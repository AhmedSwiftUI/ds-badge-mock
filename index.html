<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>محاكي شارة عالم البيانات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E9EDF2;
  --ink:#15202B; --ink2:#435161; --muted:#6F7C8B; --line:#D3DAE2; --line2:#B9C3CE;
  --accent:#0F4C81; --accent-ink:#FFFFFF; --accent-soft:#E2ECF5;
  --good:#17784A; --good-soft:#E1F2E9; --bad:#B42318; --bad-soft:#FBE8E6;
  --flag:#9A5A06; --flag-soft:#FCEFD9;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --ar:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,sans-serif;
  --en:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141A; --surface:#161F28; --sunken:#1D2833;
    --ink:#E7ECF1; --ink2:#B4BFCA; --muted:#8894A2; --line:#2A3642; --line2:#3B4958;
    --accent:#74B4EC; --accent-ink:#0A1621; --accent-soft:#1A2D3F;
    --good:#4FC48C; --good-soft:#132F23; --bad:#F27D72; --bad-soft:#391B18;
    --flag:#E6A94D; --flag-soft:#372811;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --sunken:#1D2833;
  --ink:#E7ECF1; --ink2:#B4BFCA; --muted:#8894A2; --line:#2A3642; --line2:#3B4958;
  --accent:#74B4EC; --accent-ink:#0A1621; --accent-soft:#1A2D3F;
  --good:#4FC48C; --good-soft:#132F23; --bad:#F27D72; --bad-soft:#391B18;
  --flag:#E6A94D; --flag-soft:#372811;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:15px;line-height:1.7;margin:0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ltr{direction:ltr;text-align:left;font-family:var(--en)}

/* ---------- shared ---------- */
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:28px}
.btn{border:1px solid var(--line2);background:var(--surface);padding:8px 16px;border-radius:4px;font-weight:500;line-height:1.4;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.quiet:hover{background:var(--sunken)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.start{font-size:18px;padding:14px 44px;font-weight:600}
.facts.info{grid-template-columns:repeat(2,1fr);max-width:420px}
.credit{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:14px}
.credit div{display:flex;flex-direction:column;gap:1px}
.credit span{font-size:12.5px;color:var(--muted)}
.credit b{font-size:15.5px;font-weight:600;color:var(--ink)}
.credit a{font-family:var(--en);font-size:15px;color:var(--accent);text-decoration:none;direction:ltr;unicode-bidi:isolate;align-self:flex-start}
.credit a:hover{text-decoration:underline}
h1,h2,h3{margin:0;line-height:1.35;text-wrap:balance}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding-bottom:8px;margin-bottom:0}
.sec-h h2{font-size:17px;font-weight:600}
.sec-h .hint{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line)}
.note{color:var(--muted);font-size:13px}

/* ---------- home ---------- */
.mast{display:flex;flex-direction:column;gap:6px}
.mast h1{font-size:26px;font-weight:700}
.mast p{margin:0;color:var(--ink2);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:var(--surface)}
.facts div{padding:12px 14px;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.facts div:first-child{border-inline-start:0}
.facts b{font-size:17px;font-weight:600}
.facts span{color:var(--muted);font-size:12.5px}
@media (max-width:720px){.facts{grid-template-columns:repeat(2,1fr)}.facts div{border-inline-start:0;border-top:1px solid var(--line)}.facts div:nth-child(-n+2){border-top:0}.facts div:nth-child(even){border-inline-start:1px solid var(--line)}}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--accent);background:var(--accent-soft)}
.resume .acts{display:flex;gap:8px}
.modes{display:grid}
.mode{display:grid;grid-template-columns:minmax(0,1fr) 92px 92px auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.mode:last-child{border-bottom:0}
.mode h3{font-size:15.5px;font-weight:600}
.mode p{margin:2px 0 0;color:var(--ink2);font-size:13.5px}
.mode .k{display:flex;flex-direction:column;font-size:12px;color:var(--muted)}
.mode .k b{font-size:15px;color:var(--ink);font-weight:500}
.mode select{border:1px solid var(--line2);background:var(--surface);padding:5px 8px;border-radius:4px;margin-top:8px;max-width:100%}
@media (max-width:640px){.mode{grid-template-columns:1fr 1fr}.mode>div:first-child{grid-column:1/-1}.mode .go{grid-column:1/-1}.mode .go .btn{width:100%}}
.bank{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bank div{padding:12px 16px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-start:-1px;margin-bottom:-1px}
.bank b{display:block;font-size:20px;font-weight:600}
.bank span{font-size:12.5px;color:var(--muted)}
.clip{overflow:hidden}
.ai{padding:14px 16px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.ai .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai select{border:1px solid var(--line2);background:var(--surface);padding:7px 8px;border-radius:4px}
.ai .status{font-size:13px;color:var(--ink2);min-height:1.7em}
table.grid{width:100%;border-collapse:collapse;font-size:14px}
table.grid th,table.grid td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
table.grid th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--sunken)}
table.grid tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.bar{height:8px;background:var(--sunken);border-radius:2px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.bar.low i{background:var(--bad)} .bar.mid i{background:var(--flag)} .bar.high i{background:var(--good)}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink2)}
.empty{padding:18px 16px;color:var(--muted)}

/* ---------- exam ---------- */
#exam{height:100%;display:flex;flex-direction:column;font-family:var(--en);background:var(--bg)}
.xbar{display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--surface);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.xbar .qpos{font-weight:600}
.xbar .sp{flex:1}
.timer{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 10px;border:1px solid var(--line2);border-radius:4px;background:var(--bg)}
.timer.warn{color:var(--flag);border-color:var(--flag)} .timer.crit{color:var(--bad);border-color:var(--bad)}
.pace{font-size:12.5px;padding:3px 8px;border-radius:3px;background:var(--sunken);color:var(--ink2);font-family:var(--mono)}
.pace.behind{background:var(--bad-soft);color:var(--bad)} .pace.ahead{background:var(--good-soft);color:var(--good)}
.xbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px}
.qpane{overflow-y:auto;padding:24px 16px 32px}
.qinner{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.qmeta .flagged{color:var(--flag);font-weight:600}
.stem{font-size:16.5px;line-height:1.65;white-space:pre-line;max-width:70ch}
.pick{font-size:13px;color:var(--ink2);font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--line2);border-radius:4px;background:var(--surface);text-align:left;line-height:1.55;width:100%;font-size:15px}
.opt:hover{border-color:var(--accent)}
.opt .mk{width:18px;height:18px;border:1.5px solid var(--muted);border-radius:50%;margin-top:3px;display:grid;place-items:center;flex:none}
.opt.multi .mk{border-radius:3px}
.opt .lt{font-family:var(--mono);font-weight:600;color:var(--muted);margin-top:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .mk{border-color:var(--accent);background:var(--accent)}
.opt.sel .mk::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink)}
.opt.multi.sel .mk::after{width:9px;height:5px;border-radius:0;background:none;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.opt.sel .lt{color:var(--accent)}
.navpane{border-left:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.navhead{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.navhead .counts{display:grid;grid-template-columns:repeat(3,1fr);font-size:12px;color:var(--muted);gap:6px}
.navhead .counts b{display:block;font-family:var(--mono);font-size:16px;color:var(--ink);font-weight:500}
.navfilter{display:flex;gap:4px}
.navfilter button{flex:1;font-size:12px;padding:4px 6px;border:1px solid var(--line2);background:var(--surface);border-radius:3px}
.navfilter button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.navgrid{overflow-y:auto;padding:12px 14px;display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-content:start}
.nb{position:relative;aspect-ratio:1/1;border:1px solid var(--line2);background:var(--surface);border-radius:3px;font-family:var(--mono);font-size:12px;padding:0;color:var(--ink2)}
.nb.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nb.flg::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--flag) transparent transparent}
.nb.cur{outline:2px solid var(--ink);outline-offset:1px;font-weight:600}
.nb.dim{opacity:.22}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--line2);margin-right:4px;vertical-align:-1px;border-radius:2px}
.legend i.a{background:var(--accent-soft);border-color:var(--accent)} .legend i.f{background:var(--flag);border-color:var(--flag)}
.xfoot{display:flex;gap:8px;padding:10px 16px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line2);align-items:center}
.xfoot .sp{flex:1}
.btn.flagon{background:var(--flag-soft);border-color:var(--flag);color:var(--flag)}
.navtoggle{display:none}
@media (max-width:860px){
  .xbody{grid-template-columns:1fr}
  .navpane{position:fixed;inset:0 0 0 auto;width:min(320px,88vw);z-index:30;transform:translateX(105%);transition:transform .18s ease;border-left:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
  .navpane.open{transform:none;box-shadow:-8px 0 24px rgba(0,0,0,.18)}
  .navtoggle{display:inline-block}
  .xbar{gap:8px}.timer{font-size:17px}
  .kbd-hint{display:none}
}
@media (prefers-reduced-motion:reduce){.navpane{transition:none}}
.kbd-hint{font-size:12px;color:var(--muted)}
.paused{flex:1;display:grid;place-items:center;text-align:center;padding:24px}
.paused h2{font-size:22px;margin-bottom:6px}

/* stimulus */
.stim{border:1px solid var(--line);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:8px;max-width:100%}
.stim .cap{font-size:13px;font-weight:600;color:var(--ink2)}
.stim table{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stim th,.stim td{border:1px solid var(--line);padding:6px 12px;text-align:left;white-space:nowrap}
.stim th{background:var(--sunken);font-weight:600;font-size:13px}
.stim svg{display:block;width:100%;max-width:540px;height:auto}
.stim svg text{font-family:var(--en);font-size:11px;fill:var(--ink2)}
.stim svg .ttl{font-size:12.5px;font-weight:600;fill:var(--ink)}
.chartleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink2)}
.chartleg i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
.stim details{font-size:12.5px;color:var(--muted)}
.stim details summary{cursor:pointer}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:6px;max-width:440px;width:100%;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 18px 50px rgba(0,0,0,.3)}
.modal h3{font-size:18px}
.modal .tri{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line)}
.modal .tri div{padding:10px;border-inline-start:1px solid var(--line);text-align:center;font-size:12.5px;color:var(--muted)}
.modal .tri div:first-child{border-inline-start:0}
.modal .tri b{display:block;font-family:var(--mono);font-size:20px;color:var(--ink);font-weight:500}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* ---------- results ---------- */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--surface)}
.score .big{padding:20px 28px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.score .big b{font-family:var(--mono);font-size:46px;line-height:1.1;font-weight:600}
.score .big span{color:var(--muted);font-size:13px}
.score .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.score .kv div{padding:14px 16px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-start:-1px;margin-bottom:-1px}
.score .kv b{display:block;font-size:17px;font-weight:600}
.score .kv span{font-size:12.5px;color:var(--muted)}
@media (max-width:620px){.score{grid-template-columns:1fr}.score .big{border-inline-end:0;border-bottom:1px solid var(--line)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rv{border:1px solid var(--line);background:var(--surface);margin-top:-1px}
.rv>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:44px 22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px}
.rv>summary::-webkit-details-marker{display:none}
.rv .no{font-family:var(--mono);color:var(--muted);font-size:13px}
.rv .st{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--surface)}
.rv .st.ok{background:var(--good)} .rv .st.no_{background:var(--bad)} .rv .st.sk{background:var(--muted)}
.rv .pv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--ink2)}
.rv .tm{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.rv[open]>summary{border-bottom:1px solid var(--line);background:var(--sunken)}
.rvbody{padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.ropt{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:4px;font-size:14.5px;line-height:1.55;align-items:start}
.ropt.c{border-color:var(--good);background:var(--good-soft)}
.ropt.w{border-color:var(--bad);background:var(--bad-soft)}
.ropt .tag{font-size:11.5px;font-family:var(--ar);white-space:nowrap;color:var(--ink2)}
.ropt .ic{font-weight:700}
.ropt.c .ic{color:var(--good)} .ropt.w .ic{color:var(--bad)}
.explain{border-inline-start:3px solid var(--accent);padding:4px 14px;font-size:14.5px;color:var(--ink);max-width:72ch}
.explain h4{margin:0 0 2px;font-size:12.5px;color:var(--muted);font-weight:500}
.more{white-space:pre-wrap;font-size:14.5px;border:1px dashed var(--line2);padding:12px 14px;max-width:72ch}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>

<div id="home" dir="rtl" lang="ar"></div>
<div id="exam" dir="ltr" lang="en" hidden></div>
<div id="results" dir="rtl" lang="ar" hidden></div>
<div id="modal"></div>

<script>
"use strict";
const BANK = [{"id":"eda1-001","domain":"eda","level":"assistant","tags":["missing-data","categorical"],"stem":"A government services portal records an optional 'employment_sector' field. It is missing for 22% of applicants, and a quick check shows that applicants who leave it blank are rejected at twice the rate of the others. You need to keep this column for a classification model. Which handling is MOST appropriate?","options":["Delete the 22% of applicants who left the sector blank","Fill the blanks with the most frequent employment sector","Fill each blank with a sector drawn at random from the list","Treat blanks as their own 'Not provided' category"],"answer":[3],"explain":"الفقد هنا يحمل معلومة لأن من تركوا الحقل فارغاً يُرفضون بضعف المعدل، وجعل الفراغ فئة مستقلة مثل 'Not provided' يحافظ على هذه الإشارة. التعويض بالـ mode يدمج هؤلاء مع أكبر قطاع فيمحو الإشارة ويشوّه ذلك القطاع، وحذف 22% من الصفوف يُدخل تحيزاً لأن الفقد ليس عشوائياً."},{"id":"eda1-002","domain":"eda","level":"associate","tags":["spearman","correlation"],"stem":"An education analytics team relates students' class rank, an ordinal variable, to weekly study hours. The relationship is monotonic but clearly curved, and a few students report extreme hours. Which measure of association is MOST appropriate?","options":["Pearson correlation coefficient","Spearman rank correlation","Covariance of the raw values","Difference between the two means"],"answer":[1],"explain":"معامل Spearman يعمل على الرتب، فيناسب المتغيرات الترتيبية والعلاقات الرتيبة غير الخطية، ولا يتأثر كثيراً بالقيم المتطرفة. معامل Pearson يفترض علاقة خطية ويتأثر بالساعات المتطرفة فيقلّل من قوة العلاقة الحقيقية، والـ covariance يعتمد على وحدات القياس ولا يصلح للمقارنة."},{"id":"eda1-003","domain":"eda","level":"associate","tags":["duplicates","text-normalisation"],"stem":"A university merges applicant lists from two admission portals ahead of the new academic year. drop_duplicates() removes nothing, yet you see pairs such as 'Sara Al-Harbi ' and 'sara al-harbi' that share the same national ID and birth date. Each applicant should appear exactly once in the merged list. What should you do FIRST to deduplicate reliably?","options":["Standardise case and whitespace, then deduplicate on the national ID","Conclude that there are no duplicates, since drop_duplicates() found none","Delete every applicant whose full name appears more than once in the list","Deduplicate on the first name only, so that all spelling variants are caught"],"answer":[0],"explain":"الدالة drop_duplicates() تطابق النصوص حرفياً، فاختلاف حالة الأحرف أو مسافة زائدة يجعل السجلين مختلفين ظاهرياً؛ لذا نوحّد التنسيق أولاً ثم نزيل التكرار اعتماداً على مفتاح موثوق مثل رقم الهوية. حذف كل من يتكرر اسمه يحذف متقدمين مختلفين يحملون الاسم نفسه، والاعتماد على الاسم الأول وحده أسوأ من ذلك بكثير."},{"id":"eda1-004","domain":"eda","level":"expert","tags":["simpsons-paradox","segmentation"],"stem":"A logistics manager compares two courier partners using the table, which covers 2,000 deliveries from the last quarter, and wants to end the contract with Courier Y because its overall on-time rate is lower. Rural deliveries are known to be harder because of long distances and poor addressing. Which statement BEST explains the figures?","table":{"caption":"On-time delivery by zone","headers":["Zone","X deliveries","X on-time","Y deliveries","Y on-time"],"rows":[["Urban","900","90%","100","95%"],["Rural","100","60%","900","70%"],["Overall","1,000","87%","1,000","72.5%"]]},"options":["Y beats X in each zone; its overall rate is lower because most of its work is rural","X is the better courier, because the overall rate is based on the largest amount of data","The zone-level rates are unreliable, because each zone is a smaller sample than the total","The table must contain an arithmetic error, because such a reversal cannot occur in real data"],"answer":[0],"explain":"هذه Simpson's paradox: الناقل Y أفضل في المنطقتين (95% مقابل 90% و70% مقابل 60%) لكن 90% من شحناته ريفية صعبة بينما 90% من شحنات X حضرية سهلة، فاختلاف المزيج هو ما يخفض معدل Y الإجمالي. الحساب صحيح: 810 + 60 = 870 من 1000 للناقل X، و95 + 630 = 725 من 1000 للناقل Y. الاعتماد على المعدل الإجمالي وحده يقود إلى قرار معاكس للواقع."},{"id":"eda1-005","domain":"eda","level":"assistant","tags":["z-score","calculation"],"stem":"Call handling times at a telecom contact centre have a mean of 300 seconds and a standard deviation of 40 seconds. Your team flags calls with an absolute z-score above 3. What is the z-score of a 440-second call, and is it flagged?","options":["z = 11, so the call is flagged","z = 2.5, so the call is not flagged","z = 1.47, so the call is not flagged","z = 3.5, so the call is flagged"],"answer":[3],"explain":"الـ z-score = (440 − 300) ÷ 40 = 3.5 وهو أكبر من 3 فتُعلَّم المكالمة. القيمة 11 تنتج من قسمة 440 على 40 دون طرح المتوسط، والقيمة 1.47 تنتج من قسمة 440 على 300، وكلاهما خطأ شائع في تطبيق الصيغة."},{"id":"eda1-006","domain":"eda","level":"associate","tags":["correlation","non-linear","scatter-plot"],"stem":"At an agricultural research station, the Pearson correlation between fertiliser dose and crop yield across 500 experimental plots is only 0.03, and a junior analyst wants to exclude dose from further study. The agronomists insist that dose matters: both too little and too much fertiliser reduce the yield. What is the MOST appropriate next step?","options":["Draw a scatter plot, because Pearson only captures linear relationships","Drop fertiliser dose, because a near-zero correlation proves it is irrelevant","Remove outlying plots one by one until the correlation coefficient rises","Collect more plots until the correlation coefficient becomes significant"],"answer":[0],"explain":"معامل Pearson يقيس العلاقة الخطية فقط، والعلاقة التي يصفها الخبراء على شكل قوس (ترتفع ثم تنخفض) قد تعطي ارتباطاً قريباً من الصفر رغم أنها قوية؛ والـ scatter plot يكشف ذلك فوراً. استبعاد المتغير لأن الارتباط يقارب الصفر هو الخطأ الشائع، وحذف نقاط حتى يرتفع المعامل تلاعب بالبيانات."},{"id":"eda1-007","domain":"eda","level":"associate","tags":["outliers","tree-models","model-sensitivity"],"stem":"A logistics firm predicts delivery cost from features that contain genuine but extreme values, such as rare very long hauls and unusually heavy loads. The extremes are valid business cases and must stay in the data untouched. Which model families are LEAST affected by such extreme feature values? (Select TWO)","options":["k-nearest neighbours on the raw features","Random forest","Ordinary least squares regression","Gradient-boosted decision trees","Ridge regression on the raw features"],"answer":[1,3],"explain":"النماذج الشجرية مثل Random Forest و Gradient Boosting تقسم البيانات بحسب ترتيب القيم لا بحسب مقدارها، فالقيمة المتطرفة تقع ببساطة في أحد طرفي التقسيم دون أن تسحب النموذج. أما OLS و Ridge فيتأثران بشدة لأن دالة الخطأ التربيعية تعطي النقاط البعيدة وزناً كبيراً، و KNN يعتمد على المسافات التي تهيمن عليها القيم المتطرفة."},{"id":"eda1-008","domain":"eda","level":"expert","tags":["correlation","target-leakage","eda"],"stem":"A telecom operator asks you to build a churn model. During EDA you compute the correlation of each candidate feature with the binary target 'churned' (1 = the customer left during the quarter); the table shows the results. The features come from a customer-360 table assembled by another team, and the documentation does not say at what moment each field is captured. You know from the retention department that agents send a special retention offer when a customer calls to cancel. Marketing is excited about the results and wants a model in production within two weeks. The dataset has 400,000 customers and no missing values in these columns. What should you do FIRST?","table":{"caption":"Correlation with churned","headers":["Feature","Correlation"],"rows":[["tenure_months","-0.31"],["monthly_fee","0.18"],["support_calls","0.27"],["retention_offer_sent","0.93"],["contract_type_code","-0.22"]]},"options":["Drop tenure_months from the feature set, because its correlation is negative","Find out when retention_offer_sent is recorded relative to the churn event","Drop monthly_fee from the feature set, because its correlation is the weakest","Keep only retention_offer_sent, since it is by far the strongest predictor"],"answer":[1],"explain":"ارتباط 0.93 مع الهدف مرتفع بشكل مريب، ومعرفتنا بأن العرض يُرسَل عندما يتصل العميل للإلغاء تعني أن هذه الخاصية تُسجَّل على الأرجح بعد بدء حدث الـ churn، أي أنها target leakage لن تكون متاحة وقت التنبؤ. لذلك يجب التحقق من توقيت تسجيلها أولاً. الاعتماد عليها وحدها ينتج نموذجاً ممتازاً على الورق وعديم الفائدة في الإنتاج، والارتباط السالب ليس سبباً لحذف خاصية."},{"id":"eda1-009","domain":"eda","level":"associate","tags":["missing-data","time-series","interpolation"],"stem":"A manufacturing plant logs furnace temperature every minute for quality monitoring. Occasional transmission faults leave gaps of two to three minutes, and engineers confirm that the temperature changes slowly and smoothly between readings. You need a complete series to plot trends and compute hourly averages for the production report. Which way of filling these short gaps is MOST appropriate?","options":["The overall mean temperature of the whole year of data","Linear interpolation between the neighbouring readings","The most frequent temperature value in the dataset","A constant value of 0 to mark the faulty minutes"],"answer":[1],"explain":"في سلسلة زمنية ناعمة التغير وفجوات قصيرة، الـ linear interpolation بين القراءتين المجاورتين يعطي تقديراً قريباً جداً من الحقيقة لأنه يستغل الترتيب الزمني. التعويض بالمتوسط السنوي يتجاهل السياق الزمني ويُحدث قفزات مصطنعة في المنحنى، والقيمة 0 تشوّه المتوسطات الساعية."},{"id":"eda1-010","domain":"eda","level":"associate","tags":["cleaning-order","sentinel-values"],"stem":"You receive a raw sensor extract at a water utility. The flow column is stored as text and uses '-999' as a code for missing readings, some rows are exact duplicates caused by a retry in the upload job, and you plan to use median imputation and IQR-based outlier capping. Which ordering of the cleaning steps is MOST sensible?","options":["Cap outliers with the IQR rule first, then fix the types and turn -999 into NaN","Fix types and turn -999 into NaN, remove duplicates, then treat outliers and gaps","Treat the outliers and the gaps first, and remove the duplicated rows at the very end","Impute with the median first, then turn -999 into NaN, then remove the duplicates"],"answer":[1],"explain":"يجب أولاً تصحيح النوع وتحويل -999 إلى NaN وإزالة التكرارات، لأن الـ median وحدود الـ IQR تُحسب من البيانات، وأي رمز -999 أو صف مكرر متبقٍّ سيشوّه هذه الإحصاءات. لو بدأنا بالتعويض أو بالـ capping لدخلت قيم -999 في حساب الـ median والـ quartiles، ولأثّرت الصفوف المكررة في الأوزان، فتُبنى بقية الخطوات على أرقام خاطئة."},{"id":"eda1-011","domain":"eda","level":"assistant","tags":["log-transform","zeros"],"stem":"A tourism booking app wants to log-transform 'bookings_last_year', a strongly right-skewed count. About 35% of users have zero bookings, which are genuine values, and np.log returns -inf for them. What is the MOST appropriate adjustment?","options":["Take the log of the values after multiplying them by 100","Replace the zeros with the column mean, then take the log","Use log(1 + x), which maps a zero count to zero","Drop the users with zero bookings before transforming"],"answer":[2],"explain":"التحويل log(1 + x) (أي np.log1p) معرَّف عند الصفر ويعطي صفراً، فيحافظ على المستخدمين بلا حجوزات ويضغط الذيل الأيمن في الوقت نفسه. حذف 35% من المستخدمين يُحيّز التحليل نحو العملاء النشطين، واستبدال الأصفار الحقيقية بالمتوسط يختلق حجوزات لم تحدث، والضرب في 100 لا يحل شيئاً لأن log(0) يبقى غير معرَّف."},{"id":"eda1-012","domain":"eda","level":"expert","tags":["iterative-imputation","mar"],"stem":"You work for a health insurer that wants to study how body-mass index, systolic blood pressure, cholesterol and fasting glucose jointly relate to annual claim cost. The data comes from 85,000 members who attended voluntary screening days held in shopping malls and workplaces over three years. Each of the four clinical variables is missing for 10–20% of members, mostly because some screening stations were not available at every event; the gaps are related to event location and member age, both of which are fully recorded. The four variables are strongly correlated with one another and with age. Keeping only complete rows would discard 48% of members. The actuarial team stresses that the relationships between the variables must be preserved, because the study is about their joint effect. Which imputation strategy is MOST appropriate?","options":["Replacing the missing values with -1 so that they are clearly identifiable","Filling each variable with its own median so that every member is retained","Keeping only complete rows to avoid introducing any artificial values at all","Iterative (MICE-style) imputation that models each variable from the others"],"answer":[3],"explain":"الفقد MAR والمتغيرات مترابطة بقوة، والـ iterative imputation (مثل IterativeImputer أو MICE) يتنبأ بكل متغير من بقية المتغيرات فيحافظ على العلاقات المشتركة المطلوبة للدراسة. التعويض بالـ median لكل عمود مغرٍ لبساطته لكنه يُضعف الارتباطات ويقلّص التباين، وحذف الصفوف الناقصة يُفقدنا 48% من الأعضاء ويُدخل تحيزاً لأن الفقد مرتبط بالعمر والموقع."},{"id":"eda1-013","domain":"eda","level":"associate","tags":["data-quality","profiling"],"stem":"You receive a new claims extract from a partner insurer with no documentation. Before any modelling, which checks belong in your initial data-quality pass? (Select THREE)","options":["Duplicate records on the claim identifier","The test-set accuracy of a baseline classifier","Value ranges and category labels against business rules","A hyperparameter search for the first candidate model","Row count, column dtypes and missing values per column"],"answer":[0,2,4],"explain":"الفحص الأولي لجودة البيانات يشمل البنية (عدد الصفوف، الأنواع، القيم المفقودة)، والتكرارات على المفتاح، ومطابقة المدى والفئات لقواعد العمل، وكلها تسبق أي نمذجة. أما الـ hyperparameter search ودقة النموذج على الـ test set فهي خطوات نمذجة وتقييم، وتنفيذها قبل فهم البيانات وتنظيفها يعطي نتائج لا يُعتمد عليها."},{"id":"eda1-014","domain":"eda","level":"assistant","tags":["imputation","skewness"],"stem":"You are preparing a customer dataset at a telecom operator. The numeric column 'monthly_data_usage_gb' has 6% missing values that appear to be random. Its distribution is strongly right-skewed: most customers use 5–20 GB, while a small group of heavy users consume more than 500 GB. You want a simple single-value imputation for a first baseline model. Which fill value is MOST appropriate?","options":["The mean of the column","Zero for every missing row","The median of the column","The midpoint between the minimum and maximum"],"answer":[2],"explain":"في التوزيع شديد الالتواء لليمين يتأثر الـ mean بقلة من المستخدمين الثقيلين فيصبح أعلى من استهلاك العميل النموذجي، بينما الـ median مقاوم للقيم المتطرفة ويمثّل القيمة النموذجية. لذلك التعويض بالـ mean هو الخطأ الأكثر إغراءً هنا، والتعويض بالصفر أو بمنتصف المدى يُدخل قيماً غير واقعية."},{"id":"eda1-015","domain":"eda","level":"associate","tags":["stratified-sampling","class-imbalance","big-data"],"stem":"A payments processor stores 1.5 billion card transactions for the past year, of which 0.08% are confirmed fraud. The fraud-analytics team wants a detailed exploratory comparison of fraud and non-fraud behaviour: amounts, hours of day, merchant categories and device types. Your workstation can comfortably handle about 1 million rows, and the full table can only be queried through a slow warehouse that charges per scan. A simple random sample of 1 million rows would contain only about 800 frauds, too few to break down by merchant category and device type together. The team knows that any sample that distorts class proportions must be documented so that rates can be corrected later. The warehouse is scheduled for an upgrade next year. Which sampling design is MOST appropriate for this EDA?","options":["Sample only the 1 million largest transactions, as fraud is usually large","Take a simple random sample of 1 million rows and accept about 800 frauds","Oversample the frauds, downsample the rest, and record both sampling rates","Take the 1 million most recent transactions, as they are the most relevant"],"answer":[2],"explain":"المطلوب مقارنة تفصيلية بين الفئتين، والعينة العشوائية البسيطة لا تعطي إلا نحو 800 حالة احتيال (مليون × 0.08%) وهو عدد لا يكفي للتقسيم المتقاطع؛ لذا نأخذ نسبة عالية من حالات الاحتيال وعينة عشوائية من البقية مع توثيق معدلي السحب لتصحيح النسب لاحقاً. أخذ أحدث المعاملات أو أكبرها يُدخل تحيزاً زمنياً أو تحيزاً في المبالغ يشوّه المقارنة نفسها."},{"id":"eda1-016","domain":"eda","level":"assistant","tags":["iqr","outliers","calculation"],"stem":"A retail analyst summarises basket values in a Jeddah supermarket: the first quartile is 40 SAR and the third quartile is 60 SAR. Using the 1.5 × IQR rule, which of these basket values is flagged as an outlier?","options":["75 SAR","12 SAR","88 SAR","95 SAR"],"answer":[3],"explain":"الـ IQR = 60 − 40 = 20، فالحد الأدنى = 40 − 1.5×20 = 10 والحد الأعلى = 60 + 1.5×20 = 90. القيمة 95 وحدها تتجاوز الحد الأعلى، أما 88 فهي قريبة من الحد لكنها داخله، و12 أعلى من الحد الأدنى 10 فلا تُعدّ outlier."},{"id":"eda1-017","domain":"eda","level":"associate","tags":["domain-rules","outliers","iqr"],"stem":"A medical-device company collects continuous body-temperature readings from wearable patches worn by 9,000 patients after surgery. The research goal is to study fever episodes, which clinicians define as readings above 38.0 °C. Most readings sit between 36.2 and 37.4 °C, so the 1.5 × IQR rule flags every reading above about 38.2 °C, which would delete nearly all fever episodes. The engineering team adds that when a patch overheats or detaches it reports values such as 45–60 °C or below 30 °C, which are physically impossible for a living patient. The patches transmit every 30 seconds over Bluetooth, and battery level is logged in a separate table. A statistician on the team insists on a purely statistical rule 'to stay objective'. Which outlier rule is MOST appropriate for this study?","options":["Use a z-score threshold of 2, so that more suspicious readings are flagged","Remove the top 5% and bottom 5% of readings regardless of their values","Keep the 1.5 × IQR rule, because it is the accepted statistical standard","Remove only readings outside clinician-defined plausible limits, e.g. 30–43 °C"],"answer":[3],"explain":"الهدف دراسة نوبات الحمّى، وهي قيم نادرة لكنها حقيقية، بينما الأخطاء الفعلية هي القراءات المستحيلة فيزيائياً؛ لذلك القاعدة المبنية على حدود يحددها الأطباء تفصل الخطأ عن الظاهرة المهمة. قاعدة الـ IQR أو الـ z-score أو حذف نسب ثابتة من الأطراف تحذف الحمّى نفسها لأنها تعامل كل ما هو نادر على أنه خطأ."},{"id":"eda1-018","domain":"eda","level":"associate","tags":["listwise-deletion","missing-data"],"stem":"A tourism board gives you a visitor-survey dataset with 10,000 records and 25 survey columns. Each column is missing in only 3–5% of rows, and the gaps look unrelated across questions. Yet after an analyst calls dropna() on the whole table, just 3,900 rows remain, which is too few for the planned regional breakdown. What BEST explains this, and what is the better approach?","options":["Gaps fall in different rows for each column; impute per column instead","dropna() is unreliable on wide tables; rerun it on a smaller random sample","The columns are highly correlated; drop the correlated columns first","Most of the rows are duplicates; remove duplicates before dropping rows"],"answer":[0],"explain":"الحذف الكامل للصفوف (listwise deletion) يحذف الصف إذا نقصت فيه قيمة واحدة في أي عمود، ومع 25 عموداً تتوزع فجواتها على صفوف مختلفة تتراكم الخسارة حتى لا يبقى إلا نحو 39% من الصفوف (تقريباً 0.963 مرفوعة للقوة 25 ≈ 0.39). الحل هو التعويض عموداً بعمود بدل dropna() الشامل، أما افتراض وجود تكرارات أو خلل في الدالة فلا يدعمه أي معطى."},{"id":"eda1-019","domain":"eda","level":"assistant","tags":["skewness","mean-vs-median"],"stem":"Claim amounts at a motor insurer have a mean of 9,400 SAR and a median of 3,100 SAR, with a minimum of 150 SAR. Which statement about the shape of the distribution is correct?","options":["It is symmetric, because both statistics are positive","It is uniform, because the two statistics differ widely","It is left-skewed, with a long tail of small claims","It is right-skewed, with a long tail of large claims"],"answer":[3],"explain":"عندما يكون الـ mean أكبر بكثير من الـ median فهذا يعني أن قلة من القيم الكبيرة تسحب المتوسط للأعلى، أي أن التوزيع ملتوٍ لليمين (right-skewed) بذيل طويل من المطالبات الضخمة. في الالتواء لليسار يحدث العكس فيكون الـ mean أصغر من الـ median، وفي التوزيع المتماثل يتقارب المقياسان."},{"id":"eda1-020","domain":"eda","level":"assistant","tags":["missing-data","drop-column"],"stem":"At an insurance company, the column 'secondary_phone_verified' is 94% missing, the missingness shows no relationship with claim outcomes, and the business says the field was abandoned years ago. What is the MOST appropriate action before modelling?","options":["Drop every row in which the column is missing","Use KNNImputer to reconstruct the missing values","Impute the column with its most frequent value","Drop the column from the modelling dataset"],"answer":[3],"explain":"عمود مفقود بنسبة 94% وبلا علاقة بالهدف وبلا معنى تجاري حالي لا يحمل معلومة تستحق الاحتفاظ بها، فحذفه هو القرار السليم. التعويض بالـ mode أو بـ KNNImputer سيجعل العمود شبه ثابت ومصنوعاً من 6% فقط من البيانات، وحذف الصفوف الناقصة سيُضيّع 94% من مجموعة البيانات."},{"id":"eda1-021","domain":"eda","level":"associate","tags":["consistency-checks","dates","validation"],"stem":"At a hospital group you compute length of stay as discharge_date minus admission_date for a bed-capacity study. The dates are typed in by ward clerks at different times. Both columns parse correctly as dates and each one passes its own range check, but 0.8% of stays come out negative. Which type of data-quality check would have caught this problem earlier?","options":["A missing-value count on each of the two date columns","A cross-field rule that discharge must not precede admission","A duplicate check on the patient identifier column","A dtype check confirming that both columns are stored as datetime"],"answer":[1],"explain":"كل عمود سليم بمفرده لكن العلاقة بين العمودين غير منطقية، وهذا لا تكشفه إلا قاعدة اتساق بين الحقول (cross-field validation) مثل: تاريخ الخروج لا يسبق تاريخ الدخول. فحص الـ dtype أو القيم المفقودة يختبر كل عمود على حدة وقد نجح العمودان فيه فعلاً، فلا يمكنه التقاط هذا النوع من الأخطاء."},{"id":"eda1-022","domain":"eda","level":"associate","tags":["structural-missingness","missing-indicator"],"stem":"A bank's mortgage team gives you 140,000 applications to explore before a default model is built. The column 'co_applicant_income' is empty for 64% of applications. The data dictionary states that the field is filled only when an application has a co-applicant; single applicants have no such income to record. For the 36% that do have a co-applicant, the values look complete and plausible. A junior analyst argues that any column with more than half of its values missing should be dropped, while another suggests KNNImputer so that every application receives a realistic income. The property-valuation columns come from an external appraiser and are complete. Branch codes were renumbered in 2024, which does not affect this field. How should the blanks in co_applicant_income be handled?","options":["Drop the column, because more than half of its values are missing","Fill them with the median income of the applications that have a co-applicant","Use KNNImputer so that each blank receives an income from similar applications","Set them to 0 and add a 'has_co_applicant' flag, as no value applies"],"answer":[3],"explain":"هذا فقد هيكلي (structural missingness): القيمة ليست مجهولة بل غير منطبقة لأن المتقدم بلا شريك، فالصحيح وضع 0 مع عمود دلالة has_co_applicant. التعويض بالـ median أو بـ KNNImputer يخترع دخلاً لشريك غير موجود، وحذف العمود يضيّع معلومة مهمة عن القدرة على السداد لدى 36% من الطلبات."},{"id":"eda1-023","domain":"eda","level":"associate","tags":["impossible-values","domain-knowledge"],"stem":"An electronics retailer's sales table contains negative values in 'quantity' for 2% of rows, while the other summary statistics look reasonable. Before deciding anything, you notice that all of these rows carry invoice numbers starting with the letter 'C', unlike the rest. You are preparing the data for a demand analysis. What should you do FIRST?","options":["Convert the quantities to absolute values so that they become valid sales","Delete these rows, because a sold quantity can never be negative","Confirm with the business whether these rows are returns or cancellations","Replace the negative quantities with the median quantity of the column"],"answer":[2],"explain":"النمط المنتظم (كل الفواتير تبدأ بالحرف 'C') يشير إلى أن القيم السالبة مرتجعات أو إلغاءات وليست أخطاء عشوائية، فالخطوة الأولى التحقق من معناها مع جهة العمل قبل أي تعديل. الحذف الفوري أو تحويلها إلى قيم موجبة يعتمد على افتراض غير مؤكد، وتحويل المرتجع إلى بيع موجب يضاعف الخطأ في تقدير الطلب."},{"id":"eda1-024","domain":"eda","level":"assistant","tags":["robust-statistics","median"],"stem":"An HR analytics team at a manufacturing firm must report the 'typical' salary. Of 400 employees, six executives earn 15–30 times more than everyone else. Which summary statistic BEST represents a typical employee?","options":["The midrange (average of minimum and maximum)","The mean salary","The median salary","The standard deviation of salaries"],"answer":[2],"explain":"الـ median مقياس مقاوم لا يتأثر بالرواتب الستة الضخمة فيعكس راتب الموظف النموذجي، بينما الـ mean ينسحب للأعلى بسبب هذه القلة فيبالغ في تقدير الراتب المعتاد. الـ midrange يعتمد كلياً على القيمتين الطرفيتين فهو الأكثر تأثراً، والـ standard deviation مقياس تشتت لا مقياس قيمة نموذجية."},{"id":"eda1-025","domain":"eda","level":"assistant","tags":["dtypes","identifiers"],"stem":"In a government postal-services dataset, pandas read 'postal_code' as int64, turning '01234' into 1234, and describe() now reports a mean postal code. What is the MOST appropriate correction?","options":["Reload the column as text, since it is an identifier, not a quantity","Standardise the column, so that its mean and spread become meaningful","Keep it numeric and replace the codes that became too short with the mean","Round the codes to the nearest thousand to reduce the noise in the column"],"answer":[0],"explain":"الرمز البريدي معرّف وليس كمية؛ فلا معنى لمتوسطه، وقراءته كعدد صحيح تحذف الأصفار البادئة فتتلف القيم. الحل إعادة قراءته كنص (string). إبقاؤه رقمياً مع تعويض الرموز القصيرة بالمتوسط أو توحيد مقياسه يعامل المعرّف ككمية قابلة للحساب، وهو خطأ مفاهيمي."},{"id":"eda1-026","domain":"eda","level":"assistant","tags":["describe","missing-data"],"stem":"You are a data scientist at a telecom operator reviewing the describe() output below for a churn dataset of 20,000 customers. What does the table tell you, and what should you look into next?","table":{"caption":"describe() excerpt","headers":["Statistic","tenure_months","monthly_fee","support_calls"],"rows":[["count","20,000","20,000","16,400"],["mean","31.2","58.4","2.1"],["min","1","10","0"],["max","72","120","19"]]},"options":["support_calls has 3,600 zero values that describe() has ignored","support_calls has 3,600 duplicated rows; remove them from the table","support_calls has 3,600 outliers that describe() has excluded","support_calls has 3,600 missing values; find out why they are missing"],"answer":[3],"explain":"الصف count في describe() يحسب القيم غير المفقودة فقط، والفرق 20,000 − 16,400 = 3,600 هو عدد القيم المفقودة في support_calls، والخطوة التالية فهم سبب الفقد قبل اختيار المعالجة. الدالة describe() لا تستبعد الـ outliers ولا الأصفار من العدّ، بدليل أن الـ min يساوي 0 في العمود نفسه."},{"id":"eda1-027","domain":"eda","level":"expert","tags":["multivariate-outliers","bivariate-analysis"],"stem":"A children's hospital dataset passes all univariate checks: every height and every weight lies within its own plausible range for patients aged 0–18. Yet a clinician spots a record with a height of 172 cm and a weight of 9 kg. What does this illustrate, and how would you find similar records?","options":["A duplicate-record problem; run drop_duplicates() on the patient table","A missing-value problem; impute the weight column using the column median","A multivariate outlier; inspect height and weight jointly in a scatter plot","A univariate outlier; tighten the z-score threshold used on the weight column"],"answer":[2],"explain":"كل قيمة مقبولة منفردة (9 كجم طبيعي لرضيع و172 سم طبيعي لمراهق) لكن اجتماعهما مستحيل، وهذا هو الـ multivariate outlier الذي لا تكشفه الفحوص أحادية المتغير. يُكشف بفحص المتغيرين معاً عبر scatter plot أو قاعدة مشتركة مثل BMI أو مقياس مسافة متعدد المتغيرات. تشديد عتبة الـ z-score على الوزن وحده سيحذف رُضّعاً طبيعيين ولن يلتقط هذا النمط."},{"id":"eda1-028","domain":"eda","level":"associate","tags":["correlation-matrix","multicollinearity"],"stem":"A real-estate analytics firm in Riyadh wants an interpretable linear regression of apartment price based on 12,000 sales, and the coefficients will be presented to management as the 'effect' of each feature. The table shows the Pearson correlation matrix of the candidate features and the target. What is the MAIN concern before fitting the model?","table":{"caption":"Pearson correlation matrix","headers":["","area_sqm","rooms","age_years","price"],"rows":[["area_sqm","1.00","0.96","-0.10","0.82"],["rooms","0.96","1.00","-0.08","0.80"],["age_years","-0.10","-0.08","1.00","-0.35"],["price","0.82","0.80","-0.35","1.00"]]},"options":["No pair of variables reaches a correlation of 1.00, so nothing needs attention","age_years correlates negatively with price, so it must be dropped from the model","area_sqm and rooms are nearly collinear, so their coefficients will be unstable","price correlates with area_sqm at 0.82, which is a clear sign of target leakage"],"answer":[2],"explain":"الارتباط 0.96 بين area_sqm و rooms يعني multicollinearity شبه تامة، فلا يستطيع الانحدار الخطي فصل أثر كل منهما وتصبح المعاملات غير مستقرة وقد تنقلب إشارتها، وهذا يُفسد التفسير المطلوب للإدارة. الارتباط السالب للعمر مع السعر معلومة مفيدة وليس عيباً، وارتباط 0.82 بين المساحة والسعر علاقة منطقية متوقعة لا data leakage."},{"id":"eda1-029","domain":"eda","level":"associate","tags":["missing-indicator","imputation"],"stem":"You are a data scientist at a private hospital group with sites in Riyadh and Jeddah, building a gradient-boosted model to predict 30-day readmission. The training table has 210,000 admissions and 64 columns drawn from the billing system, the pharmacy system and the laboratory. One laboratory column, 'troponin_result', is empty for 55% of admissions. Clinicians explain that the test is ordered only when the treating physician suspects a cardiac problem, so whether the test was done says something about the patient's condition. The IT team is migrating the billing system next quarter, and the finance department has asked for a monthly report, but neither affects your dataset. You want to retain as much predictive information as possible from this column. Which handling is MOST appropriate?","options":["Impute with the median and keep no record of which values were missing","Drop the column, because more than half of its values are missing","Impute the value and add a binary flag marking where it was missing","Keep only the admissions for which the test was actually performed"],"answer":[2],"explain":"غياب الفحص هنا معلومة بحد ذاته لأنه يعكس قرار الطبيب، وإضافة missing-indicator مع التعويض تحفظ القيمة المقاسة وإشارة الفقد معاً. التعويض بالـ median وحده يخفي الفرق بين من أُجري له الفحص ومن لم يُجرَ له، وحذف العمود أو الاقتصار على من أُجري لهم الفحص يضيّع معلومات تنبؤية ويحيّز العينة نحو مرضى القلب."},{"id":"eda1-030","domain":"eda","level":"assistant","tags":["skewness","log-transform","histogram"],"stem":"You work at a real-estate listing platform and plan to model property prices with linear regression. The chart shows the number of listings in each price band across 8,633 active listings. All prices are positive and have been verified against signed contracts. Which transformation of price is MOST appropriate to make its distribution more symmetric?","chart":{"type":"bar","title":"Listings by price band","xLabel":"Price (million SAR)","yLabel":"Number of listings","x":["0-0.5","0.5-1","1-1.5","1.5-2","2-2.5","2.5-3","3-3.5","3.5+"],"series":[{"name":"Listings","values":[4200,2600,1100,450,180,70,25,8]}]},"options":["A log transform of the price","Min-max scaling of the price to the 0–1 range","Subtracting the mean price from every value","Squaring the price values"],"answer":[0],"explain":"الرسم يُظهر التواءً قوياً لليمين (ذيل طويل من الأسعار العالية)، والـ log transform يضغط القيم الكبيرة أكثر من الصغيرة فيقرّب التوزيع من التماثل. أما min-max scaling وطرح المتوسط فهما تحويلان خطيان يغيّران المقياس أو الموضع فقط ولا يغيّران شكل التوزيع، والتربيع يزيد الالتواء سوءاً."},{"id":"eda1-031","domain":"eda","level":"assistant","tags":["duplicates","data-quality"],"stem":"A nightly ETL job at an online retailer was accidentally run twice, and the orders table now has 1.2 million rows instead of about 600,000. Every column, including the supposedly unique order_id, is repeated exactly, and the revenue dashboards show doubled totals. What is the MOST appropriate fix in your cleaning script?","options":["Divide all revenue totals by two in the dashboard calculations","Randomly sample half of the rows and discard the other half","Remove exact duplicate rows, then verify that order_id is unique","Keep all the rows, since more data improves model training"],"answer":[2],"explain":"التكرار هنا تام ومصدره معروف (تشغيل الـ ETL مرتين)، فالحل حذف الصفوف المكررة ثم التحقق من أن order_id أصبح فريداً للتأكد من نجاح الإصلاح. القسمة على اثنين ترقيع يخفي المشكلة ولا يصلح البيانات وسيفشل إن لم يكن التكرار متساوياً، وأخذ نصف الصفوف عشوائياً قد يحذف نسختي طلب ويُبقي نسختي طلب آخر."},{"id":"eda1-032","domain":"eda","level":"associate","tags":["winsorizing","linear-regression","outliers"],"stem":"A motor insurer in the Gulf builds a linear regression to explain claim severity from vehicle age, driver age, region and repair-shop type. The pricing committee will read the coefficients, so the model must remain linear and interpretable. About 1% of the 300,000 claims are verified total-loss or injury claims that are 40–100 times larger than a typical claim, and refitting the model with and without them changes several coefficients dramatically. The regulator requires that every settled claim remains in the analysis dataset, so deleting records is not allowed. The committee mainly wants stable estimates that describe typical claims, and a separate team already models catastrophic losses. The claims system was upgraded last year, but field definitions did not change. Which treatment of the extreme claims BEST fits these constraints?","options":["Cap the claim amounts at the 99th percentile (winsorize)","Delete the top 1% of claims from the analysis dataset","Leave the amounts unchanged and add polynomial terms","Set the top 1% of amounts to missing, then drop those rows"],"answer":[0],"explain":"الـ winsorizing عند الـ 99th percentile يُبقي كل المطالبات في البيانات كما تشترط الجهة التنظيمية، ويحدّ من تأثير القيم الضخمة على معاملات الانحدار الخطي فتستقر التقديرات للمطالبات النموذجية. الحذف المباشر أو غير المباشر (تحويلها إلى مفقودة ثم حذف الصفوف) يخالف شرط الإبقاء على السجلات، وإضافة حدود polynomial لا تعالج حساسية OLS للقيم المتطرفة."},{"id":"eda1-033","domain":"eda","level":"assistant","tags":["sentinel-values","describe"],"stem":"You are a data scientist at a wind-energy company preparing a year of hourly data for a production forecast. The table shows the describe() output for wind speed. The turbine documentation says the logger writes a special numeric code whenever the sensor is offline, and wind speed can never be negative. What should you do FIRST?","table":{"caption":"describe() for wind_speed_kmh","headers":["Statistic","wind_speed_kmh"],"rows":[["count","8760"],["mean","-38.6"],["min","-999.0"],["25%","6.0"],["50%","11.0"],["75%","17.0"],["max","64.0"]]},"options":["Replace -999 with NaN, since it is a missing-value code","Take the absolute value of all the negative readings","Cap the low values at the lower bound of the IQR rule","Standardise the column so that its scale is comparable"],"answer":[0],"explain":"القيمة -999 هي sentinel value تعني أن الحساس متوقف وليست سرعة رياح حقيقية، ولهذا ظهر mean سالب وهو مستحيل فيزيائياً؛ الخطوة الأولى تحويلها إلى NaN ثم التعامل معها كقيم مفقودة. تطبيق الـ IQR capping مغرٍ لكنه يحوّل الرمز إلى قراءة منخفضة مزيفة بدل الاعتراف بأنها مفقودة، وأخذ القيمة المطلقة ينتج سرعة 999 غير المعقولة."},{"id":"eda1-034","domain":"eda","level":"expert","tags":["missing-data","mcar","diagnostics"],"stem":"At a health insurer, 'cholesterol' is missing for 20% of members. Before choosing an imputation strategy, the team wants evidence on whether the values could be missing completely at random (MCAR) or whether missingness is related to other member characteristics. Age, gender, region and claims history are fully recorded for everyone. Which analysis is MOST useful for this purpose?","options":["Test whether the observed cholesterol values are normally distributed","Compare age and claims between members with and without a value","Compare the mean of cholesterol before and after a mean imputation","Count how many members exceed the clinical cholesterol threshold"],"answer":[1],"explain":"إذا اختلفت خصائص مثل العمر والمطالبات بين من لديهم قيمة ومن ليس لديهم، فهذا دليل على أن الفقد ليس MCAR بل مرتبط بمتغيرات مُشاهَدة (MAR على الأقل). مقارنة المتوسط قبل التعويض بالـ mean وبعده لا تكشف شيئاً لأن المتوسط لا يتغير أصلاً، واختبار normality يصف القيم الموجودة لا آلية الفقد."},{"id":"eda1-035","domain":"eda","level":"expert","tags":["sampling","big-data","rare-events"],"stem":"A telecom data lake holds 3 billion call records, and you do most of your EDA on a 0.1% simple random sample to keep queries fast and cheap. The network team now sends you a list of questions about the data. Which tasks should still be run on the FULL data with aggregate queries rather than on the sample? (Select TWO)","options":["Estimating the share of calls made at night","Estimating the mean call duration","Counting records for rare error codes seen a few hundred times","Finding the true minimum and maximum call duration","Viewing the general shape of the duration histogram"],"answer":[2,3],"explain":"عينة 0.1% من 3 مليارات تساوي 3 ملايين سجل، وهي تقدّر المتوسطات والنِّسب وشكل التوزيع بدقة عالية جداً. لكن القيم القصوى والأحداث النادرة لا تظهر في العينة إلا مصادفة: رمز خطأ يتكرر بضع مئات من المرات يُتوقع منه أقل من سجل واحد في العينة، والـ min والـ max الحقيقيان غالباً خارجها، فهذه تُحسب على البيانات الكاملة باستعلامات تجميعية."},{"id":"eda1-036","domain":"eda","level":"associate","tags":["outliers","fraud","keep-outliers"],"stem":"You are a data scientist in the card-fraud team of a Gulf bank. The transactions table holds 90 million card payments from the last 18 months, with merchant category, channel, country and amount. During EDA you see that 0.4% of transactions exceed 50,000 SAR, far above the upper bound of the 1.5 × IQR rule. The payments team confirms these records are genuine, mostly jewellery, car deposits and travel purchases, and the fraud investigators note that a disproportionate share of confirmed fraud losses sits in exactly this range. A colleague who recently cleaned a marketing dataset suggests deleting these rows 'to clean the data' before training the fraud classifier. The bank's dashboard team is also asking for a new colour scheme, which is unrelated. What is the BEST decision about these transactions?","options":["Keep them, because they are valid and carry the signal of interest","Move them all to the test set, so that the training data stays clean","Replace their amounts with the median transaction amount of the table","Delete them, because outliers always degrade the quality of a classifier"],"answer":[0],"explain":"هذه المعاملات صحيحة ومؤكدة، وهي بالذات المنطقة التي تتركز فيها خسائر الاحتيال، فحذفها يزيل الإشارة التي نريد من النموذج تعلّمها. القول بأن الـ outliers تضر دائماً بالنموذج تعميم خاطئ؛ فالمعالجة تعتمد على كون القيمة خطأً أم ظاهرة حقيقية. ونقلها كلها إلى مجموعة الاختبار يجعل النموذج يُقيَّم على نمط لم يره في التدريب."},{"id":"eda1-037","domain":"eda","level":"associate","tags":["missing-data","imputation","drop-column"],"stem":"You are cleaning a customer table of 80,000 policyholders at an insurance company before building a churn model. The table summarises the columns that have missing values, together with notes from the data owner. You want to keep as many rows as possible and use simple, defensible methods for a first baseline. Which actions are MOST appropriate? (Select TWO)","table":{"caption":"Missing-value summary","headers":["Column","Type","% missing","Note"],"rows":[["age","numeric","1%","random entry gaps"],["fax_number","text","97%","legacy field, unused"],["annual_income","numeric","12%","strongly right-skewed"],["churned (target)","binary","0%","complete"]]},"options":["Impute annual_income with its median","Drop every row that has any missing value","Impute fax_number with its most frequent value","Drop the fax_number column","Impute annual_income with its mean"],"answer":[0,3],"explain":"العمود fax_number مفقود بنسبة 97% وغير مستخدم فلا فائدة من الإبقاء عليه، والعمود annual_income ملتوٍ بشدة لليمين فالـ median أنسب من الـ mean الذي تسحبه الدخول العالية. حذف كل صف فيه قيمة مفقودة سيزيل نحو 97% من الصفوف بسبب fax_number، وهذا يناقض هدف الحفاظ على الصفوف."},{"id":"eda1-038","domain":"eda","level":"expert","tags":["tree-models","monotonic-transforms"],"stem":"You train a random forest on heavily skewed income and balance features at a bank. A colleague insists that every feature must be log-transformed first, otherwise the forest will choose poor splits. Which statement is correct?","options":["The log transform is needed, because trees rely on Euclidean distances","Monotonic transforms preserve value order, so the tree splits barely change","Trees fail on skewed features unless the features are first standardised","Trees require normally distributed inputs, so the log transform is mandatory"],"answer":[1],"explain":"أشجار القرار تختار نقاط التقسيم بحسب ترتيب القيم، والتحويل الرتيب (monotonic) مثل الـ log يحافظ على الترتيب نفسه، فتبقى التقسيمات والتنبؤات كما هي عملياً. الأشجار لا تفترض التوزيع الطبيعي ولا تستخدم المسافات الإقليدية؛ فهذه متطلبات نماذج أخرى مثل النماذج الخطية و KNN، ولذلك فالتحويل هنا جهد بلا فائدة تُذكر."},{"id":"eda1-039","domain":"eda","level":"assistant","tags":["inconsistent-categories","value-counts"],"stem":"You are cleaning a branch-performance dataset for a Saudi retail bank before comparing cities. The business confirms that it has branches in exactly three cities, and the city field was typed manually by branch staff. The table shows value_counts() for the 'branch_city' column. What is the MOST appropriate next step?","table":{"caption":"value_counts() for branch_city","headers":["Value","Count"],"rows":[["Riyadh","4,210"],["Jeddah","3,050"],["Dammam","1,480"],["riyadh","388"],["RIYADH","125"],["'Riyadh ' (trailing space)","97"],["Jedda","41"]]},"options":["Drop the rows whose city label occurs fewer than 500 times in the column","Keep all seven values, since each one may represent a separate branch group","Merge all the rare labels into a single 'Other' category for the analysis","Normalise case and whitespace, and map misspellings to the valid names"],"answer":[3],"explain":"القيم السبع هي في الحقيقة ثلاث مدن فقط كُتبت بصيغ مختلفة (حالة الأحرف، مسافة زائدة، خطأ إملائي)، فالصحيح توحيد الصيغة وربط الأخطاء بالأسماء الصحيحة. دمج القيم النادرة في 'Other' مغرٍ لكنه يفصل 651 سجلاً عن مدنها الحقيقية فيشوّه إحصاءات الرياض وجدة، وحذف تلك الصفوف يُضيّع بيانات سليمة."},{"id":"eda1-040","domain":"eda","level":"assistant","tags":["bivariate-analysis","box-plot"],"stem":"At a telecom operator you want to compare the distribution of monthly charges across four contract types, including the spread and any outliers, in a single figure. Which plot is MOST suitable?","options":["A scatter plot of monthly charges against customer ID","A single histogram of all monthly charges together","A pie chart showing the share of each contract type","Side-by-side box plots, one per contract type"],"answer":[3],"explain":"مقارنة متغير رقمي عبر فئات متغير فئوي تناسبها الـ box plots المتجاورة، فهي تعرض الـ median والتشتت والـ outliers لكل فئة في شكل واحد. الـ histogram الواحد لكل الرسوم يخلط الفئات الأربع فلا تظهر الفروق بينها، والـ pie chart يعرض الحصص فقط ولا يقول شيئاً عن الرسوم."},{"id":"eda1-041","domain":"eda","level":"expert","tags":["iqr","skewness","log-scale"],"stem":"You are analysing business-to-business payments at a fintech that serves small and medium enterprises. The 'amount' column has 14 million rows, no missing values, and is strongly right-skewed: most payments are a few hundred riyals, while supplier settlements run into the hundreds of thousands. On a log scale the histogram looks close to a bell curve. A teammate applies the 1.5 × IQR rule to the raw amounts and reports that 11% of all payments are 'outliers', every one of them on the high side, and proposes excluding them. You spot-check 200 flagged payments with the operations team, and all are ordinary supplier invoices. The compliance team runs its own separate screening for suspicious payments. What is the MOST appropriate conclusion?","options":["The multiplier should be lowered from 1.5 to 1.0 to make the rule stricter","The rule suits roughly symmetric data; apply it to log-amounts instead","Quartiles are unreliable at 14 million rows, so the rule cannot be trusted","About 11% of the payments are anomalies and should be excluded from EDA"],"answer":[1],"explain":"قاعدة 1.5 × IQR مصممة لتوزيعات شبه متماثلة؛ وفي توزيع قريب من log-normal يكون الذيل الأيمن الطويل جزءاً طبيعياً من البيانات فتُعلَّم نسبة كبيرة زوراً، والفحص اليدوي أكد أنها فواتير عادية. تطبيق القاعدة على log(amount) حيث التوزيع قريب من الجرس يعطي حدوداً معقولة. استبعاد 11% من الدفعات الصحيحة يشوّه التحليل، وخفض المضاعف يزيد عدد الإنذارات الكاذبة."},{"id":"eda1-042","domain":"eda","level":"expert","tags":["joins","duplicates","row-counts"],"stem":"At a retail bank you prepare an EDA notebook on deposit balances. You left-join the accounts table (2.0 million rows, one row per account) to a customer-contact table on customer_id in order to bring in each customer's city. No filters are applied. After the join the table has 2.6 million rows, and total deposits in your summary are about 30% higher than the figure the finance department reports from the same accounts table. The contact table is maintained by the branch network and is updated whenever a customer changes phone number or address. Balances are stored in riyals in both systems, and the accounts table has no duplicate account numbers. Your manager wants the city-level deposit chart by tomorrow. What is the MOST likely cause, and what should you check FIRST?","options":["customer_id repeats in the contact table; check it for duplicate keys","The balances contain extreme outliers; winsorize them before aggregating","The left join dropped unmatched accounts; switch to an inner join instead","Some accounts lack a customer_id; impute the missing keys before joining"],"answer":[0],"explain":"الـ left join لا يمكن أن يزيد عدد الصفوف إلا إذا تكرر المفتاح في الجدول الأيمن؛ فجدول الاتصال يحتفظ بعدة صفوف للعميل الواحد عند تغيير العنوان أو الهاتف، فتتكرر حساباته وتتضخم الأرصدة. الخطوة الأولى فحص تفرّد customer_id في جدول الاتصال ثم اختيار صف واحد لكل عميل قبل الدمج. والـ left join لا يُسقط صفوفاً من الجدول الأيسر أصلاً، والـ outliers لا تغيّر عدد الصفوف."},{"id":"eda1-043","domain":"eda","level":"assistant","tags":["class-imbalance","target-distribution"],"stem":"You are a data scientist at a consumer-finance company starting a loan-default classification project with 50,000 past loans. The chart shows the distribution of the target variable. The risk team cares most about identifying the customers who will default. Which conclusions should guide your next steps? (Select TWO)","chart":{"type":"bar","title":"Target distribution","xLabel":"Class","yLabel":"Number of loans","x":["No default","Default"],"series":[{"name":"Loans","values":[48500,1500]}]},"options":["Use a stratified split, so that train and test both keep the 3% default rate","Remove the default cases as outliers, because they are so rare","Conclude that the dataset cannot be used for classification","Treat the 3% as label noise and relabel them as 'No default'","Do not rely on accuracy, since always predicting 'No default' scores 97%"],"answer":[0,4],"explain":"نسبة التعثر 1,500 من 50,000 أي 3%، وهذا class imbalance واضح: نموذج يتنبأ دائماً بعدم التعثر يحقق accuracy قدرها 97% دون أي فائدة، فلا بد من مقاييس أخرى ومن stratified split يحافظ على النسبة في التدريب والاختبار. حالات التعثر هي الفئة التي نريد اكتشافها وليست outliers ولا ضجيجاً في التسميات، والبيانات صالحة تماماً للتصنيف."},{"id":"eda1-044","domain":"eda","level":"associate","tags":["imputation","variance"],"stem":"An energy utility surveys households to understand electricity consumption. The column 'household_size' is missing for 25% of households, and an analyst filled every gap with the column mean before exploring how household size relates to consumption. No rows were removed. Which consequences of this choice should you expect? (Select TWO)","options":["The number of households available for analysis falls","The variance of household_size is artificially inflated","The mean of household_size shifts substantially","Its correlation with consumption is weakened","The variance of household_size is artificially reduced"],"answer":[3,4],"explain":"التعويض بالـ mean يضع ربع القيم عند نقطة واحدة في مركز التوزيع، فينكمش التباين وتضعف الارتباطات مع المتغيرات الأخرى لأن القيم المُعوَّضة لا تتغير مع الاستهلاك. أما المتوسط نفسه فيبقى كما هو تماماً بعد التعويض، ولا يُحذف أي صف، فهذان الخياران خاطئان رغم أنهما يبدوان منطقيين."},{"id":"eda1-045","domain":"eda","level":"associate","tags":["outliers","removal-policy"],"stem":"At an energy company you are documenting an outlier policy for a study of residential smart-meter consumption. Which situations justify REMOVING an observation from the analysis dataset? (Select TWO)","options":["The reading is confirmed to come from a faulty meter","The record belongs to an industrial site, outside the study's scope","The reading lowers the model's R-squared on the training data","The reading stretches the axis and makes the histogram hard to read","The reading lies more than three standard deviations above the mean"],"answer":[0,1],"explain":"الحذف مبرَّر حين تكون المشاهدة خطأ قياس مؤكداً أو حين لا تنتمي إلى المجتمع المدروس (موقع صناعي في دراسة سكنية). أما كون القيمة بعيدة بأكثر من ثلاثة انحرافات معيارية فمجرد مؤشر يستدعي الفحص لا سبب كافٍ للحذف، وحذف نقاط لأنها تخفض الـ R-squared أو تُفسد شكل الرسم هو انتقاء للبيانات يُحيّز النتائج."},{"id":"eda1-046","domain":"eda","level":"associate","tags":["imputation","train-test-split"],"stem":"At an e-commerce company you are building a model to predict late deliveries. The column 'delivery_distance_km' has 9% missing values, and the team has agreed to fill them with the median as a simple baseline. You have set aside 20% of the orders as a test set whose only purpose is to estimate how the model will perform on future, unseen orders. A teammate computes the median on the full dataset before the split, arguing that a median uses no label information and that more rows give a more stable estimate. The dataset has 600,000 orders from 14 cities, and the warehouse team is separately reviewing courier contracts. Your manager wants the evaluation to mirror production as closely as possible, where future orders are obviously not available when the imputation value is set. What is the BEST response?","options":["Skip imputation for the test rows and evaluate only on complete test rows","Compute the median on the training rows only and apply it to the test rows","Accept the full-data median, since a median contains no target information","Compute a separate median on the test rows and use it to fill the test gaps"],"answer":[1],"explain":"مجموعة الاختبار تمثّل بيانات مستقبلية غير متاحة وقت تحديد قيمة التعويض، لذا يجب حساب الـ median من بيانات التدريب فقط ثم تطبيقه على الاختبار حتى يحاكي التقييم بيئة الإنتاج. حجة أن الـ median لا يستخدم الهدف مغرية لكنها لا تنفي تسرّب معلومات من الاختبار (data leakage)، وحساب median منفصل للاختبار غير ممكن أصلاً في الإنتاج."},{"id":"eda1-047","domain":"eda","level":"assistant","tags":["missing-data","mnar","imputation"],"stem":"A fintech lender asks loan applicants to declare debts held with other lenders. The field is optional and 30% leave it blank. Collections staff tell you that applicants with heavy debts are the ones who tend to skip it, and nothing else in the application reliably reveals the debt level. A colleague proposes filling the blanks with the mean of the declared values. What is the MAIN risk of this plan?","options":["Imputed debts will be biased low, since the blanks hide the largest debts","The training set will shrink by 30%, which reduces statistical power","The mean is distorted by outliers, and using the median would remove the bias","Mean imputation will inflate the variance of the debt column far too much"],"answer":[0],"explain":"الفقد هنا MNAR لأن احتمال ترك الحقل فارغاً يعتمد على قيمة الدَّين نفسها، فمتوسط القيم المُصرَّح بها أقل من الحقيقة وتعويض الفراغات به يُدخل تحيزاً منهجياً نحو الأسفل. استبدال المتوسط بالـ median مغرٍ لكنه لا يحل المشكلة لأنه محسوب أيضاً من المُصرِّحين فقط، كما أن التعويض بالمتوسط يقلّل التباين ولا يضخّمه ولا يحذف أي صف."},{"id":"eda1-048","domain":"eda","level":"associate","tags":["sentinel-values","describe","hidden-missing"],"stem":"You are a data scientist at a public health agency exploring a diabetes-screening dataset of 768 adult women before any modelling. The table shows part of the describe() output, and isnull() reports no missing values in any column. A clinician reminds you that these are measurements taken from living patients. Which interpretation is MOST appropriate?","table":{"caption":"describe() excerpt","headers":["Statistic","glucose","blood_pressure","bmi","pregnancies"],"rows":[["count","768","768","768","768"],["min","0","0","0.0","0"],["25%","99","62","27.3","1"],["50%","117","72","32.0","3"],["max","199","122","67.1","17"]]},"options":["Zero glucose, blood_pressure and bmi are hidden gaps; zero pregnancies is valid","All four columns are complete and valid, since every count equals 768 rows","The zeros are genuine low outliers and should be capped at the 25th percentile value","Zeros in all four columns, including pregnancies, are hidden missing values"],"answer":[0],"explain":"لا يمكن لإنسان حيّ أن يكون سكر دمه أو ضغطه أو BMI مساوياً للصفر، فهذه الأصفار رموز لقيم مفقودة يجب تحويلها إلى NaN، بينما عدد مرات الحمل صفر قيمة حقيقية ومنطقية تماماً. الاعتماد على count أو isnull() وحدهما مضلل لأن الصفر ليس NaN، وتعميم الحكم على الأعمدة الأربعة يتجاهل المعنى الطبي لكل عمود."},{"id":"eda1-049","domain":"eda","level":"assistant","tags":["impossible-values","data-quality"],"stem":"In a hospital patient table, 14 of 80,000 records show an age between 150 and 999 years. The source system cannot be re-queried to recover the true ages. Which treatment is MOST appropriate?","options":["Apply a log transform to the age column to shrink their influence","Keep them unchanged, because tree-based models tolerate extreme values","Winsorize them down to the 99th percentile of the age column","Set these ages to missing and handle them with the other missing values"],"answer":[3],"explain":"عمر يتجاوز 150 سنة قيمة مستحيلة أي خطأ إدخال وليس outlier حقيقياً، والعمر الصحيح مجهول، فالأمانة تقتضي اعتباره مفقوداً ثم معالجته كبقية القيم المفقودة. الـ winsorizing مغرٍ لكنه يفترض بلا دليل أن المريض مسنّ جداً فيختلق معلومة، والإبقاء على القيم أو تحويلها بالـ log يُبقي خطأً معروفاً داخل البيانات."},{"id":"eda1-050","domain":"eda","level":"assistant","tags":["missing-data","mar"],"stem":"You are a data scientist at a retail bank analysing a customer survey. The 'monthly_income' field is empty for 18% of respondents. When you break this down, you find that customers under 25 skip the question far more often than older customers, but within each age group the people who skip it have profiles similar to those who answer. Age is fully recorded. Which missing-data mechanism BEST describes this situation?","options":["Missing not at random (MNAR): missingness depends on the unseen income itself","Structurally missing: the income question does not apply to these customers","Missing at random (MAR): missingness depends on an observed variable, age","Missing completely at random (MCAR): missingness is unrelated to any variable"],"answer":[2],"explain":"الفقد يعتمد على متغير مُشاهَد بالكامل (العمر) وليس على قيمة الدخل المفقودة نفسها، وهذا هو تعريف الـ MAR. لو كان MCAR لما اختلفت نسبة الفقد بين الفئات العمرية، ولو كان MNAR لكان الفقد مرتبطاً بمقدار الدخل نفسه حتى داخل الفئة العمرية الواحدة، وهو ما ينفيه السيناريو."},{"id":"eda1-051","domain":"eda","level":"associate","tags":["outliers","k-means","distance-based"],"stem":"A retailer segments customers with K-means on annual spend and visit frequency. Three corporate accounts spend 200 times more than typical shoppers, and with k = 4 the algorithm gives these accounts clusters almost of their own while lumping nearly all other customers into one cluster. What is the MOST likely cause?","options":["K-means cannot produce valid segments when it has only two numeric features","Squared distances let the extreme accounts dominate the centroid positions","The algorithm ran for too many iterations and over-fitted the customers","Four clusters are too many for a customer dataset of this kind and size"],"answer":[1],"explain":"الـ K-means يصغّر مجموع مربعات المسافات، فالنقاط البعيدة جداً تساهم بمقدار هائل في دالة الهدف وتجذب الـ centroids نحوها حتى تحصل على عناقيد خاصة بها. المشكلة ليست في عدد الخصائص ولا في عدد التكرارات؛ فالخوارزمية تتقارب ولا يحدث overfitting بزيادة التكرارات. الحل معالجة هذه الحسابات أو فصلها قبل التجميع."},{"id":"eda1-052","domain":"eda","level":"associate","tags":["date-formats","parsing","data-quality"],"stem":"An airline's revenue team combines bookings from two reservation systems. The legacy system, used by the call centre, exports booking dates as DD/MM/YYYY, while the newer web system exports MM/DD/YYYY. Both feeds land in one CSV with a 'source_system' column, and an intern loaded the file letting the parser infer the date format automatically. In your EDA you notice that bookings appear unusually concentrated in the first twelve days of each month, that some web bookings seem to have been made months after the flight departed, and that about 4% of rows failed to parse. Fare amounts, currencies and passenger counts all look correct. The team needs a reliable daily booking curve for the next pricing review. What is the MOST appropriate fix?","options":["Let the parser infer the format row by row, since it can recognise both styles","Sort the rows by the parsed date, so that wrongly parsed dates move to the ends","Parse each source with its own explicit format, using the source_system column","Drop all rows whose day and month are both 12 or lower, as they are ambiguous"],"answer":[2],"explain":"تاريخ مثل 03/04/2026 غامض ولا يمكن لأي parser أن يعرف من النص وحده هل هو 3 أبريل أم 4 مارس؛ المعلومة الحاسمة هي النظام المصدر، فنحلّل كل مصدر بصيغته الصريحة. الاستنتاج التلقائي صفاً بصف هو سبب المشكلة أصلاً لأنه ينجح فقط عندما يتجاوز اليوم 12، وحذف الصفوف الغامضة يُسقط نحو 40% من البيانات بشكل متحيز نحو أوائل الشهر."},{"id":"eda1-053","domain":"eda","level":"associate","tags":["overplotting","scatter-plot","big-data"],"stem":"You plot trip distance against fare for 8 million rides at a ride-hailing company. The scatter plot is a solid dark blob that hides any structure, and it takes several minutes to render. The rows are stored in order of trip date. Which techniques would make the relationship visible? (Select TWO)","options":["Replace the plot with the Pearson correlation value alone","Increase the marker size so that individual points are clearer","Use a hexbin or 2D density plot built from all the rides","Plot a random sample of the rides with semi-transparent points","Plot only the first 10,000 rows of the file to save time"],"answer":[2,3],"explain":"مشكلة الـ overplotting تُحل إما بتقليل عدد النقاط عبر عينة عشوائية مع شفافية (alpha)، أو بتجميع النقاط في خلايا كثافة مثل hexbin فتظهر مناطق التركّز. تكبير حجم النقاط يزيد التراكب سوءاً، وأخذ أول 10,000 صف ليس عينة عشوائية لأن الملف مرتب بالتاريخ، ومعامل Pearson وحده يخفي شكل العلاقة والقيم الشاذة."},{"id":"eda1-054","domain":"eda","level":"associate","tags":["documentation","reproducibility"],"stem":"A pharmaceutical analytics team must be able to show auditors exactly how the analysis dataset was derived from the raw clinical-trial export, months after the work was done. Which practices BEST support this requirement? (Select TWO)","options":["Describe the cleaning steps from memory in the final report","Keep the raw export read-only and never overwrite it","Keep only the final cleaned file, to avoid confusion between versions","Do all cleaning in a ver
