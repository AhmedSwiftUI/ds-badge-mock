 model?","options":["Pickle the trained model and load the pickle file from the C++ application","Export the model to ONNX and run it with a compatible inference runtime","Rewrite the training code in C++ and retrain on each inspection station","Send the weights as CSV and let engineers re-implement the network by hand"],"answer":[1],"explain":"ONNX صيغة مفتوحة مستقلة عن إطار التدريب واللغة، فيمكن تصدير نموذج PyTorch إليها وتشغيله عبر runtime متوافق من داخل تطبيق C++ دون Python. ملف pickle خاص بـ Python ولا يمكن لتطبيق C++ قراءته، وإعادة كتابة الشبكة يدوياً عرضة للأخطاء ويصعب صيانتها مع كل إصدار جديد."},{"id":"mlops-028","domain":"mlops","level":"associate","tags":["rest-api","fastapi","latency"],"stem":"You wrapped a 900 MB text-classification model in a FastAPI service for an insurance call centre. Each request takes about 4 seconds, although the prediction itself takes 40 ms in a notebook. Reviewing the code, you see that joblib.load(...) is called inside the /predict handler function. Which change would MOST improve latency?","options":["Switch the web framework from FastAPI to Flask","Return the predictions as plain text instead of a JSON body","Load the model once at application startup and reuse it","Add more CPU cores and memory to the serving machine"],"answer":[2],"explain":"تحميل ملف بحجم 900 MB من القرص مع كل طلب هو مصدر الأربع ثوانٍ، بينما التنبؤ نفسه 40 ms فقط؛ الحل تحميل النموذج مرة واحدة عند بدء التطبيق وإبقاؤه في الذاكرة. تغيير الـ framework أو صيغة الاستجابة لا يمس عنق الزجاجة، وزيادة العتاد تكلفة إضافية لا تعالج السبب."},{"id":"mlops-029","domain":"mlops","level":"associate","tags":["privacy","access-control","pseudonymization"],"stem":"A data science team at a telecom operator is starting a churn project that uses call records and customer profiles containing names, national IDs and phone numbers. The model itself only needs usage, billing and complaint history. Which TWO measures BEST protect personal data during model development? (Select TWO)","options":["Work on pseudonymized data in which direct identifiers are removed or tokenized","Copy the full raw tables to every laptop so that work can continue offline","Grant least-privilege access, limited to the columns the project really needs","Share one team login for the database so that access is simpler to manage","Keep all identifiers as model features, because they may improve accuracy"],"answer":[0,2],"explain":"حماية البيانات الشخصية أثناء التطوير تقوم على تقليل التعرض: العمل على بيانات pseudonymized بدون معرّفات مباشرة، ومنح الصلاحيات بمبدأ least privilege على الأعمدة اللازمة فقط. نسخ الجداول الخام على الأجهزة المحمولة يوسّع سطح التسريب، والحساب المشترك يلغي إمكانية تتبع من وصل إلى ماذا (audit trail)، والمعرّفات الشخصية ليست features مفيدة أصلاً وتسبب overfitting."},{"id":"mlops-030","domain":"mlops","level":"assistant","tags":["docker","reproducible-environments"],"stem":"Your fraud model service runs perfectly on your laptop but crashes on the production server because of a different Python version and missing system libraries. Which solution addresses this class of problem MOST directly?","options":["Package the service and its dependencies in a Docker image","Retrain the model directly on the production server hardware","Increase the memory and CPU allocated to the production server","Convert the notebook into one long standalone Python script"],"answer":[0],"explain":"مشكلة «يعمل على جهازي فقط» سببها اختلاف البيئة (إصدار Python ومكتبات النظام)، والـ Docker image تحزم الكود مع كل اعتمادياته في بيئة واحدة تعمل بالشكل نفسه على أي خادم. إعادة التدريب على الخادم أو زيادة الذاكرة لا علاقة لهما بسبب العطل، وتحويل الـ notebook إلى script لا يحل نقص المكتبات."},{"id":"mlops-031","domain":"mlops","level":"assistant","tags":["docker","image-vs-container"],"stem":"A junior colleague says: 'I deleted the running container of our scoring service, so the Docker image is gone and we must rebuild everything from scratch.' Which statement is correct?","options":["Correct: a container and the image it was started from are the same object","Incorrect: an image is a template, and containers are instances of it","Correct: an image exists only while at least one container of it is running","Incorrect: a container is a template, and images are its running instances"],"answer":[1],"explain":"الـ image قالب ثابت للقراءة فقط يحتوي الكود والاعتماديات، والـ container نسخة عاملة تُنشأ من هذا القالب؛ حذف الـ container لا يحذف الـ image ويمكن تشغيل container جديد منها فوراً. العبارة المعكوسة (الـ container هو القالب) خطأ شائع عند المبتدئين."},{"id":"mlops-032","domain":"mlops","level":"associate","tags":["throughput","batch-inference","scalability"],"stem":"A retailer's nightly job must score 200 million customer–product rows within a four-hour window. The current implementation loops over the rows and sends one HTTP request per row to the model's REST endpoint; it takes 19 hours. The model itself is a small gradient-boosting model. Which change is MOST appropriate?","options":["Raise the REST endpoint's timeout so that long-running calls no longer fail","Replace the model with a deep neural network to make each prediction faster","Score large vectorized chunks of rows, partitioned across parallel workers","Score a 10% sample of rows each night and reuse older scores for the rest"],"answer":[2],"explain":"عنق الزجاجة هو تكلفة طلب HTTP لكل صف وليس النموذج؛ في الـ batch inference نحمّل النموذج داخل الـ job ونتنبأ على دفعات كبيرة vectorized موزعة على عدة workers، فترتفع الـ throughput أضعافاً كثيرة. رفع الـ timeout لا يسرّع شيئاً، والشبكة العصبية أبطأ غالباً من نموذج boosting صغير، وتسجيل 10% فقط يغيّر المنتج نفسه ويقدم درجات قديمة."},{"id":"mlops-033","domain":"mlops","level":"associate","tags":["reproducibility","data-versioning","experiment-tracking"],"stem":"An auditor asks a bank's data science team to reproduce exactly the credit model that was approved 14 months ago. The training code is in git, but the team cannot regenerate the same model: the source tables have been updated since, and nobody remembers the settings used. Which TWO practices would MOST directly have prevented this? (Select TWO)","options":["Using a larger training set so that the results become more stable","Versioning the exact snapshot of training data used for the model","Training on more powerful hardware in order to shorten each run","Recording seeds, parameters and the environment with each run","Reporting the validation metrics with more decimal places"],"answer":[1,3],"explain":"إعادة إنتاج نموذج تتطلب تثبيت ثلاثة أشياء: الكود (موجود في git)، ونسخة البيانات بالضبط (data versioning/snapshot)، وإعدادات التشغيل (seeds وparameters وإصدارات المكتبات) المسجلة مع كل run في أداة مثل MLflow. بيانات أكبر أو عتاد أقوى لا يعيدان النموذج نفسه، لأن الجداول المصدرية تغيرت والإعدادات مجهولة."},{"id":"mlops-034","domain":"mlops","level":"assistant","tags":["experiment-tracking","mlflow"],"stem":"Over three weeks you ran about 80 experiments for a delivery-time model, changing features and hyperparameters, and you noted results in a spreadsheet only when you remembered. Your manager now asks which exact configuration produced the best validation MAE, and you cannot tell. Which practice addresses this BEST?","options":["Run far fewer experiments so that each one is easier to remember afterwards","Save each trained model file with the date and time in its file name","Keep only the best model found so far and delete all the other files","Log every run's parameters and metrics in a tracker such as MLflow"],"answer":[3],"explain":"الـ experiment tracking يسجل آلياً لكل run الـ parameters والـ metrics ونسخة الكود والـ artifacts، فيمكن ترتيب التجارب ومعرفة الإعداد الأفضل وإعادة إنتاجه. وضع التاريخ في اسم الملف يحفظ النموذج لكنه لا يخبرك بأي features أو hyperparameters أنتجته ولا بنتيجته."},{"id":"mlops-035","domain":"mlops","level":"associate","tags":["model-registry","governance"],"stem":"At an e-commerce firm, models are deployed by copying a file named model.pkl to a shared drive that the scoring service reads. The firm sells in four countries, the service handles 2,000 requests per second, and the data science team grew from three to eleven people this year. Last Thursday a data scientist overwrote the file with a new version that had only been tested in a notebook. When conversion dropped, nobody could tell which version had been live before, who approved the change, or what its validation metrics had been; restoring the old behaviour took two days of retraining from an old branch. Which practice BEST prevents this situation?","options":["A model registry with versioned models and approved stage transitions","A strict file naming convention such as model_final_v2_new.pkl","Sending an email to the whole team whenever the model file is replaced","Committing the production model file to the git repository's main branch"],"answer":[0],"explain":"الـ model registry يحفظ كل إصدار من النموذج مع metrics ومصدره (lineage)، ويضبط الانتقال بين المراحل (Staging ثم Production) بموافقات، فيُعرف دائماً ما هو الإصدار الحي ومن وافق عليه ويمكن الـ rollback فوراً. تسمية الملفات أو البريد الإلكتروني تعتمد على انضباط الأفراد ولا تمنع الكتابة فوق الملف ولا توفر سجل موافقات."},{"id":"mlops-036","domain":"mlops","level":"expert","tags":["ci-cd","ml-testing","data-validation"],"stem":"You are designing a CI/CD pipeline for a loan-default model at a fintech. Models are retrained monthly by an automated job, and no human looks at each run. Beyond ordinary software checks such as linting, which THREE checks are MOST valuable to automate before a new model version can be promoted? (Select THREE)","options":["Schema and range validation of the training and scoring data","A check that the new model has more parameters than the previous one","Comparison with the production model on a fixed holdout set","A check that the accuracy on the training set has reached 100%","Unit tests of feature-engineering code on small known inputs"],"answer":[0,2,4],"explain":"خط CI/CD للـ ML يختبر ثلاثة أشياء: البيانات (schema وranges)، والكود (unit tests لدوال الـ feature engineering بمدخلات معروفة الناتج)، والنموذج (مقارنة المرشح بنموذج الإنتاج على holdout ثابت قبل الترقية). عدد الـ parameters ليس مقياس جودة، ودقة 100% على بيانات التدريب علامة overfitting وليست شرط قبول."},{"id":"mlops-037","domain":"mlops","level":"associate","tags":["data-validation","schema-checks","monitoring"],"stem":"You maintain a model at a private hospital group that estimates a recommended dose band from patient attributes. It has worked well for a year. On Sunday the vendor of the admissions system deployed an update; since then the 'height' field arrives in metres instead of centimetres (1.72 instead of 172). The model did not crash — it silently produced unusual dose bands for two days until a pharmacist noticed. The group has 14 branches, the model serves about 3,000 predictions per day, and it was last retrained four months ago. The vendor's release notes did not mention the change. Which control would MOST directly have caught the problem immediately?","options":["Retraining the model every week on the most recent admissions data","Schema and range checks on incoming features before scoring","A larger and more diverse training set covering all 14 branches","Monitoring the prediction API's response time and error codes"],"answer":[1],"explain":"تغيّر الوحدة من سنتيمتر إلى متر يجعل القيم خارج المدى المتوقع (مثلاً 100–220)، وفحص الـ schema والـ ranges على المدخلات قبل التنبؤ كان سيرفض الطلبات أو يطلق إنذاراً من أول سجل. مراقبة زمن الاستجابة وأكواد الخطأ لا تكشف شيئاً لأن الخدمة لم تتعطل تقنياً، وإعادة التدريب الأسبوعي كانت ستدرّب النموذج على بيانات خاطئة."},{"id":"mlops-038","domain":"mlops","level":"expert","tags":["training-serving-skew","feature-store"],"stem":"A food-delivery platform trained a delivery-time model offline. The feature 'restaurant average preparation time over the last 7 days' was computed by an analyst in SQL on the data warehouse. For the live service, a backend engineer re-implemented the feature in Java from a short description, using the last 7 calendar days including today and a different treatment of cancelled orders. Offline MAE was 4.1 minutes; in production it is 7.9 minutes, although the distributions of the raw input fields look unchanged and the deployed model file is identical to the trained one. The platform serves 12 cities and handles about 90,000 orders per day. What is the BEST long-term fix?","options":["Retrain the model more often so that it adapts to the production values","Add many more features so that the model depends less on this one","Train and serve from one shared feature definition, e.g. a feature store","Increase regularization to make the model robust to noisy feature values"],"answer":[2],"explain":"هذه حالة training–serving skew: الـ feature نفسها تُحسب بمنطقين مختلفين (SQL وقت التدريب وJava وقت الخدمة)، فيرى النموذج في الإنتاج قيماً تختلف عما تدرّب عليه. الحل الجذري تعريف واحد مشترك للـ feature يُستخدم في التدريب والخدمة معاً، وهذا دور الـ feature store أو مكتبة تحويلات مشتركة. إعادة التدريب المتكرر على القيم المحسوبة offline لا تزيل التناقض بين المسارين."},{"id":"mlops-039","domain":"mlops","level":"expert","tags":["feature-store","point-in-time","data-leakage"],"stem":"A bank builds a training set for a loan-default model. Each row is a loan application from 2022–2024, with the outcome observed 12 months later. To add the feature 'number of late payments on other products', an engineer joins each application to the customer's CURRENT value in the customer summary table, which is refreshed daily. Offline AUC rises from 0.78 to 0.93. The data scientist is excited, and the business sponsor wants to go live before the end of the quarter. The summary table has 45 columns, the join runs in six minutes, and the bank receives around 20,000 applications per month. The engineer validated the model with 5-fold cross-validation. What is the MAIN problem?","options":["The six-minute join is too slow to be used in a production scoring service","A 45-column summary table will cause the curse of dimensionality","AUC is not a valid evaluation metric for loan-default models","Feature values come from after the application date, leaking the outcome"],"answer":[3],"explain":"الربط بالقيمة «الحالية» يعني أن طلباً من 2022 يحصل على عدد المتأخرات حتى اليوم، أي معلومات بعد تاريخ الطلب تتضمن نتيجة التعثر نفسها، وهذا data leakage يفسر قفزة الـ AUC ولن يتكرر في الإنتاج. الصحيح هو point-in-time join يأخذ قيمة الـ feature كما كانت في تاريخ الطلب، وهو ما توفره الـ feature stores. زمن الربط وعدد الأعمدة تفاصيل ثانوية أمام هذا الخلل."},{"id":"mlops-040","domain":"mlops","level":"associate","tags":["model-cards","documentation","responsible-ai"],"stem":"Your team at an insurance company is about to release a claims-severity model to several business units, and you are asked to write its model card. Which THREE items belong in it? (Select THREE)","options":["The intended use of the model and the uses that are out of scope","The personal phone numbers of customers found in the training data","Evaluation results, including performance on relevant subgroups","Known limitations, risks and ethical considerations of the model","A guarantee that the model will never require any retraining"],"answer":[0,2,3],"explain":"الـ model card وثيقة شفافية تصف الاستخدام المقصود وغير المقصود، وبيانات التدريب والتقييم، والنتائج بما فيها الأداء على الفئات الفرعية، والقيود والاعتبارات الأخلاقية. البيانات الشخصية للعملاء لا مكان لها في وثيقة كهذه، ولا يمكن لأحد أن يضمن أن النموذج لن يحتاج إلى إعادة تدريب."},{"id":"mlops-041","domain":"mlops","level":"expert","tags":["ci-cd","model-validation","slice-evaluation"],"stem":"A telecom's CI pipeline compares a candidate churn model with the production model on a fixed holdout set. Business accounts are only 8% of churners but generate 45% of revenue. The pipeline currently promotes any candidate whose overall recall is higher. Based on the table, what is the MOST appropriate decision?","table":{"caption":"Recall on the fixed holdout set","headers":["Segment","Share of churners","Production recall","Candidate recall"],"rows":[["Overall","100%","0.71","0.74"],["Consumer prepaid","60%","0.70","0.76"],["Consumer postpaid","32%","0.73","0.75"],["Business accounts","8%","0.72","0.51"]]},"options":["Promote the candidate, because its overall recall improved","Block promotion and investigate the drop on business accounts","Promote it and remove business accounts from the holdout set","Average both models' recalls and promote if the result exceeds 0.70"],"answer":[1],"explain":"التحسن الإجمالي (0.71 إلى 0.74) يخفي تراجعاً حاداً في شريحة الـ Business accounts من 0.72 إلى 0.51، وهي شريحة صغيرة عددياً لكنها تمثل 45% من الإيراد، لذا يجب أن تتضمن بوابة الترقية فحص الشرائح المهمة وليس المتوسط فقط. الترقية بناءً على المتوسط وحده تخاطر بخسارة أعلى العملاء قيمة، وحذف الشريحة من الـ holdout يخفي المشكلة ولا يحلها."},{"id":"mlops-042","domain":"mlops","level":"associate","tags":["serialization","pipeline","training-serving-skew"],"stem":"A retail analyst trained a model on features that were standardized and one-hot encoded in a notebook, then saved only the fitted classifier. In production the service receives raw records, and a developer re-created the preprocessing from memory; predictions now look erratic. What is the BEST practice to avoid this?","options":["Save a copy of the scaled training data alongside the classifier file","Refit the scaler and encoder on each incoming request before predicting","Serialize one fitted Pipeline that contains preprocessing and model","Drop scaling and encoding so that no preprocessing is needed at all"],"answer":[2],"explain":"المعاملات المتعلَّمة في الـ preprocessing (متوسطات الـ StandardScaler وفئات الـ OneHotEncoder) جزء من النموذج، ولذلك يُحفظ Pipeline واحد fitted يضم التحويلات والـ classifier معاً فيُطبَّق المنطق نفسه في التدريب والخدمة. إعادة fit للـ scaler على كل طلب تنتج قيماً لا علاقة لها بما تدرب عليه النموذج، وحفظ البيانات المحوّلة لا ينقل منطق التحويل."},{"id":"mlops-043","domain":"mlops","level":"expert","tags":["deployment-strategy","shadow-deployment"],"stem":"A bank wants to replace its credit-limit model, which directly changes customers' limits and is subject to regulatory review. The new model performed better offline, but it uses three new real-time features that have never been computed in production before. The risk committee refuses any customer impact until the model has been observed on live traffic for a month. The serving platform can duplicate requests at low cost. The project has been running for nine months, the team has four people, and the old model was built by a vendor that no longer supports it. Predictions are needed within 300 ms, which both models achieve. Which deployment strategy BEST fits these constraints?","options":["Canary release to 5% of customers, expanding the share every week","Blue-green switch of all traffic, with an instant rollback prepared","A/B test with half of the customers assigned to each of the models","Shadow mode: score live traffic without acting on the outputs"],"answer":[3],"explain":"القيد الحاسم هو «لا أثر على أي عميل» مع الحاجة لاختبار النموذج والـ features الجديدة على حركة حقيقية، وهذا تعريف الـ shadow deployment: يستقبل النموذج الجديد نسخة من الطلبات وتُسجَّل مخرجاته للمقارنة دون استخدامها في القرار. الـ canary والـ A/B يعرّضان جزءاً من العملاء لقرارات النموذج الجديد، والـ blue-green يحوّل كل الحركة دفعة واحدة."},{"id":"mlops-044","domain":"mlops","level":"expert","tags":["deployment-strategy","canary","rollback"],"stem":"An e-commerce team will roll out a new search-ranking model as a canary on 5% of traffic before a wider release. Which TWO things should be defined BEFORE the canary starts? (Select TWO)","options":["Guardrail metrics and thresholds that trigger an automatic rollback","A commitment to reach 100% of traffic within one hour whatever happens","How traffic is assigned, so that the canary group is comparable to the rest","A plan to delete the old model's artifacts as soon as the canary starts","A larger training set that will be used for the next model version"],"answer":[0,2],"explain":"قبل بدء الـ canary يجب تحديد الـ guardrail metrics وعتبات الـ rollback مسبقاً حتى لا يكون القرار ارتجالياً تحت الضغط، وتحديد طريقة توزيع الحركة (عشوائية ومتسقة) كي تكون مقارنة مجموعة الـ canary بالبقية عادلة. الالتزام بالوصول إلى 100% مهما حدث يلغي الغرض من الـ canary، وحذف النموذج القديم يجعل الـ rollback مستحيلاً."},{"id":"mlops-045","domain":"mlops","level":"expert","tags":["deployment-strategy","blue-green","rollback"],"stem":"An airline's pricing service must move to a new model version and a new feature pipeline at the same time. The business accepts no downtime, and if anything goes wrong operations wants to be back on the old version within seconds. Paying for duplicate infrastructure for a few days is not a concern. Which strategy fits BEST?","options":["An in-place update of the running servers during the quietest hour","Blue-green: stand up a parallel environment and switch the router","A shadow deployment that lasts six months before any switch is made","Retraining the old model on new data rather than deploying the new one"],"answer":[1],"explain":"في الـ blue-green تُبنى بيئة كاملة موازية بالإصدار الجديد (النموذج مع الـ pipeline)، ثم يُحوَّل الـ router إليها دون توقف، ويبقى الإصدار القديم جاهزاً فيكون الـ rollback مجرد إعادة توجيه خلال ثوانٍ. التحديث in-place يسبب توقفاً ويجعل التراجع بطيئاً لأن البيئة القديمة لم تعد موجودة، وتكلفة البنية المزدوجة مقبولة حسب المعطيات."},{"id":"mlops-046","domain":"mlops","level":"expert","tags":["ab-testing","deployment-strategy"],"stem":"A video-streaming service is A/B testing a new recommendation model. Based on a power calculation, the test was planned to run for 14 days. On day 3 the dashboard shows the results below, and the product owner wants to stop and ship 'because treatment is ahead'. What should you recommend?","table":{"caption":"A/B test results on day 3","headers":["Metric","Control","Treatment","95% CI of difference"],"rows":[["Watch time per user (min/day)","61.0","61.9","-0.8 to +2.6"],["7-day retention","78.2%","78.5%","-0.9 to +1.5 pts"],["Users per arm","41,000","41,200","-"]]},"options":["Ship now, because treatment is ahead on both of the metrics","Stop the test and keep control, since nothing is significant","Continue to the planned 14 days before making a decision","Move all traffic to treatment in order to gather data faster"],"answer":[2],"explain":"فترتا الثقة تشملان الصفر، فلا دليل بعد على فرق في أي اتجاه، والاختبار لم يبلغ المدة التي حددها حساب الـ power؛ إيقافه مبكراً عند رؤية نتيجة مرغوبة (peeking) يرفع معدل النتائج الكاذبة، كما أن 3 أيام لا تغطي دورة أسبوعية كاملة. كذلك لا يصح إعلان فشل النموذج الآن للسبب نفسه، فالصحيح إكمال الـ 14 يوماً ثم اتخاذ القرار."},{"id":"mlops-047","domain":"mlops","level":"expert","tags":["canary","rollback","monitoring"],"stem":"A payments company releases a new fraud model as a canary on 5% of traffic. After two hours the monitoring shows the figures below. Before the release, the team agreed on a rollback guardrail: an error rate above 1%. What is the MOST appropriate action?","table":{"caption":"Canary monitoring after two hours","headers":["Metric","Baseline (95%)","Canary (5%)"],"rows":[["HTTP 5xx error rate","0.2%","2.9%"],["p99 latency (ms)","110","118"],["Transactions flagged","1.4%","1.5%"],["Requests served","1,900,000","100,000"]]},"options":["Expand the canary to 50% of traffic, since flag rates are similar","Keep the canary at 5% for another week to collect more evidence","Switch all traffic to the new model to see whether errors persist","Roll back the canary and investigate the cause of the errors"],"answer":[3],"explain":"معدل أخطاء الـ canary يبلغ 2.9% مقابل 0.2% للنسخة الأساسية، وهو يتجاوز بوضوح الـ guardrail المتفق عليه (1%) على 100,000 طلب، أي عينة كافية، فالإجراء هو rollback فوري ثم التحقيق. تشابه نسبة العمليات الموسومة لا يعوّض فشل 2.9% من الطلبات، وإبقاء الـ canary أسبوعاً يعني استمرار تضرر عملاء حقيقيين دون حاجة."},{"id":"mlops-048","domain":"mlops","level":"expert","tags":["concept-drift","monitoring","performance-decay"],"stem":"You monitor a loan-approval model at a consumer finance company. Labels (repaid or defaulted within 90 days) arrive with a delay but are now available for all months shown. The chart shows monthly accuracy and the largest PSI across all input features. In month 4 a new regulation changed how customers can restructure their debt. What is the MOST likely cause of the decay?","chart":{"type":"line","title":"Model accuracy and input drift by month","xLabel":"Month after deployment","yLabel":"Value","x":["M1","M2","M3","M4","M5","M6"],"series":[{"name":"Accuracy","values":[0.91,0.91,0.9,0.86,0.81,0.77]},{"name":"Max feature PSI","values":[0.02,0.03,0.02,0.03,0.02,0.03]}]},"options":["Concept drift: the relationship between inputs and default changed","Covariate shift: the input distributions moved away from training","Overfitting that was already present from the first month onwards","A training–serving skew that was introduced at deployment time"],"answer":[0],"explain":"الـ PSI بقي قرب 0.02–0.03 طوال الفترة، أي أن توزيع المدخلات لم يتغير، بينما هبطت الـ accuracy بدءاً من الشهر الرابع المتزامن مع النظام الجديد؛ هذا يعني أن العلاقة بين الـ features والنتيجة P(y|x) هي التي تغيرت، وهو تعريف الـ concept drift. الـ covariate shift كان سيظهر كارتفاع في الـ PSI، والـ overfitting أو الـ training–serving skew كانا سيظهران من الشهر الأول لا بعد ثلاثة أشهر مستقرة."},{"id":"mlops-049","domain":"mlops","level":"expert","tags":["data-drift","psi","monitoring"],"stem":"A bank computes the PSI of each input of its credit-scoring model every month, comparing production data with the training sample. The team follows the common rule of thumb: below 0.10 stable, 0.10–0.25 moderate shift, above 0.25 significant shift. Labels for this period are not yet available. Which conclusion is correct?","table":{"caption":"PSI by feature, current month vs training","headers":["Feature","PSI"],"rows":[["age","0.03"],["monthly_income","0.08"],["tenure_months","0.12"],["application_channel","0.31"]]},"options":["All four features are stable, so no action is needed this month","application_channel shifted significantly; investigate it first","monthly_income has the most serious shift and requires retraining now","A PSI above 0.25 proves that the model's accuracy has already dropped"],"answer":[1],"explain":"حسب القاعدة المتبعة، application_channel بقيمة 0.31 تجاوزت 0.25 أي انزياح كبير يستحق التحقيق أولاً (قناة جديدة؟ تغيير في الترميز؟)، وtenure_months بقيمة 0.12 انزياح متوسط يُراقب، والبقية مستقرة. الـ PSI يقيس تغير توزيع المدخلات فقط ولا يثبت بذاته أن الأداء انخفض؛ فهذا يحتاج labels أو تحليلاً لأثر الـ feature على النموذج."},{"id":"mlops-050","domain":"mlops","level":"expert","tags":["ks-test","drift-detection","alerting"],"stem":"A telecom runs a two-sample KS test for every feature each day, comparing 5 million production rows with the training sample, and raises an alert when p < 0.05. Nearly every feature triggers an alert every day, yet model performance is stable and the histograms look almost identical. What BEST explains this, and what should change?","options":["The KS test is invalid for continuous features; use a chi-square test","The model is drifting badly on all features; retrain it on a daily schedule","Huge samples make tiny shifts significant; alert on effect size instead","The p-value threshold is too strict; raise the alert threshold to p < 0.5"],"answer":[2],"explain":"مع ملايين الصفوف تصبح قوة الاختبار هائلة فيُعد أي فرق ضئيل بلا أهمية عملية «ذا دلالة إحصائية»، فينخفض الـ p-value دائماً. الحل هو التنبيه بناءً على حجم الأثر (قيمة إحصاءة KS نفسها أو PSI أو Wasserstein distance) بعتبات عملية، أو الاختبار على عينة ثابتة الحجم. رفع عتبة الـ p-value إلى 0.5 يزيد الإنذارات ولا يقللها، وKS مصمم أصلاً للمتغيرات المتصلة."},{"id":"mlops-051","domain":"mlops","level":"expert","tags":["delayed-labels","monitoring","prediction-drift"],"stem":"A bank's mortgage-default model went live in January. A default is only confirmed after 12 months, so true performance cannot be measured for a year. The bank's economists expect interest rates to rise, the model scores about 900 applications per week, and it was trained on applications from 2019–2023. The model replaced a scorecard that had been in use for eight years, and two of its inputs come from an external credit bureau. The monitoring budget is modest, and no new data sources can be purchased. The head of risk asks how the team will know early if the model starts to go wrong. Which TWO monitoring approaches are MOST useful in the meantime? (Select TWO)","options":["Track drift of the input features against the training distribution","Wait for 12 months and then compute the AUC of the first cohort","Track the score distribution and early proxies such as 30-day arrears","Monitor accuracy on the training set, which is available immediately","Retrain the model every week on the new unlabelled applications"],"answer":[0,2],"explain":"عندما تتأخر الـ labels سنة كاملة نراقب ما هو متاح فوراً: انزياح توزيع المدخلات (PSI/KS) وانزياح توزيع الدرجات المتنبأ بها، إضافة إلى مؤشرات مبكرة مرتبطة بالنتيجة مثل التأخر 30 يوماً. الانتظار 12 شهراً يعني اكتشاف المشكلة بعد منح آلاف القروض، ودقة بيانات التدريب لا تتغير ولا تقول شيئاً عن الإنتاج، ولا يمكن إعادة التدريب supervised على طلبات بلا labels."},{"id":"mlops-052","domain":"mlops","level":"expert","tags":["label-shift","drift-types","calibration"],"stem":"A clinic network uses a model that estimates the probability of influenza from a patient's symptoms. It was trained when about 4% of tested patients were positive. The chart shows the observed positive rate and the model's mean predicted probability per quarter. Clinicians confirm that symptom patterns among positive patients have not changed, and the model still ranks patients well (AUC stable at 0.88). What BEST describes the situation?","chart":{"type":"line","title":"Observed positive rate vs mean predicted probability","xLabel":"Quarter","yLabel":"Percent","x":["Q1","Q2","Q3","Q4","Q5"],"series":[{"name":"Observed positive rate (%)","values":[4,4,5,9,10]},{"name":"Mean predicted probability (%)","values":[4,4,5,6,6]}]},"options":["Concept drift: the same symptoms now indicate a different disease","Covariate shift only: prevalence is unchanged but symptoms moved","Training–serving skew caused by a bug in the feature pipeline","Label (prior) shift: prevalence rose, symptoms per class unchanged"],"answer":[3],"explain":"نسبة الإيجابيين ارتفعت من 4% إلى 10% بينما بقي متوسط الاحتمال المتنبأ به عند 5–6% فقط، مع ثبات أعراض المصابين وثبات الـ AUC؛ أي أن P(y) تغيرت وP(x|y) ثابتة، وهذا هو الـ label shift (prior shift). العلاج المعتاد هو إعادة معايرة الاحتمالات (recalibration) على الانتشار الجديد. لو كان concept drift لتغيرت دلالة الأعراض وتراجع الترتيب (الـ AUC)، وهذا لم يحدث."},{"id":"mlops-053","domain":"mlops","level":"expert","tags":["recalibration","retraining-strategy"],"stem":"A motor insurer's claim-probability model still ranks policies well: its AUC has been stable at 0.81 for a year. However, predicted probabilities are now consistently about 1.5 times the observed claim frequency in every score band, which distorts pricing. Recent labelled data are available, but a full retrain requires a six-week regulatory validation. What is the MOST efficient remedy?","options":["Recalibrate the scores on recent data and keep the underlying model","Rebuild the model from scratch with a new algorithm and new features","Lower the decision threshold by one third and keep the probabilities","Take no action, because a stable AUC means the probabilities are fine"],"answer":[0],"explain":"الترتيب سليم (AUC ثابت) والخلل في مستوى الاحتمالات فقط، فيكفي إعادة المعايرة (مثل Platt scaling أو isotonic regression) على بيانات حديثة فوق النموذج نفسه، وهي أسرع وأرخص من retrain كامل يتطلب ستة أسابيع من التحقق. الـ AUC لا يتأثر بأي تحويل monotonic للدرجات فلا يكشف مشاكل الـ calibration، وتعديل الـ threshold لا يصحح الاحتمالات المستخدمة في التسعير."},{"id":"mlops-054","domain":"mlops","level":"associate","tags":["retraining-strategy","triggered-retraining"],"stem":"A fashion retailer retrains its demand-forecasting model every Sunday night, at a considerable compute cost, for 9,000 products in 60 stores. For most of the year almost nothing changes between two retrains, and the new model is nearly identical to the old one. During sudden events, however — a flash promotion, a competitor opening nearby, an unexpected heatwave — the model stays badly wrong for up to a week until the next Sunday. Actual sales arrive daily, and a dashboard already tracks the forecast error per day. The forecasting team has two people, and the cloud bill has become a topic in management meetings. Which retraining policy is MOST appropriate?","options":["Retrain every night, regardless of what the monitoring shows","Trigger retraining when monitored error crosses a threshold","Stop retraining altogether and rely on the original model","Retrain only when a store manager files a formal complaint"],"answer":[1],"explain":"بما أن القيم الفعلية تصل يومياً والخطأ مراقَب أصلاً، فالأنسب هو triggered retraining: إعادة التدريب عندما يتجاوز الخطأ أو الـ drift عتبة محددة، فيتفاعل النموذج بسرعة مع الأحداث المفاجئة ويوفر تكلفة إعادة تدريب لا تضيف شيئاً في الفترات المستقرة. التدريب الليلي يضاعف التكلفة التي تشتكي منها الإدارة، وانتظار الشكاوى يعني اكتشاف المشكلة بعد وقوع الخسارة."},{"id":"mlops-055","domain":"mlops","level":"expert","tags":["alerting","monitoring"],"stem":"The monitoring system for a logistics company's ETA model sends about 60 alerts per day to a chat channel. Almost all of them are harmless, and last week a real outage was missed because nobody reads the channel any more. Which TWO changes would MOST improve the alerting? (Select TWO)","options":["Alert on impact-related metrics, with thresholds tuned on past variation","Send every alert to more people, so that someone will eventually notice","Add severity levels, and page the on-call person only for critical alerts","Lower all of the thresholds, so that problems are detected even earlier","Disable the monitoring during business hours in order to reduce the noise"],"answer":[0,2],"explain":"المشكلة هي alert fatigue: كثرة الإنذارات غير المهمة تجعل الفريق يتجاهل الإنذار الحقيقي. العلاج رفع نسبة الإشارة إلى الضجيج بالتنبيه على مقاييس مرتبطة بالأثر الفعلي مع عتبات مبنية على التذبذب التاريخي، وتصنيف الإنذارات حسب الخطورة بحيث يصل الحرج فقط إلى المناوب والباقي إلى dashboard. إرسال الضجيج نفسه لعدد أكبر أو خفض العتبات يزيد المشكلة سوءاً."},{"id":"mlops-056","domain":"mlops","level":"associate","tags":["retraining-strategy","performance-decay","cost"],"stem":"An energy utility backtested three retraining policies for its meter-anomaly classifier over six months. Every retrain costs the same amount, and the business requires the AUC to stay at or above 0.85 in every month. Based on the chart, which policy meets the requirement at the LOWEST cost?","chart":{"type":"line","title":"Backtested AUC by retraining policy","xLabel":"Month","yLabel":"AUC","x":["M1","M2","M3","M4","M5","M6"],"series":[{"name":"Never retrained","values":[0.88,0.87,0.85,0.83,0.8,0.78]},{"name":"Retrained monthly","values":[0.88,0.88,0.87,0.88,0.87,0.87]},{"name":"Retrained quarterly","values":[0.88,0.87,0.86,0.88,0.87,0.86]}]},"options":["Never retraining the model","Retraining the model monthly","Monthly or quarterly alike, since they cost the same","Retraining the model quarterly"],"answer":[3],"explain":"النموذج غير المعاد تدريبه يهبط إلى 0.83 في الشهر الرابع فيخالف الشرط، بينما تبقى السياسة الفصلية عند 0.86 أو أعلى في كل الأشهر، أي تحقق الشرط بعدد أقل بكثير من مرات التدريب. السياسة الشهرية تحقق الشرط أيضاً لكنها تكلف نحو ثلاثة أضعاف مقابل فرق 0.01 لا تحتاجه الأعمال، والقول بتساوي تكلفة السياستين خاطئ لأن الشهرية تعني ستّ مرات تدريب مقابل مرتين فقط للفصلية."},{"id":"mlops-057","domain":"mlops","level":"expert","tags":["monitoring","data-quality","incident-response"],"stem":"The daily monitoring of a consumer-lending model shows the chart below. Nothing changed in the model, the approval threshold or the marketing campaigns during this week. What should you do FIRST?","chart":{"type":"line","title":"Daily monitoring of the lending model","xLabel":"Day","yLabel":"Percent","x":["D1","D2","D3","D4","D5","D6","D7"],"series":[{"name":"Missing income values (%)","values":[1,1,2,1,38,40,39]},{"name":"Approval rate (%)","values":[52,51,53,52,31,30,31]}]},"options":["Check the upstream pipeline that supplies the income field","Retrain the model on the data from the last three days","Lower the approval threshold to restore the usual approval rate","Conclude that concept drift occurred and plan a model rebuild"],"answer":[0],"explain":"القفزة المفاجئة في يوم واحد لنسبة القيم المفقودة في income من نحو 1% إلى 38% متزامنة تماماً مع هبوط نسبة الموافقة، وهذا نمط عطل في مصدر البيانات (data quality incident) وليس drift تدريجياً في سلوك العملاء، فالخطوة الأولى فحص الـ pipeline المغذي للحقل وإصلاحه. إعادة التدريب على بيانات معطوبة ترسّخ الخلل داخل النموذج، وخفض الـ threshold يخفي العرَض ويمنح قروضاً بناءً على مدخلات ناقصة."},{"id":"mlops-058","domain":"mlops","level":"expert","tags":["feedback-loop","monitoring","recommendation"],"stem":"A news app ranks articles with a click-prediction model that is retrained every week on the app's own click logs. Over six months, editors notice that the home feed has narrowed to a few topics: articles from other sections are rarely shown, so they receive almost no clicks, and each retrain rates them even lower. Offline accuracy on the logged data keeps improving, and the dashboards show no input drift alerts. The app has 2 million daily users, publishes about 400 articles per day and recently added a podcast section that almost nobody has discovered. Serving latency is well within its budget. What BEST explains the situation, and what is a sound mitigation?","options":["The model underfits; train a larger model on the same click logs","A feedback loop from its own exposure; add some exploration traffic","Label shift in click rates; recalibrate the probabilities each week","Retraining is too frequent; retrain once a year on the full history"],"answer":[1],"explain":"النموذج يتدرب على بيانات ولّدتها قراراته هو: ما لا يُعرض لا يُنقر عليه، فيُقيَّم أدنى في التدريب التالي، وهذه feedback loop (exposure bias) تضيّق المحتوى بينما تتحسن المقاييس offline ظاهرياً. المعالجة تخصيص جزء من الحركة للاستكشاف (exploration/عرض عشوائي) وتصحيح تحيز العرض عند التدريب. نموذج أكبر على السجلات المتحيزة نفسها سيتعلم التحيز بدقة أعلى فقط."},{"id":"mlops-059","domain":"mlops","level":"expert","tags":["distillation","model-size","edge-deployment"],"stem":"A bank's mobile app must classify customer messages on the device, with no network call, in under 30 ms on mid-range phones. The best model so far is a large transformer of 1.3 GB that reaches 96% accuracy; a small model trained directly on the labelled data reaches 89%. Only 20,000 labelled messages exist, but 15 million unlabelled messages are available. The app is used in Arabic and English, its installation package is limited to 150 MB by company policy, and the feature is scheduled for release in the next quarter. Privacy rules forbid sending message text to any server once the feature is live. Which approach is MOST promising?","options":["Ship the 1.3 GB transformer and ask customers to upgrade their phones","Train the small model for many more epochs on the same 20,000 labels","Distil the large model into a small student using unlabelled messages","Host the large model on a GPU server and call it from the app per message"],"answer":[2],"explain":"الـ knowledge distillation يدرّب نموذجاً صغيراً (student) على مخرجات النموذج الكبير (teacher) فوق الـ 15 مليون رسالة غير المصنفة، فيقترب من دقة 96% بحجم وزمن يناسبان الجهاز. النموذج الكبير يخالف حد 150 MB وزمن 30 ms، والاستضافة على خادم تخالف شرط عدم وجود اتصال وقاعدة الخصوصية، وزيادة الـ epochs على 20 ألف مثال تؤدي إلى overfitting لا إلى سد فجوة الدقة."},{"id":"mlops-060","domain":"mlops","level":"expert","tags":["quantization","cost-optimization"],"stem":"To cut serving cost on a factory inspection line, an engineer proposes quantizing a vision model's weights from 32-bit floats to 8-bit integers. What is the MOST important thing to verify before adopting the quantized model?","options":["That the training loss curve of the original model is unchanged afterwards","That the model file's name and version tag are preserved in the registry","That the number of layers in the network stays exactly the same as before","That accuracy on representative validation data stays acceptable"],"answer":[3],"explain":"الـ quantization يقلل الحجم وزمن الـ inference لكنه يخفض الدقة العددية للأوزان، وقد يتراجع الأداء خصوصاً في الحالات الحدية، لذا يجب قياس دقة النموذج بعد التحويل على بيانات تمثل الإنتاج ومقارنتها بحد التسامح المقبول. منحنى الـ training loss للنموذج الأصلي لا يتأثر أصلاً بالتحويل فلا يخبرنا بشيء عن النموذج الـ quantized."},{"id":"mlops-061","domain":"mlops","level":"associate","tags":["caching","cost-optimization","serving"],"stem":"A travel site calls a pricing-recommendation model for every hotel search. About 70% of requests repeat the same combination of city, dates and room type within an hour, and the underlying features are refreshed only once per hour. Serving costs are rising fast. Which change would MOST reduce cost without changing the outputs?","options":["Cache predictions keyed by the request features, expiring hourly","Retrain the model with fewer and shallower trees to speed it up","Move the endpoint to a larger GPU instance to serve requests faster","Log fewer requests to the monitoring system to save on storage"],"answer":[0],"explain":"بما أن 70% من الطلبات تتكرر بالمدخلات نفسها خلال ساعة والـ features لا تتغير إلا كل ساعة، فإن caching للتنبؤات بمفتاح من مدخلات الطلب وصلاحية ساعة يعيد النتيجة نفسها تماماً دون استدعاء النموذج، فتنخفض التكلفة بشكل كبير. تصغير النموذج يغيّر المخرجات وقد يضر بالجودة، والـ instance الأكبر يرفع التكلفة ولا يخفضها."},{"id":"mlops-062","domain":"mlops","level":"expert","tags":["cost-optimization","batch-vs-online"],"stem":"A grocery chain's replenishment forecasts are read once each morning by planners. Today they are produced by an always-on real-time endpoint that was set up during a proof of concept. You propose a nightly batch job instead. Using the table and a 30-day month, how much would the batch design save per month?","table":{"caption":"Infrastructure options","headers":["Design","Instances","Hours per day","Price per instance-hour"],"rows":[["Real-time endpoint","2","24","USD 3"],["Nightly batch job","4","2","USD 3"]]},"options":["USD 720","USD 3,600","USD 4,320","USD 2,160"],"answer":[1],"explain":"تكلفة الـ endpoint الدائم = 2 × 24 × 3 × 30 = 4,320 دولاراً شهرياً، وتكلفة الـ batch الليلي = 4 × 2 × 3 × 30 = 720 دولاراً، فالتوفير 4,320 − 720 = 3,600 دولار. الرقم 4,320 هو تكلفة التصميم الحالي وليس التوفير، و720 هي تكلفة البديل. وبما أن التوقعات تُقرأ مرة واحدة صباحاً فلا حاجة عملية لخدمة real-time تعمل طوال اليوم."},{"id":"mlops-063","domain":"mlops","level":"associate","tags":["explainability","local-vs-global","shap"],"stem":"A bank in Jeddah uses a gradient-boosting model to decide on personal-loan applications. The model was validated last year, has an AUC of 0.86 and uses 38 features, including salary, length of employment, existing obligations and repayment history. A customer whose application was declined files a complaint, and the regulator requires the bank to give that customer the main reasons for the individual decision within ten working days. The compliance officer asks the data science team what to provide. The team already has a slide with the model's top-10 most important features from training, and the customer service department would like to reuse a single standard letter for all declined customers. Which explanation is MOST appropriate?","options":["The model's global feature-importance ranking from the training slide","The model's overall AUC together with its confusion matrix on test data","A local explanation, such as SHAP values for that applicant","A partial dependence plot of salary computed across all applicants"],"answer":[2],"explain":"المطلوب تفسير قرار فردي محدد، وهذا يتطلب local explanation مثل SHAP values (أو LIME) التي تبين مساهمة كل feature في درجة هذا المتقدم بالذات. أما الـ global feature importance فيصف سلوك النموذج في المتوسط عبر كل العملاء، وقد لا تكون أهم الـ features عموماً هي سبب رفض هذا العميل، لذلك لا تصلح رسالة موحدة للجميع."},{"id":"mlops-064","domain":"mlops","level":"expert","tags":["explainability","feature-importance","stakeholder-communication"],"stem":"You present a random forest for hospital readmission to a group of clinical directors. The impurity-based feature importance chart ranks 'number of medications' very high, while 'number of diagnoses' — which has a 0.9 correlation with it — appears almost unimportant. One director concludes that diagnoses do not matter for readmission and proposes that staff stop recording them carefully to save time. The forest has 500 trees, the hospital has 11 departments, the test AUC is 0.79, and the chart was produced on the training data. Another director asks whether the chart can be included in next month's board report as it is. None of the directors has a statistics background. What is the BEST response?","options":["Agree, because low importance proves the feature is unrelated to readmission","Increase the number of trees until both features show equal importance","Remove all correlated features, because forests cannot handle correlation","Caution that correlated features share importance; permute them as a group"],"answer":[3],"explain":"عندما ترتبط feature بأخرى بقوة (0.9) يختار النموذج إحداهما في معظم الـ splits فتأخذ هي معظم الأهمية وتبدو الأخرى غير مهمة رغم أنها تحمل المعلومة نفسها، كما أن الـ impurity importance المحسوبة على بيانات التدريب متحيزة. لذلك يجب التحذير من هذا الاستنتاج والتحقق عبر permutation importance على بيانات held-out مع تبديل الـ features المترابطة كمجموعة واحدة، لأن تبديل واحدة منها فقط يترك المعلومة متاحة للنموذج عبر الأخرى فتبدو كلتاهما ضعيفة. انخفاض الأهمية لا يثبت انعدام العلاقة بالنتيجة، وزيادة عدد الأشجار لا تعالج المشكلة."},{"id":"mlops-065","domain":"mlops","level":"associate","tags":["explainability","shap","causality"],"stem":"A marketing manager at a telecom sees that 'number of support calls' has the largest SHAP contribution to churn predictions and proposes making it harder for customers to call support in order to reduce churn. What is the BEST response?","options":["SHAP shows what drives the model's predictions, not what causes churn","SHAP values are unreliable for tree models, so the result can be ignored","Agree, since the feature with the largest SHAP value is the root cause","Remove the feature so that the model stops predicting churn for callers"],"answer":[0],"explain":"الـ SHAP يفسر كيف يستخدم النموذج الـ features للوصول إلى تنبؤه، أي علاقات ارتباطية تعلمها من البيانات وليست علاقات سببية؛ كثرة الاتصالات بالدعم علامة على مشكلة لدى العميل وليست سبب المغادرة، ومنع الاتصال قد يزيد الـ churn. إثبات السببية يحتاج تجربة مضبوطة (A/B test). والـ SHAP موثوق مع نماذج الأشجار (TreeSHAP)، فالمشكلة في الاستنتاج وليست في الأداة."},{"id":"mlops-066","domain":"mlops","level":"associate","tags":["fairness","bias","proxy-features"],"stem":"A recruitment platform trains a CV-screening model using historical hiring decisions as labels. To be fair, the team removed gender from the features, yet an audit shows that female applicants are shortlisted far less often than equally qualified male applicants. Which TWO statements BEST explain or address this? (Select TWO)","options":["Other features, such as hobbies or career gaps, can act as proxies for gender","Removing the protected attribute guarantees fairness, so the audit is wrong","Historical labels may carry past bias; audit outcomes by group and mitigate","The model should be trained for longer so that it forgets about gender","Fairness can be assessed only after several years of production use"],"answer":[0,2],"explain":"حذف الـ protected attribute (ما يسمى fairness through unawareness) لا يكفي، لأن features أخرى تعمل كـ proxies له، ولأن الـ labels التاريخية نفسها قد تعكس تحيزاً سابقاً في قرارات التوظيف فيتعلمه النموذج. المطلوب قياس النتائج حسب المجموعة (مع الاحتفاظ بالـ attribute لأغراض التدقيق فقط) وتطبيق أساليب المعالجة. التدريب لمدة أطول لا «ينسي» النموذج شيئاً، بل يرسّخ الأنماط الموجودة في البيانات."},{"id":"mlops-067","domain":"mlops","level":"expert","tags":["fairness","equal-opportunity","audit"],"stem":"A lender audits its loan-approval model, whose overall accuracy is 0.88. In the table, 'TPR' is the share of genuinely creditworthy applicants (those who would have repaid) that the model approves. Group membership is not an input feature. Which conclusion is BEST supported by the table?","table":{"caption":"Audit results by applicant group","headers":["Group","Applicants","Approval rate","TPR"],"rows":[["Group A","4,000","60%","0.85"],["Group B","1,000","35%","0.62"]]},"options":["The high overall accuracy shows that both groups are treated fairly","Group B is much smaller, so differences in its metrics can be ignored","Creditworthy applicants in group B are rejected more often","The model is fair because group membership is not an input feature"],"answer":[2],"explain":"الـ TPR يبين أن 85% من المؤهلين في Group A يحصلون على الموافقة مقابل 62% فقط في Group B، أي أن المؤهلين من المجموعة الثانية يُرفضون خطأً بنسبة أعلى بكثير، وهذه فجوة في الـ equal opportunity تستوجب التحقيق والمعالجة. الـ accuracy الإجمالية يهيمن عليها حجم Group A فتخفي الفجوة، وغياب الـ attribute من المدخلات لا يمنع التحيز عبر الـ proxies."},{"id":"mlops-068","domain":"mlops","level":"associate","tags":["privacy","pseudonymization","anonymization"],"stem":"An insurance analytics team replaces customer names and national IDs with random tokens and keeps the token-to-ID mapping table in a separate secured system, so that results can later be linked back to customers. A manager says the dataset is now 'anonymous' and data-protection rules no longer apply to it. Which statement is correct?","options":["Correct: once names and IDs are removed, the data are fully anonymous","Correct: random tokens can never be linked back to a person by anyone","Incorrect: tokenized data cannot be used for modelling purposes at all","Incorrect: this is pseudonymization, so the data remain personal"],"answer":[3],"explain":"استبدال المعرّفات برموز مع الاحتفاظ بجدول الربط هو pseudonymization: يمكن إعادة ربط البيانات بالأشخاص، ولذلك تبقى بيانات شخصية تخضع لأنظمة حماية البيانات وإن كان الخطر أقل. الـ anonymization الحقيقي يعني استحالة إعادة التعريف عملياً، وهذا غير متحقق ما دام جدول الربط موجوداً. والبيانات الـ tokenized صالحة تماماً للنمذجة، فهذا هو الغرض منها."},{"id":"mlops-069","domain":"mlops","level":"assistant","tags":["privacy","data-minimization"],"stem":"For a model that predicts electricity demand per neighbourhood, a utility's engineer suggests also collecting customers' national IDs, religion and family photos 'in case they become useful later'. Which principle does this violate MOST directly?","options":["Data minimization: collect only what the stated purpose needs","Reproducibility: every training run must use fixed random seeds","Portability: trained models should be exported to a format like ONNX","Scalability: storage costs grow as more columns are collected"],"answer":[0],"explain":"مبدأ data minimization يقضي بجمع البيانات الشخصية اللازمة للغرض المحدد فقط؛ والتنبؤ بالطلب على الكهرباء على مستوى الحي لا يحتاج إلى هويات أو ديانة أو صور، وجمعها «احتياطاً» يرفع المخاطر النظامية ومخاطر التسريب دون فائدة. تكلفة التخزين اعتبار ثانوي مقارنة بانتهاك مبدأ أساسي في حماية البيانات الشخصية."},{"id":"mlops-070","domain":"mlops","level":"associate","tags":["privacy","consent","purpose-limitation"],"stem":"A fitness-app company collected users' location data with their consent 'to map your running routes and show your statistics'. The app has 600,000 users in the Gulf region and stores three years of routes. The growth team now wants to use the same data to train a model that infers each user's home address and income level, and to sell these segments to advertising partners. A product manager argues that the users already agreed to location tracking when they installed the app, that the data are stored on encrypted disks, and that a pilot model already reaches 91% accuracy at locating users' homes. The legal team has not yet been consulted. What is the MOST appropriate position?","options":["Proceed, because consent was given once and therefore covers any later use","This is a new purpose and needs a legal basis such as fresh, specific consent","Proceed, because the pilot model's accuracy is high enough to be useful","Proceed, provided that the location data stay on the encrypted disks"],"answer":[1],"explain":"الموافقة مرتبطة بالغرض الذي أُعطيت من أجله (رسم مسارات الجري)، واستنتاج عنوان المنزل ومستوى الدخل وبيعها للمعلنين غرض جديد مختلف جوهرياً (purpose limitation)، فيحتاج إلى أساس نظامي مثل موافقة جديدة صريحة ومحددة وإشراك الفريق القانوني. التشفير يحمي البيانات من الاختراق لكنه لا يجعل الاستخدام الجديد مشروعاً، ودقة النموذج لا علاقة لها بمشروعية المعالجة."},{"id":"stats-001","domain":"stats","level":"assistant","tags":["central-tendency","outliers"],"stem":"You are a data scientist at a real-estate portal in Riyadh. Listing prices in one district mostly fall between 0.9 and 1.4 million riyals, but a handful of palaces are listed above 30 million. Which single statistic BEST represents the typical listing price?","options":["The median, because a few extreme listings do not distort it","The mean, because it uses every listing price in the calculation","The mode, because it reports the single most frequent exact price","The midrange, because it lies halfway between the cheapest and dearest"],"answer":[0],"explain":"الـ median لا يتأثر بالقيم المتطرفة، لذلك يعبّر عن السعر النموذجي عندما يكون التوزيع ملتوياً بشدة نحو اليمين. الـ mean يبدو مغرياً لأنه يستخدم كل القيم، لكن بضعة قصور بأسعار تفوق 30 مليوناً ترفعه بعيداً عن أسعار معظم العقارات."},{"id":"stats-002","domain":"stats","level":"assistant","tags":["central-tendency","mode"],"stem":"A footwear retailer must decide which single shoe size to stock in the largest quantity for a new Jeddah store. You have the sizes of 40,000 pairs sold last year. Which summary statistic answers this question directly?","options":["The mean of the sizes sold","The mode of the sizes sold","The median of the sizes sold","The standard deviation of the sizes sold"],"answer":[1],"explain":"المطلوب هو المقاس الأكثر مبيعاً، وهذا هو تعريف الـ mode مباشرة. الـ mean قد يعطي قيمة مثل 41.3 لا تقابل مقاساً حقيقياً، والـ median يعطي المقاس الأوسط في الترتيب وليس الأكثر تكراراً."},{"id":"stats-003","domain":"stats","level":"assistant","tags":["central-tendency","outliers"],"stem":"The operations lead of a food-delivery start-up asks you for 'the typical delivery time' in a newly opened zone. Only seven orders have been delivered so far, and one of them was held up for more than an hour by a road closure. The delivery times are shown in the table. Which figure should you report as the typical delivery time?","table":{"caption":"Delivery times in the new zone","headers":["Order","Minutes"],"rows":[["1","20"],["2","22"],["3","24"],["4","25"],["5","26"],["6","28"],["7","100"]]},"options":["35 minutes, the mean","80 minutes, the range","25 minutes, the median","60 minutes, the midpoint of the fastest and slowest orders"],"answer":[2],"explain":"مجموع القيم 245 فيكون الـ mean = 35 دقيقة، وهو أعلى من ستة طلبات من أصل سبعة بسبب القيمة المتطرفة 100. الـ median (القيمة الرابعة بعد الترتيب = 25 دقيقة) يمثّل الطلب النموذجي بشكل أفضل. أما الـ range فهو مقياس تشتت وليس مقياس نزعة مركزية."},{"id":"stats-004","domain":"stats","level":"assistant","tags":["spread","skewness"],"stem":"You are preparing a one-page summary of motor insurance claim amounts for the claims director. The amounts are strongly right-skewed: most claims are a few thousand riyals, but a few exceed one million. Which TWO statistics are MOST appropriate to describe the centre and the spread of these claims? (Select TWO)","options":["Mean claim amount","Standard deviation","Range (maximum minus minimum)","Median claim amount","Interquartile range (IQR)"],"answer":[3,4],"explain":"في التوزيعات الملتوية ذات القيم المتطرفة نستخدم مقاييس robust: الـ median للمركز والـ IQR للتشتت لأنهما يعتمدان على الترتيب لا على القيم القصوى. الـ mean والـ standard deviation يتضخمان بسبب المطالبات المليونية، والـ range يعتمد كلياً على أكبر وأصغر قيمة."},{"id":"stats-005","domain":"stats","level":"associate","tags":["percentiles","kpi"],"stem":"You are a data scientist at a fintech payment gateway. The engineering dashboard shows a mean API response time of 180 ms, comfortably under the 300 ms target, and the mean has been stable for six months. The team recently migrated to a new cloud region and hired two more engineers. Yet merchant support tickets about 'timeouts at checkout' have tripled in the past month, mostly during the evening peak. Logs show that the large majority of requests finish in under 150 ms, while a small share take several seconds. The head of engineering asks which metric should be added to the dashboard so that this problem becomes visible. Which metric is MOST appropriate?","options":["The 95th and 99th percentile response times","The median response time, since it is robust to outliers","The most frequent response time, rounded to 10 ms","A 30-day moving average of the mean response time"],"answer":[0],"explain":"المشكلة في ذيل التوزيع (tail): نسبة صغيرة من الطلبات بطيئة جداً، وهذا لا يظهر إلا في الـ percentiles العليا مثل p95 وp99. الـ median مغرٍ لأنه robust، لكنه تحديداً يتجاهل الذيل فيخفي المشكلة أكثر من الـ mean، والـ moving average يزيد التنعيم فقط."},{"id":"stats-006","domain":"stats","level":"assistant","tags":["skewness","distribution-shape"],"stem":"A government statistics team surveys monthly household income in a large city using a random sample of 5,000 households. The sample mean is 14,500 SAR while the sample median is 9,800 SAR. The team lead is surprised that the two figures are so far apart and asks you to describe the shape of the income distribution in one sentence for the published report. Which description is MOST accurate?","options":["Left-skewed: a minority of very low incomes pulls the mean above the median","Symmetric: the gap between the two figures is simply caused by survey rounding","Right-skewed: a minority of high incomes pulls the mean above the median","Bimodal: the mean and the median differ, so there must be two peaks"],"answer":[2],"explain":"عندما يكون الـ mean أكبر بوضوح من الـ median فالتوزيع right-skewed، لأن القيم العالية القليلة تسحب الـ mean إلى الأعلى بينما يبقى الـ median ثابتاً. في الـ left-skew يحدث العكس (الـ mean أقل من الـ median)، واختلاف المقياسين لا يدل وحده على وجود قمتين."},{"id":"stats-007","domain":"stats","level":"assistant","tags":["box-plot","iqr"],"stem":"A bank branch in Dammam summarises customer waiting times with a box plot. The five-number summary behind the plot is shown in the table. Using the usual 1.5 × IQR rule that box plots apply to the upper whisker, above which waiting time is a customer flagged as an outlier?","table":{"caption":"Waiting time summary (minutes)","headers":["Statistic","Value"],"rows":[["Minimum","2"],["Q1","10"],["Median","13"],["Q3","18"],["Maximum","41"]]},"options":["26 minutes","30 minutes","25 minutes","27 minutes"],"answer":[1],"explain":"الـ IQR = Q3 − Q1 = 18 − 10 = 8، والحد الأعلى = Q3 + 1.5 × IQR = 18 + 12 = 30 دقيقة. القيمة 26 تنتج عن إضافة IQR واحد فقط إلى Q3، والقيمة 25 تنتج عن إضافة 12 إلى الـ median بدلاً من Q3، وكلاهما خطأ شائع."},{"id":"stats-008","domain":"stats","level":"assistant","tags":["distributions","poisson"],"stem":"At a government call centre, calls arrive independently at a steady average of 12 per minute during the morning shift. To plan staffing, you need to model the number of calls that arrive in any given minute. Which distribution is the natural choice?","options":["Binomial distribution","Exponential distribution","Poisson distribution","Uniform distribution"],"answer":[2],"explain":"عدد الأحداث المستقلة التي تقع في فترة زمنية ثابتة بمعدل ثابت يتبع Poisson distribution. الـ Binomial يحتاج عدداً ثابتاً من المحاولات n وهو غير موجود هنا، والـ Exponential يصف الزمن بين مكالمتين وليس عدد المكالمات."},{"id":"stats-009","domain":"stats","level":"assistant","tags":["distributions","binomial"],"stem":"A factory inspects 50 randomly chosen circuit boards from every batch. Each board independently has a 2% chance of being defective. Which distribution describes the number of defective boards found in one inspection?","options":["Binomial with n = 50 and p = 0.02","Poisson with a mean of 50 defects per batch","Normal with mean 50 and standard deviation 2","Exponential with a rate of 0.02 per board"],"answer":[0],"explain":"لدينا عدد ثابت من المحاولات المستقلة (n = 50) واحتمال نجاح ثابت (p = 0.02) ونعدّ حالات العيب، وهذا تعريف الـ Binomial. المتوسط المتوقع هنا هو 1 وليس 50، لذلك فإن Poisson بمتوسط 50 خاطئ، والـ Exponential يخص الأزمنة لا الأعداد."},{"id":"stats-010","domain":"stats","level":"associate","tags":["distributions","exponential"],"stem":"An airline's maintenance team records the time, in hours, between successive unplanned failures of a baggage-belt motor. Failures occur independently at a roughly constant rate. A histogram of the gaps peaks near zero and decays steadily: short gaps are very common and long gaps become increasingly rare. Which distribution BEST fits the time between failures?","options":["Exponential distribution","Poisson distribution","Normal distribution","Binomial distribution"],"answer":[0],"explain":"الزمن بين أحداث مستقلة تقع بمعدل ثابت يتبع Exponential distribution، وشكله يبدأ مرتفعاً قرب الصفر ثم يتناقص. الـ Poisson مغرٍ لأنه مرتبط بنفس العملية، لكنه يصف عدد الأعطال في فترة زمنية وليس الزمن الفاصل بينها، والـ Normal متماثل ولا يناسب هذا الشكل."},{"id":"stats-011","domain":"stats","level":"assistant","tags":["normal-distribution","empirical-rule"],"stem":"A bottling line fills bottles with a mean of 500 ml and a standard deviation of 4 ml, and the fill volumes are approximately normal. Roughly what share of bottles contain between 492 ml and 508 ml?","options":["About 68%","About 99.7%","About 50%","About 95%"],"answer":[3],"explain":"المدى من 492 إلى 508 يساوي الـ mean ± 2 standard deviations، وحسب الـ empirical rule يقع نحو 95% من القيم في هذا المدى في التوزيع الطبيعي. نسبة 68% تخص ± 1 SD (496 إلى 504)، ونسبة 99.7% تخص ± 3 SD."},{"id":"stats-012","domain":"stats","level":"assistant","tags":["sampling","stratified-sampling"],"stem":"A bank plans a satisfaction survey with a budget of 2,000 telephone interviews. Its customer base is 92% retail, 7% small business and 1% corporate, and management needs a reliable satisfaction estimate for each of the three segments separately. A full customer list with the segment of every customer is available. Which sampling method is MOST appropriate?","options":["Stratified sampling by segment, with enough interviews in each stratum","Simple random sampling of 2,000 customers from the full customer list","Cluster sampling: pick five branches at random and call all their clients","Convenience sampling of the customers who visit a branch this week"],"answer":[0],"explain":"الـ stratified sampling يضمن عدداً كافياً من المقابلات في كل شريحة، بما فيها شريحة الشركات الصغيرة جداً. الـ simple random sampling سيعطي نحو 20 عميلاً فقط من الشركات الكبرى (1% من 2,000)، وهذا لا يكفي لتقدير موثوق لتلك الشريحة."},{"id":"stats-013","domain":"stats","level":"assistant","tags":["sampling","cluster-sampling"],"stem":"An agricultural development agency wants to survey irrigation practices on small farms spread across 400 remote villages. There is no national register of farms, but a complete list of villages exists. Travel between villages is by far the largest cost, and the budget is tight. Which sampling approach is MOST practical while still being probability-based?","options":["Simple random sampling of individual farms drawn from across the whole country","Stratified sampling of individual farms by crop type, using the farm register","Convenience sampling of the farms located nearest to the regional offices","Cluster sampling: select villages at random, then survey farms within them"],"answer":[3],"explain":"الـ cluster sampling مناسب عندما لا يوجد إطار معاينة للوحدات الفردية ولكن توجد قائمة بالمجموعات (القرى)، وعندما تكون تكلفة التنقل عالية. الـ simple random sampling للمزارع غير ممكن لعدم وجود سجل للمزارع، والـ convenience sampling ليس عينة احتمالية أصلاً."},{"id":"stats-014","domain":"stats","level":"assistant","tags":["sampling-bias","convenience-sampling"],"stem":"An events company wants to estimate the satisfaction of all 60,000 attendees of a festival in Riyadh. An intern interviews 300 people queuing at the VIP lounge on the first evening, because they were easy to reach, and reports that 96% are satisfied. What is the MAIN problem with this estimate?","options":["It is a convenience sample, so it may not represent all attendees","A sample of 300 is too small for a population of 60,000 attendees","Interview answers are qualitative, so they cannot be summarised as a rate","Random sampling error is too large because attendees differ in age"],"answer":[0],"explain":"المشكلة في طريقة الاختيار لا في الحجم: زوار الـ VIP في أول ليلة يختلفون على الأرجح عن بقية الحضور، وهذا selection bias ناتج عن الـ convenience sampling. عينة من 300 شخص كافية إحصائياً لو كانت عشوائية، لأن الدقة تعتمد على حجم العينة لا على نسبتها من المجتمع."},{"id":"stats-015","domain":"stats","level":"associate","tags":["survivorship-bias"],"stem":"You are a data scientist at a fintech platform that provides payment services to small online shops. The growth team wants to know what makes a shop successful so that it can advise new merchants. An analyst pulls the 1,800 merchants that joined three years ago and are still active today, and finds that 85% of them offer free shipping. The draft report concludes that free shipping drives long-term survival and recommends promoting it to every new merchant. You learn that 6,000 merchants actually joined three years ago; the accounts that closed were moved to an archive database that the analyst did not query. The report is due to the board next week and its layout has already been finalised by the communications team. What is the MAIN flaw in the analysis?","options":["Small sample: 1,800 merchants are too few to estimate a proportion such as 85% reliably","Survivorship bias: shops that closed are excluded, and may have offered it too","Measurement error: a yes/no flag for free shipping discards too much useful information","Recency bias: three years of history is too short a period to study merchant success"],"answer":[1],"explain":"التحليل اقتصر على المتاجر التي نجت فقط، وهذا survivorship bias: ربما كانت نسبة الشحن المجاني 85% أيضاً بين الـ 4,200 متجر التي أغلقت، فلا يكون عاملاً مميزاً للنجاح. حجم العينة 1,800 كبير بما يكفي لتقدير نسبة، فالمشكلة ليست في الحجم بل في من تم استبعاده."},{"id":"stats-016","domain":"stats","level":"associate","tags":["non-response-bias","surveys"],"stem":"A telecom operator emailed a satisfaction survey to 200,000 subscribers and received 8,000 responses, a 4% response rate. Among those who answered, 92% said they were satisfied, and the average score was 4.6 out of 5. A quick profile shows that respondents are mostly long-tenure subscribers on premium postpaid plans, while prepaid subscribers, who make up 60% of the customer base, account for only 15% of the responses. The survey platform cost 40,000 riyals and the questionnaire had 12 questions. Responses were collected over three weeks in October, and one reminder email was sent after ten days. Marketing wants to publish the line '92% of our customers are satisfied' in the annual report. What is the MAIN statistical risk in doing so?","options":["Sampling error: 8,000 responses give a margin of error that is too wide to publish","Survivorship bias: subscribers who left the operator years ago were not contacted","Multiple comparisons: a questionnaire with 12 questions inflates the false-positive rate","Non-response bias: those who answered differ systematically from those who did not"],"answer":[3],"explain":"نسبة الاستجابة 4% فقط والمستجيبون يختلفون بوضوح عن قاعدة العملاء (الـ prepaid ممثلون بـ 15% بدلاً من 60%)، وهذا non-response bias يجعل نسبة 92% غير قابلة للتعميم. حجم 8,000 استجابة يعطي margin of error صغيراً جداً، لكن الدقة العالية لا تعالج التحيّز."},{"id":"stats-017","domain":"stats","level":"assistant","tags":["standard-error"],"stem":"You draw a random sample of 400 retail transactions. The sample mean is 250 SAR and the sample standard deviation is 40 SAR. What is the standard error of the mean?","options":["40 SAR","0.1 SAR","20 SAR","2 SAR"],"answer":[3],"explain":"الـ standard error = s / √n = 40 / √400 = 40 / 20 = 2 ريال. القيمة 0.1 تنتج عن القسمة على n بدلاً من √n، والقيمة 40 هي الـ standard deviation للمعاملات الفردية وليست دقة تقدير الـ mean."},{"id":"stats-018","domain":"stats","level":"associate","tags":["central-limit-theorem","standard-error"],"stem":"An e-commerce analyst notes that individual order values are strongly right-skewed. She wants to build a 95% confidence interval for the mean order value from a random sample of 2,500 orders using the usual normal-based formula. A colleague objects that 'the data are not normal, so the formula is invalid'. Which TWO statements are correct? (Select TWO)","options":["With 2,500 orders, the individual order values themselves become normally distributed","The central limit theorem applies only when the population itself is normal","The sampling distribution of the mean is approximately normal at this sample size","The resulting interval will contain about 95% of the individual order values","The standard error of the mean shrinks in proportion to 1/√n as n grows larger"],"answer":[2,4],"explain":"الـ central limit theorem تنص على أن توزيع الـ sample mean يقترب من الطبيعي عند n كبيرة حتى لو كانت البيانات الأصلية ملتوية، وأن الـ standard error = σ/√n. زيادة حجم العينة لا تغيّر شكل توزيع الطلبات الفردية نفسها، والـ confidence interval يخص الـ mean وليس مدى القيم الفردية."},{"id":"stats-019","domain":"stats","level":"associate","tags":["margin-of-error","sample-size"],"stem":"A municipal services survey interviewed a random sample of 400 residents, giving a margin of error of about ±5 percentage points on the satisfaction rate at 95% confidence. The council now wants ±2.5 points at the same confidence level. Interviews are done by telephone and cost about 30 riyals each, so the council needs the total before approving the budget. Approximately how many residents must be interviewed in total?","options":["800","1,600","1,000","3,200"],"answer":[1],"explain":"الـ margin of error يتناسب مع 1/√n، لذلك تقليصه إلى النصف يتطلب مضاعفة حجم العينة أربع مرات: 400 × 4 = 1,600. مضاعفة العينة إلى 800 فقط تقلّص الهامش بمعامل √2 أي إلى نحو ±3.5 نقطة وليس ±2.5."},{"id":"stats-020","domain":"stats","level":"assistant","tags":["confidence-interval","interpretation"],"stem":"From a random sample of 900 loyalty-programme members, a supermarket chain computes a 95% confidence interval for mean monthly spend of 210 to 250 SAR. The sample was drawn properly from the full membership list and the interval was computed with the standard formula. The marketing manager, who wants to quote it in a presentation, asks what this interval actually tells her. Which interpretation is correct?","options":["About 95% of loyalty-programme members spend between 210 and 250 SAR each month","There is a 95% chance that the mean of this sample lies between 210 and 250 SAR","About 95% of future samples will produce a mean between 210 and 250 SAR","We are 95% confident that the true mean spend of all members is 210 to 250 SAR"],"answer":[3],"explain":"الـ confidence interval يخص معلمة المجتمع (الـ mean الحقيقي لكل الأعضاء)، والطريقة المستخدمة تلتقط القيمة الحقيقية في 95% من العينات المتكررة. الخطأ الأكثر شيوعاً هو تفسيره على أنه المدى الذي يقع فيه إنفاق 95% من الأفراد، فذلك المدى أوسع بكثير لأنه يعتمد على الـ standard deviation لا على الـ standard error."},{"id":"stats-021","domain":"stats","level":"associate","tags":["confidence-interval","precision"],"stem":"An energy utility estimates mean household electricity consumption from a random sample of smart meters. The 95% confidence interval is too wide to be useful for capacity planning, and the planning team insists on keeping the 95% confidence level. Which TWO valid changes to the study would narrow the interval? (Select TWO)","options":["Report a 99% interval in place of the 95% interval","Increase the number of households sampled","Drop the households with the highest and lowest usage before computing","Replace the mean with the maximum household consumption","Stratify the sample by dwelling type to reduce the variance of the estimate"],"answer":[1,4],"explain":"عرض الـ confidence interval يعتمد على الـ standard error، ويمكن تقليصه بزيادة n أو بتقليل التباين عبر تصميم أفضل مثل الـ stratified sampling. رفع مستوى الثقة إلى 99% يوسّع الفترة ولا يضيّقها، وحذف الأسر ذات الاستهلاك المتطرف يضيّق الفترة شكلياً لكنه يحيّز التقدير فليس تغييراً صحيحاً."},{"id":"stats-022","domain":"stats","level":"expert","tags":["confidence-interval","hypothesis-testing"],"stem":"A healthcare group compares mean waiting times at two clinics, using independent random samples of visits. The 95% confidence intervals are 30.1 to 34.0 minutes for clinic A and 33.2 to 37.5 minutes for clinic B. An analyst writes: 'the intervals overlap, so there is no statistically significant difference at the 5% level.' Which response is MOST accurate?","options":["The analyst is right: if two 95% intervals overlap, the difference cannot be significant","The analyst is wrong: a small overlap between 95% intervals always means p < 0.05","Overlap does not settle it; test the difference directly or build an interval for it","Recompute both intervals at 80% confidence and declare a difference if they separate"],"answer":[2],"explain":"تداخل فترتي ثقة 95% لا يعني بالضرورة أن الفرق غير معنوي، لأن الـ standard error للفرق أصغر من مجموع نصفي عرض الفترتين؛ الصحيح هو اختبار الفرق مباشرة (مثل two-sample t-test) أو بناء confidence interval للفرق نفسه. وبالفعل فإن الفرق هنا 3.3 دقيقة والـ standard error له نحو 1.5، أي z ≈ 2.2 وp ≈ 0.03، فهو معنوي رغم التداخل. ومع ذلك فالتداخل الصغير لا يضمن المعنوية دائماً دون إجراء الحساب."},{"id":"stats-023","domain":"stats","level":"assistant","tags":["hypothesis-testing","null-hypothesis"],"stem":"An online retailer tests a redesigned checkout page against the current page to find out whether the conversion rate differs. Which statement is the correct null hypothesis for this test?","options":["The redesigned page has a higher true conversion rate","The true conversion rates of the two pages are different","The observed conversion rates in the two samples are equal","The true conversion rates of the two pages are equal"],"answer":[3],"explain":"الـ null hypothesis تفترض عدم وجود فرق في معلمات المجتمع، أي أن معدلي التحويل الحقيقيين متساويان. القول بأن المعدلين مختلفين هو الـ alternative hypothesis، والفرضيات تُصاغ حول القيم الحقيقية في المجتمع وليس حول القيم المشاهدة في العينة."},{"id":"stats-024","domain":"stats","level":"assistant","tags":["p-value","interpretation"],"stem":"An A/B test of two email subject lines at an online bookstore gives p = 0.03 for the difference in open rates. The marketing lead asks what the p-value means. Which interpretation is correct?","options":["There is a 3% probability that the null hypothesis of no difference in open rates is true","There is a 97% probability that the new subject line is really better than the old one","If there were truly no difference, a gap at least this large would arise 3% of the time","The new subject line raises the open rate by 3% compared with the old subject line"],"answer":[2],"explain":"الـ p-value هو احتمال الحصول على نتيجة بهذا التطرف أو أكثر بافتراض صحة الـ null hypothesis، وليس احتمال صحة الفرضية نفسها. تفسيره على أنه «احتمال 3% أن الـ null صحيحة» هو أشهر سوء فهم، كما أنه لا يقيس حجم الأثر."},{"id":"stats-025","domain":"stats","level":"associate","tags":["p-value","statistical-power"],"stem":"A hospital pilot compares a new discharge checklist with the usual process, with 30 patients in each group. The difference in 30-day readmission rates gives p = 0.40. The checklist takes nurses about ten minutes per patient, and the pilot ran in a single ward. The quality manager writes in her report that 'the study proves the checklist has no effect'. Which response is MOST accurate?","options":["The statement is right: a p-value above 0.05 confirms that the null hypothesis is true","The p-value of 0.40 means there is a 40% chance that the checklist reduces readmissions","The pilot should be repeated on new groups of 30 until the p-value falls below 0.05","A non-significant result from a small pilot does not show there is no effect; power was low"],"answer":[3],"explain":"عدم رفض الـ null hypothesis لا يعني إثباتها، خصوصاً مع 30 مريضاً فقط في كل مجموعة حيث يكون الـ statistical power منخفضاً واحتمال الـ Type II error مرتفعاً. اعتبار p > 0.05 دليلاً على صحة الـ null خطأ شائع، وتكرار التجربة حتى تظهر المعنوية هو p-hacking."},{"id":"stats-026","domain":"stats","level":"assistant","tags":["type-i-error","type-ii-error"],"stem":"A manufacturer tests whether a new supplier's components have a higher defect rate than the current supplier's. The test finds no significant difference, but in reality the new supplier's defect rate is higher. What kind of error has occurred?","options":["A Type II error (false negative)","A Type I error (false positive)","No error, since the null hypothesis was not rejected","A multiple-comparisons error from repeated testing"],"answer":[0],"explain":"الفرق موجود فعلاً لكن الاختبار لم يكتشفه، وهذا هو الـ Type II error أي false negative. الـ Type I error هو العكس: رفض الـ null hypothesis وهي صحيحة، أي إعلان فرق غير موجود."},{"id":"stats-027","domain":"stats","level":"associate","tags":["statistical-power","ab-testing"],"stem":"A tourism booking site is planning an A/B test of a new itinerary builder. The power analysis shows only 45% power to detect the 2% relative lift in bookings that the business cares about. The site receives about 30,000 visitors a week, and the team is flexible about how long the test runs. Which TWO changes would increase the power of the test? (Select TWO)","options":["Include more users in each variant","Reduce metric variance, for example by adjusting for pre-experiment behaviour","Lower the significance level from 0.05 to 0.01","Switch from a one-sided test to a two-sided test","Check the results daily and stop at the first significant p-value"],"answer":[0,1],"explain":"الـ power يزداد بزيادة حجم العينة وبتقليل تباين المقياس (مثل أسلوب CUPED الذي يستخدم سلوك المستخدم قبل التجربة كـ covariate). خفض الـ significance level إلى 0.01 يقلل الـ power لأنه يصعّب رفض الـ null، والتوقف عند أول p-value معنوية لا يزيد الـ power بل يرفع معدل الـ false positives."},{"id":"stats-028","domain":"stats","level":"assistant","tags":["test-selection","paired-t-test"],"stem":"A supermarket chain changes the s
