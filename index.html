 فأقل)، وهذا هو الـ elbow الذي يدل على أن العناقيد الإضافية لا تضيف بنية حقيقية. اختيار k=8 لأن الـ inertia أقل خطأ شائع، فالـ inertia تنخفض دائماً مع زيادة k حتى تصل إلى الصفر عندما يصبح لكل نقطة عنقود."},{"id":"ml2-032","domain":"ml","level":"associate","tags":["k-means","silhouette"],"stem":"At a telecom operator you cluster 1.2 million prepaid customers on standardised usage features (data volume, voice minutes, top-up frequency, roaming days). Marketing can run at most six campaigns. A colleague wants k=6 because its inertia is the lowest of all tested values. You also computed the average silhouette on a random sample. Based on the table, which k is the BEST choice?","table":{"caption":"k-means results by number of clusters","headers":["k","Inertia","Average silhouette"],"rows":[["2","8,400","0.41"],["3","6,100","0.47"],["4","4,300","0.62"],["5","3,900","0.44"],["6","3,600","0.39"]]},"options":["k = 6, since lower inertia means tighter clusters","k = 2, since fewer clusters are always easier to explain","k = 4, since silhouette peaks there while inertia always falls with k","k = 3, as a compromise between the simplest and the tightest solution"],"answer":[2],"explain":"الـ inertia تنخفض دائماً كلما زاد k فلا تصلح وحدها للمقارنة، بينما الـ silhouette يقيس تماسك العناقيد وانفصالها معاً ويبلغ ذروته بوضوح عند k=4 (0.62) ثم يهبط إلى 0.44 و 0.39. كما أن الانخفاض في الـ inertia يتباطأ بعد k=4، فالمؤشران متفقان. اختيار k=6 لمجرد أن الـ inertia أقل يعني تقسيم عناقيد متماسكة إلى أجزاء متداخلة."},{"id":"ml2-033","domain":"ml","level":"assistant","tags":["k-means","initialisation"],"stem":"At a university, your k-means student segmentation gives different clusters and a different inertia on every run. It uses a single random initialisation. Which change is MOST appropriate?","options":["Use k-means++ with several initialisations and keep the lowest-inertia run","Raise the maximum number of iterations so each run converges further","Shuffle the rows before every run so that the starting order is random","Increase k until the results stop changing from one run to the next"],"answer":[0],"explain":"k-means يصل إلى local minimum يعتمد على نقاط البداية، فالبداية العشوائية الواحدة تعطي نتائج متقلبة. استخدام k-means++ لتوزيع المراكز الأولية مع تكرار التشغيل عدة مرات (n_init) والاحتفاظ بأقل inertia يعطي حلاً أفضل وأكثر ثباتاً، ويُضاف تثبيت random_state لقابلية التكرار. زيادة عدد الـ iterations لا تفيد لأن كل تشغيل يكون قد تقارب فعلاً ولكن إلى حل محلي مختلف."},{"id":"ml2-034","domain":"ml","level":"associate","tags":["dbscan","k-means","clustering"],"stem":"At a last-mile delivery company you cluster GPS coordinates of drop-offs to define service zones. Zones follow curved roads and the coastline, so they are elongated and irregular; isolated rural drop-offs should not belong to any zone, and the number of zones is unknown. Which TWO properties make DBSCAN a better fit than k-means here? (Select TWO)","options":["It always produces clusters with equal numbers of points","It finds clusters of arbitrary shape based on density","It requires no parameters to be chosen by the analyst","It assigns every point to its nearest cluster centroid","It labels sparse points as noise and needs no preset k"],"answer":[1,4],"explain":"DBSCAN يبني العناقيد من المناطق الكثيفة المتصلة، فيلتقط الأشكال الممتدة وغير المنتظمة التي يقسمها k-means إلى كرات، كما يصنّف النقاط المعزولة كـ noise ولا يحتاج إلى تحديد عدد العناقيد مسبقاً. القول بأنه لا يحتاج إلى أي parameters غير صحيح، إذ يجب اختيار eps و min_samples بعناية. والتعيين إلى أقرب centroid هو سلوك k-means نفسه وهو سبب المشكلة هنا."},{"id":"ml2-035","domain":"ml","level":"expert","tags":["dbscan","varying-density","hdbscan"],"stem":"You are a data scientist at a ride-hailing start-up operating in Riyadh. You cluster pick-up locations with DBSCAN to find demand hot spots. The city centre has extremely dense pick-ups, while outer districts have far fewer requests spread over larger areas. The coordinates are projected to metres, so distance units are consistent, and min_samples is fixed at 20. With a small eps, the centre splits into sensible hot spots but almost every suburban point is labelled noise. With a large eps, suburban hot spots appear but the whole centre merges into one giant cluster. The operations team needs hot spots in both areas. What BEST explains the problem and its remedy?","options":["DBSCAN needs the number of clusters in advance; set it to the number of districts","The coordinates must be standardised; after scaling, one eps will fit every district","min_samples is too high; setting it to 1 removes the noise label and fixes both areas","One global eps assumes similar density everywhere; use HDBSCAN or OPTICS instead"],"answer":[3],"explain":"DBSCAN يستخدم قيمة eps واحدة لكل البيانات، أي يفترض كثافة متقاربة في كل العناقيد، ولذلك لا توجد قيمة تناسب وسط المدينة الكثيف والضواحي المتناثرة معاً. خوارزميات مثل HDBSCAN و OPTICS صُممت للتعامل مع كثافات متفاوتة. ضبط min_samples على 1 يجعل كل نقطة عنقوداً محتملاً ويلغي مفهوم الـ noise دون حل مشكلة اختلاف الكثافة، والإحداثيات أصلاً بوحدة موحدة فلا حاجة للـ scaling."},{"id":"ml2-036","domain":"ml","level":"assistant","tags":["hierarchical-clustering","dendrogram"],"stem":"At a research hospital you have standardised lab profiles for 180 patients. Clinicians do not know how many patient groups exist and want to see how groups merge at different levels of similarity. Which method is MOST appropriate?","options":["K-means with k=2, increasing k until clinicians are satisfied with the groups","Agglomerative hierarchical clustering, inspected through a dendrogram","DBSCAN, because it is the only method that needs no number of clusters","PCA to two components, then judging the groups by eye from the scatter plot"],"answer":[1],"explain":"الـ hierarchical clustering ينتج dendrogram يوضح كيف تندمج المجموعات على مستويات تشابه مختلفة، فيمكن للأطباء اختيار مستوى القطع المناسب دون تحديد عدد العناقيد مسبقاً، وحجم البيانات (180 مريضاً) صغير فلا توجد مشكلة في الكلفة الحسابية. k-means يعطي تقسيماً مسطحاً واحداً لكل k ولا يُظهر علاقة التداخل بين المستويات. و DBSCAN لا يحتاج k أيضاً لكنه لا يقدم بنية هرمية."},{"id":"ml2-037","domain":"ml","level":"associate","tags":["gaussian-mixture","soft-clustering"],"stem":"At a mobile operator you segment 800,000 customers by data, voice and roaming usage. Exploratory plots show that the segments overlap, have elongated shapes and very different sizes. Marketing wants, for borderline customers, the probability of belonging to each segment rather than a single hard label, so that offers can be blended. Which method is MOST appropriate?","options":["A Gaussian mixture model, giving soft memberships and flexible shapes","K-means, converting each customer's distances to the centroids into percentages","DBSCAN, treating every borderline customer as noise to be handled separately","Hierarchical clustering, cutting the dendrogram at two different heights"],"answer":[0],"explain":"الـ Gaussian mixture model يفترض أن البيانات خليط من توزيعات Gaussian لكل منها covariance خاص، فيلتقط عناقيد بيضاوية مختلفة الأحجام ويعطي لكل عميل احتمال الانتماء لكل شريحة (soft assignment). k-means يعطي تعييناً قطعياً ويفترض عناقيد كروية متقاربة الحجم، وتحويل المسافات إلى نسب ليس احتمالاً مبنياً على نموذج. و DBSCAN لا يقدم احتمالات انتماء."},{"id":"ml2-038","domain":"ml","level":"associate","tags":["customer-segmentation","choosing-k","actionability"],"stem":"You are a data scientist at a fashion retailer with stores in Jeddah and Dammam. You cluster 300,000 loyalty members on recency, frequency, monetary value and category mix, after log-transforming and standardising the features. The marketing team can design and fund at most four differentiated campaigns this year, because each campaign requires its own creative material and discount budget. You present two candidate solutions. With k=7, three of the segments have almost identical profiles, and marketing cannot say how it would treat them differently. With k=4, each segment has a clearly distinct profile. The loyalty programme was launched five years ago and the app has a 4.6 store rating. Which solution should you recommend?","table":{"caption":"Candidate solutions","headers":["k","Average silhouette","Smallest segment","Segments marketing can act on"],"rows":[["4","0.51","11% of members","4"],["7","0.54","2% of members","4"]]},"options":["k = 7, because the higher silhouette makes it the statistically correct answer","k = 4, because a slightly lower silhouette is outweighed by actionable segments","k = 7, merging similar segments by hand afterwards without telling marketing","Neither; clustering should be abandoned when silhouette is below 0.7"],"answer":[1],"explain":"الـ segmentation وسيلة لاتخاذ قرارات تسويقية، فمعيار النجاح هو أن تكون الشرائح مميزة وقابلة للتنفيذ ضمن قدرة الفريق (أربع حملات). الفرق في الـ silhouette بين 0.51 و 0.54 ضئيل، بينما حل k=7 يحتوي ثلاث شرائح متطابقة تقريباً وشريحة لا تتجاوز 2% من الأعضاء. لا يوجد k صحيح إحصائياً في الـ clustering، فالمقاييس الداخلية ترشد الاختيار ولا تحسمه."},{"id":"ml2-039","domain":"ml","level":"associate","tags":["customer-segmentation","skewed-features","k-means"],"stem":"At an online electronics store you run k-means on standardised RFM features. Total spend is extremely right-skewed. The result is one cluster of 12 very large buyers and one huge cluster containing everyone else. Marketing already manages those 12 accounts personally and wants structure among the remaining customers. Which change would MOST improve the segmentation?","options":["Increase k to 15 so that the large cluster is forced to break apart into pieces","Remove the standardisation step so that spend differences become more visible","Log-transform the skewed features before standardising, then re-cluster","Raise the maximum number of iterations so that the centroids can move further"],"answer":[2],"explain":"k-means حساس للقيم المتطرفة لأنه يصغّر مربعات المسافات، فالعملاء الاثنا عشر ذوو الإنفاق الهائل يسحبون centroid خاصاً بهم ويُضغط باقي العملاء في عنقود واحد. الـ log transform يقلّص الذيل الأيمن فتظهر الفروق بين العملاء العاديين، ثم يأتي الـ standardisation. إلغاء الـ standardisation يزيد هيمنة الإنفاق، وزيادة k إلى 15 تنتج تقسيمات عشوائية يظل الـ skew مسيطراً عليها."},{"id":"ml2-040","domain":"ml","level":"associate","tags":["k-means","elbow-method","silhouette"],"stem":"At an insurance company you cluster 90,000 policyholders with k-means on standardised features such as premium, claims history, tenure and number of policies. The goal is a small set of segments for the retention team. The elbow plot below declines smoothly, with no clear bend. What is the MOST appropriate next step?","chart":{"type":"line","title":"Elbow plot for policyholder clustering","xLabel":"Number of clusters (k)","yLabel":"Inertia","x":["1","2","3","4","5","6","7","8"],"series":[{"name":"Inertia","values":[1000,820,690,590,510,450,400,360]}]},"options":["Choose k = 8, because it has the lowest inertia of all the tested values","Conclude that the data has no structure and abandon the segmentation project","Re-run k-means on unscaled features, which usually makes the elbow sharper","Compare silhouette scores and the business usefulness of several candidate k"],"answer":[3],"explain":"الـ elbow method كثيراً ما يكون غامضاً كما هنا حيث ينخفض المنحنى بسلاسة دون انحناء واضح، وعندها نلجأ إلى مؤشرات مكمّلة مثل الـ silhouette وإلى ثبات الشرائح وفائدتها العملية للأعمال. اختيار k=8 لأن الـ inertia أقل لا معنى له لأنها تنخفض دائماً مع زيادة k. وإلغاء الـ scaling يجعل ميزة واحدة تهيمن وقد يصنع elbow مضللاً."},{"id":"ml2-041","domain":"ml","level":"assistant","tags":["pca","feature-scaling"],"stem":"At a chemical plant you run PCA on raw sensor data: temperature (20–90 °C), pressure (90,000–110,000 Pa) and vibration (0.01–0.5 mm). The first component explains 99.9% of variance and is almost purely pressure. What is the MOST likely explanation?","options":["Pressure is the only informative sensor, so the other two can be removed","PCA failed to converge and should be re-run with more iterations","Pressure's large numeric scale dominates the variance; standardise first","The three sensors are perfectly correlated, so one component is enough"],"answer":[2],"explain":"PCA يبحث عن اتجاهات أكبر variance، والـ variance يتأثر بوحدة القياس: الضغط بالباسكال يتغير بعشرات الآلاف بينما الاهتزاز بأجزاء من المليمتر، فيستحوذ الضغط على المكوّن الأول لأسباب عددية بحتة. الحل تطبيق StandardScaler قبل PCA. استنتاج أن الضغط هو الحسّاس المفيد الوحيد خطأ، لأن كبر الـ variance الناتج عن الوحدة لا يعني أهمية تنبؤية."},{"id":"ml2-042","domain":"ml","level":"assistant","tags":["pca","explained-variance"],"stem":"You apply PCA to standardised survey data at a national education authority. Based on the explained variance ratios in the table, what is the smallest number of components that retains at least 90% of the variance?","table":{"caption":"PCA explained variance ratio","headers":["Component","Explained variance ratio"],"rows":[["PC1","0.42"],["PC2","0.23"],["PC3","0.14"],["PC4","0.09"],["PC5","0.05"],["PC6","0.04"],["PC7","0.03"]]},"options":["5","4","3","7"],"answer":[0],"explain":"الـ variance التراكمي: 0.42 ثم 0.65 ثم 0.79 ثم 0.88 ثم 0.93. أربعة مكونات تحتفظ بـ 88% فقط وهي أقل من الحد المطلوب، بينما خمسة مكونات تصل إلى 93%، فأصغر عدد يحقق 90% هو خمسة. الإجابة بأربعة هي الفخ الشائع لأن 88% قريبة من 90% لكنها لا تبلغها."},{"id":"ml2-043","domain":"ml","level":"associate","tags":["pca","feature-selection","interpretability"],"stem":"You are a data scientist at a bank that must give every rejected loan applicant the main reasons for the decision, expressed in terms of their own attributes such as income, existing debt or missed payments. The regulator audits these reason codes twice a year, and last year the bank received two formal complaints about unclear rejection letters. The current scorecard uses 60 input features, many of them redundant versions of each other (for example, three different measures of monthly income). A colleague proposes compressing the 60 features into 10 principal components to simplify the model, noting that the components keep 95% of the variance. The model is retrained quarterly and the IT department prefers fewer inputs. Which approach is MOST appropriate?","options":["Adopt the 10 components, since keeping 95% of the variance also keeps the explanations intact","Adopt the 10 components and name each one after the feature with the largest loading","Use t-SNE instead of PCA, because its two dimensions are easier to explain to applicants","Use feature selection to remove redundant inputs, so the model keeps original attributes"],"answer":[3],"explain":"كل principal component هو مزيج خطي من الميزات الستين، فلا يمكن أن يُقال للعميل إن سبب الرفض هو المكوّن الثالث، وهذا يخالف متطلب الجهة التنظيمية بذكر الأسباب بدلالة خصائص العميل نفسها. الـ feature selection يقلل عدد المدخلات ويزيل التكرار مع الإبقاء على الميزات الأصلية القابلة للتفسير. وتسمية المكوّن باسم الميزة الأعلى loading مضللة لأن بقية الميزات تبقى مساهمة فيه."},{"id":"ml2-044","domain":"ml","level":"expert","tags":["pca","supervised-vs-unsupervised"],"stem":"At a semiconductor plant you reduce 150 standardised process features with PCA, keeping the components that together explain 95% of the variance. Defects are rare and are known to be linked to small fluctuations in a few chamber-pressure readings. A defect classifier trained on the components performs clearly worse than the same classifier trained on all original features. What BEST explains this?","options":["Principal components are strongly correlated with each other, which confuses the classifier","PCA ignores the target, so a low-variance direction that predicts defects was discarded","Keeping 95% of the variance is too much and caused the classifier to overfit the noise","PCA is only valid when the target variable follows a normal distribution"],"answer":[1],"explain":"PCA تقنية unsupervised تحتفظ بالاتجاهات الأعلى variance دون النظر إلى الـ target، وقد تكون الإشارة التي تميّز العيوب موجودة في اتجاه قليل الـ variance وقع ضمن الـ 5% المحذوفة. كِبر الـ variance لا يعني قدرة تنبؤية. أما القول بأن المكونات مترابطة فخطأ، لأن الـ principal components متعامدة وغير مترابطة بحكم تعريفها."},{"id":"ml2-045","domain":"ml","level":"assistant","tags":["pca","dimensionality-reduction"],"stem":"You mentor junior analysts at an energy company who have just learned PCA and now want to apply it to every dataset before modelling. You want them to understand where it helps and where it does harm. In which TWO situations is PCA a reasonable choice? (Select TWO)","options":["300 highly correlated smart-meter readings feed a model where feature-level explanations are not needed","A credit model with 12 features must show customers which attribute caused a rejection","A dataset of 8 unrelated categorical survey answers needs to be one-hot encoded","Hundreds of correlated sensor channels need compressing before clustering machines by behaviour","A model underfits with 5 features and needs more predictive signal added"],"answer":[0,3],"explain":"PCA مفيد عندما تكون الميزات عددية كثيرة ومترابطة بقوة ولا نحتاج إلى تفسير على مستوى الميزة، كما في قراءات العدادات الذكية أو ضغط قنوات الحسّاسات قبل الـ clustering لتخفيف أثر الأبعاد العالية. لا يناسب الحالات التي تتطلب تفسيراً بدلالة الخصائص الأصلية كأسباب رفض الائتمان. كما أنه لا يضيف معلومات جديدة، فلا يعالج underfitting ناتجاً عن قلة الإشارة."},{"id":"ml2-046","domain":"ml","level":"associate","tags":["t-sne","visualisation"],"stem":"At a travel-insurance company, a colleague produced an attractive t-SNE plot of 50,000 customers in which several groups are clearly visible. Encouraged by the picture, he now wants to feed the two t-SNE coordinates into the production claims classifier as its only inputs, to keep the model small and fast. New customers must be scored every day. What is the MAIN problem with this idea?","options":["t-SNE has no stable mapping for new customers; it is meant for visualisation","t-SNE keeps too much variance, so the classifier would receive redundant information","t-SNE coordinates are always linearly correlated, which breaks most classifiers","t-SNE only accepts labelled data, so it cannot be applied to new unlabelled customers"],"answer":[0],"explain":"t-SNE لا يتعلم دالة تحويل يمكن تطبيقها على نقاط جديدة، وتتغير إحداثياته باختلاف الـ random seed والـ perplexity، كما أنه يحافظ على الجوار المحلي فقط ويشوّه المسافات العامة. لذلك يُستخدم للاستكشاف البصري وليس لتوليد features لنموذج في الإنتاج، وإذا لزم تقليل الأبعاد فـ PCA يوفر transform ثابتاً. والقول بأنه يحتاج بيانات مصنفة غير صحيح، فهو unsupervised."},{"id":"ml2-047","domain":"ml","level":"associate","tags":["isolation-forest","anomaly-detection","contamination"],"stem":"At a public procurement office you score 40,000 invoices per month with an isolation forest. There are no fraud labels. The audit team can manually review 200 invoices per month. With default settings the model flags about 2,900 invoices. What is the MOST appropriate way to use the model?","options":["Send all 2,900 flagged invoices to the auditors, since each one is a confirmed anomaly","Rank invoices by anomaly score and send the top 200, a contamination of 0.5%","Set contamination to 0.5 so that half of the invoices are examined over time","Retrain with more trees until the number of flagged invoices falls to 200"],"answer":[1],"explain":"الـ Isolation Forest يعطي anomaly score لكل فاتورة، والحد الفاصل (contamination) قرار عملي يُضبط حسب نسبة الشذوذ المتوقعة أو طاقة المراجعة: 200 ÷ 40,000 = 0.5%. ترتيب الفواتير وإرسال الأعلى 200 يستغل وقت المدققين في أكثر الحالات شذوذاً. الفواتير التي يعلّمها النموذج ليست احتيالاً مؤكداً بل حالات غير معتادة فقط، وعدد الأشجار لا يتحكم في عدد التنبيهات."},{"id":"ml2-048","domain":"ml","level":"assistant","tags":["time-series","train-test-split"],"stem":"At a supermarket chain you forecast daily sales from three years of history. A random 80/20 split gives a very low test error. Why is this estimate misleading, and what should you do instead?","options":["The test set is too small; use a random 50/50 split to get a more reliable estimate","Random splits are fine, but the rows must be shuffled again before every training run","The model sees days after each test day; hold out the most recent period instead","Daily data is too noisy; aggregate to yearly totals and then split the years randomly"],"answer":[2],"explain":"في الـ time series يضع التقسيم العشوائي أياماً من المستقبل في بيانات التدريب، فيتنبأ النموذج بيوم اختبار وهو يعرف ما قبله وما بعده مباشرة، وهذا لا يحدث في الواقع فيخرج الخطأ منخفضاً بشكل مضلل. التقييم الصحيح هو التدريب على الماضي والاختبار على أحدث فترة زمنية. تغيير نسبة التقسيم العشوائي لا يعالج المشكلة لأن التسريب الزمني يبقى قائماً."},{"id":"ml2-049","domain":"ml","level":"associate","tags":["time-series","lag-features","leakage"],"stem":"At a parcel company you forecast daily volume per depot 7 days ahead, so that shift plans can be published a week in advance. The forecast for a target day is produced every morning using only data available up to the previous evening. A colleague has proposed five candidate features. Which TWO features can legitimately be used at the moment the forecast is made? (Select TWO)","options":["Volume on the day before the target day (lag 1 relative to the target)","A centred 7-day rolling mean around the target day","Volume on the same weekday two and three weeks before the target day","Day of week and public-holiday flags for the target day","Number of delivery vans dispatched on the target day"],"answer":[2,3],"explain":"عند التنبؤ قبل 7 أيام لا تتوفر إلا المعلومات المعروفة لحظة إصدار التوقع: الـ lags التي تساوي أفق التنبؤ أو تزيد عنه (14 و 21 يوماً هنا) وميزات التقويم المعروفة مسبقاً كاليوم من الأسبوع والعطل. أما lag 1 بالنسبة لليوم المستهدف فيقع في المستقبل وقت التوقع، والـ rolling mean المتمركز يتضمن أياماً لاحقة. وعدد المركبات المرسلة في اليوم نفسه نتيجة للحجم وليس معلومة متاحة مسبقاً."},{"id":"ml2-050","domain":"ml","level":"assistant","tags":["time-series","trend","seasonality"],"stem":"You plot quarterly revenue (in million riyals) for a hotel group before choosing a forecasting approach. Which statement BEST describes the series in the chart?","chart":{"type":"line","title":"Quarterly revenue","xLabel":"Quarter","yLabel":"Revenue (million riyals)","x":["Q1-22","Q2-22","Q3-22","Q4-22","Q1-23","Q2-23","Q3-23","Q4-23","Q1-24","Q2-24"],"series":[{"name":"Revenue","values":[100,110,105,160,120,130,126,190,141,152]}]},"options":["A stationary series with a constant mean and no repeating pattern","Random noise with two Q4 outliers that should be removed before modelling","A seasonal pattern only, with no change in the overall level over time","An upward trend plus a yearly seasonal peak in the fourth quarter"],"answer":[3],"explain":"كل ربع أعلى من نظيره في السنة السابقة (Q1: 100 ثم 120 ثم 141، و Q4: 160 ثم 190)، وهذا trend صاعد، وفي الوقت نفسه تتكرر قفزة الربع الرابع كل سنة، وهذه seasonality سنوية. لذلك يجب أن يراعي نموذج التنبؤ المكوّنين معاً. اعتبار قيم Q4 مجرد outliers وحذفها خطأ، لأنها نمط متكرر ومتوقع وهو بالضبط ما نريد التنبؤ به."},{"id":"ml2-051","domain":"ml","level":"assistant","tags":["time-series","stationarity","differencing"],"stem":"At a regional airport operator, monthly passenger counts rise steadily year after year. You plan to use an ARIMA-type model, which assumes a roughly stationary series. Which preparation step is MOST appropriate?","options":["Shuffle the months so that the upward trend no longer appears in the data","Standardise the counts to zero mean and unit variance to remove the trend","Difference the series, so the model works on month-to-month changes","Delete the oldest years until the remaining series looks roughly flat"],"answer":[2],"explain":"السلسلة ذات الـ trend غير stationary لأن متوسطها يتغير مع الزمن، والـ differencing (طرح القيمة السابقة من الحالية) يزيل الـ trend ويجعل المتوسط ثابتاً تقريباً، وهو ما يمثله الحرف I في ARIMA. الـ standardisation يغيّر المقياس فقط ويبقى الاتجاه الصاعد كما هو. وخلط ترتيب الأشهر يدمّر البنية الزمنية التي يعتمد عليها النموذج."},{"id":"ml2-052","domain":"ml","level":"expert","tags":["time-series","random-forest","extrapolation"],"stem":"At a fast-growing fintech, monthly transaction volume has risen about 8% per month for two years. Your random forest with lag and calendar features fits history well, but its forecasts for the coming months flatten out near the highest volume seen in training. What is the MOST likely cause, and the best remedy?","options":["Tree ensembles cannot extrapolate beyond training targets; forecast growth rates instead","The forest has too few trees to capture the trend; increase the number of trees by a factor of ten","The lag features are leaking future values; remove all lag features from the model","The forest is overfitting to recent months; limit the depth of the trees to two levels"],"answer":[0],"explain":"تنبؤ أي شجرة هو متوسط قيم الـ target في إحدى أوراقها، فلا يمكن لـ Random Forest أو الـ boosting أن يتنبأ بقيمة أعلى من أقصى ما رآه في التدريب، ولذلك تتسطح التوقعات مع سلسلة تنمو باستمرار. العلاج هو نمذجة الفروق أو معدل النمو (أو إزالة الـ trend بنموذج منفصل) ثم إعادة بناء المستوى. زيادة عدد الأشجار لا تغيّر هذه الخاصية البنيوية."},{"id":"ml2-053","domain":"ml","level":"associate","tags":["time-series","naive-baseline"],"stem":"At a bakery chain you test a weekly demand model for the best-selling bread line against a naive forecast that simply repeats the previous week's actual sales. The manager will only fund deployment if the model beats this baseline on mean absolute error (MAE). Using the five test weeks in the table, which conclusion is correct?","table":{"caption":"Weekly demand (units) on the test period","headers":["Week","Actual","Model forecast","Naive forecast"],"rows":[["1","200","215","190"],["2","220","200","200"],["3","210","230","220"],["4","240","215","210"],["5","230","250","240"]]},"options":["Model MAE is 16 and naive MAE is 20, so the model is ready for deployment","Both forecasts have an MAE of 20, so the choice between them does not matter","Model MAE is 20, under 10% of average sales, so the baseline is irrelevant","Model MAE is 20 and naive MAE is 16, so the model does not yet add value"],"answer":[3],"explain":"أخطاء النموذج المطلقة: 15 و 20 و 20 و 25 و 20 ومجموعها 100 فيكون MAE = 20، وأخطاء الـ naive forecast: 10 و 20 و 10 و 30 و 10 ومجموعها 80 فيكون MAE = 16. النموذج أسوأ من مجرد تكرار مبيعات الأسبوع السابق، فلا قيمة مضافة له بعد. كون الخطأ أقل من 10% من متوسط المبيعات لا يكفي، فأي نموذج تنبؤ يجب أن يتفوق أولاً على naive baseline."},{"id":"ml2-054","domain":"ml","level":"expert","tags":["time-series","seasonality","calendar-features"],"stem":"You are a data scientist at a grocery retailer in Saudi Arabia forecasting daily demand for 2,000 products. Demand rises sharply before and during Ramadan and again around the Hajj season. Your gradient boosting model uses Gregorian features (month, week of year, day of week), a lag of 365 days and promotional flags. Overall error is acceptable, and the model is retrained weekly on four years of history. However, every year the largest errors occur in the weeks around Ramadan: the model predicts the peak roughly a week and a half later than it actually happens. Store managers have started overriding the forecasts manually in that period. Which change would MOST improve the model?","options":["Add a second yearly lag of 730 days so that the model sees two earlier Ramadan peaks","Add Hijri-calendar features, such as days until Ramadan and Eid flags","Remove the Ramadan weeks from the training data, because they behave as outliers","Double the number of trees so that the model can memorise the date of each peak"],"answer":[1],"explain":"رمضان والحج يتبعان التقويم الهجري فيتقدمان نحو 11 يوماً كل سنة ميلادية، بينما ميزات النموذج الميلادية و lag 365 تفترض أن الذروة تتكرر في التاريخ الميلادي نفسه، ولهذا يتأخر التوقع بنحو أسبوع ونصف. إضافة ميزات هجرية (الأيام المتبقية لرمضان، أعلام العيد والحج) تربط الموسمية بسببها الحقيقي. إضافة lag 730 تزيد الانزياح إلى نحو 22 يوماً، وحذف أسابيع رمضان يلغي أهم فترة يحتاج العمل إلى توقعها."},{"id":"ml2-055","domain":"ml","level":"assistant","tags":["recommender-systems","cold-start","content-based"],"stem":"An online learning platform adds about 500 new courses every week. Its collaborative-filtering recommender never suggests them, because they have no enrolments yet. What is the MOST appropriate way to get new courses recommended?","options":["Recommend them through content features such as topic, level and description","Wait until each course has gathered enough enrolments for collaborative filtering","Give every new course the average rating of all the existing courses","Increase the number of latent factors in the collaborative-filtering model"],"answer":[0],"explain":"هذه مشكلة item cold start: الـ collaborative filtering يعتمد على تفاعلات سابقة، والدورة الجديدة لا تملك أي تفاعل. الـ content-based filtering يستخدم خصائص الدورة نفسها (الموضوع، المستوى، الوصف) فيربطها بالمستخدمين الذين أحبوا دورات مشابهة منذ اليوم الأول. انتظار تراكم التسجيلات حلقة مفرغة، لأن الدورة لن تحصل على تسجيلات ما دامت لا تظهر في التوصيات."},{"id":"ml2-056","domain":"ml","level":"assistant","tags":["recommender-systems","cold-start"],"stem":"A grocery delivery app in Jeddah uses collaborative filtering to personalise its home screen. Newly registered users have no order history, and their home screen is currently filled with random products, which leads to poor first-week retention. The app already knows each user's delivery district from registration. Which TWO approaches are appropriate for these new users? (Select TWO)","options":["Hide all recommendations until the user has completed at least 50 orders","Show popular and trending items in the user's area until history accumulates","Ask a few onboarding questions and use the answers for content-based suggestions","Assign the new user a random latent vector from the existing user matrix","Copy the recommendations of the most active user on the platform"],"answer":[1,2],"explain":"في user cold start لا توجد تفاعلات يبني عليها الـ collaborative filtering، فالحلول المعتادة هي عرض الأكثر رواجاً (popularity baseline) كبداية معقولة، وجمع تفضيلات أولية عبر أسئلة onboarding لاستخدامها في توصيات content-based، ثم الانتقال تدريجياً إلى التخصيص مع تراكم السجل. تعيين latent vector عشوائي يعطي توصيات عشوائية وهي المشكلة الحالية نفسها. وإخفاء التوصيات حتى 50 طلباً يضيّع فترة الاحتفاظ الحرجة."},{"id":"ml2-057","domain":"ml","level":"associate","tags":["recommender-systems","collaborative-filtering"],"stem":"You are a data scientist at a second-hand marketplace with 4 million active users and 90 million recorded views, saves and purchases. The platform operates in three Gulf countries and earns its revenue from promoted listings. Item listings are written by private sellers: titles are free text in mixed Arabic and English, categories are often wrong, and many listings have no description or a single blurry photo. The business wants a 'recommended for you' carousel within one quarter, and the team has two data scientists. New-item cold start is not a concern, because the carousel is only meant to show listings that already have some activity. Which approach is the MOST appropriate starting point?","options":["A content-based recommender built on the listing titles, categories and descriptions","Collaborative filtering, such as matrix factorisation on the interaction data","A rule that shows every user the same ten most-viewed listings of the week","A manually curated list per category, maintained by the two data scientists"],"answer":[1],"explain":"المنصة تملك بيانات تفاعل غنية (90 مليون تفاعل) بينما بيانات وصف المنتجات ضعيفة وغير موثوقة، والـ collaborative filtering يتعلم من سلوك المستخدمين وحده دون حاجة إلى metadata جيدة. نقطة ضعفه المعتادة وهي cold start للعناصر الجديدة مستبعدة صراحة في السيناريو. الـ content-based سيعتمد على عناوين وتصنيفات خاطئة فتكون جودته محدودة، وقائمة الأكثر مشاهدة ليست توصية شخصية."},{"id":"ml2-058","domain":"ml","level":"expert","tags":["recommender-systems","implicit-feedback"],"stem":"A video streaming service records only which videos each user watched; there are no ratings, likes or dislikes. The catalogue holds 200,000 videos and a typical user has watched about 60. An analyst fills every unwatched user–video pair with a rating of 0, trains a rating-prediction matrix factorisation model and minimises RMSE. What is the MAIN flaw in this approach?","options":["Matrix factorisation cannot be trained without explicit star ratings from users","RMSE must be replaced by MAE, because watch data contains many large outliers","Unwatched mostly means unseen, not disliked; use implicit-feedback methods","The matrix is too sparse, so every user with under 100 views must be removed"],"answer":[2],"explain":"في الـ implicit feedback غياب المشاهدة لا يعني عدم الإعجاب، فمعظم الفيديوهات لم يرها المستخدم أصلاً، ومعاملتها كتقييم صفري تملأ المصفوفة بإشارات سلبية زائفة تدفع النموذج لتوقع الصفر لكل شيء تقريباً. الطرق المخصصة لذلك تتعامل مع المشاهدة كإشارة إيجابية بدرجة ثقة، ومع غير المشاهَد كسلبي ضعيف الوزن أو عبر negative sampling و ranking loss. والـ matrix factorisation تعمل مع البيانات الضمنية إذا صيغت المشكلة بشكل صحيح."},{"id":"ml2-059","domain":"ml","level":"assistant","tags":["nlp","tf-idf","baseline"],"stem":"A municipal service centre wants to route citizen complaints to six departments (water, electricity, roads, waste, parks, permits). You have 40,000 labelled complaints, the departments are usually identifiable from a few characteristic words, and the solution must run on a modest CPU server and be easy to explain. What should you build FIRST?","options":["A large transformer model trained from scratch on the 40,000 complaints","A fine-tuned multi-billion-parameter language model served on rented GPUs","A t-SNE projection of the complaints, routed according to visual clusters","A TF-IDF representation with a linear classifier as a strong baseline"],"answer":[3],"explain":"حين تتميز الفئات بكلمات مفتاحية واضحة وتتوفر بيانات مصنفة كافية، فإن TF-IDF مع linear classifier يعطي عادة دقة عالية، ويعمل بسرعة على CPU، ويمكن تفسيره عبر أوزان الكلمات، وهو ما يطابق قيود المشروع. النماذج الضخمة مكلفة في التشغيل وصعبة التفسير، ولا مبرر لها قبل أن يثبت أن الـ baseline البسيط غير كافٍ. وتدريب transformer من الصفر على 40 ألف نص فقط غير عملي."},{"id":"ml2-060","domain":"ml","level":"associate","tags":["nlp","embeddings","semantic-search"],"stem":"A bank's help-centre search matches customer questions to 600 FAQ articles using TF-IDF cosine similarity. It works when customers reuse the article wording, but fails when wording differs: 'the machine swallowed my card' does not retrieve the article titled 'ATM retained card'. Queries and articles are short, and a pretrained multilingual language model is available. Which change would MOST improve retrieval?","options":["Add bigrams and trigrams to the TF-IDF vocabulary so more phrases are captured","Apply lowercasing and stemming so that different word forms are matched","Compare pretrained sentence embeddings of queries and articles instead","Raise the TF-IDF vocabulary size limit so that rare words are no longer dropped"],"answer":[2],"explain":"TF-IDF يطابق الكلمات حرفياً، فلا يرى أي تشابه بين swallowed و retained أو بين machine و ATM لأنها كلمات مختلفة رغم تطابق المعنى. الـ sentence embeddings من نموذج pretrained تمثل المعنى في فضاء متجهات تتقارب فيه الصياغات المترادفة، فيتحسن الاسترجاع الدلالي. إضافة n-grams أو stemming تبقى ضمن المطابقة اللفظية ولا تحل مشكلة المرادفات."},{"id":"ml2-061","domain":"ml","level":"associate","tags":["nlp","transfer-learning","fine-tuning"],"stem":"An insurance company wants to classify incoming customer emails into 12 intents so they can be routed automatically. Only 2,000 emails are labelled, the intents depend on subtle phrasing rather than keywords, and a TF-IDF baseline plateaus at a disappointing level. A GPU is available and there is no strict latency requirement. Which approach is MOST appropriate?","options":["Fine-tune a pretrained language model on the 2,000 labelled emails","Train a transformer from scratch on the 2,000 emails to avoid outside bias","Train word embeddings from scratch on the 2,000 emails and average them","Add thousands of extra TF-IDF n-gram features until accuracy improves"],"answer":[0],"explain":"النموذج الـ pretrained تعلّم بنية اللغة ومعانيها من كميات هائلة من النصوص، والـ fine-tuning ينقل هذه المعرفة إلى مهمتك فيكفيه عدد قليل من الأمثلة المصنفة، وهذا هو جوهر الـ transfer learning. تدريب transformer أو embeddings من الصفر على 2,000 رسالة فقط يؤدي إلى overfitting شديد لأن البيانات لا تكفي لتعلم اللغة. وزيادة n-grams لا تلتقط الفروق الدقيقة في الصياغة التي فشل فيها TF-IDF أصلاً."},{"id":"ml2-062","domain":"ml","level":"associate","tags":["nlp","model-selection","latency"],"stem":"You are a data scientist at a telecom operator. Incoming chat messages must be tagged as 'urgent' or 'normal' before being placed in the agent queue. The tagging service runs on existing CPU servers, must answer within 50 ms per message, and handles about 3 million messages per day. Messages arrive in Arabic and English, and peak traffic occurs in the evening. The contact-centre manager states that an F1 of at least 0.90 is good enough for the queueing logic, and the budget for new infrastructure this year is 5,000 riyals per month. The chat platform was migrated to a new vendor last year. You benchmarked four options on the same test set. Which option should you recommend?","table":{"caption":"Benchmark of text-classification options","headers":["Option","F1","Latency per message","Monthly serving cost"],"rows":[["Keyword rules","0.78","1 ms","0 riyals"],["TF-IDF + linear model","0.91","3 ms","300 riyals"],["Fine-tuned transformer on CPU","0.94","220 ms","2,500 riyals"],["Large LLM via GPU cluster","0.95","400 ms","60,000 riyals"]]},"options":["The large LLM, because it has the highest F1 of all four options","The fine-tuned transformer on CPU, since it is within the monthly budget","The keyword rules, because they are the cheapest and the fastest","The TF-IDF model, which meets the F1, latency and cost requirements"],"answer":[3],"explain":"المتطلبات ثلاثة: F1 لا يقل عن 0.90، و latency أقل من 50 ms، وتكلفة لا تتجاوز 5,000 ريال شهرياً، ونموذج TF-IDF مع linear model هو الوحيد الذي يحققها جميعاً (0.91 و 3 ms و 300 ريال). الـ transformer على CPU ضمن الميزانية لكنه يحتاج 220 ms فيخالف شرط الـ latency. والقواعد النصية رخيصة وسريعة لكن F1 = 0.78 أقل من الحد المطلوب. النموذج الأبسط الذي يحقق المتطلبات هو الاختيار الصحيح."},{"id":"ml2-063","domain":"ml","level":"expert","tags":["nlp","domain-shift","fine-tuning"],"stem":"You are a data scientist at a hospital group that runs six hospitals and collects about 2,000 comments per week through a post-visit SMS survey. To analyse patient feedback you deployed an off-the-shelf sentiment model that was pretrained on movie and product reviews. On a sample of 1,500 feedback comments labelled by the patient-experience team, accuracy is only 68%. Errors cluster around clinical vocabulary: comments containing 'positive', 'negative', 'aggressive treatment' or 'discharged' are often misread, because these words carry a different meaning in a medical setting. The team can label about 3,000 more comments over the next month, and the comments are stored in a secure on-premise database. Which approach is MOST appropriate?","options":["Keep the model unchanged and add a rule that flips the sentiment whenever a clinical word appears","Fine-tune the pretrained model on labelled in-domain comments and evaluate on held-out feedback","Discard pretraining and train a new deep model from scratch on the 4,500 labelled comments","Translate the comments into review-style language so that they resemble the original training data"],"answer":[1],"explain":"المشكلة domain shift: النموذج تعلّم دلالات الكلمات من مراجعات الأفلام والمنتجات، وكلمات مثل positive و negative لها معنى مختلف في السياق الطبي. الـ fine-tuning على تعليقات مصنفة من المجال نفسه يحتفظ بالمعرفة اللغوية العامة ويكيّفها مع المفردات السريرية، مع تقييم على بيانات hold-out من المجال. التدريب من الصفر على 4,500 تعليق يتخلى عن فائدة الـ pretraining والبيانات لا تكفي له. وقاعدة قلب الـ sentiment عند ظهور كلمة سريرية ستخطئ في حالات كثيرة."},{"id":"ml2-064","domain":"ml","level":"assistant","tags":["deep-learning","tabular-data","model-choice"],"stem":"At a home-insurance company you must predict claim probability from 8,000 policies with 25 tabular features (property age, region, sum insured and so on). A manager insists on a deep neural network because it is 'state of the art'. Results are needed in two weeks and must be explainable to underwriters. What is the BEST recommendation?","options":["Start with gradient-boosted trees; deep learning is hard to justify here","Build the deep network, because neural networks outperform other models on any dataset","Build the deep network, but add more hidden layers to compensate for the small dataset","Convert each policy row into an image so that a pretrained CNN can be applied to it"],"answer":[0],"explain":"الـ deep learning يتفوق عادة مع البيانات غير المهيكلة الضخمة (صور، نصوص، صوت)، أما مع 8,000 صف من البيانات الجدولية فإن نماذج مثل gradient-boosted trees تعطي غالباً دقة مساوية أو أفضل بجهد ضبط أقل وتدريب أسرع وتفسير أسهل، وهو ما يناسب مهلة الأسبوعين ومتطلب الشرح. إضافة طبقات أكثر مع بيانات قليلة تزيد الـ overfitting ولا تعوّض صغر حجم البيانات."},{"id":"ml2-065","domain":"ml","level":"associate","tags":["transfer-learning","cnn","image-classification"],"stem":"An agricultural start-up wants to classify date-palm leaf diseases from photos taken by farmers on their phones. It has only 1,500 labelled images across 5 classes and a single GPU, and labelling more images requires an agronomist and is slow. A CNN trained from scratch reaches 98% training accuracy but 61% validation accuracy. Which approach is MOST appropriate?","options":["Train the same CNN from scratch for many more epochs until validation accuracy catches up","Start from a CNN pretrained on a large image set and retrain its final layers","Flatten the pixels into a table and train gradient boosting on the raw pixel values","Add more convolutional layers, so that the network can learn richer features from the photos"],"answer":[1],"explain":"1,500 صورة لا تكفي لتعلّم features بصرية من الصفر، ولذلك حفظت الشبكة بيانات التدريب (98% مقابل 61%). في الـ transfer learning نستخدم CNN مدرّبة مسبقاً على مجموعة صور ضخمة، فطبقاتها الأولى تعرف الحواف والأنسجة والأشكال، ونعيد تدريب الطبقات الأخيرة فقط على أمراض النخيل، ويفضَّل مع data augmentation. زيادة الـ epochs أو الطبقات تزيد الـ overfitting لأن المشكلة في قلة البيانات وليست في سعة النموذج."},{"id":"ml2-066","domain":"ml","level":"assistant","tags":["neural-networks","dropout"],"stem":"At a logistics company, a junior colleague adds dropout layers to a neural network that overfits. Which TWO statements about dropout are correct? (Select TWO)","options":["It randomly switches off units during training, which discourages co-adaptation","It permanently deletes the least important neurons to make the network smaller","It should stay active when scoring new data so predictions remain regularised","It speeds up convergence, so fewer epochs are always needed when it is used","It is disabled at inference time, when the full network is used"],"answer":[0,4],"explain":"الـ dropout يعطّل عشوائياً نسبة من الوحدات في كل خطوة تدريب، فلا تعتمد الشبكة على وحدات بعينها (co-adaptation) ويعمل ذلك كـ regularization يشبه تدريب ensemble من شبكات أصغر. وعند الـ inference يُوقَف وتُستخدم الشبكة كاملة حتى تكون التنبؤات ثابتة. هو لا يحذف الوحدات نهائياً فهذا وصف للـ pruning، وغالباً ما يبطئ التقارب قليلاً ولا يسرّعه."},{"id":"ml2-067","domain":"ml","level":"assistant","tags":["neural-networks","overfitting","early-stopping"],"stem":"At a manufacturing company, your image classifier for surface defects reaches 99% training accuracy and 82% validation accuracy, and the validation loss has been rising for the last 30 epochs. Collecting more images is not possible this month. Which TWO actions are MOST likely to reduce the overfitting? (Select TWO)","options":["Train for twice as many epochs so that the validation loss has time to recover","Add several more dense layers to increase the capacity of the network","Apply data augmentation such as flips, rotations and brightness changes","Remove the validation set and train on all images to use more data","Use early stopping and restore the weights from the best validation epoch"],"answer":[2,4],"explain":"ارتفاع الـ validation loss مع استمرار تحسن التدريب يعني overfitting. الـ data augmentation يزيد تنوع الصور فعلياً دون جمع بيانات جديدة، والـ early stopping يوقف التدريب عند أفضل epoch ويستعيد أوزانه بدلاً من مواصلة الحفظ. مضاعفة عدد الـ epochs أو إضافة طبقات تزيد قدرة الشبكة على الحفظ فتفاقم المشكلة. وإلغاء الـ validation set يحرمك من الأداة الوحيدة التي تكشف الـ overfitting."},{"id":"ml2-068","domain":"ml","level":"associate","tags":["neural-networks","learning-rate"],"stem":"At an energy company you train the same neural network for load forecasting three times, changing only the learning rate; architecture, data, batch size and optimiser are identical. The table shows the training loss at selected epochs for each run. A junior colleague asks which run to continue with and why. Which interpretation is MOST appropriate?","table":{"caption":"Training loss by epoch","headers":["Epoch","Run A (lr = 1.0)","Run B (lr = 0.001)","Run C (lr = 0.0000001)"],"rows":[["1","2.31","2.30","2.31"],["5","8.74","1.12","2.30"],["10","56.20","0.61","2.30"],["20","NaN","0.35","2.29"],["40","NaN","0.24","2.28"]]},"options":["Run A needs more epochs; the loss will come down once the network warms up","Run C is the safest choice, because its loss never increases between epochs","Run A's rate is too high and diverges, Run C's is too low; Run B is suitable","All three runs show overfitting, so dropout should be added before anything else"],"answer":[2],"explain":"في Run A يتضخم الـ loss ثم يصبح NaN، وهذا divergence ناتج عن learning rate كبير يجعل خطوات التحديث تقفز فوق الحد الأدنى. في Run C بالكاد يتحرك الـ loss (من 2.31 إلى 2.28 خلال 40 epoch) لأن الخطوات صغيرة جداً. أما Run B فينخفض فيه الـ loss بثبات فهو المناسب. هذه الأرقام كلها training loss فلا تدل على overfitting، وانتظار epochs أكثر لن ينقذ تدريباً وصل إلى NaN."},{"id":"ml2-069","domain":"ml","level":"assistant","tags":["neural-networks","batch-size","gpu-memory"],"stem":"At a medical-imaging start-up, training a CNN on high-resolution scans crashes with a GPU out-of-memory error at batch size 64. No larger GPU is available. Which TWO changes address the problem? (Select TWO)","options":["Reduce the batch size so that fewer scans are held in memory at once","Use gradient accumulation to keep the effective batch size with smaller steps","Increase the learning rate so that training needs fewer batches overall","Add dropout layers so that fewer activations are stored during training","Train for more epochs so that each batch uses less memory"],"answer":[0,1],"explain":"ذاكرة الـ GPU أثناء التدريب تتناسب مع عدد العينات في الـ batch لأن الـ activations تُخزَّن لكل عينة، فتقليل الـ batch size يحل المشكلة مباشرة. والـ gradient accumulation يجمع الـ gradients عبر عدة batches صغيرة قبل تحديث الأوزان، فيحافظ على batch size فعّال كبير بذاكرة أقل. الـ learning rate وعدد الـ epochs لا علاقة لهما باستهلاك الذاكرة، والـ dropout لا يقلل الـ activations المخزنة."},{"id":"ml2-070","domain":"ml","level":"expert","tags":["transfer-learning","fine-tuning","learning-rate"],"stem":"You are a data scientist at an aviation maintenance company building a classifier for cracks in turbine-blade photographs. You start from a CNN pretrained on a large general image dataset. In phase one you froze the pretrained layers and trained only a new classification head on 6,000 labelled photos; validation accuracy reached 88%. In phase two you unfroze all layers and continued training with the same learning rate used for the head, 0.01. Within two epochs the training loss jumped and validation accuracy collapsed to 55%. The photos are taken with a standard inspection camera under fixed lighting, and the project deadline is in six weeks. What is the MOST appropriate correction?","options":["Unfreeze the layers from the very first epoch and train everything at 0.01 from the start","Discard the pretrained weights, because they are clearly incompatible with blade photographs","Increase the batch size to the largest value the GPU allows and keep the learning rate at 0.01","Fine-tune the unfrozen layers with a much smaller learning rate, such as 0.0001"],"answer":[3],"explain":"الأوزان الـ pretrained قريبة أصلاً من حل جيد، والـ learning rate الكبير (0.01) عند فك التجميد يُحدث تحديثات عنيفة تمحو الـ features المتعلَّمة، وهو ما يفسر قفزة الـ loss وانهيار الدقة. الممارسة المعتادة في الـ fine-tuning هي استخدام learning rate أصغر بكثير للطبقات المفكوكة، وأحياناً فكّها تدريجياً. نجاح المرحلة الأولى (88%) يثبت أن الأوزان المسبقة مفيدة، فالتخلي عنها استنتاج خاطئ."},{"id":"mlops-001","domain":"mlops","level":"assistant","tags":["problem-framing","churn"],"stem":"You are a data scientist at a telecom operator. The marketing director says: 'I want to know which prepaid customers are about to leave so that we can send them an offer.' The CRM holds two years of customer history, including whether each customer stopped recharging for 60 consecutive days. How should this request be framed as an ML task?","options":["Binary classification: predict whether a customer stops recharging in the next 60 days","Clustering: group customers by usage and treat the smallest cluster as the future churners","Regression: predict each customer's total recharge amount over the next two years","Forecasting: predict the company's overall monthly churn rate for the coming year"],"answer":[0],"explain":"الطلب هو معرفة «من سيغادر» على مستوى كل عميل، ولدينا label تاريخي واضح (توقف عن الشحن 60 يوماً)، فهذه مسألة binary classification بأفق تنبؤ محدد. أما الـ clustering فلا يستخدم الـ label المتوفر ولا يضمن أن أصغر مجموعة هي المغادرون، والتنبؤ بمعدل الـ churn الإجمالي لا يحدد العملاء الذين يجب إرسال العرض لهم."},{"id":"mlops-002","domain":"mlops","level":"assistant","tags":["problem-framing","forecasting"],"stem":"A supermarket chain in Jeddah wants to know how many units of each dairy product to order per store for next week, using three years of daily sales history. Which ML formulation fits this request BEST?","options":["Multi-class classification of products into high, medium and low sellers","Regression / time-series forecasting of units sold per product and store","Clustering of the stores according to their historical sales patterns","Anomaly detection to find unusual daily sales values in the history"],"answer":[1],"explain":"المطلوب قيمة عددية مستقبلية (عدد الوحدات الأسبوع القادم) من بيانات مرتبة زمنياً، وهذه مسألة regression / time-series forecasting. تصنيف المنتجات إلى فئات «عالٍ/متوسط/منخفض» يضيّع الكمية المطلوبة لأمر الشراء، والـ clustering يصف المتاجر ولا يتنبأ بالطلب."},{"id":"mlops-003","domain":"mlops","level":"assistant","tags":["problem-framing","segmentation"],"stem":"A tourism events company has attendance and spending records for 200,000 visitors but no predefined customer categories. Marketing asks you to 'discover natural visitor groups' in order to design different packages. Which approach is MOST appropriate?","options":["Train a classifier that predicts each visitor's package from past spending","Fit a regression model that predicts the total spending of each visitor","Apply clustering to visitor features and profile the resulting groups","Build a recommender system that ranks upcoming events for each visitor"],"answer":[2],"explain":"لا توجد فئات معرّفة مسبقاً (لا يوجد label)، والهدف اكتشاف مجموعات طبيعية، وهذا تعريف الـ clustering ثم وصف كل مجموعة (profiling) لتصميم الباقات. الـ classifier يحتاج إلى label غير موجود أصلاً، والـ regression يجيب عن سؤال مختلف (كم سينفق الزائر) لا عن «ما هي الشرائح»."},{"id":"mlops-004","domain":"mlops","level":"associate","tags":["problem-framing","fraud","anomaly-detection"],"stem":"You are a data scientist at a fintech that launched a digital wallet three months ago. The wallet has processed 6 million transactions, of which only 40 have been confirmed as fraud by the operations team; nobody believes this is all the fraud that occurred. Fraud patterns are largely unknown and are expected to change as the product grows. The wallet supports QR payments, bill payments and peer-to-peer transfers, and the company plans to launch in two more cities next quarter. The risk team has three analysts who can manually review about 200 transactions per day, and they want a system that starts flagging suspicious transactions for review next month. Which initial formulation is MOST appropriate?","options":["A supervised deep neural network trained on the 40 confirmed fraud cases","Multi-class classification that predicts the specific fraud type per transaction","Regression that predicts the amount of money lost on each transaction","Unsupervised anomaly detection, saving reviewer decisions as future labels"],"answer":[3],"explain":"مع 40 حالة مؤكدة فقط من 6 ملايين عملية وأنماط احتيال غير معروفة، لا يكفي الـ label لتدريب نموذج supervised موثوق، لذا نبدأ بـ anomaly detection لترتيب العمليات المشبوهة ضمن طاقة المراجعة (200 يومياً) ونحفظ قرارات المراجعين لبناء labels لاحقاً. الشبكة العصبية على 40 حالة ستحفظها (overfitting) ولن تكتشف الأنماط الجديدة."},{"id":"mlops-005","domain":"mlops","level":"associate","tags":["problem-framing","ranking","recommendation"],"stem":"An e-commerce marketplace can show only 10 products on each user's home page out of a catalogue of 50,000. The goal is to increase clicks and purchases from that page. You have logs of which products were shown to each user, which were clicked and which were bought. Which problem formulation is MOST appropriate?","options":["A ranking problem: score user–product pairs and show the top 10 per user","A clustering problem: group products by category and show the largest cluster","A regression problem: forecast the total daily revenue of the home page","A binary classification problem: predict whether each user will visit tomorrow"],"answer":[0],"explain":"القرار الفعلي هو «أي 10 منتجات وبأي ترتيب لكل مستخدم»، وهذه مسألة ranking / recommendation تُبنى على تقدير احتمال النقر أو الشراء لكل زوج (مستخدم، منتج) وتُقيَّم بمقاييس مثل NDCG@10. التنبؤ بإجمالي الإيراد اليومي أو بزيارة المستخدم غداً لا يحدد ما الذي يُعرض، فلا يخدم القرار المطلوب."},{"id":"mlops-006","domain":"mlops","level":"assistant","tags":["ml-vs-rules","scoping"],"stem":"You work on a government e-services portal. A manager asks for 'a machine learning model' to detect building-permit applications that are incomplete. By regulation, an application is complete if and only if all five mandatory attachments are uploaded, and the list of attachments is fixed. The upload status of each attachment is stored in the database. What should you recommend?","options":["Train a classifier on past applications labelled complete or incomplete","Implement a deterministic rule or SQL check on the five attachment fields","Use anomaly detection to find applications that look unusual","Collect six more months of data before choosing which model to train"],"answer":[1],"explain":"القاعدة معروفة ومحددة نظاماً (خمسة مرفقات إلزامية) والبيانات مخزنة، فالحل الصحيح هو rule أو استعلام SQL دقيق 100% وقابل للتفسير وبلا تكلفة صيانة نموذج. تدريب classifier ليتعلم قاعدة معروفة مسبقاً يضيف تعقيداً وأخطاءً بلا فائدة؛ الـ ML يُستخدم عندما يصعب كتابة النمط كقواعد."},{"id":"mlops-007","domain":"mlops","level":"expert","tags":["label-definition","prediction-horizon","data-leakage"],"stem":"You are a data scientist at a retail bank with branches in Riyadh and Dammam. The retention team can contact at most 2,000 customers per month, and a retention offer takes about three weeks to prepare and deliver. The bank's logo was redesigned last year, and the mobile app has 1.2 million active users, most of them under 40. A colleague proposes labelling a customer as churned if the account was closed, building features from all activity up to the closure date, and predicting closure 'as early as possible'. In a quick test this setup gives an AUC of 0.99, and the colleague wants to present it to management this week. Which change to the problem definition is MOST important?","options":["Replace the label with a multi-class target that describes the reason for the account closure","Use only the final week of activity before closure, because it is the most predictive period","Build features only up to a cutoff date and predict closure in a later window","Keep the current definition and tune the threshold until exactly 2,000 customers are flagged"],"answer":[2],"explain":"استخدام النشاط حتى تاريخ الإغلاق يُدخل إشارات حدثت عملياً أثناء المغادرة (سحب الرصيد، إلغاء البطاقات)، وهذا data leakage يفسر AUC = 0.99، كما أن التنبؤ قبل الإغلاق بأيام لا يفيد لأن العرض يحتاج ثلاثة أسابيع. الصحيح تثبيت cutoff date وبناء الـ features قبله فقط والتنبؤ بالإغلاق في نافذة لاحقة تترك وقتاً للتدخل. ضبط الـ threshold لا يعالج الخلل في تعريف المسألة نفسه."},{"id":"mlops-008","domain":"mlops","level":"associate","tags":["success-criteria","business-kpi"],"stem":"A motor insurer receives about 10,000 claims per week, and its special investigation unit can examine only 300 of them. Management's goal is to maximize the fraudulent amount recovered by this unit. You are asked to propose the main success criterion for a claims-scoring model. Which criterion is BEST aligned with the business goal?","options":["Overall accuracy across all 10,000 weekly claims","ROC AUC measured on a class-balanced resample of claims","Log loss on the validation set of historical claims","Precision and recovered amount among the top 300 scored claims"],"answer":[3],"explain":"القيد التشغيلي هو فحص 300 مطالبة فقط أسبوعياً، فالقيمة تتحقق من جودة أعلى 300 في الترتيب: الـ precision@300 والمبلغ المسترد منها يرتبطان مباشرة بالـ KPI. الـ accuracy الإجمالية مضللة مع ندرة الاحتيال، والـ AUC على عينة متوازنة يقيس الترتيب عموماً وليس الأداء عند طاقة الفحص الفعلية."},{"id":"mlops-009","domain":"mlops","level":"associate","tags":["mvp","scoping"],"stem":"You join a logistics company in which dispatchers manually estimate delivery times. The CEO wants 'an AI platform' that predicts delivery times, optimizes routes, forecasts fleet maintenance and chats with customers. There is one data engineer, 18 months of clean historical delivery records, and no GPS stream yet (it is planned for next year). The company operates 340 vans and recently opened a warehouse in a new city. The operations director will fund a second phase only if something useful is in the dispatchers' hands within eight weeks. Dispatchers' own estimates are recorded in the same system as actual delivery times. What is the BEST way to scope the first release?","options":["Ship a delivery-time model on existing records and compare it with dispatcher estimates","Build the full platform architecture first so that all four use cases share one foundation","Start with route optimization, because it has the largest theoretical savings of the four ideas","Wait for the GPS stream so that the first model released is as accurate as it can be"],"answer":[0],"explain":"الـ MVP الجيد حالة استخدام واحدة ضيقة، بياناتها جاهزة، ولها baseline واضح للمقارنة (تقديرات الموزعين) ويمكن تسليمها خلال ثمانية أسابيع. بناء المنصة الكاملة أولاً أو انتظار بيانات الـ GPS يؤخر القيمة ويخالف شرط التمويل، وتحسين المسارات يعتمد على بيانات غير متوفرة بعد."},{"id":"mlops-010","domain":"mlops","level":"associate","tags":["feasibility","data-availability"],"stem":"A plant manager at a packaging manufacturer wants a model that predicts machine failure seven days ahead. The plant runs three production lines around the clock and typically has about 12 failures per year in total. Each unplanned stop costs roughly one shift of output. You review the available data sources below. What is the MAIN feasibility concern?","table":{"caption":"Available data sources","headers":["Source","History","Granularity","Notes"],"rows":[["Vibration sensors","3 years","1 reading/minute","Complete"],["Temperature sensors","3 years","1 reading/minute","2% gaps"],["Maintenance log","4 months","Free text","Failure dates not recorded earlier"],["Production schedule","5 years","Daily","Complete"]]},"options":["The temperature data have 2% gaps, so no model can be trained on them","Only about four months of failure labels exist, so positives are very few","Minute-level readings are too coarse for a seven-day prediction horizon","Five years of production schedule is too much history to process"],"answer":[1],"explain":"الـ label (تاريخ العطل) مسجل لأربعة أشهر فقط، ومع نحو 12 عطلاً سنوياً فهذا يعني قرابة 4 حالات موجبة، وهو غير كافٍ لتدريب نموذج supervised أو تقييمه. فجوات 2% في قراءات الحرارة مشكلة بسيطة تُعالج بالـ imputation، والقراءات كل دقيقة أدق بكثير مما يحتاجه أفق سبعة أيام."},{"id":"mlops-011","domain":"mlops","level":"assistant","tags":["stakeholder-communication"],"stem":"You built a model for a bank that predicts which SME clients are likely to need a credit line. You must present the results to the head of corporate sales, who has no statistics background and has given you ten minutes. Which TWO practices are MOST appropriate? (Select TWO)","options":["Translate performance into business terms, such as extra deals expected per 100 calls","Walk through the full hyperparameter grid and the score of every cross-validation fold","State clearly what the model cannot do and how uncertain its estimates are","Present only the single best metric and avoid mentioning any limitation","Explain the mathematics of gradient boosting so that the results are trusted"],"answer":[0,2],"explain":"المدير غير التقني يحتاج إلى أثر النموذج بلغة العمل (صفقات إضافية لكل 100 اتصال) وإلى معرفة حدود النموذج ودرجة عدم اليقين حتى يتخذ قراراً سليماً. عرض تفاصيل الـ hyperparameters أو رياضيات الـ gradient boosting لا يفيد قراره، وإخفاء القيود يضر بالثقة عند أول خطأ للنموذج."},{"id":"mlops-012","domain":"mlops","level":"associate","tags":["cost-benefit","business-value"],"stem":"A telecom operator plans a retention campaign based on a churn model. Every flagged customer is contacted and receives the offer, and the offer has no effect on customers who were not going to churn. Using the figures in the table, what is the expected net benefit of the campaign?","table":{"caption":"Campaign assumptions","headers":["Item","Value"],"rows":[["Customers flagged by the model","1,000"],["Precision of the flagged list","40%"],["Cost of the offer per contacted customer","SAR 50"],["Share of true churners retained by the offer","25%"],["Value of each retained customer","SAR 1,200"]]},"options":["SAR 120,000","SAR 430,000","SAR 100,000","SAR 70,000"],"answer":[3],"explain":"المغادرون الحقيقيون = 1,000 × 40% = 400، والمحتفَظ بهم = 400 × 25% = 100 عميل بقيمة 100 × 1,200 = 120,000 ريال. تكلفة العرض تُدفع لكل الـ 1,000 عميل = 50,000 ريال، فالصافي 70,000 ريال. الرقم 120,000 يتجاهل التكلفة كلياً، والرقم 100,000 يحسب التكلفة على المغادرين الحقيقيين فقط وهذا خطأ لأن الـ false positives يستلمون العرض أيضاً."},{"id":"mlops-013","domain":"mlops","level":"assistant","tags":["crisp-dm","business-understanding"],"stem":"An airline's head of customer experience tells you: 'Use our data to do something with AI about flight delays.' You have access to several operational databases. Following CRISP-DM, what should you do FIRST?","options":["Clarify the business objective and how success will be measured","Explore the databases and build a first delay-prediction model","Clean and merge all of the operational tables into one dataset","Benchmark several algorithms to see which handles the data best"],"answer":[0],"explain":"أول مرحلة في CRISP-DM هي Business Understanding: ما القرار الذي سيُتخذ بناءً على النموذج، ومن سيستخدمه، وكيف يُقاس النجاح. البدء باستكشاف البيانات أو بناء نموذج قبل تحديد الهدف قد ينتج نموذجاً دقيقاً يجيب عن سؤال لا يهم أحداً."},{"id":"mlops-014","domain":"mlops","level":"assistant","tags":["baseline","cost-benefit"],"stem":"An education platform wants to predict which students will fail a course. Before any complex modelling, a senior colleague asks you to build a simple baseline such as 'flag students scoring under 50% on the first quiz'. Why is this baseline valuable?","options":["It guarantees that the final model will not overfit the training data","It shows whether a complex model adds enough value to justify its cost","It removes the need to keep a held-out test set later in the project","It must exist before the data can be split into training and test sets"],"answer":[1],"explain":"الـ baseline البسيط يعطي نقطة مرجعية: إذا لم يتفوق النموذج المعقد عليه بفارق يبرر تكلفة البناء والتشغيل والصيانة فالقاعدة البسيطة تكفي. الـ baseline لا يمنع الـ overfitting ولا يغني عن الـ test set، بل يُقيَّم هو نفسه على الـ test set ذاته."},{"id":"mlops-015","domain":"mlops","level":"assistant","tags":["success-criteria","stakeholder-communication"],"stem":"At a payments company, fraud makes up about 0.5% of card transactions. The operations manager, who is sponsoring your fraud-detection project, writes in the project charter that the model 'must reach at least 95% accuracy'. The company processes about 4 million transactions per month. What is the BEST response?","options":["Accept the target, because 95% accuracy is already a demanding goal for a fraud detection model","Oversample the fraud cases until classes are balanced, then report accuracy on the balanced data","Show that always predicting 'no fraud' scores 99.5%, and agree on recall and false-alarm targets","Commit to 99% accuracy instead, since the transaction volume makes that level easily achievable"],"answer":[2],"explain":"مع نسبة احتيال 0.5% فإن نموذجاً يقول دائماً «لا احتيال» يحقق accuracy = 99.5% دون أن يكتشف أي حالة، فالـ accuracy هدف مضلل هنا. الأفضل شرح ذلك للمدير والاتفاق على أهداف مرتبطة بالعمل مثل الـ recall (نسبة الاحتيال المكتشف) ومعدل الإنذارات الكاذبة. قياس الـ accuracy على بيانات موزونة اصطناعياً لا يعكس الأداء الحقيقي في الإنتاج."},{"id":"mlops-016","domain":"mlops","level":"expert","tags":["label-definition","fairness","proxy-label"],"stem":"A hospital network wants to enrol high-need chronic patients in a care-management programme. 'Health need' is not recorded directly, so the team trains a model to predict next-year healthcare cost and enrols the top 5% of predicted spenders. The model has an R² of 0.71, was trained on 800,000 patients and is rescored every night. An audit finds that patients from low-income districts, who historically used fewer services for the same conditions because of access barriers, are enrolled far less often than equally sick patients from other districts. District is not an input feature. The programme has capacity for 9,000 patients and is funded for three years. What is the MOST likely root cause?","options":["The model is underfitting, and a more flexible algorithm would remove the gap","Nightly batch scoring relies on stale features for the low-income districts","The training set is too small to represent patients from low-income districts","Cost is a biased proxy for need, so the label itself encodes unequal access"],"answer":[3],"explain":"المشكلة في تعريف الـ target: التكلفة proxy متحيز للحاجة الصحية لأن من يواجهون عوائق في الوصول للخدمة ينفقون أقل رغم مرضهم، فالنموذج يتنبأ بالتكلفة بدقة ويرث هذا التحيز حتى دون وجود الحي كـ feature. نموذج أكثر مرونة سيتعلم الـ label المتحيز بشكل أفضل فقط، و800 ألف مريض حجم كافٍ، فالعلاج هو اختيار label أقرب للحاجة الفعلية (مثل مؤشرات الحالة المرضية)."},{"id":"mlops-017","domain":"mlops","level":"expert","tags":["cost-benefit","threshold-selection"],"stem":"A fintech manually reviews card transactions flagged by its fraud model. Each review costs SAR 10, and each fraud caught saves SAR 800 on average. The table shows last month's validation results at four score thresholds. Which threshold maximizes the expected net benefit (savings minus review cost)?","table":{"caption":"Validation results by threshold","headers":["Threshold","Transactions flagged","Frauds caught"],"rows":[["0.2","5,000","180"],["0.4","2,000","160"],["0.6","800","120"],["0.8","300","70"]]},"options":["0.4","0.2","0.6","0.8"],"answer":[0],"explain":"الصافي = الاحتيال المكتشف × 800 − العمليات المراجَعة × 10: عند 0.2 = 144,000 − 50,000 = 94,000، وعند 0.4 = 128,000 − 20,000 = 108,000، وعند 0.6 = 96,000 − 8,000 = 88,000، وعند 0.8 = 56,000 − 3,000 = 53,000، فالأفضل 0.4. العتبة 0.2 تعطي أعلى recall والعتبة 0.8 أعلى precision، لكن القرار يُبنى على القيمة المتوقعة وليس على مقياس واحد."},{"id":"mlops-018","domain":"mlops","level":"expert","tags":["offline-vs-online","ab-testing","business-kpi"],"stem":"An online retailer's new recommendation model improved offline NDCG@10 by 6% over the current model on last quarter's logged data. In a properly randomized two-week A/B test with an adequate sample size, revenue per session and click-through rate showed no significant difference between the models. The logged data were generated while the current model decided what users saw. The product manager asks whether to launch anyway because 'the offline numbers are clearly better'. The engineering team also mentions that the new model costs 30% more to serve, and the retailer is preparing for its annual sale season in two months. Both models were trained on the same features. What is the BEST conclusion?","options":["Launch, because the offline metric was computed on far more data than the two-week A/B test","Do not launch; the offline gain did not reach the business KPI, so revisit offline evaluation","Rerun the same A/B test repeatedly until the difference finally becomes statistically significant","Launch to half of the users permanently, so that both models keep generating training data"],"answer":[1],"explain":"الـ A/B test العشوائي هو المقياس الأقرب للحقيقة لأثر النموذج على الـ KPI، وقد أظهر عدم وجود فرق مع تكلفة خدمة أعلى بـ 30%، فلا مبرر للإطلاق. التحسن في الـ offline غالباً ناتج عن تحيز البيانات المسجلة التي ولّدها النموذج الحالي، فيجب مراجعة طريقة التقييم offline. تكرار الاختبار حتى تظهر دلالة إحصائية هو p-hacking ويرفع احتمال النتيجة الكاذبة."},{"id":"mlops-019","domain":"mlops","level":"associate","tags":["feasibility","data-availability"],"stem":"An agricultural company wants a model that predicts wheat yield per field from satellite images, so that managers can adjust irrigation and fertilizer plans during the season. The company farms about 1,200 fields across two regions. Before committing to a six-month project, which TWO feasibility checks are MOST important? (Select TWO)","options":["Whether historical yield records exist per field and can be matched to the images","Whether the newest deep learning architecture is supported by the team's framework","Whether the model can reach at least 99% accuracy in its very first iteration","Whether the inputs are available at prediction time, early enough to change decisions","Whether the office has a dedicated GPU workstation for every data scientist"],"answer":[0,3],"explain":"دراسة الجدوى تبدأ بسؤالين: هل يوجد label تاريخي (المحصول لكل حقل) يمكن ربطه بالصور، وهل ستتوفر المدخلات وقت التنبؤ مبكراً بما يكفي للتأثير في قرارات الري والتسميد. بدون أي منهما لا قيمة للمشروع مهما كانت الخوارزمية. أحدث architecture أو عدد الـ GPUs تفاصيل تنفيذية تُحل لاحقاً، واشتراط 99% من أول تجربة غير واقعي."},{"id":"mlops-020","domain":"mlops","level":"assistant","tags":["human-in-the-loop","responsible-ai"],"stem":"A hospital plans to use a model that flags chest X-rays as 'urgent' or 'routine'. Missing an urgent case could be fatal, and the model's sensitivity on local data is 94%. Which deployment design is MOST appropriate?","options":["Let the model close routine cases automatically to save the radiologists' time","Hide the model's output from the radiologists so their judgment is not influenced","Use the model to prioritize the reading queue while radiologists review every case","Postpone any deployment until the model reaches 100% sensitivity on a test set"],"answer":[2],"explain":"في القرارات عالية الخطورة يبقى الإنسان هو صاحب القرار (human-in-the-loop): النموذج يرتب قائمة القراءة ليصل الطبيب للحالات العاجلة أسرع، مع مراجعة كل الحالات. إغلاق الحالات «الروتينية» آلياً يعني أن 6% من الحالات العاجلة قد تفوت دون أن يراها أحد، وانتظار حساسية 100% هدف غير واقعي يحرم المرضى من فائدة الترتيب."},{"id":"mlops-021","domain":"mlops","level":"assistant","tags":["batch-inference","serving"],"stem":"A telecom company's retention team plans its call list every Monday morning using churn scores for all 3 million subscribers. Nobody looks at the scores between Mondays. Which inference pattern is MOST appropriate?","options":["A real-time REST endpoint called once per subscriber by the CRM system","A streaming pipeline that rescores each subscriber on every network event","On-device inference that runs inside the subscribers' mobile application","A scheduled weekly batch job that writes all scores to a database table"],"answer":[3],"explain":"الاستهلاك أسبوعي ولا توجد حاجة لاستجابة لحظية، فالـ batch inference المجدول هو الأبسط والأرخص: يحسب الدرجات لجميع المشتركين ويكتبها في جدول يقرؤه فريق الاحتفاظ. الـ endpoint اللحظي أو الـ streaming يضيفان تكلفة تشغيل وتعقيداً دون أي فائدة لأن أحداً لا يستخدم الدرجات بين الاثنين والآخر."},{"id":"mlops-022","domain":"mlops","level":"associate","tags":["online-inference","latency"],"stem":"A bank must approve or decline each card payment within 100 ms at the moment of authorization, using a fraud score. To keep the architecture simple, a colleague proposes scoring everything in a nightly batch job and looking the score up at payment time. What is the MAIN problem with this proposal?","options":["The transaction's own features do not exist until the moment it happens","Batch jobs are not able to run gradient boosting models at this scale","The nightly table of scores would require far too much storage space","Batch predictions are always less accurate than online predictions"],"answer":[0],"explain":"درجة الاحتيال تعتمد على خصائص العملية نفسها (المبلغ، التاجر، الموقع، الوقت) وهي لا توجد إلا لحظة حدوثها، فلا يمكن حسابها مسبقاً في batch ليلي؛ لذلك يلزم online inference ضمن حد 100 ms. الـ batch ليس أقل دقة بطبيعته ولا مشكلة في التخزين أو نوع النموذج، المشكلة هي توفر المدخلات وقت القرار."},{"id":"mlops-023","domain":"mlops","level":"associate","tags":["latency","model-selection","slo"],"stem":"An online travel-booking site must score every checkout for fraud risk inside the payment flow. The service-level objective is a p99 latency below 50 ms, and all candidates were benchmarked on the production hardware. The fraud team would like the highest AUC it can get. Based on the table, which model should you deploy?","table":{"caption":"Candidate models","headers":["Model","AUC","Mean latency (ms)","p99 latency (ms)"],"rows":[["Logistic regression","0.84","3","8"],["Gradient boosting","0.89","12","35"],["Deep ensemble","0.91","40","180"],["Stacked ensemble","0.92","95","420"]]},"options":["Logistic regression","Gradient boosting","Deep ensemble","Stacked ensemble"],"answer":[1],"explain":"الشرط هو p99 أقل من 50 ms، ويحققه فقط الـ Logistic regression (8) والـ Gradient boosting (35)، وأفضلهما في الـ AUC هو الـ Gradient boosting (0.89). الـ Deep ensemble مغرٍ لأن متوسط زمنه 40 ms، لكن الـ SLO معرّف على الـ p99 وهو 180 ms، أي أن نسبة ملحوظة من الطلبات ستتجاوز الحد."},{"id":"mlops-024","domain":"mlops","level":"expert","tags":["privacy","anonymization","re-identification"],"stem":"A hospital group plans to publish a patient-level research dataset openly. The team removed names and national ID numbers but kept full date of birth, postal code and gender next to each diagnosis. What is the MAIN risk?","options":["The file will be too large to publish because diagnoses are high-cardinality","Removing the names makes the dataset useless for any medical research","The remaining quasi-identifiers can be combined to re-identify patients","Gender is a protected attribute, so any model trained on the data is biased"],"answer":[2],"explain":"حذف المعرّفات المباشرة لا يكفي: تركيبة تاريخ الميلاد الكامل + الرمز البريدي + الجنس (quasi-identifiers) فريدة لمعظم الأفراد ويمكن ربطها بمصادر خارجية لإعادة تحديد هوية المريض وتشخيصه. المطلوب تعميم هذه الحقول (سنة الميلاد، منطقة أوسع) وتقييم خطر إعادة التعريف مثل k-anonymity قبل النشر. وجود الجنس في البيانات لا يعني تلقائياً أن النماذج متحيزة."},{"id":"mlops-025","domain":"mlops","level":"associate","tags":["serialization","pickle","security"],"stem":"You find a promising pre-trained model shared as a .pkl file on a public forum by an unknown author. A teammate wants to load it on a server that also holds database credentials. What is the MAIN risk?","options":["Pickle files lose numerical precision when they are loaded on another machine","The model file may turn out to be larger than the server's available memory","Pickled models cannot be used for batch predictions on large tables","Unpickling can execute arbitrary code that was embedded in the file"],"answer":[3],"explain":"صيغة pickle تسمح بتنفيذ كود Python عشوائي أثناء التحميل، فملف من مصدر مجهول قد يسرق بيانات الاعتماد أو يخترق الخادم بمجرد استدعاء load. لذلك لا تُحمَّل ملفات pickle/joblib إلا من مصادر موثوقة، أو تُستخدم صيغ لا تنفذ كوداً مثل ONNX. الـ pickle لا يفقد الدقة العددية، وحجم الملف مشكلة ثانوية مقارنة بالخطر الأمني."},{"id":"mlops-026","domain":"mlops","level":"associate","tags":["serialization","dependency-pinning","reproducibility"],"stem":"An energy company's load-forecasting model was trained six months ago with scikit-learn 1.2 and saved with joblib. The model feeds the day-ahead trading desk, runs in a Linux container, and had a validation MAPE of 3.4%. Last week the platform team rebuilt the serving image, which pulled the latest scikit-learn because the requirements file lists packages without versions. Since then, loading the model prints version-inconsistency warnings, and a few forecasts differ slightly from those produced by the old image for the same inputs. Nobody changed the model file, and the input data checks all pass. The trading desk asks for assurance that this will not happen again. What is the BEST long-term fix?","options":["Record the exact library versions with each model and build the serving image from them","Suppress the warnings in the service logs, because the forecasts changed only very slightly","Rename the file from .joblib to .pkl so that it loads with the Python standard library","Upgrade every package to the newest release in both training and serving once a week"],"answer":[0],"explain":"ملفات pickle/joblib مرتبطة بإصدار المكتبة التي أنشأتها، وscikit-learn لا يضمن التوافق بين الإصدارات، لذا يجب تثبيت الإصدارات (pinning) وتسجيلها مع كل نموذج وبناء صورة الخدمة منها، أو إعادة تدريب النموذج عند الترقية المقصودة. إخفاء التحذيرات يترك خطر تغيّر التنبؤات بصمت، وتغيير امتداد الملف لا يغير شيئاً في محتواه."},{"id":"mlops-027","domain":"mlops","level":"associate","tags":["onnx","portability","serialization"],"stem":"A manufacturing firm trains a defect classifier in Python with PyTorch. The factory's inspection stations run a C++ application on small industrial PCs, and installing a Python stack on them is not allowed. The stations have no reliable network connection to the data centre. Which approach is MOST appropriate for deploying the
