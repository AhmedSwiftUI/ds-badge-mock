sion-controlled script that logs row counts","Fix obvious errors by hand directly in the raw spreadsheet"],"answer":[1,3],"explain":"قابلية التدقيق تتطلب بقاء البيانات الخام كما هي دون تعديل، وتنفيذ كل خطوات التنظيف في سكربت تحت version control يسجّل عدد الصفوف قبل كل خطوة وبعدها، فيمكن إعادة إنتاج النتيجة نفسها في أي وقت. التعديل اليدوي في الملف الخام لا يترك أثراً ولا يمكن تكراره، والاحتفاظ بالملف النهائي فقط يقطع سلسلة الاشتقاق من الأصل."},{"id":"eda1-055","domain":"eda","level":"expert","tags":["log-transform","skewed-target","heteroscedasticity"],"stem":"A hospital group asks you to predict the total cost of an inpatient stay from diagnosis group, age, admission type and planned procedures. The finance team needs the predictions for budgeting and says errors matter in relative terms: being off by 2,000 SAR is serious for a 5,000 SAR stay but negligible for a 400,000 SAR stay. Costs are strongly right-skewed and span three orders of magnitude. Your first ordinary least squares model, fitted on 120,000 stays from five hospitals, shows residuals that fan out widely as the predicted cost increases, and a handful of very expensive transplant cases pull the fitted line upward. All the cases are valid and must remain in scope. The model must stay a linear regression so that coefficients can be explained. Which change would MOST improve the model?","options":["Apply min-max scaling to all of the input features","Remove the 10% most expensive stays from the training data","Model log(cost) and back-transform the predictions","Standardise the cost target to zero mean and unit variance"],"answer":[2],"explain":"الهدف ملتوٍ بشدة لليمين والبواقي تتسع مع القيمة المتوقعة (heteroscedasticity) والأخطاء تهمّ نسبياً، ونمذجة log(cost) تعالج الأمور الثلاثة معاً: تثبّت التباين وتقلّل هيمنة الحالات الباهظة وتجعل الخطأ نسبياً. الـ standardization للهدف تحويل خطي لا يغيّر شكل التوزيع ولا نمط البواقي، وحذف أغلى 10% يخالف شرط بقاء كل الحالات ضمن النطاق."},{"id":"eda1-056","domain":"eda","level":"assistant","tags":["dtypes","describe","data-quality"],"stem":"At an electronics e-commerce company you call df.describe() on the orders table, which was exported from the shop's admin panel as a CSV. You get statistics for order_id and quantity only; price does not appear. The table shows the column types with one example value each. What is the MOST likely cause, and the fix?","table":{"caption":"Column types and example values","headers":["Column","dtype","Example"],"rows":[["order_id","int64","10233"],["price","object","'1,250 SAR'"],["quantity","int64","3"],["order_date","datetime64","2026-03-02"]]},"options":["price is treated as an identifier; describe() skips identifier columns by design","price is stored as text; strip the symbols and convert it to a numeric type","price has too many missing values; impute it before calling describe() again","price contains extreme outliers; winsorize it before calling describe() again"],"answer":[1],"explain":"العمود price نوعه object لأن قيمه نصوص تحتوي فاصلة الآلاف ورمز العملة مثل '1,250 SAR'، و describe() يعرض افتراضياً الأعمدة الرقمية فقط؛ الحل إزالة الرموز ثم التحويل إلى نوع رقمي. القيم المفقودة أو الـ outliers لا تمنع describe() من إظهار العمود، ولا توجد آلية تتعرف على أعمدة المعرّفات بدليل ظهور order_id نفسه."},{"id":"eda1-057","domain":"eda","level":"assistant","tags":["missing-data","dtypes","placeholders"],"stem":"You load a municipal building-permits dataset with pandas to analyse construction activity by district for the planning department. df.isnull().sum() reports zero missing values in 'building_area', yet the column has dtype object, and value_counts() shows entries such as '?', 'N/A' and '-' alongside the numbers. What is the MOST appropriate next step?","options":["Leave the column as text and treat each distinct entry as a category","Conclude that the column is complete, because isnull() found no gaps","Delete the column from the dataset, because its dtype is incorrect","Convert those placeholders to NaN, then cast the column to a numeric type"],"answer":[3],"explain":"الرموز مثل '?' و'N/A' هي قيم مفقودة مقنّعة على هيئة نص، ولذلك لم تكتشفها isnull() وتحوّل العمود إلى dtype object؛ الحل تحويلها إلى NaN ثم تحويل العمود إلى رقمي. الاكتفاء بنتيجة isnull() هو الخطأ الشائع لأنها لا تتعرف إلا على NaN الحقيقية، وحذف العمود يُضيّع بيانات سليمة يمكن إصلاحها بسهولة."},{"id":"eda1-058","domain":"eda","level":"assistant","tags":["sampling","big-data","eda"],"stem":"A retailer's 900-million-row sales file is sorted by region and then by date. To explore it quickly on a laptop, a colleague loads only the first 2 million rows with a row limit and starts drawing conclusions about national sales patterns and seasonality. What is the MAIN problem with this approach, and the better alternative?","options":["The first rows cover only one region; draw a random sample across the file","Sorted files lose precision in their values; re-sort by customer before loading","Two million rows are too few for any EDA; load at least half of the file","The first rows are the oldest records; load the last 2 million rows instead"],"answer":[0],"explain":"الملف مرتب حسب المنطقة، فأول مليوني صف تأتي من منطقة واحدة (وربما فترة محدودة) ولا تمثّل الأنماط الوطنية؛ العينة العشوائية من كامل الملف تمثّل كل المناطق والفترات. مليونا صف عدد كافٍ جداً للـ EDA إذا كانت العينة ممثِّلة، وأخذ آخر مليوني صف يكرر المشكلة نفسها مع منطقة أخرى."},{"id":"eda1-059","domain":"eda","level":"associate","tags":["inconsistent-units","data-quality"],"stem":"An agricultural cooperative merges harvest records from two regions. The 'yield' column shows a main cluster of values around 3–6 and a second cluster around 3,000–6,000, and the second cluster comes entirely from one region's files. Farm sizes and crops are similar in both regions. What is the MOST likely explanation and fix?","options":["The second region is far more productive; keep all the values as they are","One region reports tonnes and the other kilograms; convert to a common unit","The column is right-skewed; apply a log transform to bring the clusters together","The second cluster is a set of outliers; remove it using the 1.5 × IQR rule"],"answer":[1],"explain":"الفرق بين العنقودين عامل 1000 بالضبط ويأتي كله من ملفات منطقة واحدة مع تشابه المزارع، وهذا نمط نموذجي لاختلاف الوحدات (طن مقابل كيلوجرام)، فالحل توحيد الوحدة لا الحذف. معاملة العنقود الثاني كـ outliers تحذف بيانات منطقة كاملة وهي صحيحة، والـ log transform يخفي المشكلة ولا يصحّحها."},{"id":"eda1-060","domain":"eda","level":"expert","tags":["box-cox","yeo-johnson","power-transform"],"stem":"An energy trading desk wants to make the feature 'net_position' more Gaussian-like for a linear model. The variable is skewed and takes both negative and positive values, and the sign is meaningful. Which option is MOST appropriate?","options":["A Yeo-Johnson power transform, which accepts negative values","A plain log transform applied after dropping the negative rows","A Box-Cox power transform, which works for any real-valued input","A square-root transform applied directly to the raw values"],"answer":[0],"explain":"تحويل Yeo-Johnson صُمّم ليعمل مع القيم السالبة والموجبة والصفر، بينما Box-Cox يشترط أن تكون القيم كلها موجبة تماماً، فالعبارة التي تنسب إليه العمل مع أي قيم خاطئة. حذف الصفوف السالبة يُضيّع نصف المعنى لأن الإشارة مهمة، والجذر التربيعي غير معرَّف للقيم السالبة."},{"id":"eda1-061","domain":"eda","level":"associate","tags":["bimodal-distribution","segmentation","univariate-analysis"],"stem":"A logistics company asks you to summarise delivery times for a board presentation. The histogram of delivery time in days shows two clear peaks, one near 1 day and one near 4 days, with few deliveries in between. You have already verified that timestamps are in a single time zone, that the unit is days everywhere, and that there are no duplicated shipments. The dataset mixes same-city shipments handled by the company's own vans with inter-city shipments handed to partner carriers. A colleague proposes reporting the overall mean of about 2.5 days as the 'typical delivery time', and another proposes a log transform to 'fix' the shape. The board mainly wants to understand where service is slow. The company also plans to open a new warehouse next year. What is the MOST appropriate next step?","options":["Remove the smaller of the two peaks, treating it as a group of outliers","Report the overall mean of about 2.5 days as the typical delivery time","Split the analysis by shipment type and describe each distribution separately","Apply a log transform so that the two peaks merge into a single smooth peak"],"answer":[2],"explain":"التوزيع ثنائي القمة (bimodal) بعد التحقق من سلامة البيانات يدل على مجموعتين مختلفتين ممزوجتين: الشحن داخل المدينة والشحن بين المدن، فالتحليل الصحيح فصلهما ووصف كل منهما على حدة. المتوسط العام 2.5 يوم يقع في منطقة شبه خالية من الشحنات فلا يمثّل أياً من المجموعتين، والـ log transform لا يدمج قمتين ناتجتين عن عمليتين مختلفتين."},{"id":"eda1-062","domain":"eda","level":"expert","tags":["z-score","robust-statistics","masking"],"stem":"An aviation maintenance team screens engine vibration readings with the rule |z| > 3. A batch of 40 readings contains five extreme values caused by a loose sensor, yet none of them is flagged, because the extremes themselves inflate the mean and the standard deviation. Which alternatives are MORE robust for this screening? (Select TWO)","options":["A z-score computed after min-max scaling the readings","The 1.5 × IQR rule based on the quartiles","A z-score computed after centring the readings on zero","The same z-score rule with the threshold raised to 4","A modified z-score using the median and the MAD"],"answer":[1,4],"explain":"هذه ظاهرة الـ masking: القيم المتطرفة تضخّم الـ mean والـ standard deviation فتخفي نفسها عن قاعدة الـ z-score. الـ quartiles والـ median والـ MAD مقاييس مقاومة لا تتأثر بخمس قيم من أربعين، فتكشف القراءات الشاذة. أما min-max scaling أو التوسيط فهما تحويلان خطيان لا يغيّران قيم الـ z-score إطلاقاً، ورفع العتبة إلى 4 يزيد المشكلة سوءاً."},{"id":"eda1-063","domain":"eda","level":"associate","tags":["outliers","seasonality","keep-outliers"],"stem":"A public transport operator in the Makkah region asks you to forecast daily bus ridership for fleet planning. Three years of daily counts are available, together with weather, school-calendar and fuel-price data. An automated z-score check flags about ten days each year where ridership is roughly five times the normal level. These days fall in the Hajj season, the counts match the ticketing system, and operations staff confirm that extra buses ran at full capacity. The planning department specifically needs to know how many buses to lease for the next Hajj season. A junior analyst suggests that flagged days should be 'handled as outliers' so that the model fits normal days better, and also points out that fuel prices were unusually low last year. What should you do with the flagged days?","options":["Replace them with the average ridership of the same year","Cap them at three standard deviations above the mean","Keep them and label them as Hajj-season days in the dataset","Delete them so that the forecast reflects normal demand only"],"answer":[2],"explain":"هذه الأيام قيم حقيقية مؤكدة من نظام التذاكر وتمثّل نمطاً موسمياً متكرراً، وهي بالذات ما تحتاج إدارة التخطيط إلى التنبؤ به، فالصحيح إبقاؤها مع وسمها كأيام موسم الحج. حذفها أو استبدالها بالمتوسط أو تقليمها (capping) يجعل النموذج يقلّل تقدير الطلب في الموسم القادم فيفشل في الغرض الأساسي من التنبؤ."},{"id":"eda1-064","domain":"eda","level":"associate","tags":["sentinel-values","dates","histogram"],"stem":"You are profiling the customer table of an insurance company that started operating in 1995 and migrated to a new policy system in 2015. The chart shows the number of customers by decade of birth. Underwriting staff say they have never seen a policyholder older than 100. What is the MOST likely explanation for the first bar?","chart":{"type":"bar","title":"Customers by decade of birth","xLabel":"Decade of birth","yLabel":"Customers","x":["1900s","1940s","1950s","1960s","1970s","1980s","1990s","2000s"],"series":[{"name":"Customers","values":[5200,900,2100,4300,6800,8900,7600,3100]}]},"options":["Older customers were oversampled when the data extract was created","A default date such as 1900-01-01 was stored when the birth date was unknown","The bars are too wide to show the older customers' birth years correctly","The insurer has an unusually large group of customers aged over 115 years"],"answer":[1],"explain":"وجود أكثر من خمسة آلاف عميل من مواليد العقد الأول من القرن العشرين مع غياب تام لعقود 1910–1930 أمر غير معقول، والنمط المعروف هو أن النظام يخزّن تاريخاً افتراضياً مثل 1900-01-01 عند عدم توفر تاريخ الميلاد. هذه sentinel value يجب تحويلها إلى قيمة مفقودة، وتفسيرها كعملاء معمّرين يناقض ما يؤكده موظفو الاكتتاب."},{"id":"eda1-065","domain":"eda","level":"expert","tags":["missing-data","data-collection","root-cause"],"stem":"You are exploring the orders table of an e-commerce marketplace to study which marketing channels bring the most valuable customers. The 'referral_source' field is filled by the checkout page. The chart shows the percentage of orders with a missing referral_source for each month of this year. Order volume, average basket value and the mix of product categories were stable across the whole period, and the marketing team ran its usual campaigns. A teammate suggests imputing the blanks with the most frequent channel so the channel analysis can proceed today. The mobile app was redesigned at some point this year, but you do not know exactly when. What should you do FIRST?","chart":{"type":"line","title":"Orders with missing referral_source","xLabel":"Month","yLabel":"% missing","x":["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"],"series":[{"name":"% missing","values":[2.1,1.8,2.3,2.0,2.2,34.5,35.1,33.8]}]},"options":["Ask the engineers what changed in data collection around June","Remove the June–August orders so that the dataset is consistent","Impute all the blanks with the most frequent referral source","Fit a KNNImputer on January–May and apply it to later months"],"answer":[0],"explain":"القفزة المفاجئة من نحو 2% إلى نحو 35% في يونيو مع ثبات بقية المؤشرات تدل على تغيير في نظام جمع البيانات (غالباً إعادة تصميم التطبيق) وليس على سلوك العملاء، فيجب معرفة السبب الجذري أولاً وربما استرجاع البيانات من المصدر. التعويض بالقناة الأكثر تكراراً سيضخّم تلك القناة بشكل مصطنع في ثلث الطلبات الأخيرة ويُفسد تحليل القنوات."},{"id":"eda1-066","domain":"eda","level":"assistant","tags":["missing-data","mcar","deletion"],"stem":"You are a data scientist at a logistics company analysing fleet telematics to study driving behaviour on intercity routes. About 1% of GPS speed readings are missing because of random network dropouts that are unrelated to the vehicle, the route or the speed itself. The dataset has 4 million rows and no other quality problems. Which handling is MOST appropriate?","options":["Drop the whole speed column, since it cannot be fully trusted any more","Replace the missing readings with the maximum speed seen in the data","Drop the rows with a missing speed, since the loss is tiny and random","Replace the missing readings with 0 so that no rows are lost"],"answer":[2],"explain":"الفقد هنا من نوع MCAR (عشوائي تماماً ولا يرتبط بأي متغير) ونسبته 1% فقط من 4 ملايين صف، فحذف الصفوف لا يُدخل تحيزاً ولا يُفقدنا قوة إحصائية تُذكر. أما التعويض بالقيمة 0 فيُدخل سرعات وهمية تشوّه التوزيع والمتوسط، وحذف العمود كاملاً يضيّع 99% من بيانات سليمة."},{"id":"eda1-067","domain":"eda","level":"assistant","tags":["describe","skewness","outliers"],"stem":"You join an online grocery retailer as its first data scientist and run describe() on the order values, shown in the table. The retailer serves both households and a few restaurants that buy in bulk. Nobody on the team has examined this column before. What does the output suggest, and what is the MOST appropriate next step?","table":{"caption":"describe() for order_value_sar","headers":["Statistic","order_value_sar"],"rows":[["count","52,000"],["mean","310"],["std","1,950"],["min","5"],["25%","60"],["50%","95"],["75%","170"],["max","148,000"]]},"options":["Roughly symmetric values; proceed to modelling without further checks","Right-skewed with extreme highs; plot it and inspect the largest orders","Left-skewed with extreme lows; drop the orders below the 25th percentile","Many missing values are present; fill the gaps in the column with the mean"],"answer":[1],"explain":"الـ mean (310) أكبر بكثير من الـ median (95)، والـ max (148,000) بعيد جداً عن الـ 75th percentile (170)، والـ std ضخم؛ كلها علامات على التواء لليمين مع قيم عليا متطرفة، والخطوة التالية رسم التوزيع وفحص أكبر الطلبات لمعرفة هل هي أخطاء أم طلبات جملة حقيقية. لا يوجد في الجدول ما يدل على قيم مفقودة، والتوزيع بعيد كل البعد عن التماثل."},{"id":"eda1-068","domain":"eda","level":"assistant","tags":["iqr","calculation","outliers"],"stem":"A food-delivery operations analyst in Riyadh reports that delivery times have Q1 = 24 minutes and Q3 = 36 minutes. Using the 1.5 × IQR rule, how many of the deliveries in the table are flagged as outliers?","table":{"caption":"Sample of deliveries","headers":["Delivery","Time (minutes)"],"rows":[["D1","8"],["D2","52"],["D3","55"],["D4","30"],["D5","5"],["D6","47"]]},"options":["4","2","3","1"],"answer":[1],"explain":"الـ IQR = 36 − 24 = 12، فالحد الأدنى = 24 − 18 = 6 دقائق والحد الأعلى = 36 + 18 = 54 دقيقة. القيم خارج الحدود هي 55 (أعلى من 54) و5 (أقل من 6) فقط، أي توصيلتان. القيمتان 52 و8 قريبتان من الحدود لكنهما داخلها، ومن يعدّهما يقع في خطأ حساب الحدود."},{"id":"eda1-069","domain":"eda","level":"associate","tags":["duplicates","domain-knowledge"],"stem":"A coffee chain with 60 stores sends you a point-of-sale extract for a basket analysis. The extract has store, date, product, size and amount, but the vendor did not include a transaction ID or a time of day. You find 3,100 groups of rows that are identical on every column, mostly popular drinks in busy stores. A colleague wants to call drop_duplicates() 'as standard hygiene'. Store managers tell you that a busy store sells the same drink at the same price dozens of times a day, and the daily totals in the extract match the finance ledger to within 0.1%. The vendor can re-export the data with transaction IDs, but it would take two weeks. The loyalty programme data is stored elsewhere and is not part of this task. What is the BEST decision?","options":["Drop them only in the busiest stores, where repeats are most common","Drop them, because fully identical rows are always ingestion errors","Drop them, because repeated rows bias any model towards popular items","Keep the rows, since they are consistent with genuine repeated sales"],"answer":[3],"explain":"غياب transaction ID يجعل عمليات البيع المتكررة الحقيقية تبدو صفوفاً متطابقة، ومطابقة الإجماليات اليومية لدفتر المالية بفارق 0.1% دليل قوي على أنها مبيعات حقيقية لا أخطاء إدخال. حذفها بـ drop_duplicates() كإجراء روتيني سيُسقط مبيعات فعلية ويقلّل حجم مبيعات المنتجات الرائجة بالذات، وليست كل الصفوف المتطابقة أخطاء."},{"id":"eda1-070","domain":"eda","level":"expert","tags":["mnar","survey-bias"],"stem":"A telecom operator emails a satisfaction survey to 2 million subscribers and 12% respond. Management wants the average satisfaction score of ALL subscribers for the annual report, and the marketing director has already drafted a press release quoting the respondents' average of 8.1 out of 10. An analyst proposes imputing scores for non-respondents with KNN using demographics and usage. However, a small follow-up phone study of 600 non-respondents found that, even among customers with the same demographics and usage, non-respondents scored about two points lower than respondents. The survey tool, the email template and the response window were the same for everyone. Which statement about this situation is correct?","options":["Dropping non-respondents is unbiased, because no artificial values are introduced","KNN imputation removes the bias, because each blank is filled from similar customers","With 240,000 responses the sample is so large that non-response bias is negligible","Missingness depends on the score itself, so imputing from respondents stays biased"],"answer":[3],"explain":"الدراسة الهاتفية تُظهر أن غير المستجيبين أقل رضاً حتى عند تساوي الخصائص المُشاهَدة، أي أن الفقد MNAR ويعتمد على الدرجة نفسها، فأي تعويض مبني على إجابات المستجيبين (ومنه KNN) يبقى متحيزاً نحو الأعلى. كِبَر العينة لا يعالج التحيز بل يجعل التقدير المتحيز أكثر دقة ظاهرياً فقط، والحل يتطلب بيانات متابعة أو تحليل حساسية."},{"id":"eda2-001","domain":"eda","level":"assistant","tags":["one-hot-encoding","linear-models"],"stem":"You are building a logistic regression model to predict loan default for a bank. The feature 'branch_city' has six unordered values such as Riyadh, Jeddah and Dammam. Which encoding is MOST appropriate for this feature?","options":["One-hot encode the city into binary indicator columns","Hash the city names into one numeric column and scale it","Assign each city a random integer code and standardize it","Map the cities to the integers 1 to 6 in alphabetical order"],"answer":[0],"explain":"المدينة متغير اسمي (nominal) بلا ترتيب، والـ logistic regression يفسّر الأرقام على أنها مقادير، لذلك الـ one-hot encoding هو الأنسب لأنه يعطي كل مدينة معاملاً مستقلاً. ترميز المدن بأرقام من 1 إلى 6 أبجدياً يفرض ترتيباً ومسافات وهمية بين المدن فيتعلم النموذج علاقة خطية لا وجود لها."},{"id":"eda2-002","domain":"eda","level":"assistant","tags":["ordinal-encoding","tree-models"],"stem":"You work at an e-learning company and are training a gradient boosting model to predict course completion. One feature is the learner's self-reported skill level with the values Beginner, Intermediate, Advanced and Expert. The team wants the model to be able to split on conditions such as 'at least Advanced' using a single column. Which encoding BEST fits this feature?","options":["Ordinal encoding with the order Beginner, Intermediate, Advanced, Expert","One-hot encoding of the feature into four separate binary indicator columns","Hashing of the four level names into a single numeric hash bucket value","Ordinal encoding that uses the encoder's default alphabetical category order"],"answer":[0],"explain":"المتغير ترتيبي (ordinal) والنموذج شجري، فالـ ordinal encoding بترتيب صريح يحفظ معنى الترتيب ويسمح بتقسيم واحد مثل 'المستوى >= Advanced' في عمود واحد. الاعتماد على الترتيب الأبجدي الافتراضي يضع Advanced قبل Beginner فيفسد الترتيب، والـ one-hot encoding يفقد معلومة الترتيب ويحتاج عدة تقسيمات للتعبير عن الشرط نفسه."},{"id":"eda2-003","domain":"eda","level":"assistant","tags":["ordinal-encoding","category-order"],"stem":"A hospital analyst encodes triage priority with an ordinal encoder using default settings and feeds the result to a linear model that predicts emergency-department waiting time. The coefficient of the encoded feature looks meaningless, so the analyst inspects the mapping learned by the encoder, shown below. What is the MOST likely cause of the problem?","table":{"caption":"Mapping learned by the encoder","headers":["Triage priority","Encoded value"],"rows":[["High","0"],["Low","1"],["Medium","2"]]},"options":["The encoder was fitted on the test set instead of on the training set","The linear model needs the feature standardized before it is encoded","Categories were sorted alphabetically because no explicit order was given","The encoder ranked the categories by their frequency in the training data"],"answer":[2],"explain":"الجدول يُظهر ترتيب High=0 ثم Low=1 ثم Medium=2 وهو ترتيب أبجدي، لأن الـ OrdinalEncoder يرتب الفئات أبجدياً ما لم تُمرَّر له قائمة الترتيب الصحيحة (Low ثم Medium ثم High). تفسير الترتيب بحسب التكرار مغرٍ لكنه ليس سلوك المرمِّز الافتراضي، كما أن الترتيب الظاهر يطابق الأبجدية تماماً."},{"id":"eda2-004","domain":"eda","level":"assistant","tags":["one-hot-encoding","dummy-variable-trap"],"stem":"An insurer's analyst will one-hot encode the categorical features below for an unregularized linear regression with an intercept, dropping the first level of each feature to avoid perfect collinearity. How many encoded columns will these four features produce in total?","table":{"caption":"Categorical features","headers":["Feature","Distinct categories"],"rows":[["vehicle_type","5"],["region","4"],["fuel_type","3"],["payment_plan","2"]]},"options":["4","10","13","14"],"answer":[1],"explain":"مع حذف المستوى الأول ينتج كل متغير (k - 1) عموداً: 4 + 3 + 2 + 1 = 10 أعمدة. الرقم 14 هو مجموع الفئات دون حذف أي مستوى، وهو ما يوقع في الـ dummy variable trap مع وجود الـ intercept في نموذج خطي غير منتظم (unregularized)."},{"id":"eda2-005","domain":"eda","level":"associate","tags":["target-encoding","data-leakage"],"stem":"You are a data scientist at a telecom operator building a churn model. The customer table has 180,000 rows, a 12% churn rate, and a 'dealer_code' feature with about 2,300 distinct values. A colleague replaced each dealer code with the mean churn rate of that dealer, computed on the full dataset, and then split the data 80/20 into training and test sets. The marketing team also asked for a monthly report by region, which is unrelated to this model. The test AUC rose from 0.78 to 0.91, but a pilot on new customers performed close to the old model. What BEST explains the gap between the test result and the pilot?","options":["The 12% churn rate makes AUC an unusable metric for this kind of model","The encoding used test-row labels, so the test features leaked the target","Dealer codes are nominal, so a mean-based encoding is never valid for them","The 80/20 split left too few test rows to estimate the AUC reliably"],"answer":[1],"explain":"حساب الـ target encoding على كامل البيانات قبل التقسيم يعني أن قيمة الميزة لكل صف في الـ test تحتوي على الـ label الخاص به، وهذا data leakage يضخّم الـ AUC ولا يتكرر مع عملاء جدد. حجم الـ test (نحو 36,000 صف) كافٍ جداً لتقدير الـ AUC، فليس هو السبب. الحل هو حساب الترميز من بيانات التدريب فقط ويفضَّل بطريقة out-of-fold."},{"id":"eda2-006","domain":"eda","level":"associate","tags":["target-encoding","smoothing"],"stem":"A fintech team target-encodes 'merchant_category' for a fraud model. Some categories have very few rows, so their raw fraud rates are noisy, and the team uses the smoothed formula: encoded = (n × category_mean + m × global_mean) / (n + m), with m = 30 and a global fraud rate of 0.10. Using the training statistics below, what is the encoded value for 'Jewelry'?","table":{"caption":"Training statistics per category","headers":["Category","Rows (n)","Fraud rate"],"rows":[["Grocery","5000","0.08"],["Jewelry","20","0.50"],["Travel","600","0.15"]]},"options":["0.10","0.50","0.26","0.30"],"answer":[2],"explain":"القيمة = (20 × 0.50 + 30 × 0.10) / (20 + 30) = (10 + 3) / 50 = 0.26. الـ smoothing يسحب متوسط الفئات قليلة الصفوف نحو المتوسط العام حتى لا نثق بمعدل 0.50 المبني على 20 صفاً فقط. القيمة 0.30 هي المتوسط البسيط بين 0.50 و0.10 وتتجاهل الأوزان n وm."},{"id":"eda2-007","domain":"eda","level":"assistant","tags":["rare-categories","one-hot-encoding"],"stem":"You are preparing a 'device_model' feature for a logistic regression that predicts app uninstalls at a mobile games company. The training set has 50,000 rows. The chart shows row counts for the five most common values; the last bar is the combined total of 400 other models, each appearing fewer than 20 times. What is the MOST appropriate way to prepare this feature?","chart":{"type":"bar","title":"Training rows per device model","xLabel":"Device model","yLabel":"Rows","x":["Model A","Model B","Model C","Model D","Model E","400 others"],"series":[{"name":"Rows","values":[18000,14000,9000,4500,2500,2000]}]},"options":["Delete the rows that belong to infrequent models, then one-hot encode","Rank the 405 models by frequency and use the rank as a single number","One-hot encode all 405 models separately so that no information is lost","Merge the infrequent models into one 'Other' level, then one-hot encode"],"answer":[3],"explain":"الفئات النادرة (أقل من 20 صفاً لكل منها) لا تكفي لتقدير معامل موثوق، ودمجها في فئة 'Other' يقلل الأبعاد والـ overfitting مع الاحتفاظ بالفئات الخمس الكبيرة. ترميز الـ 405 فئات كلها بـ one-hot يضيف مئات الأعمدة شبه الفارغة، وحذف الصفوف يضيّع 2,000 مثال ويترك النموذج بلا تصرف عند ظهور هذه الأجهزة في الإنتاج."},{"id":"eda2-008","domain":"eda","level":"associate","tags":["unseen-categories","inference"],"stem":"An e-commerce company's conversion model one-hot encodes 'traffic_source'. After launch, the scoring service crashes whenever a source appears that was not in the training data, and new sources show up every few weeks. Retraining happens monthly and the model expects a fixed set of input columns. Which TWO measures would make the pipeline robust to such values? (Select TWO)","options":["Map values not seen in training to the 'Other' bucket used for rare categories","Refit the encoder on each incoming scoring batch so new columns are created","Reject every request with a new source until the next monthly retraining","Configure the encoder to ignore unknown categories, giving all-zero indicators","Give each new source the next unused integer code and pass it to the model"],"answer":[0,3],"explain":"النموذج يتوقع أعمدة ثابتة، لذا الحل إما ضبط الـ OneHotEncoder على تجاهل الفئات غير المعروفة (handle_unknown='ignore') فتصبح كل المؤشرات أصفاراً، أو توجيه القيم الجديدة إلى فئة 'Other' التي تدرّب عليها النموذج. إعادة fit للمرمِّز على كل دفعة في الإنتاج يغيّر عدد الأعمدة ومعانيها فلا تعود متوافقة مع النموذج المدرَّب."},{"id":"eda2-009","domain":"eda","level":"assistant","tags":["dummy-variable-trap","linear-regression"],"stem":"An energy analyst fits an ordinary least squares model with an intercept and one-hot encodes 'tariff_type' into all four indicator columns. The software warns that the design matrix is singular. What is the MOST appropriate fix?","options":["Drop one of the four indicator columns to act as the baseline","Add a fifth indicator column for an 'unknown' tariff type","Replace the indicators with integer codes 1 to 4 in one column","Standardize the four indicator columns before fitting the model"],"answer":[0],"explain":"مجموع الأعمدة الأربعة يساوي 1 دائماً وهو مطابق لعمود الـ intercept، وهذا هو الـ dummy variable trap الذي يجعل المصفوفة singular؛ حذف عمود واحد يجعله الفئة المرجعية ويحل المشكلة. استبدال المؤشرات بأرقام 1 إلى 4 يزيل التفرد لكنه يفرض ترتيباً ومسافات غير حقيقية بين أنواع التعرفة."},{"id":"eda2-010","domain":"eda","level":"associate","tags":["high-cardinality","frequency-encoding","tree-models"],"stem":"You are a data scientist at a logistics firm that delivers parcels across the Gulf region. The team trains a random forest to predict delivery delay in hours from 1.2 million historical shipments. Features include parcel weight, carrier, pickup hour and 'destination_postcode', which has 3,800 distinct values. A junior colleague one-hot encoded the postcode, creating a very wide sparse matrix; training time rose from 10 minutes to 3 hours, and the individual postcode columns are rarely chosen for splits. The training server has limited memory and is shared with the routing team. Team policy also forbids using the target variable inside preprocessing steps, to keep audits simple. Which alternative is MOST suitable for this tree-based model?","options":["Replace each postcode with its frequency count in the training data","Keep the one-hot columns and standardize them to unit variance","Replace each postcode with the mean delivery delay of that postcode","Keep the one-hot columns and add pairwise products between them"],"answer":[0],"explain":"الـ frequency (count) encoding يحوّل المتغير عالي الـ cardinality إلى عمود رقمي واحد تستطيع الأشجار التقسيم عليه، ولا يستخدم الـ target فيلتزم بسياسة الفريق ويوفر الذاكرة. استبدال الرمز البريدي بمتوسط التأخير هو target encoding وهو ممنوع هنا صراحةً، أما توحيد مقياس أعمدة الـ one-hot فلا يفيد الأشجار ولا يحل مشكلة العرض."},{"id":"eda2-011","domain":"eda","level":"expert","tags":["feature-hashing","high-cardinality","streaming"],"stem":"You are the lead data scientist at an ad-tech company building a click-through model with online logistic regression. The 'ad_id' and 'site_domain' features together have tens of millions of distinct values, and thousands of new values appear every day. The model is updated continuously from a stream, the serving containers have a fixed 2 GB memory limit, and maintaining a growing category-to-column dictionary across 40 servers has caused synchronization failures twice this quarter. The current model reaches a log loss of 0.410, and the product team would accept anything up to 0.415. The dashboards team separately needs daily click counts per campaign, which come from another system. Which encoding approach is MOST appropriate for these features?","options":["Feature hashing into a fixed number of columns, accepting some collisions","One-hot encoding with a dictionary that is rebuilt on every server nightly","Ordinal encoding that assigns the next free integer to each new value","Target encoding recomputed from the full click history before each update"],"answer":[0],"explain":"الـ feature hashing (hashing trick) يحوّل أي قيمة، حتى الجديدة، إلى عدد ثابت من الأعمدة دون قاموس، فيناسب حد الذاكرة والتحديث المستمر ويلغي مشكلة مزامنة القاموس بين الخوادم مقابل خسارة بسيطة بسبب الـ collisions وهي مقبولة هنا. الـ one-hot encoding بقاموس يُعاد بناؤه كل ليلة يُبقي مشكلتي نمو الذاكرة والمزامنة كما هما ولا يتعامل مع القيم التي تظهر خلال اليوم."},{"id":"eda2-012","domain":"eda","level":"associate","tags":["high-cardinality","target-encoding","rare-categories"],"stem":"A bank is building a regularized logistic regression for credit approval, and the regulator expects a linear, scorecard-style model. The 'employer_name' feature has about 15,000 distinct values in 200,000 training rows, and most employers appear fewer than 10 times. A separate test set is held out for the final evaluation. Which TWO approaches are reasonable ways to use this feature in the model? (Select TWO)","options":["Grouping infrequent employers into 'Other' before one-hot encoding","Out-of-fold target encoding with smoothing toward the global mean","Alphabetical integer codes passed to the model as one numeric column","Alphabetical integer codes followed by standardization of that column","Target encoding computed once on all rows, including the test rows"],"answer":[0,1],"explain":"مع 15,000 فئة أغلبها نادر، الخياران المعقولان هما الـ target encoding بطريقة out-of-fold مع smoothing (يمنع تسرب الـ label ويثبّت الفئات الصغيرة)، أو دمج الفئات النادرة في 'Other' ثم one-hot. الترميز بأرقام أبجدية، حتى بعد الـ standardization، يفرض على النموذج الخطي ترتيباً لا معنى له، وحساب الـ target encoding على كل الصفوف بما فيها الـ test هو data leakage."},{"id":"eda2-013","domain":"eda","level":"expert","tags":["target-encoding","overfitting","identifier-features"],"stem":"You are reviewing a colleague's work at a subscription video service. The goal is to predict whether a viewing session is followed by a cancellation within 7 days. The training data has 900,000 sessions from 610,000 users, so most users appear once or twice. Sessions come from smart TVs, phones and web browsers, and device type is already a feature. Your colleague added a target-encoded 'user_id' feature, computed on the training set only, without smoothing. Training AUC jumped from 0.81 to 0.99 while validation AUC fell from 0.79 to 0.71. The model is a gradient boosting classifier with default settings, and the validation users are mostly different from the training users. What is the MOST likely cause of this pattern?","options":["The validation set was used to compute the encoding, which leaked its labels","Gradient boosting with default settings cannot use continuous encoded features","Each user's encoding is almost their own label, so the model memorized it","The encoding was not standardized, so its scale dominated the other features"],"answer":[2],"explain":"حين يظهر المستخدم مرة أو مرتين فقط، يصبح متوسط الـ target لذلك المستخدم مساوياً تقريباً للـ label نفسه، فيحفظه النموذج (AUC تدريب 0.99) ولا يعمم على مستخدمين جدد لا يملكون ترميزاً مفيداً. تفسير تسرب بيانات الـ validation مغرٍ لكنه مستبعد لأن الترميز حُسب من التدريب فقط، ولو حدث لارتفع AUC الـ validation بدل أن ينخفض."},{"id":"eda2-014","domain":"eda","level":"assistant","tags":["feature-scaling","algorithm-requirements"],"stem":"You are preparing customer features with very different units (age in years, annual income in riyals, number of products held) for several candidate models at a bank. For which TWO of the following models is feature scaling generally important? (Select TWO)","options":["Random forest classifier","k-nearest neighbours using Euclidean distance","Support vector machine with an RBF kernel","A single decision tree of depth 6","Gradient-boosted decision trees"],"answer":[1,2],"explain":"الـ KNN والـ SVM بنواة RBF يعتمدان على المسافات بين النقاط، فالميزة ذات المدى الكبير مثل الدخل بالريال ستهيمن على الحساب ما لم تُوحَّد المقاييس. النماذج الشجرية (decision tree وrandom forest وgradient boosting) تقسّم على عتبات لكل ميزة على حدة، فلا يتأثر أداؤها بتغيير مقياس الميزات."},{"id":"eda2-015","domain":"eda","level":"assistant","tags":["robust-scaler","feature-scaling"],"stem":"A real-estate platform is scaling 'listing_price' for a distance-based model that recommends similar homes to buyers in three cities. A few genuine luxury listings are hundreds of times more expensive than typical homes and must stay in the data. With min-max scaling, almost all listings end up between 0 and 0.01. Which scaler is MOST appropriate?","options":["RobustScaler, which centers on the median and scales by the IQR","MinMaxScaler with the output range changed to run from -1 to 1","MaxAbsScaler, which divides each value by the maximum absolute value","StandardScaler, because the mean and standard deviation ignore extremes"],"answer":[0],"explain":"الـ RobustScaler يستخدم الـ median والـ IQR، وهما لا يتأثران بالقيم المتطرفة، فتبقى العقارات العادية موزعة على مدى مفيد. الـ StandardScaler خيار مغرٍ لكنه غير صحيح هنا لأن الـ mean والـ standard deviation يتأثران بشدة بالقيم المتطرفة، وتغيير مدى الـ MinMaxScaler أو استخدام MaxAbsScaler يُبقي المشكلة نفسها لاعتمادهما على القيمة القصوى."},{"id":"eda2-016","domain":"eda","level":"associate","tags":["min-max-scaling","inference"],"stem":"A manufacturing team monitors machines with sensors that report vibration and temperature every minute. They fit a MinMaxScaler (default settings, output range 0 to 1) on training data and apply it in production. Using the training statistics below, a new reading of vibration = 145 arrives at inference. What value does the fitted scaler output, and what is the correct interpretation?","table":{"caption":"Statistics learned from the training data","headers":["Feature","Training min","Training max"],"rows":[["vibration","20","120"],["temperature","40","90"]]},"options":["1.45; the scaler divides each new reading by the training range of 100","1.25; the scaler should now be refitted on the production readings","1.00; the scaler always clips values above the training maximum to 1","1.25; values outside 0 to 1 occur when data exceed the training range"],"answer":[3],"explain":"الناتج = (145 - 20) / (120 - 20) = 1.25، فالـ MinMaxScaler يطبّق الـ min والـ max المحفوظين من التدريب ولا يقص القيم افتراضياً، وخروج القيمة عن [0, 1] يعني فقط أن القراءة تجاوزت مدى التدريب. إعادة fit للـ scaler على بيانات الإنتاج خطأ لأنها تغيّر معنى الميزة مقارنةً بما تدرّب عليه النموذج."},{"id":"eda2-017","domain":"eda","level":"assistant","tags":["standardization","z-score"],"stem":"A StandardScaler fitted on a retailer's training data learned a mean basket value of 50 riyals and a standard deviation of 10 riyals. What scaled value does it produce for a new basket worth 75 riyals?","options":["0.75","1.5","2.5","7.5"],"answer":[2],"explain":"الـ z-score = (75 - 50) / 10 = 2.5، أي أن السلة أعلى من المتوسط بانحرافين معياريين ونصف. القيمة 7.5 تنتج عن قسمة 75 على 10 دون طرح الـ mean أولاً، والقيمة 1.5 تنتج عن قسمة 75 على الـ mean."},{"id":"eda2-018","domain":"eda","level":"assistant","tags":["data-leakage","train-test-split"],"stem":"A junior analyst at a health insurer standardizes all numeric features using the mean and standard deviation of the complete dataset, then splits the data into training and test sets and reports test accuracy. What is the MAIN problem with this workflow?","options":["Standardization must be applied after model training rather than before it","Splitting after scaling changes the class balance of the training set","Test data influenced the scaler, so the evaluation is no longer clean","The test set should be standardized with its own mean and standard deviation"],"answer":[2],"explain":"حساب الـ mean والـ standard deviation من كامل البيانات يُدخل معلومات الـ test في خطوة المعالجة، وهذا preprocessing leakage يجعل التقييم متفائلاً. الصحيح هو التقسيم أولاً ثم fit للـ scaler على التدريب فقط وتطبيقه على الـ test. توحيد الـ test بإحصاءاته الخاصة خطأ أيضاً لأنه يجعل الميزات غير متسقة مع ما تعلّمه النموذج."},{"id":"eda2-019","domain":"eda","level":"associate","tags":["pipeline","cross-validation","data-leakage"],"stem":"You are tuning a support vector machine for solder-defect detection at an electronics plant. The dataset has 8,000 labelled circuit boards with 35 numeric measurements per board, such as pad temperature, paste volume and placement offset, all on very different scales. About 6% of boards are defective, and the plant manager cares mostly about recall. Your notebook currently standardizes the full training set once with StandardScaler and then passes the scaled array to cross_val_score with 5 folds to compare values of C and gamma. A reviewer points out that the cross-validation scores are slightly contaminated, because each validation fold contributed to the scaling statistics. The final test set has not been touched. Which change MOST directly fixes the issue?","options":["Put the scaler and SVM in one Pipeline and cross-validate that","Increase the number of folds from 5 to 10 to reduce the contamination","Replace StandardScaler with MinMaxScaler before calling cross_val_score","Scale each validation fold separately using that fold's own statistics"],"answer":[0],"explain":"عند وضع الـ scaler والـ SVM داخل Pipeline واحد، يُعاد fit للـ scaler في كل fold على جزء التدريب فقط ثم يُطبَّق على جزء الـ validation، فيختفي التسرب. زيادة عدد الـ folds أو تغيير نوع الـ scaler لا يعالج المشكلة لأن الإحصاءات ما زالت محسوبة من بيانات تشمل أجزاء الـ validation."},{"id":"eda2-020","domain":"eda","level":"expert","tags":["feature-selection","cross-validation","data-leakage"],"stem":"You are a senior data scientist at a genomics lab reviewing a study that predicts treatment response from 20,000 gene-expression features measured on 150 patients. The analyst first selected the 50 features most correlated with the response using all 150 patients, then ran 10-fold cross-validation of a logistic regression on those 50 features and reported 92% accuracy. The lab's sequencing machine was replaced last year, and samples were processed in three batches, but the analyst confirms batch labels are balanced across classes and the two response classes are roughly equal in size. An independent cohort of 60 patients, processed with the same protocol, gives only 58% accuracy. What is the MOST likely explanation for the discrepancy?","options":["Selection used every patient's label, so no validation fold was truly unseen","Correlation is an invalid filter criterion when the response variable is binary","Logistic regression cannot handle 50 features with only 150 training patients","Ten folds are too many for 150 patients, which inflates the accuracy estimate"],"answer":[0],"explain":"اختيار الميزات باستخدام labels جميع المرضى قبل الـ cross-validation يعني أن كل fold للـ validation شارك في اختيار الميزات، ومع 20,000 ميزة و150 مريضاً فقط ستظهر ارتباطات قوية بالصدفة، فتصبح دقة 92% وهمية. الصحيح وضع خطوة الـ feature selection داخل الـ Pipeline ليُعاد تنفيذها في كل fold. عدد الـ folds ليس هو السبب، فالمشكلة ستبقى مع أي عدد."},{"id":"eda2-021","domain":"eda","level":"assistant","tags":["column-transformer","pipeline"],"stem":"An airline's delay model is trained on 400,000 flights from the last two years. It uses numeric columns (distance, scheduled duration) and categorical columns (carrier, origin airport). You want to standardize the numeric columns, one-hot encode the categorical ones, and keep everything in one object that can be cross-validated together with the model. Which scikit-learn design is MOST appropriate?","options":["A OneHotEncoder applied to all of the columns, followed by the estimator","A single StandardScaler applied to all of the columns, inside a Pipeline","A ColumnTransformer with one branch per column type, inside a Pipeline","Two separately fitted models, one per column type, averaged afterwards"],"answer":[2],"explain":"الـ ColumnTransformer يطبّق تحويلاً مختلفاً على كل مجموعة أعمدة (StandardScaler للرقمية وOneHotEncoder للفئوية)، ووضعه داخل Pipeline مع النموذج يضمن أن الـ fit يتم على بيانات التدريب فقط في كل fold. تطبيق StandardScaler على كل الأعمدة يفشل مع الأعمدة النصية، وتطبيق OneHotEncoder على الأعمدة الرقمية يحوّل كل قيمة رقمية إلى فئة مستقلة."},{"id":"eda2-022","domain":"eda","level":"associate","tags":["column-transformer","debugging"],"stem":"You support the forecasting team at an electricity utility. An analyst refactored a notebook into a scikit-learn Pipeline so that it can be deployed. Preprocessing is now wrapped in a ColumnTransformer that standardizes three numeric columns (temperature, humidity, wind speed) and one-hot encodes two categorical columns (region, tariff class). The dataset has four more numeric columns, including last week's load and the number of connected meters, which were used by the old notebook but were not listed in any transformer. The estimator, its hyperparameters, the random seed and the train/validation split are all unchanged, and no errors or warnings are raised. After the change, validation R² falls from 0.84 to 0.61. What is the MOST likely cause?","options":["The one-hot encoder removed the numeric columns with many unique values","The ColumnTransformer shuffled the rows, misaligning features and targets","The unlisted columns were silently dropped by the default remainder setting","The unlisted columns were scaled twice, which distorted their distributions"],"answer":[2],"explain":"الإعداد الافتراضي في الـ ColumnTransformer هو remainder='drop'، أي أن أي عمود غير مذكور في أحد المحوّلات يُحذف بصمت، فخسر النموذج أربع ميزات وانخفض الـ R². الحل هو ضبط remainder='passthrough' أو إدراج الأعمدة صراحةً. الـ ColumnTransformer لا يغيّر ترتيب الصفوف ولا يطبّق التحويل على أعمدة لم تُذكر."},{"id":"eda2-023","domain":"eda","level":"associate","tags":["pipeline","hyperparameter-tuning","tf-idf"],"stem":"At a legal-tech firm you classify contracts into six types using TF-IDF features and a linear SVM, with 25,000 labelled contracts. You want to choose the n-gram range, the minimum document frequency and the SVM's C together, with an unbiased cross-validated comparison. Documents are not time-ordered, and a final test set is held out. Which setup is MOST appropriate?","options":["Tune C with default TF-IDF first, then pick vectorizer settings on the test set","Fit each vectorizer variant on all documents, then grid-search C on the matrices","Grid-search one Pipeline that holds the vectorizer and SVM, tuning all three","Choose the vectorizer settings with the largest vocabulary, then tune only C"],"answer":[2],"explain":"البحث عن المعاملات على Pipeline يضم الـ vectorizer والـ SVM يجعل الـ vocabulary وقيم الـ IDF تُحسب من جزء التدريب في كل fold، ويسمح بضبط معاملات المعالجة والنموذج معاً دون تسرب. عمل fit للـ vectorizer على كل الوثائق قبل الـ cross-validation يسرّب معلومات أجزاء الـ validation، واستخدام الـ test set لاختيار الإعدادات يفسد التقييم النهائي."},{"id":"eda2-024","domain":"eda","level":"expert","tags":["deployment","pipeline-persistence","training-serving-skew"],"stem":"You deployed a credit-limit model for a digital bank as a REST service. In training, features were standardized and categories one-hot encoded with scikit-learn. The engineering team re-implemented preprocessing in the service: for each nightly scoring batch it computes the batch's own mean and standard deviation and builds indicator columns from the categories present in that batch. Batches range from 500 to 20,000 customers depending on the day. The service has 99.9% uptime and latency under 40 ms, and the exported model file matches the training run. Since launch, predictions for identical customers change from night to night, and some batches fail because the column count differs from what the model expects. What is the BEST fix?","options":["Retrain the model every night on the scoring batch so its columns always match","Serialize the fitted preprocessing-plus-model pipeline and load it in the service","Increase the batch size so that batch statistics approach the training statistics","Remove scaling and encoding from training so the service needs no preprocessing"],"answer":[1],"explain":"معاملات المعالجة (الـ mean والـ standard deviation وقائمة الفئات) يجب أن تُتعلَّم مرة واحدة من بيانات التدريب ثم تُطبَّق كما هي في الإنتاج، وحفظ الـ Pipeline كاملاً بعد الـ fit (مثلاً بـ joblib) وتحميله في الخدمة يضمن ذلك. زيادة حجم الدفعة تقرّب الإحصاءات فقط ولا تضمن التطابق، ولا تحل مشكلة اختلاف الأعمدة عند غياب فئة عن الدفعة."},{"id":"eda2-025","domain":"eda","level":"associate","tags":["feature-scaling","regularization","lasso"],"stem":"A retailer with 320 stores fits Lasso regression to predict annual store sales from floor area in square metres, annual rent in riyals and number of staff, without scaling. Rent keeps a tiny non-zero coefficient, while staff count is shrunk to exactly zero despite being clearly predictive in exploratory plots. What BEST explains this?","options":["Lasso always removes the feature with the smallest number of distinct values","The L1 penalty acts on coefficient size, which depends on each feature's units","The intercept absorbed the effect of staff count because it was unscaled","Lasso cannot be used when the features are correlated with one another"],"answer":[1],"explain":"عقوبة الـ L1 تُفرض على حجم المعاملات، وحجم المعامل يعتمد على وحدة الميزة: الميزة ذات القيم الكبيرة (الإيجار بالريال) تحتاج معاملاً صغيراً جداً فلا تكاد تُعاقَب، بينما عدد الموظفين يحتاج معاملاً كبيراً فيُصفَّر. لذلك يجب عمل standardization قبل Lasso وRidge. وجود ارتباط بين الميزات لا يمنع استخدام Lasso وإن كان يجعل الاختيار بينها أقل استقراراً."},{"id":"eda2-026","domain":"eda","level":"expert","tags":["sparse-data","feature-scaling","text-features"],"stem":"You maintain a spam filter at an email provider. The feature matrix is a sparse bag-of-words matrix with 2 million rows and 300,000 columns, in which 99.9% of the entries are zero. A colleague adds a StandardScaler with default settings before the linear model, and the job runs out of memory. What is the MOST appropriate change?","options":["Keep the default scaler but fit it on a 1% random sample of the rows","Apply min-max scaling to the range -1 to 1 so every column is centered","Convert the matrix to a dense array first so the scaler can center it","Scale without centering, e.g. MaxAbsScaler, so zeros stay zeros"],"answer":[3],"explain":"طرح الـ mean من مصفوفة sparse يحوّل الأصفار إلى قيم غير صفرية فتصبح المصفوفة dense وتنفد الذاكرة، لذا الصحيح هو التحجيم دون centering مثل MaxAbsScaler أو StandardScaler مع with_mean=False. عمل fit على عينة 1% لا يحل شيئاً لأن تطبيق الـ centering على المصفوفة كاملة هو ما يدمّر الـ sparsity، وكذلك إزاحة القيم إلى المدى من -1 إلى 1."},{"id":"eda2-027","domain":"eda","level":"associate","tags":["data-leakage","stateful-transformers","pipeline"],"stem":"You are moving a notebook's preprocessing into a scikit-learn Pipeline at a fintech company to prevent leakage. Some steps learn parameters from the data and must be fitted on the training folds only; others are row-wise calculations that learn nothing. Which THREE steps learn from the data and therefore must be fitted on training data only? (Select THREE)","options":["Replacing merchant category with that category's mean default rate","Building the TF-IDF vocabulary and document frequencies from notes","Standardizing income using its mean and standard deviation","Extracting the hour of day from each transaction's timestamp","Dividing each customer's debt by that same customer's income"],"answer":[0,1,2],"explain":"الـ standardization يتعلم الـ mean والـ standard deviation، والـ TF-IDF يتعلم الـ vocabulary وقيم الـ IDF، والـ target encoding يتعلم متوسطات الـ target لكل فئة؛ هذه كلها محوّلات stateful يجب عمل fit لها على التدريب فقط. أما استخراج الساعة من الـ timestamp أو قسمة الدين على الدخل للصف نفسه فعمليات تُحسب لكل صف بمعزل عن بقية البيانات ولا تسبب leakage."},{"id":"eda2-028","domain":"eda","level":"assistant","tags":["datetime-features","demand-forecasting"],"stem":"A ride-hailing company in Jeddah wants to predict hourly ride demand from trip request timestamps. Which TWO features derived from the timestamp are MOST likely to be useful? (Select TWO)","options":["Hour of the day","Second within the minute","Millisecond part of the timestamp","Day of the week","Full timestamp text, one-hot encoded"],"answer":[0,3],"explain":"الطلب على الرحلات يتبع أنماطاً يومية وأسبوعية (ساعات الذروة وعطلة نهاية الأسبوع)، لذا ساعة اليوم ويوم الأسبوع هما الأكثر فائدة. ترميز الـ timestamp الكامل بـ one-hot يجعل كل قيمة فريدة تقريباً فلا يتعلم النموذج نمطاً يتكرر، والثواني والميلي ثانية ضوضاء لا علاقة لها بالطلب."},{"id":"eda2-029","domain":"eda","level":"associate","tags":["cyclical-encoding","datetime-features"],"stem":"A power utility feeds 'hour of day' (0 to 23) as a plain number into a neural network that forecasts load. Errors are unusually large around midnight, because the model treats 23:00 and 00:00 as far apart. One-hot encoding is ruled out because the team wants neighbouring hours to stay close to each other. Which change would MOST improve the feature?","options":["Standardize the hour to zero mean and unit variance","Replace the hour with its square to stretch the evening values","Shift the hours so the day starts at 12:00 instead of 00:00","Replace the hour with its sine and cosine on a 24-hour cycle"],"answer":[3],"explain":"الـ cyclical encoding باستخدام sin وcos على دورة 24 ساعة يضع الساعات على دائرة، فتصبح 23:00 و00:00 متجاورتين كما هما في الواقع. الـ standardization تغيّر المقياس فقط وتُبقي الفجوة بين 23 و0، وإزاحة بداية اليوم إلى 12:00 تنقل نقطة الانقطاع إلى الظهيرة ولا تلغيها."},{"id":"eda2-030","domain":"eda","level":"associate","tags":["cyclical-encoding","calculation"],"stem":"An analyst encodes hour of day with sin(2π × hour / 24) and cos(2π × hour / 24). Which pair (sin, cos) correctly represents 06:00?","options":["(1, 0)","(0, 1)","(0, -1)","(-1, 0)"],"answer":[0],"explain":"عند الساعة 6 تكون الزاوية 2π × 6 / 24 = π/2، و sin(π/2) = 1 و cos(π/2) = 0، فالزوج هو (1, 0). الزوج (0, 1) يمثل الساعة 00:00 حيث الزاوية صفر، والزوج (0, -1) يمثل 12:00، والزوج (-1, 0) يمثل 18:00."},{"id":"eda2-031","domain":"eda","level":"expert","tags":["time-since-event","point-in-time","data-leakage"],"stem":"You are building a churn model for a gym chain. Training rows are customer snapshots taken on the first day of each month in 2025, labelled with whether the customer cancelled in the following 30 days. A colleague computed 'days_since_last_visit' for every row as the difference between today's date and the customer's last visit date in the current database. The feature is the top predictor offline, and the model's validation AUC is 0.93. The chain has 45 branches, and branch managers want a weekly list of at-risk members. In production, where the feature is computed relative to the scoring date, performance is far lower. What is the MOST appropriate correction?","options":["Compute recency relative to the cancellation date for customers who cancelled","Compute recency relative to each row's snapshot date, using only earlier visits","Remove the recency feature, since time-based features always cause leakage","Standardize the recency feature so that offline and production scales match"],"answer":[1],"explain":"يجب حساب الميزة كما كانت ستبدو لحظة الـ snapshot (point-in-time): الفرق بين تاريخ الـ snapshot وآخر زيارة قبله. الحساب نسبةً إلى تاريخ اليوم يستخدم زيارات حدثت بعد الـ snapshot، فمن ألغى اشتراكه توقفت زياراته وتبدو قيمته كبيرة جداً، وهذا leakage يختفي في الإنتاج. حذف الميزة نهائياً يضيّع إشارة مفيدة؛ المشكلة في طريقة الحساب لا في الميزة."},{"id":"eda2-032","domain":"eda","level":"associate","tags":["seasonality","holiday-features","calendar"],"stem":"You forecast daily hotel bookings for a tourism operator in Makkah that manages nine properties. Demand peaks sharply during Ramadan and the Hajj season, and is otherwise fairly stable with a mild weekend effect. A gradient boosting model using Gregorian 'month', 'day of month' and 'day of week' features, trained on four years of daily data, predicts the peaks later than they actually occur, and the gap grows every year. Outside those periods the error is low. The operator has also opened two new hotels, which are already handled by a separate capacity feature, and prices are set by another team. Management wants forecasts 60 days ahead to plan staffing. Which change would MOST improve the model?","options":["Add the Gregorian week of the year as an extra one-hot encoded feature","Add Hijri-calendar features, such as days until Hajj and a Ramadan flag","Drop the four years of history and train on the most recent year only","Encode the Gregorian month with sine and cosine instead of integers"],"answer":[1],"explain":"مواسم رمضان والحج تتبع التقويم الهجري الذي يتقدم نحو 11 يوماً كل سنة ميلادية، فالميزات الميلادية لا تستطيع تحديد موقع الذروة، بينما ميزات مثل 'عدد الأيام حتى الحج' ومؤشر رمضان تربط الطلب بالحدث نفسه. الـ cyclical encoding للشهر الميلادي أو إضافة رقم الأسبوع الميلادي يبقيان مرتبطين بالتقويم الخطأ."},{"id":"eda2-033","domain":"eda","level":"expert","tags":["datetime-features","tree-models","extrapolation"],"stem":"A payments company trains gradient-boosted trees on 2024 transactions to detect fraud in 2025. One input is the raw Unix timestamp of the transaction. Under a random train/validation split it ranks high in importance and validation AUC is 0.96, so the fraud team wants to keep it. What is the MAIN risk of keeping this feature in production?","options":["The timestamp will be perfectly collinear with the transaction amount feature","Tree models cannot process integers as large as Unix timestamps without scaling","Future timestamps exceed every learned split, so the feature stops discriminating","Unix timestamps ignore time zones, so trees will double count some transactions"],"answer":[2],"explain":"الأشجار لا تستطيع الـ extrapolation: كل timestamp في 2025 أكبر من جميع عتبات التقسيم المتعلَّمة من 2024، فتقع كل المعاملات الجديدة في الفرع نفسه وتفقد الميزة قدرتها على التمييز، بينما كانت تبدو مهمة لأن التقسيم العشوائي سمح للنموذج بحفظ فترات زمنية بعينها. الأفضل استخراج ميزات متكررة مثل الساعة ويوم الأسبوع. حجم الأرقام ليس مشكلة للأشجار لأنها لا تتأثر بالمقياس."},{"id":"eda2-034","domain":"eda","level":"associate","tags":["datetime-features","time-zones"],"stem":"A food-delivery platform operating in Riyadh, Cairo and London stores order timestamps in UTC. You extract 'hour' directly from the UTC value to model lunch and dinner peaks. Each city shows clear peaks when analysed on its own, but when the three cities are pooled in one model the hour feature is much weaker than expected. What should you do FIRST?","options":["Replace the hour feature with the minute of the hour for finer detail","Keep the UTC hour and apply sine and cosine encoding to that value","Drop the hour feature and rely on the day of the week instead","Convert timestamps to local time before extracting the hour"],"answer":[3],"explain":"سلوك العملاء يتبع التوقيت المحلي: الغداء الساعة 13:00 في الرياض يقابل ساعة UTC مختلفة عن غداء لندن، فخلط المدن بساعة UTC يطمس الذروات. التحويل إلى التوقيت المحلي قبل استخراج الساعة يجعل الميزة تعني الشيء نفسه في كل المدن. الـ cyclical encoding لساعة UTC يعالج مشكلة منتصف الليل فقط ولا يصحح فرق التوقيت."},{"id":"eda2-035","domain":"eda","level":"expert","tags":["lag-features","rolling-windows","data-leakage"],"stem":"You review a sales forecasting project at a grocery chain with 140 stores. The model predicts tomorrow's sales for each store and feeds the fresh-produce ordering system, so overestimates lead to waste and underestimates to empty shelves. An analyst added a '7-day rolling mean of sales' feature, but computed it in pandas with a centered window, so for each date it includes the three days before, the date itself and the three days after. In the backtest the mean absolute percentage error dropped from 14% to 4%, and the feature has by far the highest importance. In the first live month, however, the error was back at 14%. Promotions and holidays are handled by other features. Which correction is MOST appropriate?","options":["Keep the centered window but standardize the rolling mean per store","Replace the rolling mean with a rolling median over the same window","Use a trailing window ending the day before the predicted date","Widen the centered window from 7 to 14 days to smooth out the noise"],"answer":[2],"explain":"النافذة المتمركزة (centered) تتضمن مبيعات أيام لاحقة، بل ويوم التنبؤ نفسه، وهي غير متاحة وقت التنبؤ الفعلي، فيبدو الـ backtest ممتازاً بسبب الـ leakage. الصحيح نافذة خلفية (trailing) تنتهي قبل يوم التنبؤ، باستخدام shift قبل الـ rolling. تغيير الإحصائية إلى median أو توسيع النافذة لا يزيل استخدام بيانات المستقبل."},{"id":"eda2-036","domain":"eda","level":"assistant","tags":["tf-idf","bag-of-words"],"stem":"A support team classifies tickets by topic using raw word counts. Words like 'please', 'hello' and 'thanks' appear in nearly every ticket and dominate the feature values. Which representation MOST directly reduces the weight of such words?","options":["Bigram counts, which pair each common word with its neighbouring word","TF-IDF weighting, which down-weights terms found in most documents","Uppercased text, which merges the different spellings of the same word","Character counts, which measure the overall length of every ticket"],"answer":[1],"explain":"الـ TF-IDF يضرب تكرار الكلمة في معامل IDF الذي يصغر كلما ظهرت الكلمة في عدد أكبر من الوثائق، فتنخفض أوزان كلمات مثل 'please' و'thanks' تلقائياً. الـ bigrams تضيف ميزات جديدة لكنها لا تقلل وزن الكلمات الشائعة، بل تنتج أزواجاً شائعة أيضاً."},{"id":"eda2-037","domain":"eda","level":"associate","tags":["text-cleaning","n-grams","sentiment"],"stem":"You are building a sentiment classifier for hotel reviews at a travel site using bag-of-words unigrams and logistic regression. Reviews are in English, average about 45 words, and are labelled positive or negative from the star rating. The cleaning step lowercases text, strips punctuation and removes a standard English stop-word list that includes 'not' and 'no'. Overall accuracy is 86%, but error analysis shows that reviews such as 'not clean' and 'no hot water' are regularly predicted as positive. The dataset has 60,000 labelled reviews, so sparsity is not a major concern, and management wants to keep a simple, explainable model rather than move to deep learning. Which change would MOST improve the features?","options":["Switch from word counts to binary presence for each unigram","Apply stemming so 'clean', 'cleaned' and 'cleaning' are merged","Remove more stop words so only nouns and adjectives remain","Keep negation words and add bigrams such as 'not clean'"],"answer":[3],"explain":"حذف 'not' و'no' ضمن الـ stop words يمحو النفي، والـ unigrams وحدها لا تربط النفي بالكلمة التي تليه؛ الإبقاء على كلمات النفي مع إضافة bigrams يجعل 'not clean' ميزة مستقلة ذات دلالة سلبية. الـ stemming يقلل حجم الـ vocabulary لكنه لا يعيد معلومة النفي المفقودة."},{"id":"eda2-038","domain":"eda","level":"associate","tags":["n-grams","vocabulary-size","tf-idf"],"stem":"A news aggregator adds bigrams and trigrams to its TF-IDF features for topic classification. The vocabulary grows from 80,000 to 9 million terms, most of them appearing in only one or two articles, and training no longer fits in memory. Which TWO settings directly control this growth while keeping informative n-grams? (Select TWO)","options":["A wider n-gram range that also includes 4-grams for longer phrases","A minimum document frequency, so that very rare n-grams are discarded","Case-sensitive tokens, so capitalized phrases become separate terms","A dense array conversion of the sparse matrix before training the model","A maximum feature count, so that only the most frequent terms are kept"],"answer":[1,4],"explain":"معظم الـ n-grams الجديدة تظهر في مقال أو مقالين فلا تفيد التعميم؛ ضبط min_df يحذفها، وضبط max_features يضع سقفاً لحجم الـ vocabulary، وكلاهما يعالج الذاكرة مباشرة. التحويل إلى dense array يزيد استهلاك الذاكرة بشكل هائل، وإضافة 4-grams أو إلغاء الـ lowercasing يضخّمان الـ vocabulary أكثر."},{"id":"eda2-039","domain":"eda","level":"assistant","tags":["tf-idf","inference","vocabulary"],"stem":"A government services portal routes citizen requests to the right department using a TF-IDF vectorizer fitted on last year's 200,000 requests, followed by a linear classifier. The fitted pipeline was saved and is loaded by the routing service. At inference, a request contains a word that never appeared in training. What happens when the fitted vectorizer transforms this request?","options":["The transform fails until the vectorizer is refitted on the new request","The unseen word receives the highest IDF weight because it is so rare","The unseen word is ignored and the known words are encoded as usual","The vectorizer adds a new column, so the classifier gets an extra feature"],"answer":[2],"explain":"الـ vocabulary يتحدد عند الـ fit على بيانات التدريب ويبقى ثابتاً، وعند الـ transform تُتجاهل أي كلمة خارجه وتُرمَّز بقية الكلمات كالمعتاد، فيبقى عدد الأعمدة مطابقاً لما يتوقعه النموذج. لا يُضاف عمود جديد ولا يُحسب IDF لكلمة غير موجودة في الـ vocabulary."},{"id":"eda2-040","domain":"eda","level":"associate","tags":["tf-idf","calculation"],"stem":"A legal search team scores the terms of one contract using tf × log10(N / df), where N = 1,000 documents in the corpus, tf is the term's count in this contract and df is the number of documents containing the term. Based on the table, which term gets the HIGHEST score in this contract?","table":{"caption":"Term statistics for the contract","headers":["Term","tf in this contract","df in corpus"],"rows":[["agreement","8","1000"],["indemnity","3","10"],["arbitration","4","100"],["escrow","1","1"]]},"options":["arbitration","agreement","indemnity","escrow"],"answer":[2],"explain":"الدرجات: indemnity = 3 × log10(1000/10) = 3 × 2 = 6، وarbitration = 4 × 1 = 4، وescrow = 1 × 3 = 3، وagreement = 8 × log10(1) = 0. كلمة 'agreement' هي الأكثر تكراراً داخل العقد لكنها موجودة في كل الوثائق فيصبح IDF لها صفراً، و'escrow' الأندر لكن تكرارها مرة واحدة فقط."},{"id":"eda2-041","domain":"eda","level":"associate","tags":["character-n-grams","text-features"],"stem":"A marketplace matches seller-typed product titles to 900 catalogue categories. Titles are short and full of typos, abbreviations and joined words, such as 'iphon15 pro-max cas'. About 2 million labelled titles are available, so data volume is not the issue, but a word-level TF-IDF model treats most of these tokens as unknown. Which feature change is MOST likely to help?","options":["Use word-level trigrams so longer exact phrases are captured","Raise the minimum document frequency so rare tokens are excluded","Remove all tokens containing digits before building the vocabulary","Use character n-gram TF-IDF so misspelled words still overlap"],"answer":[3],"explain":"الـ character n-grams تقسّم الكلمة إلى مقاطع حروف، فكلمة 'iphon15' تشترك مع 'iphone' في معظم المقاطع، وبذلك يتحمل التمثيل الأخطاء الإملائية والاختصارات. الـ word trigrams تتطلب تطابقاً تاماً لعبارات أطول فتزيد المشكلة سوءاً، ورفع min_df يحذف مزيداً من الـ tokens النادرة التي هي أصل المشكلة."},{"id":"eda2-042","domain":"eda","level":"assistant","tags":["text-cleaning","lemmatization"],"stem":"An HR analytics team builds a bag-of-words model on 3,000 job descriptions. The vocabulary treats 'manage', 'manages', 'managed' and 'managing' as four unrelated features, and the dataset is small. Which text-preparation step MOST directly addresses this?","options":["Case preservation so capitalized forms stay distinct features","Lemmatization or stemming to map inflected forms to one base term","Bigram extraction so that each form is paired with its neighbour","Stop-word removal for words such as 'the', 'and' and 'of'"],"answer":[1],"explain":"الـ stemming أو الـ lemmatization يردّ الصيغ المختلفة للكلمة إلى جذر أو أصل واحد، فتتجمع 'manage' و'managed' و'managing' في ميزة واحدة، وهذا مهم مع بيانات قليلة لأنه يقلل الـ sparsity. حذف الـ stop words يزيل كلمات شائعة أخرى لكنه لا يوحّد صيغ الكلمة الواحدة."},{"id":"eda2-043","domain":"eda","level":"assistant","tags":["binning","linear-models","non-linearity"],"stem":"A health insurer models claim cost with linear regression for interpretability. Exploration shows cost is high for young children, low for adults aged 20 to 50 and rises steeply after 60, so a single straight-line effect of age fits poorly. Which feature change is MOST appropriate while keeping the linear model?","options":["Encode age with sine and cosine on a 100-year cycle","Round age to the nearest ten years in one numeric column","Bin age into ranges and one-hot encode the resulting bins","Standardize age so it has zero mean and unit variance"],"answer":[2],"explain":"تقسيم العمر إلى فئات (binning) ثم ترميزها بـ one-hot يعطي كل فئة عمرية معاملاً خاصاً، فيلتقط النموذج الخطي العلاقة غير الخطية (شكل U) مع بقائه قابلاً للتفسير. الـ standardization تحويل خطي لا يغيّر شكل العلاقة، وتقريب العمر إلى أقرب عشر سنوات في عمود رقمي واحد يبقى محكوماً بميل واحد."},{"id":"eda2-044","domain":"eda","level":"associate","tags":["binning","quantile-binning","skewed-data"],"stem":"A bank discretizes 'monthly_income' into four equal-width bins for a scorecard model built on 100,000 customers. The resulting row counts are shown below. What is the MOST appropriate change so that every bin carries useful information?","table":{"caption":"Equal-width bins of monthly income","headers":["Bin","Range (riyals)","Customers"],"rows":[["1","0 - 50,000","97,400"],["2","50,000 - 100,000","2,100"],["3","100,000 - 150,000","380"],["4","150,000 - 200,000","120"]]},"options":["Keep the four bins and standardize the bin index before modelling","Keep the four bins and one-hot encode them to separate the levels","Use eight equal-width bins instead of four to increase the resolution","Use quantile-based bins so bins hold similar shares of customers"],"answer":[3],"explain":"الدخل شديد الالتواء نحو اليمين، فالـ equal-width binning وضع 97.4% من العملاء في فئة واحدة وفقدت الميزة قدرتها على التمييز بينهم. الـ quantile binning يضع حدود الفئات بحيث تحتوي كل فئة نسبة متقاربة من العملاء، فيفصل بين مستويات الدخل حيث توجد البيانات فعلاً. مضاعفة عدد الفئات متساوية العرض تُبقي الغالبية العظمى في الفئتين الأوليين."},{"id":"eda2-045","domain":"eda","level":"associate","tags":["binning","tree-models"],"stem":"An agritech firm predicts crop yield with gradient-boosted trees using continuous rainfall, temperature and soil pH from 80,000 field-season records. A colleague proposes first converting each variable into three bins (low, medium, high) 'to help the trees'. There is no regulatory or reporting need for binned inputs. Which statement is correct?","options":["Trees cannot split on continuous inputs, so binning is required before training","Trees choose their own split points, so coarse bins mainly discard information","Three bins per variable lower the bias because the model becomes simpler","Binning is needed here because boosted trees are sensitive to feature scale"],"answer":[1],"explain":"الأشجار تبحث بنفسها عن أفضل عتبات التقسيم للمتغيرات المستمرة، فتحويل كل متغير إلى ثلاث فئات فقط يحصر العتبات الممكنة في حدّين ويضيّع التفاصيل داخل كل فئة. النماذج الشجرية لا تتأثر بمقياس الميزات فلا حاجة للـ binning لهذا السبب، كما أن تبسيط المدخلات يرفع الـ bias ولا يخفضه."},{"id":"eda2-046","domain":"eda","level":"associate","tags":["interaction-features","linear-regression"],"stem":"A supermarket chain with 85 stores uses linear regression to predict weekly units sold per product from 'discount_percent' (0 to 40) and 'is_featured_in_flyer' (0 or 1), plus store size and week of year. Analysts reviewing residuals observe that discounts lift sales far more in weeks when the product is also in the printed flyer than in weeks when it is not. The model, however, gives each variable one fixed additive effect, so it slightly overpredicts discount-only weeks and clearly underpredicts weeks with both. The pricing team reviews the coefficients every quarter and requires a linear model with readable coefficients, so switching to a tree ensemble is not an option. Data quality has been checked and is not a concern. Which change would MOST improve the fit?","options":["Standardize both of the variables so their coefficients become comparable","Add the product of discount_percent and is_featured_in_flyer as a feature","Bin discount_percent into quartiles and drop the flyer indicator column","Add the sum of discount_percent and is_featured_in_flyer as a feature"],"answer":[1],"explain":"أثر الخصم يعتمد على وجود المنتج في النشرة، وهذا interaction effect لا يستطيع النموذج الجمعي تمثيله؛ إضافة حاصل ضرب المتغيرين تعطي معاملاً للأثر المشترك مع بقاء النموذج خطياً ومقروءاً. إضافة مجموع المتغيرين لا تضيف معلومة لأنه تركيب خطي منهما ويسبب perfect multicollinearity."},{"id":"eda2-047","domain":"eda","level":"assistant","tags":["ratio-features","feature-engineering"],"stem":"A lender's default model for personal loans uses 'monthly_debt_payments' and 'monthly_income' as two separate numeric inputs. Experienced credit officers say what matters is how heavy the debt is relative to income: 4,000 riyals of debt is risky on a 6,000 income but not on a 40,000 income. Which engineered feature BEST captures this?","options":["The min-max scaled value of monthly debt payments","The rank of monthly income among all the applicants","The ratio of monthly debt payments to monthly income","The sum of monthly debt payments and monthly income"],"answer":[2],"explain":"نسبة الدين إلى الدخل (debt-to-income ratio) تعبّر مباشرة عن عبء الدين: 4,000 / 6,000 تعطي نحو 0.67 بينما 4,000 / 40,000 تعطي 0.10، وهو ما يصفه موظفو الائتمان. تحجيم عمود الدين وحده بـ min-max يغيّر المقياس فقط ولا يربطه بالدخل."},{"id":"eda2-048","domain":"eda","level":"assistant","tags":["interaction-features","calculation"],"stem":"A pricing analyst has 10 numeric features and wants to add every pairwise product of two different features as interaction terms. How many interaction columns will be added?","options":["100","20","90","45"],"answer":[3],"explain":"عدد الأزواج غير المرتبة من 10 ميزات هو C(10, 2) = 10 × 9 / 2 = 45. الرقم 90 يحسب كل زوج مرتين (A×B وB×A وهما العمود نفسه)، والرقم 100 يتضمن أيضاً ضرب كل ميزة في نفسها."},{"id":"eda2-049","domain":"eda","level":"assistant","tags":["aggregation-features","groupby"],"stem":"A retailer wants to predict which loyalty-programme customers will buy next month. The only raw data is a transactions table with one row per purchase (customer_id, date, amount) covering the two years up to today, while the classifier needs exactly one row per customer. What is the MOST appropriate way to build features?","options":["Group by customer_id and aggregate amount over the history up to today","Keep only each customer's most recent transaction row and drop the rest","Train directly on transaction rows with customer_id as a numeric feature","Pivot every transaction into its own column, giving thousands per customer"],"answer":[0],"explain":"وحدة التنبؤ هي العميل، لذا نجمّع جدول المعاملات على مستوى customer_id ونحسب ميزات مثل عدد المشتريات وإجمالي الإنفاق ومتوسطه ليصبح لكل عميل صف واحد. الاحتفاظ بآخر معاملة فقط يضيّع تاريخ العميل كله، واستخدام customer_id كميزة رقمية لا معنى له لأنه مجرد معرّف."},{"id":"eda2-050","domain":"eda","level":"expert","tags":["aggregation-features","point-in-time","data-leakage"],"stem":"You are designing features for a card-fraud model at a bank. Each transaction must be scored within 200 ms at authorization time, before the purchase is approved or declined. Fraud labels arrive 30 to 60 days later, after customers dispute charges and the investigation team confirms them. The feature team proposes the per-card aggregates below and plans to compute them for the training set with one SQL query over the full history table. The bank has 4 million active cards, stores two years of history, and retrains the model monthly. An aggregate is acceptable only if the same value could have been computed at the moment the transaction was authorized. Which TWO features are valid to use at scoring time without leaking future information? (Select TWO)","options":["Ratio of this amount to the card's average amount over the prior 90 days","Total card spend for the whole calendar month containing this transaction","Count of the card's disputed transactions in the 30 days after this one","Share of the card's transactions this week later confirmed as fraud","Count of the card's transactions in the 24 hours before this transaction"],"answer":[0,4],"explain":"الميزة الصالحة هي التي تُحسب فقط من بيانات متاحة لحظة التفويض: عدد المعاملات في الـ 24 ساعة السابقة، ونسبة المبلغ إلى متوسط الـ 90 يوماً السابقة. إجمالي إنفاق الشهر التقويمي كاملاً يبدو بريئاً لكنه يتضمن معاملات تحدث بعد المعاملة الحالية، والميزات المبنية على النزاعات أو تأكيد الاحتيال تعتمد على labels لا تصل إلا بعد 30 إلى 60 يوماً."},{"id":"eda2-051","domain":"eda","level":"assistant","tags":["joins","row-duplication","data-wrangling"],"stem":"A telecom analyst joins the customers table to the support_tickets table on customer_id to add ticket information for a churn study, then sums 'monthly_fee' to report revenue. The total is far higher than the finance figure, which is 300 for the three customers in the sample. Using the joined sample below, what is the MOST likely cause?","table":{"caption":"Joined result (sample)","headers":["customer_id","monthly_fee","ticket_id"],"rows":[["C1","100","T1"],["C1","100","T2"],["C1","100","T3"],["C2","80","T4"],["C3","120","(none)"]]},"options":["The join matched rows on ticket_id instead of customer_id, mixing customers","Customers with several tickets are repeated, so their fee is counted many times","Customers without any tickets were dropped by the join, which shifts the total","The monthly_fee column was turned into text by the join and summed wrongly"],"answer":[1],"explain":"العلاقة one-to-many: العميل C1 لديه ثلاث تذاكر فتكرر صفه ثلاث مرات، فأصبح المجموع 500 بدلاً من 300 (100 + 80 + 120). الحل هو تجميع التذاكر لكل عميل قبل الـ join أو جمع الرسوم من جدول العملاء الأصلي. العملاء بلا تذاكر لم يُحذفوا، فالعميل C3 موجود في النتيجة، ولو حُذفوا لانخفض المجموع لا ارتفع."},{"id":"eda2-052","domain":"eda","level":"associate","tags":["joins","aggregation","data-validation"],"stem":"An e-commerce analyst must add payment information to an orders table (one row per order) to build a late-delivery model. The payments table can contain several rows per order because of split payments and re
