edict processing time for permit applications. The team followed good practice: a training set, a validation set for tuning, and a test set of 3,000 applications locked away until the end. At the final evaluation, test MAE turns out 30% worse than validation MAE. A team member proposes going back, engineering new features, and re-checking the test set after each change until the test MAE matches validation. The project sponsor is pressing for a number for next quarter's steering-committee report, and the agency receives about 4,000 new labelled applications every month. What is the MOST appropriate way forward?","options":["Iterate against the existing test set as proposed, but cap it at ten re-checks in total","Report the validation MAE, since it reflects the most tuning effort and is more stable","Treat the old test set as validation data and draw a fresh test set from new applications","Merge the validation and test sets, then report the average MAE over the larger merged set"],"answer":[2],"explain":"بمجرد استخدام الـ test set لتوجيه قرارات التطوير يتحول عمليًا إلى validation set ويفقد دوره كتقدير غير متحيز. وبما أن الجهة تستقبل نحو 4,000 طلب موسوم شهريًا، فالحل النظيف هو مواصلة التطوير مع اعتبار الـ test set القديم بيانات validation، ثم سحب test set جديد من الطلبات القادمة للتقدير النهائي. تحديد عدد مرات الفحص بعشر يقلل الضرر ولا يزيله، والإبلاغ عن الـ validation MAE يعني تقديم الرقم المعروف أنه متفائل."},{"id":"eval2-047","domain":"eval","level":"assistant","tags":["model-comparison","same-folds"],"stem":"You compare a random forest and a linear model with 5-fold cross-validation, but each model was run with a different random shuffle, so their folds differ. The scores are very close. Which change makes the comparison fairer?","options":["Give the random forest more folds, since it is the more complex model","Compare the two models on their training scores, which use all the rows","Run each model with several seeds and keep each model's best run","Evaluate both models on identical folds by sharing one seeded splitter"],"answer":[3],"explain":"عندما تختلف الطيات بين النموذجين يختلط فرق الأداء الحقيقي بفرق صعوبة التقسيمات، وهذا مؤثر خصوصًا حين تكون النتائج متقاربة. استخدام splitter واحد بـ seed ثابت للنموذجين يجعل المقارنة مزدوجة (paired) على الصفوف نفسها فيُلغى أثر التقسيم. الاحتفاظ بأفضل تشغيل لكل نموذج هو cherry-picking يضخّم النتيجتين، والمقارنة على درجات التدريب تكافئ النموذج الأكثر تعقيدًا دون وجه حق."},{"id":"eval2-048","domain":"eval","level":"expert","tags":["model-comparison","paired-test","statistical-significance"],"stem":"Two demand-forecasting models were evaluated on the same 10 cross-validation folds at a beverage distributor that supplies restaurants and supermarkets across the Eastern Province. Model B's RMSE is lower than Model A's in all 10 folds, by between 0.8 and 1.3 units, which the planners consider a worthwhile gain. The fold RMSEs themselves range widely, from 40 to 65, because some folds contain Ramadan and holiday weeks, when demand is far harder to predict. A colleague notes that the 'mean ± standard deviation' ranges of the two models overlap heavily and concludes there is no evidence that B is better. Both models have similar training cost and latency, and the warehouse system was upgraded last year. Which response is BEST?","options":["Agree, because overlapping mean ± standard deviation ranges show the two models perform the same","Drop the holiday folds to shrink the standard deviation, then compare the two means again","Compare only the single best fold of each model, where the noise from holidays is lowest","Analyse the per-fold differences as paired data, since B wins by a steady margin in every fold"],"answer":[3],"explain":"التباين الكبير بين الطيات (40 إلى 65) سببه اختلاف صعوبة الطيات وهو مشترك بين النموذجين، لذلك تداخل نطاقات mean ± std لا يعني شيئًا عندما يُقيَّم النموذجان على الطيات نفسها. المقارنة الصحيحة paired: نحسب الفرق في كل fold، وهنا الفروق كلها في اتجاه واحد وبمقدار ثابت تقريبًا (0.8–1.3)، وهذا دليل قوي على تفوق حقيقي لـ B ويمكن تأكيده باختبار مزدوج مثل paired t-test أو Wilcoxon. حذف طيات العطل يزيل ظروفًا حقيقية يجب أن يخدمها النموذج."},{"id":"eval2-049","domain":"eval","level":"associate","tags":["confidence-interval","bootstrap"],"stem":"You must report the test RMSE of a freight-cost model to a logistics director, who asks 'how sure are you about that number?'. You have a single test set of 2,000 shipments, the model is already trained, and labelled data for more shipments will not be available for months. Which approach BEST answers the question?","options":["Report the RMSE to four decimal places, to convey the precision of the estimate","Resample the test rows with the bootstrap and report a confidence interval for the RMSE","Report the training RMSE next to the test RMSE, as the lower and upper bounds","Retrain with five seeds on train plus test combined and report the spread of scores"],"answer":[1],"explain":"الـ bootstrap يعيد سحب صفوف الـ test set مع الإرجاع مئات المرات ويحسب الـ RMSE في كل مرة، فينتج confidence interval يعبّر عن عدم اليقين الناتج عن محدودية عينة الاختبار، وهذا جواب مباشر عن سؤال المدير. كتابة الرقم بأربع خانات عشرية توحي بدقة زائفة، والـ training RMSE ليس حدًا أدنى إحصائيًا للأداء الحقيقي. ودمج الـ test set في التدريب يلغي التقييم المستقل من أساسه."},{"id":"eval2-050","domain":"eval","level":"associate","tags":["practical-significance","statistical-significance"],"stem":"You are a data scientist at a ride-hailing company in the Gulf that operates in six cities. The current ETA model has an MAE of 2.40 minutes. A new deep model reaches 2.37 minutes on a test set of 5 million trips, and a paired test shows the difference is statistically significant (p < 0.001). Serving the new model would require GPU instances, tripling the monthly inference cost, and would raise response latency from 40 ms to 140 ms. Product research indicates that riders do not notice ETA differences below about 15 seconds. The engineering team is excited because the new architecture was presented at a major conference. What is the MOST appropriate recommendation?","options":["Keep the current model; the gain is real but too small to justify the added cost and latency","Deploy the new model, because p < 0.001 proves that the improvement is important to riders","Collect an even larger test set to push the significance further, then deploy the new model","Reject the test result, because a 0.03-minute difference cannot be statistically significant"],"answer":[0],"explain":"الفرق 0.03 دقيقة يساوي أقل من ثانيتين، وهو أدنى بكثير من عتبة 15 ثانية التي يلاحظها الركاب، فالتحسن statistically significant لكنه غير مهم عمليًا (practical significance)، بينما التكلفة تتضاعف ثلاث مرات والـ latency يرتفع. مع 5 ملايين رحلة يصبح أي فرق ضئيل ذا دلالة إحصائية، فالـ p-value الصغير لا يقيس حجم الأثر ولا قيمته للعمل. ورفض النتيجة خطأ أيضًا، فالفروق الصغيرة تكون دالة إحصائيًا مع العينات الضخمة."},{"id":"eval2-051","domain":"eval","level":"assistant","tags":["baseline","naive-forecast"],"stem":"You are forecasting weekly visitor numbers for an events venue. The table shows results on the same test period. What is the MOST appropriate conclusion?","table":{"caption":"Test-period results","headers":["Method","Test MAE (visitors)","Training time"],"rows":[["Mean of training data","980","none"],["Same week last year (seasonal naive)","410","none"],["LSTM network","455","6 hours"]]},"options":["The LSTM is the best choice, because it cuts the mean baseline's error by more than half","The LSTM should be deployed, because deep models keep improving once they are in production","The LSTM does not yet beat the seasonal naive baseline, so it is not justified as it stands","The baselines are irrelevant, because they do not learn anything from the input features"],"answer":[2],"explain":"قيمة أي نموذج تُقاس مقارنة بأقوى baseline بسيط، وهنا الـ seasonal naive (نفس الأسبوع من العام الماضي) يحقق MAE = 410 دون أي تدريب، بينما الـ LSTM يحقق 455 بعد 6 ساعات تدريب، أي أنه أسوأ وأكثر كلفة. التفوق على متوسط بيانات التدريب وحده مضلل لأنه baseline ضعيف يتجاهل الموسمية. لا يوجد ما يضمن تحسن النماذج العميقة تلقائيًا بعد النشر."},{"id":"eval2-052","domain":"eval","level":"assistant","tags":["baseline","metric-context"],"stem":"A vendor tells your municipality's water department that its consumption-forecasting model achieves 'an RMSE of 4.2'. No other information is given. What should you ask for FIRST to judge whether this is good?","options":["The units and scale of the target, and a simple baseline's RMSE on the same data","The model's RMSE on its training data, to check that it is lower than 4.2","The algorithm family and the number of input features the model relies on","The model's R² on its training data, to check that it is close to 1.0"],"answer":[0],"explain":"الـ RMSE رقم بوحدة الهدف ولا معنى له منفردًا: 4.2 قد تكون ممتازة إذا كان الاستهلاك بالآلاف وسيئة إذا كان بالعشرات. لذلك نحتاج أولًا إلى وحدة الهدف ومداه، وإلى خطأ baseline بسيط (مثل قيمة الأسبوع الماضي) على البيانات نفسها لمعرفة ما أضافه النموذج. مقاييس بيانات التدريب لا تدل على الأداء على بيانات جديدة، ونوع الخوارزمية لا يحدد جودة التنبؤ."},{"id":"eval2-053","domain":"eval","level":"associate","tags":["cv-variance","model-comparison"],"stem":"You compare two crop-yield models for an agricultural cooperative on the same 5 folds; each fold holds a different growing region. Both models take minutes to train and use the same features. The cooperative says it needs dependable accuracy in every region rather than the best average. Based on the fold RMSEs below, which conclusion is MOST appropriate?","table":{"caption":"RMSE per fold (lower is better)","headers":["Fold","Model A","Model B"],"rows":[["1","20","14"],["2","21","30"],["3","20","12"],["4","19","31"],["5","20","12"]]},"options":["Model B, since its mean RMSE of 19.8 is below Model A's mean RMSE of 20.0","Model A, since the 0.2 gap in means is trivial next to Model B's swings across regions","Model B, since it achieves the lower RMSE in three of the five regional folds","Neither, since two models scored on the same folds cannot be compared"],"answer":[1],"explain":"متوسط Model A يساوي 20.0 ومتوسط Model B يساوي 19.8، لكن فرق 0.2 لا يُذكر أمام تذبذب B بين 12 و31 عبر المناطق، في حين يبقى A بين 19 و21. وبما أن العميل يريد دقة يمكن الاعتماد عليها في كل منطقة، فـ Model A هو الأنسب لأن B يفشل بشدة في منطقتين. الاعتماد على المتوسط وحده أو على عدد الطيات التي فاز بها B يتجاهل تباين التقدير، واستخدام الطيات نفسها هو الممارسة الصحيحة للمقارنة لا مانعًا لها."},{"id":"eval2-054","domain":"eval","level":"associate","tags":["learning-curve","high-bias"],"stem":"A water utility's linear model predicts daily consumption per district from temperature, day of week and population. The learning curve is shown below; the business target is an RMSE below 10. A manager has offered budget to buy more historical data of the same kind. Which TWO actions are MOST likely to help reach the target? (Select TWO)","chart":{"type":"line","title":"Learning curve: linear model","xLabel":"Training set size (rows)","yLabel":"RMSE","x":["500","1k","2k","5k","10k","20k"],"series":[{"name":"Training","values":[14.0,15.5,16.4,16.9,17.1,17.2]},{"name":"Validation","values":[19.5,18.4,17.9,17.6,17.5,17.4]}]},"options":["Collect another 20,000 rows with the same features","Add informative features or interaction terms","Use a more flexible model such as gradient boosting","Increase the strength of the regularisation","Remove half of the current input features"],"answer":[1,2],"explain":"منحنيا التدريب والـ validation تقاربا عند RMSE ≈ 17 وكلاهما أعلى بكثير من الهدف 10، وهذا نمط high bias (underfitting): النموذج أبسط من أن يلتقط العلاقة. العلاج هو زيادة قدرة النموذج بإضافة features مفيدة أو تفاعلات، أو استخدام نموذج أكثر مرونة. جمع مزيد من الصفوف مغرٍ لكنه لن يفيد لأن المنحنيين استقرا ولم يعد هناك فجوة لتُغلق، وزيادة الـ regularization أو حذف features يزيدان الـ underfitting."},{"id":"eval2-055","domain":"eval","level":"assistant","tags":["learning-curve","high-variance"],"stem":"You train a deep decision-tree ensemble to predict shipping cost for a freight company. The learning curve is shown below. What does the chart MOST strongly suggest?","chart":{"type":"line","title":"Learning curve: tree ensemble","xLabel":"Training set size (rows)","yLabel":"MAE","x":["1k","2k","4k","8k","16k"],"series":[{"name":"Training","values":[1.0,1.4,1.9,2.3,2.6]},{"name":"Validation","values":[9.8,8.1,6.6,5.4,4.5]}]},"options":["High bias: both errors are high and close, so a much more complex model is needed","A good fit: the curves have converged, so no change is needed","High variance: the gap is large, and more training data should keep helping","Data leakage: the validation rows are being seen during training"],"answer":[2],"explain":"خطأ التدريب منخفض جدًا بينما خطأ الـ validation أعلى بكثير، وهذه الفجوة الكبيرة علامة high variance (overfitting). وبما أن خطأ الـ validation ما زال ينخفض بوضوح مع كل مضاعفة للبيانات والفجوة تضيق، فإن جمع بيانات أكثر (أو زيادة الـ regularization) سيفيد. الـ high bias يظهر عندما يكون المنحنيان مرتفعين ومتقاربين، وهذا ليس الحال هنا. أما الـ leakage فيجعل خطأ الـ validation منخفضًا بشكل مريب لا مرتفعًا."},{"id":"eval2-056","domain":"eval","level":"assistant","tags":["validation-curve","hyperparameter-tuning"],"stem":"For a decision-tree regressor predicting energy consumption of office buildings, you plot a validation curve over max_depth (shown below). Which max_depth should you choose?","chart":{"type":"line","title":"Validation curve: decision tree","xLabel":"max_depth","yLabel":"RMSE","x":["2","4","6","8","10","12"],"series":[{"name":"Training","values":[30,24,18,12,7,3]},{"name":"Validation","values":[32,27,23,25,29,33]}]},"options":["2, because the gap between training and validation is smallest there","6, because the validation RMSE reaches its minimum there","12, because the training RMSE reaches its minimum there","8, because it lies midway between underfitting and overfitting"],"answer":[1],"explain":"الهدف من الـ validation curve هو اختيار قيمة الـ hyperparameter التي تعطي أقل خطأ على بيانات الـ validation، وهي هنا max_depth = 6 حيث RMSE = 23. بعد هذا العمق يستمر خطأ التدريب في الانخفاض بينما يرتفع خطأ الـ validation، أي يبدأ الـ overfitting، فاختيار 12 بناءً على خطأ التدريب هو الخطأ الشائع. أما العمق 2 فالفجوة عنده صغيرة لكن الخطأين مرتفعان (underfitting)، وصِغر الفجوة وحده ليس معيارًا."},{"id":"eval2-057","domain":"eval","level":"associate","tags":["error-analysis","slicing"],"stem":"You built a model predicting customers' monthly spend at a telecom operator; marketing will use it to size welcome offers for newly joined customers as well as retention offers. Overall test MAE is 18 riyals, which meets the target of 20. The table breaks the test set down by customer tenure. Which TWO conclusions are appropriate? (Select TWO)","table":{"caption":"Test MAE by customer tenure","headers":["Segment","Test rows","MAE (riyals)"],"rows":[["Under 3 months","1,000","54"],["3–12 months","4,000","21"],["1–3 years","6,000","16"],["Over 3 years","9,000","14"],["All customers","20,000","18"]]},"options":["The model is acceptable for every segment, because the overall MAE meets the 20-riyal target","The overall MAE hides poor results for the newest customers, whose error is far above the target","The newest customers should be removed from the test set, because their rows act as outliers","The model overfits long-tenure customers, because their segment has the lowest MAE of all","Error analysis should focus on new customers, e.g. whether short histories leave features empty"],"answer":[1,4],"explain":"المتوسط العام 18 ريالًا تهيمن عليه الشرائح الكبيرة ذات الخطأ المنخفض، بينما العملاء الجدد (أقل من 3 أشهر) خطؤهم 54 ريالًا أي قرابة ثلاثة أضعاف الهدف، وهذا ما يكشفه تقسيم الأداء بحسب الشريحة (slicing). الخطوة المنطقية هي تركيز الـ error analysis على هذه الشريحة، مثل فحص ما إذا كان قِصر التاريخ يترك الـ features فارغة. حذف الشريحة من الـ test set يخفي المشكلة ولا يحلها لأن النموذج سيخدم هؤلاء العملاء في الإنتاج، وانخفاض الخطأ لدى القدامى ليس دليلًا على overfitting."},{"id":"eval2-058","domain":"eval","level":"assistant","tags":["error-analysis","next-step"],"stem":"Your house-price model for a real-estate agency has a test MAE well above the target, and you have one week to improve it. Nobody has yet looked at where the model goes wrong. What should you do FIRST?","options":["Replace the current algorithm with a deep neural network","Launch a much larger hyperparameter search on the same features","Add every available raw column as a feature and retrain the model again","Review the listings with the largest errors for shared characteristics"],"answer":[3],"explain":"الـ error analysis هي أرخص وأسرع طريقة لمعرفة أين يفشل النموذج: فحص الحالات ذات الأخطاء الأكبر قد يكشف نمطًا مشتركًا مثل حي معين، أو نوع عقار، أو أخطاء إدخال في البيانات، فيوجّه الجهد إلى العلاج الصحيح. تغيير الخوارزمية أو توسيع الـ hyperparameter search دون تشخيص هو تخمين قد يستهلك الأسبوع دون فائدة، وإضافة كل الأعمدة الخام قد تُدخل ضوضاء أو leakage."},{"id":"eval2-059","domain":"eval","level":"expert","tags":["slicing","model-comparison","business-priority"],"stem":"You are a data scientist at a Gulf bank. A model estimates each customer's expected annual deposit balance, which relationship managers use to prioritise outreach and which treasury uses for liquidity planning. A challenger model built by a new team member has been evaluated against the current champion on the same test set of 20,000 customers; results are below. Private-banking customers are 5% of customers but hold about 60% of total deposits, and the business has stated in writing that accuracy on this segment matters most. The challenger also trains 20% faster, both models use the same features, and the head of analytics would like to announce an improved model at the next quarterly review. What is the MOST appropriate recommendation?","table":{"caption":"Test MAPE by segment","headers":["Segment","Test customers","Champion","Challenger"],"rows":[["Mass","16,000","25%","20%"],["Affluent","3,000","20%","18%"],["Private banking","1,000","14%","26%"],["All customers","20,000","23.7%","20.0%"]]},"options":["Deploy the challenger, because its overall MAPE is lower on the very same test set","Deploy the challenger, because private banking is only 5% of customers and barely moves the total","Hold the challenger back and investigate why it is far worse on the private-banking segment","Deploy the challenger, because faster training will allow more frequent retraining later on"],"answer":[2],"explain":"الـ MAPE الإجمالي للـ challenger أفضل (20.0% مقابل 23.7%) لأن شريحة Mass تمثل 80% من العملاء، لكن خطأه في شريحة private banking يقارب الضعف (26% مقابل 14%)، وهي الشريحة التي تحمل 60% من الودائع وصرّح العمل بأنها الأهم. لذلك لا يصح استبدال الـ champion قبل فهم سبب التراجع في هذه الشريحة ومعالجته. الحكم بالمتوسط العام وحده يتجاهل أن قيمة الخطأ للعمل غير موزعة بالتساوي بين العملاء، وسرعة التدريب ميزة ثانوية."},{"id":"eval2-060","domain":"eval","level":"associate","tags":["fairness","group-metrics"],"stem":"A fintech uses a regression model to set initial credit limits for new customers. A regulator asks whether the model performs equally well for male and female applicants. Gender is recorded for every applicant in the test set of 30,000 but is not used as a model input. Which TWO checks are MOST appropriate? (Select TWO)","options":["Compute the error metric, such as MAE, separately for each group on the test set","Confirm that gender is not an input feature, which guarantees equal performance for both groups","Report the overall R², since a high overall value implies that every group is served well","Compare the mean signed error per group, to see if one group is systematically under-estimated","Balance men and women in the training set, which makes testing the groups separately unnecessary"],"answer":[0,3],"explain":"التحقق الأساسي من العدالة هو تقسيم الأداء بحسب المجموعة: حساب الـ MAE لكل مجموعة يبيّن هل الدقة متقاربة، ومتوسط الخطأ بإشارته (signed error) يكشف هل يُقدَّر حد إحدى المجموعتين بأقل من الواقع بشكل منهجي. استبعاد الجنس من المدخلات لا يضمن شيئًا لأن features أخرى قد تعمل كـ proxy له، والـ R² الإجمالي المرتفع قد يخفي أداءً ضعيفًا لمجموعة بعينها. وموازنة بيانات التدريب قد تساعد لكنها لا تغني عن القياس الفعلي لكل مجموعة."},{"id":"eval2-061","domain":"eval","level":"associate","tags":["fairness","proxy-features"],"stem":"An insurer removes 'nationality' from a motor premium-pricing model to avoid unfair treatment and then declares the model fair in its internal audit report. Features such as postcode, occupation and years of holding a local driving licence remain in the model. Nationality is still available in the data warehouse. What is the BEST assessment?","options":["The model is now fair by construction, because it can no longer see nationality","Remaining features can act as proxies, so results must still be compared across groups","Fairness can be assessed only after deployment, from the complaints that customers file","Nationality should be restored, because removing any feature always lowers accuracy"],"answer":[1],"explain":"حذف الخاصية الحساسة (fairness through unawareness) لا يكفي، لأن features مثل الرمز البريدي والمهنة قد ترتبط بقوة بالجنسية وتعمل كـ proxy لها، فيبقى الأثر غير العادل قائمًا. لذلك يجب الاحتفاظ بالخاصية لأغراض التقييم فقط وقياس المخرجات والأخطاء لكل مجموعة على الـ test set. الادعاء بأن النموذج عادل بحكم تصميمه هو الخطأ الأكثر شيوعًا، وانتظار الشكاوى بعد النشر يعني اكتشاف الضرر بعد وقوعه."},{"id":"eval2-062","domain":"eval","level":"expert","tags":["fairness","sample-size","uncertainty"],"stem":"In a fairness review of a salary-benchmarking model for a government HR department, you slice the test set by several employee attributes. The model proposes a market-aligned salary for each job profile, and errors are measured against salaries set by an expert committee. Test MAE is 1,150 riyals for the 8,400 employees without a recorded disability and 1,900 riyals for the 35 employees with one. Among those 35, three employees in rare specialist roles have errors above 9,000 riyals. A reviewer wants to publish in the department's annual report that the model is 'substantially less accurate for employees with disabilities', while the project manager prefers to ignore the finding altogether because the group is so small. What is the MOST appropriate next step?","options":["Publish the statement as it is, because a 750-riyal gap measured on test data is conclusive","Dismiss the gap, because 35 employees are too few to affect the model's overall accuracy","Put a confidence interval on the small group's MAE and gather more cases before concluding","Duplicate the 35 employees in the test set until the two groups have equal numbers of rows"],"answer":[2],"explain":"مع 35 حالة فقط يكون تقدير الـ MAE للمجموعة الصغيرة عالي التباين، فقد تكون الفجوة حقيقية وقد تكون ناتجة عن بضع حالات متطرفة؛ لذا يجب قياس عدم اليقين (مثلًا bootstrap confidence interval) وجمع حالات موسومة إضافية قبل الجزم، مع التعامل مع الفجوة كإشارة تحذير تستحق المتابعة. النشر الفوري يتجاهل ضعف الدليل، وتجاهل الفجوة لصغر العدد يهمل احتمال ضرر حقيقي. وتكرار الصفوف نفسها لا يضيف أي معلومة جديدة بل يعطي ثقة زائفة."},{"id":"eval2-063","domain":"eval","level":"associate","tags":["offline-vs-online","proxy-metric"],"stem":"You are a data scientist at an online bookstore that sells both printed books and e-books. The recommendation team predicts the star rating a user would give each book and shows the books with the highest predicted rating. A new model lowers offline RMSE on held-out ratings from 0.92 to 0.85, the largest improvement in two years. In a four-week online experiment with sufficient traffic, however, revenue per visitor and click-through rate are unchanged compared with the old model. The experiment was checked and correctly randomised, and both models had the same latency. The content team refreshed book cover images during the period for all users. What is the MOST likely explanation?","options":["The offline test set must have leaked, since genuine offline gains always carry over online","Rating RMSE is only a proxy; predicting ratings better need not change what users buy","The cover-image refresh cancelled out the new model's gain during the experiment period","Four weeks is too short for any recommender experiment, which needs a full year of data"],"answer":[1],"explain":"الـ RMSE على التقييمات مقياس offline بديل (proxy) ولا يطابق هدف العمل: تحسين دقة التنبؤ بالنجوم، خصوصًا للكتب التي لن تُعرض أصلًا، لا يغيّر بالضرورة ترتيب الكتب المعروضة ولا قرارات النقر والشراء. هذا مثال معتاد على عدم تطابق الـ offline metric مع الـ online business metric، والعلاج اختيار مقياس offline أقرب لسلوك الشراء وتأكيده بتجارب online. تحديث الأغلفة طُبّق على جميع المستخدمين في المجموعتين فلا يفسر النتيجة، والمكاسب offline لا تنتقل دائمًا إلى online."},{"id":"eval2-064","domain":"eval","level":"expert","tags":["offline-vs-online","evaluation-strategy"],"stem":"A logistics company has built a new delivery-time prediction model whose estimates are shown to customers in the app. The team is deciding how to evaluate it before a full rollout, with some members arguing for offline tests only and others for going directly to live traffic. Which TWO statements about offline and online evaluation are correct? (Select TWO)","options":["A lower offline RMSE guarantees a higher customer-satisfaction score once the model is deployed","Online tests make offline evaluation unnecessary, so candidates can go straight to live traffic","The offline metric should mirror the business cost of errors, or offline gains may not move the KPI","Offline evaluation is a cheap filter, but business impact should be confirmed in a controlled online test","When offline and online results disagree, the offline result wins because it uses more data"],"answer":[2,3],"explain":"التقييم offline سريع ورخيص ويصلح لتصفية النماذج المرشحة، لكنه يقيس proxy فقط؛ لذلك يجب اختيار مقياس offline يعكس تكلفة الخطأ الفعلية للعمل، ثم تأكيد الأثر على الـ KPI بتجربة online مضبوطة. لا يوجد ضمان بأن انخفاض الـ RMSE يرفع رضا العملاء، فالعلاقة بينهما غير مباشرة. وتجاوز التقييم offline يعرّض العملاء لنماذج سيئة دون داعٍ، وعند التعارض تكون نتيجة الـ online هي الأقرب لهدف العمل الحقيقي لا العكس."},{"id":"eval2-065","domain":"eval","level":"assistant","tags":["production-representative","test-set-recency"],"stem":"A tourism company's hotel-demand model was trained and tested on bookings from 2019–2021 and will be deployed in 2026 to set room allocations. Travel patterns, booking channels and lead times have changed considerably since then, and labelled bookings from 2025 are available. What is the MOST appropriate step before trusting the test score?","options":["Trust the score, since a test set never used in training is always representative","Enlarge the 2019–2021 test set, to reduce the variance of the estimate","Re-split the 2019–2021 data with a new random seed and test the model again","Re-evaluate on the most recent labelled bookings, which resemble deployment"],"answer":[3],"explain":"الـ test set يجب أن يمثل البيانات التي سيواجهها النموذج في الإنتاج؛ وبما أن أنماط السفر تغيرت منذ 2019–2021، فإن نتيجة الاختبار القديمة لا تقول الكثير عن الأداء في 2026. الخطوة الصحيحة هي التقييم على أحدث حجوزات موسومة متاحة. كون الـ test set لم يُستخدم في التدريب يضمن عدم التسرب فقط ولا يضمن التمثيل، وتكبيره أو إعادة تقسيمه من الفترة القديمة نفسها يقلل التباين لكنه يبقي الانحياز الزمني كما هو."},{"id":"eval2-066","domain":"eval","level":"associate","tags":["production-representative","selection-bias","missing-data"],"stem":"You are a data scientist at a hospital group building a model to predict emergency-department waiting time. During data preparation, a colleague dropped every row with any missing value (about 35% of visits, mostly night-shift visits where triage fields are often skipped) and then split the remaining data into training and test sets. The model achieves a test MAE of 11 minutes, within the 15-minute target, and the project sponsor wants to present this figure to the board next week. In production, the model will score every arriving patient, including those with missing triage fields, using a default imputation. The hospital recently repainted the waiting area and renewed its cafeteria contract. What is the MAIN risk in reporting the 11-minute figure?","options":["Dropping rows shrank the training set, so the model is certainly underfitting the remaining data","The test set omits the incomplete visits seen in production, so 11 minutes is likely optimistic","MAE is unsuitable for waiting times, so the figure should be replaced by the RMSE","The test set became too large relative to the training set once the rows were dropped"],"answer":[1],"explain":"الـ test set بعد حذف الصفوف الناقصة يمثل فقط الزيارات المكتملة البيانات، بينما سيُستخدم النموذج في الإنتاج على جميع المرضى بمن فيهم 35% ذوو الحقول الناقصة، ومعظمهم من الوردية الليلية ذات الظروف المختلفة. لذلك فالرقم 11 دقيقة مقيس على مجتمع أسهل من الواقع ويُرجَّح أنه متفائل. الصحيح إبقاء هذه الزيارات في الـ test set وتطبيق الـ imputation نفسه المستخدم في الإنتاج عليها. نقص حجم التدريب قد يؤثر لكنه ليس الخطر الرئيسي ولا يعني underfitting مؤكدًا."},{"id":"eval2-067","domain":"eval","level":"associate","tags":["production-representative","peak-season"],"stem":"A transport operator in Makkah builds an hourly passenger-demand model for its bus network. The random test set comes from eleven ordinary months; the Hajj season weeks were excluded because 'they are unusual'. The model's main purpose is capacity planning for the coming Hajj season. Which evaluation change is MOST important?","options":["Evaluate on held-out data from previous Hajj seasons, the condition the model must serve","Keep the current test set, since ordinary months give a more stable and reliable metric","Add more ordinary months to the test set, to narrow the metric's confidence interval","Report MAPE instead of MAE, so that the unusual peak hours carry less weight"],"answer":[0],"explain":"الغرض الأساسي من النموذج هو التخطيط لموسم الحج، بينما الـ test set الحالي لا يحتوي أي بيانات من الموسم، فالنتيجة لا تقول شيئًا عن الأداء في الظرف الأهم. يجب تقييم النموذج على بيانات محجوبة من مواسم حج سابقة لأنها تمثل التوزيع الذي سيعمل عليه. استقرار المقياس على الأشهر العادية مغرٍ لكنه يقيس الشيء الخطأ، وإضافة أشهر عادية أخرى تضيّق الـ confidence interval لتقدير غير ذي صلة."},{"id":"eval2-068","domain":"eval","level":"assistant","tags":["clustering","silhouette"],"stem":"You cluster retail customers with k-means (k = 5) and obtain an average silhouette score of 0.04. No labels exist. What does this score MOST likely indicate?","options":["The clusters overlap heavily and are not well separated","The clusters are compact and clearly separated from each other","About 4% of the customers were assigned to the wrong cluster","The clusters explain about 4% of the variance in customer spend"],"answer":[0],"explain":"الـ silhouette score يتراوح بين −1 و1: القيم القريبة من 1 تعني عناقيد متماسكة ومنفصلة، والقيم القريبة من الصفر تعني أن النقاط تقع قرب الحدود بين العناقيد، أي أن العناقيد متداخلة والبنية ضعيفة. القيمة 0.04 إذن تشير إلى فصل سيئ وتستدعي تجربة قيم k أخرى أو features مختلفة. وهو ليس نسبة أخطاء في التعيين ولا نسبة تباين مفسَّر، فلا توجد labels أصلًا لحساب ذلك."},{"id":"eval2-069","domain":"eval","level":"associate","tags":["clustering","business-validation"],"stem":"For a bank's marketing team you segmented 200,000 retail customers with k-means on standardised features describing balances, product holdings and channel usage. No labels exist, so you compared several values of k. k = 2 gives the highest silhouette score (0.61), but the two clusters simply separate mortgage holders from everyone else, which marketing already knows and cannot act on. k = 5 has a lower silhouette (0.43) but yields segments with distinct product usage that marketing can target with different campaigns, and the segments stay stable across bootstrap resamples. A colleague insists the 'mathematically best' k must be used. The campaign budget for next year has already been approved. Which choice is MOST appropriate?","options":["k = 2, because the highest silhouette always identifies the correct number of clusters","k = 2, followed by a hold-out test set on which the clustering's R² can be computed","Neither, because a clustering cannot be evaluated at all without ground-truth labels","k = 5, because segments must be actionable, and silhouette is only one guide among several"],"answer":[3],"explain":"في الـ clustering بلا labels لا يوجد 'عدد صحيح' مطلق للعناقيد؛ الـ silhouette مؤشر داخلي مفيد لكنه لا يقيس الفائدة للعمل. الحل k = 5 له silhouette مقبول (0.43) ومستقر عبر إعادة المعاينة ويعطي شرائح يمكن للتسويق استهدافها بحملات مختلفة، بينما k = 2 يعيد اكتشاف معلومة معروفة. لذلك يكون التحقق من جهة العمل (business validation) هو الحاسم. والقول باستحالة التقييم دون labels خاطئ، فهناك مقاييس داخلية واختبارات استقرار وتقييم من الخبراء."},{"id":"eval2-070","domain":"eval","level":"expert","tags":["clustering","stability"],"stem":"An education authority's analyst clusters schools into performance profiles. Each time k-means is rerun on a different 80% bootstrap sample, the cluster memberships change drastically (the adjusted Rand index between runs is about 0.2), although the silhouette score stays around 0.35. Funding would be allocated by cluster. What is the MOST appropriate conclusion?","options":["The segmentation is reliable, because the silhouette score is the same in every run","The segmentation is unstable and should not drive funding until a stable solution is found","Fixing the random seed and the sample will stop the changes, so funding can then safely proceed","The number of clusters should be raised until the adjusted Rand index drops to zero"],"answer":[1],"explain":"الـ adjusted Rand index بين التشغيلات يقارب 0.2، أي أن المدرسة نفسها تنتقل من عنقود إلى آخر بمجرد تغيير العينة، فالتقسيم لا يعكس بنية حقيقية في البيانات ولا يصح أن تُبنى عليه قرارات تمويل. ثبات الـ silhouette حول 0.35 لا يعني ثبات العضويات، إذ يمكن لتقسيمات مختلفة تمامًا أن تحقق الدرجة نفسها. تثبيت الـ seed يخفي عدم الاستقرار ولا يعالجه، والمطلوب تجربة k أو features أو خوارزمية أخرى حتى يصبح الحل مستقرًا (ARI مرتفع)."},{"id":"ml1-001","domain":"ml","level":"assistant","tags":["linear-regression","heteroscedasticity","residual-plot"],"stem":"You are a data scientist at a real-estate platform in Riyadh. You fit an ordinary least squares model to predict villa sale prices in riyals. The plot of residuals against fitted values shows a clear funnel shape: residuals are small for cheap properties and spread widely for expensive ones. The business wants reliable prediction intervals across all price ranges. Which action is MOST appropriate?","options":["Remove the expensive villas, since they are outliers that distort the fit","Model the log of price instead and then re-check the residual plot","Standardize all input features so that the residual spread becomes constant","Add more rows of training data until the funnel shape disappears"],"answer":[1],"explain":"الشكل القُمعي في الـ residual plot يعني heteroscedasticity، أي أن تباين الأخطاء يزداد مع السعر، وهذا يُفسد الـ prediction intervals. تحويل الـ target بالـ log هو العلاج المعتاد للأسعار لأن الخطأ فيها نسبي، ثم نعيد فحص الـ residuals. أما توحيد مقياس الـ features فلا يغيّر تباين الـ residuals إطلاقاً، وحذف الفلل الغالية يُفقد النموذج شريحة يحتاجها العمل."},{"id":"ml1-002","domain":"ml","level":"assistant","tags":["linear-regression","residual-plot","non-linearity"],"stem":"An energy company's linear regression of electricity load on outdoor temperature shows a clear U-shaped pattern in the residuals-versus-fitted plot. What does this pattern MOST likely indicate?","options":["The residuals have non-constant variance, so weighted least squares is needed","Two of the input features are highly correlated with each other","The relationship is non-linear, so a curved term is missing from the model","The model is overfitting and needs a stronger regularization penalty"],"answer":[2],"explain":"نمط على شكل U في الـ residuals يعني أن النموذج يخطئ بشكل منتظم: يبالغ في مناطق ويقلّل في أخرى، وهذا دليل على علاقة غير خطية لم تُمثَّل (مثل حد تربيعي لدرجة الحرارة). عدم ثبات التباين يظهر كشكل قُمعي لا كمنحنى، ولذلك فهو تشخيص خاطئ هنا. والنموذج في الحقيقة يعاني underfitting لا overfitting."},{"id":"ml1-003","domain":"ml","level":"associate","tags":["linear-regression","multicollinearity","vif"],"stem":"You are a data scientist at an insurance company in the Gulf building a linear regression that explains annual motor claim cost to the actuarial team, who will use the coefficients themselves to justify pricing factors to management. The dataset holds 28,000 policies from the last three underwriting years, and missing values are below 1% in every column. When you refit the model on a different random sample, the coefficients of two features change sign, although overall R² stays stable at about 0.74 and the validation error barely moves. A colleague argues that the instability does not matter because the predictions are fine. You compute variance inflation factors, shown below. What is the MOST appropriate next step?","table":{"caption":"Variance inflation factors","headers":["Feature","VIF"],"rows":[["vehicle_age","1.3"],["engine_size_cc","14.8"],["horsepower","16.2"],["driver_age","1.6"],["annual_km","2.1"]]},"options":["Add an interaction term between engine size and horsepower to capture their shared effect","Keep all features, since a stable R² proves that the individual coefficients are reliable","Drop or combine engine size and horsepower, then refit and re-check the coefficients","Apply min-max scaling to every feature in order to bring all VIF values below 5"],"answer":[2],"explain":"قيم الـ VIF المرتفعة (14.8 و16.2) تدل على multicollinearity بين engine_size_cc و horsepower، وهذا يجعل الـ coefficients غير مستقرة وتنقلب إشارتها رغم ثبات الـ R². وبما أن الفريق الاكتواري سيفسّر الـ coefficients نفسها، فالحل هو حذف أحدهما أو دمجهما ثم إعادة الفحص. تغيير المقياس بـ min-max لا يغيّر الارتباط بين الـ features فلا يخفض الـ VIF، وإضافة interaction تزيد الارتباط سوءاً."},{"id":"ml1-004","domain":"ml","level":"assistant","tags":["linear-regression","coefficient-interpretation"],"stem":"A retailer's linear regression is: weekly_sales = 12,000 + 350 × ad_spend_thousands − 80 × competitor_stores, with sales in riyals. Holding the number of competitor stores constant, what change in predicted weekly sales is associated with increasing ad spend by 4 thousand riyals?","options":["An increase of 350 riyals","An increase of 1,400 riyals","An increase of 13,400 riyals","An increase of 1,080 riyals"],"answer":[1],"explain":"الـ coefficient يعني التغيّر في الـ target لكل وحدة واحدة من الـ feature مع تثبيت بقية الـ features، إذن 350 × 4 = 1,400 ريال. الخطأ الشائع هو إضافة الـ intercept (12,000) إلى الناتج، بينما الـ intercept ثابت ولا يدخل في حساب التغيّر. كذلك لا يُطرح أثر competitor_stores لأنه مُثبَّت."},{"id":"ml1-005","domain":"ml","level":"assistant","tags":["linear-regression","influential-points","data-quality"],"stem":"You are a data scientist at a logistics company modelling delivery cost per shipment with linear regression. The dataset has 4,200 shipments from the last fiscal year, with 11 features, collected from three regional depots that use the same billing system. After fitting, one observation has a Cook's distance many times larger than any other: a shipment recorded with a weight of 98,000 kg, while the next heaviest is 1,900 kg. Removing that single row changes the weight coefficient by 40%. The operations manager mentions that the company bought two new trucks in March, and the finance team wants the model by the end of the week. What should you do FIRST?","options":["Verify with the data owners whether the record is a genuine shipment or an entry error","Delete the row immediately, since any influential point makes a regression invalid","Keep the row exactly as it is, since removing data always biases the fitted model","Switch to a decision tree model so that the outlier no longer needs to be investigated"],"answer":[0],"explain":"نقطة ذات Cook's distance ضخم تغيّر الـ coefficient بنسبة 40%، لذا يجب أولاً معرفة حقيقتها: هل هي خطأ إدخال (مثلاً غرامات بدل كيلوغرامات) أم شحنة حقيقية؟ القرار الصحيح (تصحيح أو حذف أو إبقاء) يعتمد على هذا التحقق. الحذف الفوري بلا تحقق قد يُضيع معلومة حقيقية، والإبقاء الأعمى يترك صفاً واحداً يتحكم في النموذج."},{"id":"ml1-006","domain":"ml","level":"assistant","tags":["linear-regression","assumptions"],"stem":"A government statistics team fits an ordinary least squares model to explain monthly household water consumption from household size, dwelling type, region and average temperature. The results will appear in an official report, so the team wants to publish confidence intervals and p-values for the coefficients rather than only predictions. Before doing so, they ask you which conditions need to be verified. Which of the following are assumptions of the classical linear regression model that the team should check? (Select TWO)","options":["The residuals have roughly constant variance across the fitted values","The input features are uncorrelated with the target variable","Every input feature follows a normal distribution","The residuals are independent of one another","The input features are all measured on the same numeric scale"],"answer":[0,3],"explain":"من افتراضات الـ OLS الكلاسيكية: ثبات تباين الـ residuals (homoscedasticity) واستقلالها عن بعضها، وكلاهما ضروري لصحة الـ confidence intervals. الخطأ الشائع هو الظن بأن الـ features نفسها يجب أن تتبع normal distribution؛ الافتراض يخص الـ residuals لا الـ features. كما أن اختلاف مقياس الـ features لا يخالف أي افتراض في الـ OLS."},{"id":"ml1-007","domain":"ml","level":"associate","tags":["logistic-regression","odds-ratio"],"stem":"A bank's logistic regression for loan default has a coefficient of 0.693 for the binary feature has_previous_late_payment (note that e^0.693 ≈ 2). Holding the other features constant, how should this coefficient be interpreted?","options":["A previous late payment roughly doubles the probability of default","A previous late payment raises the probability of default by 69.3 percentage points","A previous late payment roughly doubles the odds of default","A previous late payment adds 0.693 to the odds of default"],"answer":[2],"explain":"في الـ logistic regression يكون الـ coefficient هو التغيّر في الـ log-odds، و e^0.693 ≈ 2 هو الـ odds ratio، أي أن الـ odds تتضاعف تقريباً. الخلط الأكثر شيوعاً هو القول إن الـ probability تتضاعف؛ الـ odds ليست هي الـ probability، وأثر الـ coefficient على الـ probability يختلف حسب نقطة البداية على منحنى الـ sigmoid."},{"id":"ml1-008","domain":"ml","level":"associate","tags":["logistic-regression","coefficients","feature-scaling"],"stem":"You are a data scientist at a telecom operator. A logistic regression churn model was fitted on raw, unscaled features, with the results below, and its validation performance is considered acceptable. In a review meeting, a product manager concludes that complaints matter 150 times more than the monthly bill, because 0.60 / 0.004 = 150, and wants to move the whole retention budget to the complaints team. Which response is MOST accurate?","table":{"caption":"Churn model coefficients (raw features)","headers":["Feature","Observed range","Coefficient"],"rows":[["monthly_bill (riyals)","50 – 900","0.004"],["num_complaints","0 – 6","0.60"],["tenure_months","1 – 120","-0.02"]]},"options":["The conclusion is right, because a larger coefficient always means a more important feature","Raw coefficients depend on each feature's units, so compare them only after standardizing","The conclusion is wrong, because logistic regression coefficients say nothing about importance","The coefficients become comparable once they are converted to odds ratios with the exponential"],"answer":[1],"explain":"قيمة الـ coefficient مرتبطة بوحدة قياس الـ feature: الفاتورة تتحرك بمئات الريالات بينما الشكاوى بين 0 و6، فالمقارنة المباشرة مضلِّلة. بعد standardization يصبح كل coefficient لكل انحراف معياري واحد فتصحّ المقارنة. تحويلها إلى odds ratios لا يحل المشكلة لأن الـ odds ratio يبقى «لكل وحدة» من الوحدات المختلفة نفسها."},{"id":"ml1-009","domain":"ml","level":"associate","tags":["logistic-regression","decision-boundary","underfitting"],"stem":"A manufacturing plant classifies machined parts as defective or good using two sensor readings taken at the end of the line. A scatter plot shows the defective parts forming a ring around a central cluster of good parts. Logistic regression on the two raw readings gives about 55% accuracy on both the training and the validation data, and the two classes are roughly equal in size. Which change would MOST improve the model?","options":["Increase the regularization strength so that the model generalizes better","Collect more labelled parts, because the model has not seen enough examples","Lower the classification threshold from 0.5 to 0.3 to catch more defective parts","Add squared terms of the two readings so that a curved boundary can be learned"],"answer":[3],"explain":"الـ logistic regression على الـ features الخام ترسم decision boundary خطياً، ولا يمكن لخط مستقيم أن يفصل حلقة عن مركزها، ولذلك الدقة منخفضة في الـ training والـ validation معاً (underfitting). إضافة الحدود التربيعية تسمح بحدّ دائري. جمع بيانات أكثر لا يفيد لأن المشكلة في قدرة النموذج لا في كمية البيانات، وزيادة الـ regularization تزيد الـ underfitting."},{"id":"ml1-010","domain":"ml","level":"expert","tags":["model-selection","interpretability","regulation"],"stem":"You are a data scientist at a consumer-finance company in Jeddah building a model that approves or rejects personal loan applications. The training set has 60,000 past applications with 25 well-understood numeric and categorical features. The regulator requires that every rejected applicant can be given the specific factors that reduced their score, and internal audit must be able to reproduce any decision by hand. The marketing team has also asked whether the model could later be reused for cross-selling credit cards. In experiments, a logistic regression reaches an AUC of 0.81 and an RBF-kernel SVM reaches 0.83. The serving infrastructure can handle either model. Which model should you recommend for production?","options":["The logistic regression, because its coefficients give transparent, reproducible reasons","The RBF SVM, because the higher AUC outweighs every other consideration in credit decisions","The RBF SVM, with the list of support vectors shown to applicants as the explanation","A k-nearest-neighbours model, because similar past applicants are the easiest thing to audit"],"answer":[0],"explain":"القيد الحاسم هنا تنظيمي: يجب إعطاء كل مرفوض أسباباً محددة وأن يُعاد حساب القرار يدوياً، وهذا متاح مباشرة في الـ logistic regression عبر الـ coefficients. فرق 0.02 في الـ AUC لا يبرّر نموذج RBF SVM الذي لا يمكن تفسير قراراته، والـ support vectors ليست تفسيراً مفهوماً للعميل. عندما يكون الـ interpretability شرطاً إلزامياً نختار أفضل نموذج يحقق الشرط لا الأعلى دقة."},{"id":"ml1-011","domain":"ml","level":"assistant","tags":["logistic-regression","sigmoid","calculation"],"stem":"A hospital's logistic regression for readmission is: log-odds = −3 + 0.05 × age + 1.0 × prior_admission. For a 40-year-old patient with one prior admission (prior_admission = 1), what is the predicted probability of readmission?","options":["0.00","0.73","0.50","0.27"],"answer":[2],"explain":"نحسب الـ log-odds: −3 + 0.05 × 40 + 1 = 0، ودالة الـ sigmoid عند الصفر تساوي 0.5. الخطأ الشائع هو اعتبار قيمة الـ log-odds نفسها (0) هي الـ probability، بينما يجب تمريرها عبر الـ sigmoid أولاً. القيمتان 0.73 و0.27 تقابلان log-odds يساوي +1 و−1."},{"id":"ml1-012","domain":"ml","level":"expert","tags":["logistic-regression","perfect-separation","regularization"],"stem":"You are a data scientist at an aviation maintenance provider. An unregularized logistic regression that predicts component failure within 30 days is trained on 400 inspection records with 9 features, collected from two hangars over 18 months. The optimizer warns that it did not converge; one coefficient has grown to 38.5 with an enormous standard error, while the others look reasonable. You notice that in this small sample a single feature, vibration_alarm, perfectly separates the two classes: every failed component had the alarm and no healthy one did. Engineers confirm the feature is legitimate and available at prediction time, so it is not leakage. The team wants to keep a logistic regression because its outputs feed a risk report. What is the MOST appropriate fix?","options":["Raise the maximum number of iterations until the optimizer finally converges","Standardize the features, since convergence warnings are always caused by scale","Remove the intercept so that the very large coefficient is absorbed elsewhere","Refit the model with an L2 penalty so that the coefficients stay finite"],"answer":[3],"explain":"عند الـ perfect separation لا يوجد حل محدود للـ maximum likelihood؛ فالـ coefficient يستمر في النمو نحو اللانهاية، ولهذا لا يتقارب الـ optimizer. إضافة L2 penalty تجعل الحل محدوداً ومستقراً مع الإبقاء على الـ feature المفيدة. زيادة عدد الـ iterations لن تفيد لأن المشكلة ليست بطء التقارب بل عدم وجود نقطة تقارب أصلاً."},{"id":"ml1-013","domain":"ml","level":"assistant","tags":["logistic-regression","problem-formulation"],"stem":"A fintech startup uses ordinary linear regression to predict whether a transaction is disputed (1) or not (0). Some predictions come out as −0.2 or 1.3. Which change is MOST appropriate?","options":["Use logistic regression, which models the probability through a sigmoid","Clip the predictions to the range 0 to 1 and keep the linear model","Standardize the features so that the predictions stay between 0 and 1","Add an L2 penalty to shrink the predictions into the valid range"],"answer":[0],"explain":"الـ target ثنائي، والـ linear regression غير مقيّدة فتُخرج قيماً خارج [0, 1] لا معنى لها كاحتمال. الـ logistic regression تمرّر التركيبة الخطية عبر الـ sigmoid فتضمن احتمالاً بين 0 و1 وتُدرَّب بـ log loss المناسب للتصنيف. قصّ القيم (clipping) يخفي العَرَض فقط ويبقى النموذج مُدرَّباً بدالة خسارة غير ملائمة."},{"id":"ml1-014","domain":"ml","level":"associate","tags":["logistic-regression","odds-ratio","calculation"],"stem":"A telecom operator's churn logistic regression is summarized below. Compared with an otherwise identical customer, how do the odds of churn change for a customer who has two additional complaints?","table":{"caption":"Churn model summary","headers":["Feature","Coefficient","Odds ratio"],"rows":[["tenure_years","-0.22","0.80"],["num_complaints","0.41","1.50"],["has_fiber (1/0)","-0.69","0.50"],["monthly_bill_100s","0.10","1.10"]]},"options":["They are multiplied by 3.00","They are multiplied by 1.50","They increase by 0.82","They are multiplied by 2.25"],"answer":[3],"explain":"الـ odds ratio يُطبَّق بالضرب لكل وحدة إضافية، فشكويان إضافيتان تعنيان 1.5 × 1.5 = 2.25. الخطأ المغري هو ضرب الـ odds ratio في عدد الوحدات (1.5 × 2 = 3)، لكن الجمع يحدث على مقياس الـ log-odds (0.41 × 2 = 0.82) وليس على الـ odds نفسها، و e^0.82 ≈ 2.25."},{"id":"ml1-015","domain":"ml","level":"assistant","tags":["regularization","lasso","feature-selection"],"stem":"You are a data scientist at a marketing agency predicting campaign revenue from 400 candidate features, most of which the domain experts believe are irrelevant. About 5,000 past campaigns are available. The client wants a compact linear model that uses only a handful of features, so that it can be maintained easily and explained to account managers. Which approach is MOST appropriate?","options":["Ridge (L2) regression, which sets the coefficients of irrelevant features exactly to zero","Ordinary least squares, keeping only the features whose coefficients look large","Ridge (L2) regression with a very small alpha, so that all the information is kept","Lasso (L1) regression, which can shrink irrelevant coefficients exactly to zero"],"answer":[3],"explain":"الـ L1 penalty في Lasso يدفع coefficients الـ features غير المهمة إلى الصفر تماماً، فينتج نموذجاً sparse يحقق طلب العميل. أما Ridge فيقلّص الـ coefficients نحو الصفر دون أن يصفّرها، فيبقى النموذج معتمداً على الـ 400 feature كلها. واختيار الـ features بحجم coefficients الـ OLS غير موثوق مع هذا العدد الكبير من الـ features."},{"id":"ml1-016","domain":"ml","level":"expert","tags":["regularization","elasticnet","high-dimensional"],"stem":"You are a data scientist at a biotech research institute. You must predict a patient's drug response from 12,000 gene-expression features measured on only 180 patients. Genes that belong to the same biological pathway are highly correlated with each other, and the biologists want the model to select a sparse set of genes but to keep correlated genes from a relevant pathway together rather than picking one of them at random. The lab has recently upgraded its sequencing machines, and the dataset is stored in a cloud bucket in Parquet format. A plain Lasso model selected fewer than 180 genes and arbitrarily kept a single gene per pathway. Which model is MOST appropriate?","options":["ElasticNet, combining L1 sparsity with the L2 grouping effect on correlated features","Ridge regression, because the L2 penalty removes the irrelevant genes from the model","Lasso with a much larger alpha, so that it is forced to keep whole pathways together","Ordinary least squares on all 12,000 genes, to avoid biasing any of the coefficients"],"answer":[0],"explain":"الـ ElasticNet يجمع بين L1 (لإنتاج نموذج sparse) و L2 (الذي يعطي grouping effect فتدخل الـ features المترابطة معاً أو تخرج معاً)، وهذا بالضبط ما يطلبه علماء الأحياء. Lasso وحده يختار جيناً واحداً عشوائياً من كل مجموعة مترابطة ولا يتجاوز عدد العينات، وزيادة alpha تجعله يختار أقل لا أكثر. أما Ridge فلا يحذف أي feature، والـ OLS مستحيل عملياً عندما p أكبر بكثير من n."},{"id":"ml1-017","domain":"ml","level":"associate","tags":["regularization","ridge","alpha-tuning"],"stem":"A logistics company tunes the alpha of a Ridge regression that predicts fuel consumption per route. The results are shown below. Which statement BEST describes what the table shows?","table":{"caption":"Ridge regression: R² by alpha","headers":["alpha","Training R²","Validation R²"],"rows":[["0.001","0.94","0.71"],["0.01","0.93","0.76"],["0.1","0.90","0.84"],["1","0.86","0.85"],["10","0.72","0.71"],["100","0.40","0.40"]]},"options":["Alpha = 0.001 is the best choice, because it achieves the highest training R²","Alpha = 1 gives the best trade-off; smaller values overfit and larger values underfit","Alpha = 100 is the best choice, because its training–validation gap is the smallest","Alpha has little effect here, so the library's default value should simply be kept"],"answer":[1],"explain":"نختار alpha الذي يعطي أعلى Validation R² وهو 1 (0.85). عند القيم الصغيرة يكون الـ training مرتفعاً والـ validation منخفضاً (overfitting)، وعند القيم الكبيرة ينخفض الاثنان معاً (underfitting). صِغَر الفجوة عند alpha = 100 ليس هدفاً بحد ذاته؛ فالنموذج هناك ضعيف على الجهتين."},{"id":"ml1-018","domain":"ml","level":"assistant","tags":["regularization","logistic-regression","hyperparameter-c"],"stem":"A scikit-learn LogisticRegression with C = 1000 scores 0.99 on training data and 0.81 on validation data. Which change to C is MOST likely to reduce the overfitting?","options":["Increase C, because a larger C means stronger regularization","Increase C, because a larger C lets the optimizer converge more fully","Decrease C, because a smaller C means stronger regularization","Leave C unchanged, because C only affects training speed, not the fit"],"answer":[2],"explain":"في scikit-learn الـ C هو معكوس قوة الـ regularization، فتصغير C يعني penalty أقوى ونموذجاً أبسط، وهو المطلوب لعلاج الـ overfitting. الخطأ الشائع هو معاملة C مثل alpha والاعتقاد أن زيادته تزيد الـ regularization، والعكس هو الصحيح."},{"id":"ml1-019","domain":"ml","level":"assistant","tags":["regularization","feature-scaling","ridge"],"stem":"You are a data scientist at a bank fitting a Ridge regression on features with very different units: account balance in riyals (up to millions), number of products (1–8) and customer age in years. A colleague skipped feature scaling because 'linear models do not need it'. After fitting, the balance feature appears to be barely regularized, while the other features are shrunk heavily. Why is scaling important in this case?","options":["Without scaling, the Ridge solution cannot be computed for features in different units","The penalty acts on coefficient size, which depends on the units of each feature","Scaling makes the features normally distributed, which Ridge regression requires","Scaling removes the correlation between features, which the penalty cannot handle"],"answer":[1],"explain":"الـ penalty في Ridge يُطبَّق على حجم الـ coefficients، وحجم الـ coefficient يعتمد على وحدة الـ feature: الرصيد بالملايين يحتاج coefficient صغيراً جداً فلا يكاد يُعاقَب، بينما عدد المنتجات يُعاقَب بشدة. الـ standardization يجعل العقوبة عادلة بين الـ features. الـ scaling لا يجعل التوزيع normal ولا يزيل الـ correlation، وRidge لا يشترط أياً منهما."},{"id":"ml1-020","domain":"ml","level":"associate","tags":["regularization","ridge","bias-variance"],"stem":"You are reviewing a junior colleague's notes on Ridge regression for a retail demand model. The notes will be used to train new analysts, so they must be accurate. The model uses 40 standardized features, and alpha is currently being tuned on a validation set. Which statements about the effect of increasing the regularization strength alpha are correct? (Select TWO)","options":["Coefficients of weak features become exactly zero","The model becomes more sensitive to small changes in the training data","Variance decreases while bias tends to increase","Training error decreases steadily as alpha grows","Coefficient magnitudes shrink towards zero"],"answer":[2,4],"explain":"زيادة alpha في Ridge تقلّص الـ coefficients نحو الصفر، فيصبح النموذج أبسط: ينخفض الـ variance ويرتفع الـ bias. الـ training error يرتفع ولا ينخفض لأن النموذج يُقيَّد عن مطابقة بيانات التدريب. والتصفير التام للـ coefficients خاصية L1 (Lasso) وليس Ridge."},{"id":"ml1-021","domain":"ml","level":"associate","tags":["decision-tree","instability","variance"],"stem":"A government service centre uses a single decision tree to route citizen requests to departments, and the rules are published internally. Each month the tree is retrained on a dataset that differs from the previous one by only a few percent of rows, yet the top splits and the overall structure change noticeably, which frustrates the business owners who read the rules. Validation accuracy stays about the same from month to month. What BEST explains this behaviour?","options":["Trees are high-variance: a small data change can alter an early split and everything below it","Trees are high-bias models, so they cannot settle on one consistent structure over time","The features were not scaled, so split thresholds move whenever the data changes slightly","The Gini criterion is random by design, so each training run produces a different tree"],"answer":[0],"explain":"الـ decision tree نموذج ذو variance عالٍ؛ فالبناء greedy وهرمي، وأي تغيير طفيف في البيانات قد يغيّر split في الأعلى فيتغيّر كل ما تحته. هذه خاصية معروفة باسم instability. الأشجار لا تتأثر بالـ scaling أصلاً، ومعيار Gini حتمي وليس عشوائياً."},{"id":"ml1-022","domain":"ml","level":"associate","tags":["decision-tree","gini","calculation"],"stem":"A decision tree node at a telecom company contains 100 customers: 80 who stayed and 20 who churned. What is the Gini impurity of this node?","options":["0.16","0.20","0.32","0.68"],"answer":[2],"explain":"الـ Gini impurity = 1 − Σp² = 1 − (0.8² + 0.2²) = 1 − 0.68 = 0.32. القيمة 0.68 هي مجموع المربعات قبل الطرح من 1، والقيمة 0.16 هي حاصل ضرب النسبتين فقط دون مضاعفته، وكلاهما خطأ حسابي شائع."},{"id":"ml1-023","domain":"ml","level":"expert","tags":["decision-tree","splitting-criteria","gini"],"stem":"You are debugging a custom decision-tree implementation at an insurance company, because its splits differ from those chosen by scikit-learn on the same data. The parent node holds 100 policies: 50 with a claim and 50 without. Two candidate splits are shown below; your implementation picks split Y because it produces a pure node. Using weighted Gini impurity, which split should the tree choose, and why?","table":{"caption":"Candidate splits (claim / no claim counts)","headers":["Split","Left node","Right node"],"rows":[["X","40 / 10","10 / 40"],["Y","20 / 0","30 / 50"]]},"options":["Split X, because its weighted Gini is 0.32 versus 0.375 for split Y","Split Y, because it creates a perfectly pure node, which always wins","Split Y, because its weighted Gini is 0.30 versus 0.32 for split X","Either split, because both reduce the parent impurity of 0.5 equally"],"answer":[0],"explain":"في Split X كل فرع له Gini = 1 − (0.8² + 0.2²) = 0.32، فالمتوسط الموزون 0.32. في Split Y الفرع النقي له 0، والفرع الآخر (30/50 من 80) له 0.46875، فالمتوسط الموزون 0.8 × 0.46875 = 0.375. إذن X أفضل. وجود node نقي مغرٍ لكنه لا يكفي؛ المعيار هو الـ impurity الموزون لكل الفروع، والفرع الكبير في Y ما زال مختلطاً."},{"id":"ml1-024","domain":"ml","level":"associate","tags":["decision-tree","pruning","ccp-alpha"],"stem":"A healthcare analytics team has a fully grown decision tree with 900 leaves that predicts missed appointments. It scores 0.99 on the training set and 0.71 on validation data, so it clearly overfits. The team wants a smaller tree but does not want to guess a depth limit by hand. scikit-learn offers cost-complexity pruning through ccp_alpha, and the pruning path gives a list of candidate alpha values. How should they choose the value?","options":["Pick the alpha that gives the highest training accuracy along the pruning path","Pick the largest alpha available, because the smallest tree is always the most reliable","Pick the alpha whose pruned tree scores best on held-out validation data","Set alpha to zero, because pruning is only needed when a tree underfits"],"answer":[2],"explain":"الـ ccp_alpha هو hyperparameter يوازن بين دقة الشجرة وعدد أوراقها، ويُختار مثل أي hyperparameter بتقييم الأشجار على بيانات validation. اختياره بأعلى training accuracy سيعطي دائماً alpha = 0 أي الشجرة الكاملة المصابة بالـ overfitting. وأكبر alpha يقلّص الشجرة إلى الجذر فقط فتصاب بالـ underfitting."},{"id":"ml1-025","domain":"ml","level":"associate","tags":["decision-tree","min-samples-leaf","interpretability"],"stem":"You are a data scientist at a Gulf retail bank. A decision tree segments customers for a pre-approved credit-card offer, and the compliance team reviews every rule before it is used. The tree was trained on 45,000 customers with 18 features, including tenure, salary transfers and average balance, and it is refreshed each quarter. During the review, compliance points out that several leaves contain only two or three customers, with rules such as 'balance between 18,240 and 18,265 riyals and tenure of exactly 37 months'. They consider these rules meaningless and refuse to sign off. The tree's validation accuracy is also 9 points lower than its training accuracy. Which change addresses BOTH concerns most directly?","options":["Switch the criterion from Gini to entropy so that the leaves become purer","Round the balance feature to the nearest thousand riyals and retrain the same tree","Increase max_depth so that the small leaves are split into more precise rules","Increase min_samples_leaf so that every rule is supported by enough customers"],"answer":[3],"explain":"الأوراق التي تحتوي على عميلين أو ثلاثة هي علامة overfitting: الشجرة تحفظ حالات فردية. رفع min_samples_leaf يمنع هذه القواعد الضيقة، فيحسّن الـ generalization ويجعل كل قاعدة مدعومة بعدد معقول من العملاء فتقبلها إدارة الالتزام. زيادة max_depth تفعل العكس تماماً، وتغيير المعيار إلى entropy لا يغيّر حجم الأوراق."},{"id":"ml1-026","domain":"ml","level":"associate","tags":["decision-tree","regression-tree","extrapolation"],"stem":"A property-valuation startup trains a decision tree regressor on 25,000 apartments priced between 300,000 and 2 million riyals, using size, location, floor and age as features. Validation error on similar apartments is low. When the model is applied to a newly built luxury district, every penthouse is valued at about 1.9 million riyals regardless of its size, although comparable sales there exceed 5 million. What BEST explains this?","options":["The tree is too shallow, and a deeper tree would produce valuations above 2 million","A tree predicts averages of training targets, so it cannot go beyond their range","The features were not scaled, so large apartments fall outside the tree's thresholds","The tree has overfitted, and stronger pruning would raise the penthouse valuations"],"answer":[1],"explain":"الـ regression tree يتنبأ بمتوسط قيم الـ target في الورقة، ولذلك لا يمكن لأي تنبؤ أن يتجاوز أعلى قيمة في بيانات التدريب؛ أي أنه لا يستطيع الـ extrapolation. زيادة العمق لن تحل المشكلة لأن كل الأوراق ما زالت متوسطات لأسعار تحت 2 مليون. الحل هو بيانات من الشريحة الجديدة أو نموذج قادر على الامتداد مثل النموذج الخطي."},{"id":"ml1-027","domain":"ml","level":"associate","tags":["decision-tree","overfitting","hyperparameters"],"stem":"A manufacturing quality team's decision tree for predicting weld defects overfits badly: training accuracy is 1.00 and validation accuracy is 0.78. Which of the following changes make the tree simpler and reduce its variance? (Select THREE)","options":["Increase ccp_alpha","Increase max_leaf_nodes","Decrease min_samples_split","Increase min_samples_leaf","Decrease max_depth"],"answer":[0,3,4],"explain":"تقليل max_depth وزيادة min_samples_leaf وزيادة ccp_alpha (الـ pruning) كلها تقيّد نمو الشجرة فتقلّل الـ variance. في المقابل، تقليل min_samples_split يسمح بتقسيم nodes أصغر، وزيادة max_leaf_nodes تسمح بأوراق أكثر، وكلاهما يجعل الشجرة أعقد ويزيد الـ overfitting."},{"id":"ml1-028","domain":"ml","level":"assistant","tags":["decision-tree","interpretability","model-selection"],"stem":"A municipality wants a transparent model for prioritizing building inspections. By policy, inspectors must be able to follow the model's complete logic on one printed page and explain it to building owners. On the same validation set, a depth-20 decision tree scores 0.88 accuracy, a depth-4 tree scores 0.85, and a logistic regression scores 0.80. Which recommendation is MOST appropriate?","options":["The depth-4 tree: a small accuracy loss buys rules that inspectors can actually read","The depth-20 tree: any decision tree is interpretable, so take the most accurate one","The logistic regression: linear models are the only acceptable transparent models","The depth-20 tree, with only its top four levels printed out for the inspectors"],"answer":[0],"explain":"شجرة بعمق 20 قد تحتوي على آلاف الأوراق ولا يمكن لأي إنسان تتبّعها، فقابلية التفسير في الأشجار تضيع مع العمق. شجرة بعمق 4 تُطبع في صفحة واحدة وتخسر 3 نقاط فقط، وهي أدق من الـ logistic regression. طباعة أعلى أربعة مستويات من الشجرة العميقة مضلِّل لأن القرار الفعلي يُتَّخذ في المستويات السفلى غير المعروضة."},{"id":"ml1-029","domain":"ml","level":"assistant","tags":["knn","feature-scaling","distance"],"stem":"You are a data scientist at a bank in Riyadh building a k-nearest-neighbours model, with Euclidean distance and k = 10, to find customers similar to known premium clients. The features are annual income in riyals (30,000–2,000,000), age (18–80) and number of products held (1–8). When you inspect the results, the neighbours returned are almost entirely determined by income. What is the MOST appropriate fix?","options":["Increase k so that the age and product features receive more of the votes","Remove income, because a dominant feature always hurts distance-based models","Standardize the features so that each contributes comparably to the distance","Switch from Euclidean to Manhattan distance, which is unaffected by feature scale"],"answer":[2],"explain":"الـ kNN يعتمد على المسافة، والـ feature ذات المدى الأكبر (الدخل بالملايين) تطغى على المسافة فتُهمَل بقية الـ features. الـ standardization يجعل مساهمة كل feature متقاربة. زيادة k لا تغيّر طريقة حساب المسافة، ومسافة Manhattan تتأثر بالمقياس مثل Euclidean تماماً."},{"id":"ml1-030","domain":"ml","level":"associate","tags":["knn","validation-curve","choice-of-k"],"stem":"An airline classifies bookings as likely no-shows with kNN on standardized features, so that it can plan overbooking on busy routes. The team trained the model with several values of k and plotted training and validation accuracy, as shown in the chart. They now need to fix k for the production model. Which conclusion is BEST supported?","chart":{"type":"line","title":"kNN accuracy by number of neighbours","xLabel":"k","yLabel":"Accuracy","x":["1","3","5","9","15","25","51","101"],"series":[{"name":"Training","values":[1.0,0.95,0.93,0.91,0.89,0.87,0.83,0.78]},{"name":"Validation","values":[0.8,0.84,0.86,0.88,0.87,0.85,0.81,0.77]}]},"options":["Choose k around 9; much smaller k overfits and much larger k underfits","Choose k = 1, because it achieves the highest accuracy on the training set","Choose k = 101, because training and validation accuracy are closest there","Choose the largest k available, since validation accuracy keeps rising with k"],"answer":[0],"explain":"الـ validation accuracy تبلغ ذروتها (0.88) عند k = 9. عند k = 1 الـ training تساوي 1.00 والـ validation 0.80 فقط، وهذا overfitting، وعند k = 101 ينخفض الاثنان معاً وهذا underfitting. تقارب المنحنيين عند k = 101 لا يعني أنه الأفضل؛ المعيار هو أعلى أداء على الـ validation."},{"id":"ml1-031","domain":"ml","level":"expert","tags":["knn","inference-latency","model-selection"],"stem":"You are a data scientist at a payments company. A fraud-screening model must score each card transaction in under 10 milliseconds, at up to 3,000 transactions per second. The training set holds 40 million labelled transactions with 35 numeric features, and it grows by about a million rows each week. A colleague's kNN prototype, built on a 1% sample, matches the validation AUC of a logistic regression to within 0.002. The colleague argues for kNN because it 'needs no training at all'. The company's head office recently moved to a new building, and the data platform team is migrating from one cloud region to another. Which recommendation is MOST appropriate?","options":["Deploy kNN: having no training step makes it the cheapest model to run in production","Deploy logistic regression: its prediction cost is tiny and does not grow with the data","Deploy kNN on the full 40 million rows, since more stored data makes each lookup faster","Deploy kNN with k = 1, because a single neighbour lookup fits within any latency budget"],"answer":[1],"explain":"الـ kNN نموذج lazy: لا يكلّف شيئاً في التدريب لكنه يدفع التكلفة كلها عند الـ inference، إذ يبحث في البيانات المخزَّنة لكل طلب، وهذه التكلفة والذاكرة تكبران مع نمو البيانات. الـ logistic regression تحسب ضرباً نقطياً واحداً على 35 feature بزمن ثابت، وبما أن الـ AUC متساوٍ تقريباً فهي الخيار الواضح تحت قيد 10 مللي ثانية. تقليل k إلى 1 لا يخفّض تكلفة البحث عن الجيران."},{"id":"ml1-032","domain":"ml","level":"expert","tags":["knn","curse-of-dimensionality"],"stem":"A recruitment platform represents each CV with 5,000 sparse keyword features and uses kNN with Euclidean distance to classify CVs into job categories. About 20,000 labelled CVs are available. Accuracy is poor, and you find that for most queries the distance to the nearest neighbour is almost the same as the distance to the farthest one. What is the MOST appropriate response?","options":["Increase k substantially so that the noise from distant neighbours averages out","Standardize the 5,000 features so that Euclidean distances become meaningful again","Collect a few thousand more CVs so that the feature space becomes densely sampled","Reduce the dimensionality or select informative features before applying kNN"],"answer":[3],"explain":"تقارب المسافة بين أقرب جار وأبعد جار هو العَرَض الكلاسيكي للـ curse of dimensionality: في آلاف الأبعاد تفقد المسافات قدرتها على التمييز. العلاج هو تقليل الأبعاد أو اختيار الـ features المفيدة قبل kNN. بضعة آلاف إضافية من السير الذاتية لا تكفي لأن البيانات اللازمة لتغطية الفضاء تنمو أُسّياً مع عدد الأبعاد، والـ standardization لا يعالج تركّز المسافات."},{"id":"ml1-033","domain":"ml","level":"associate","tags":["knn","non-parametric","properties"],"stem":"A logistics start-up is considering kNN for predicting delivery delays and wants to understand how the algorithm behaves before committing to it. Which statements about kNN are correct? (Select TWO)","options":["It must keep the training data available in order to make predictions","It learns a fixed set of coefficients, one for each input feature","It is robust to irrelevant features, because they cancel out in the distance","Increasing k makes the decision boundary more jagged and complex","Most of its computational cost is paid at prediction time, not at training time"],"answer":[0,4],"explain":"الـ kNN نموذج instance-based: التدريب مجرد تخزين للبيانات، والتكلفة الحقيقية عند التنبؤ حيث تُحسب المسافات إلى النقاط المخزَّنة، ولذلك يجب الاحتفاظ ببيانات التدريب. لا يتعلم coefficients إطلاقاً، والـ features غير المهمة تشوّش المسافة ولا تُلغي بعضها. وزيادة k تجعل الـ decision boundary أنعم لا أكثر تعرّجاً."},{"id":"ml1-034","domain":"ml","level":"associate","tags":["svm","rbf-kernel","gamma"],"stem":"A medical-device manufacturer tunes an RBF-kernel SVM that flags faulty sensors from 20 standardized features. The team kept C fixed at 1 and tried several gamma values, recording training and validation accuracy as shown below. A junior engineer is puzzled that the configuration with perfect training accuracy performs worst on validation. What BEST explains the result at gamma = 10?","table":{"caption":"RBF SVM results (C fixed at 1)","headers":["gamma","Training accuracy","Validation accuracy"],"rows":[["0.001","0.78","0.77"],["0.01","0.88","0.86"],["0.1","0.93","0.90"],["1","0.99","0.84"],["10","1.00","0.62"]]},"options":["The decision boundary has become too smooth to follow the real structure in the data","The margin has become too wide, so too many training points are being misclassified","The features need to be un-scaled, because large gamma values only suit raw inputs","Each training point influences only a tiny region, so the model memorizes the training set"],"answer":[3],"explain":"الـ gamma الكبير يجعل تأثير كل نقطة تدريب محصوراً في نطاق ضيق جداً حولها، فيرسم النموذج «جزراً» حول النقاط ويحفظ بيانات التدريب (training 1.00 مقابل validation 0.62)، وهذا overfitting شديد. الحدّ الناعم أكثر من اللازم يحدث مع gamma الصغير (الصف الأول حيث الاثنان منخفضان)، وليس مع الكبير."},{"id":"ml1-035","domain":"ml","level":"associate","tags":["svm","hyperparameter-c","underfitting"],"stem":"An SVM at an e-commerce company underfits: with C = 0.0001, training and validation accuracy are both low. The team plans to raise C. What does increasing C do?","options":["It penalizes margin violations more, so the model fits the training data more closely","It strengthens the regularization, giving a wider margin and a simpler boundary","It widens the RBF kernel, so that each training point influences a larger region","It raises the number of support vectors, which always lowers the model's variance"],"answer":[0],"explain":"الـ C في SVM يتحكم في عقوبة مخالفة الـ margin: قيمة صغيرة جداً تعني regularization قوياً ونموذجاً متساهلاً مع الأخطاء (underfitting)، وزيادته تجعل النموذج يلتزم ببيانات التدريب أكثر. الخلط الشائع هو اعتبار أن C الأكبر يعني regularization أقوى، والصحيح هو العكس. أما عرض الـ kernel فيتحكم فيه gamma وليس C."},{"id":"ml1-036","domain":"ml","level":"associate","tags":["svm","linear-kernel","text-classification"],"stem":"You are a data scientist at a customer-support centre for a utilities provider. You must classify 200,000 tickets as 'billing' or 'technical' using TF-IDF vectors with 80,000 sparse features. Tickets arrive from the mobile app, the call centre and e-mail, and about 8% of them are written in a mix of Arabic and English. An RBF-kernel SVM has been training for many hours without finishing, and earlier trials on a 5% sample showed no accuracy gain of the RBF kernel over a linear one. The model has to be retrained weekly on a modest CPU server, and the support manager would like the first version in production this month. Interpretability is not a formal requirement. Which option is the MOST practical choice?","options":["An RBF SVM with a much larger gamma, to speed up convergence on sparse data","A polynomial kernel of degree 5, since text needs higher-order word interactions","An RBF SVM on a dense copy of the matrix, to avoid slow sparse computations","A linear SVM, which suits high-dimensional sparse text and trains far faster"],"answer":[3],"explain":"بيانات النصوص عالية الأبعاد و sparse تكون غالباً قابلة للفصل خطياً تقريباً، والتجارب على العينة أكدت أن RBF لا يضيف دقة. الـ linear SVM (مثل LinearSVC) يتدرّب أسرع بكثير على 200 ألف صف ويناسب إعادة التدريب الأسبوعية. زيادة gamma لا تسرّع التدريب بل تزيد خطر الـ overfitting، وتحويل المصفوفة إلى dense بـ 80 ألف عمود سيستنزف الذاكرة."},{"id":"ml1-037","domain":"ml","level":"expert","tags":["svm","logistic-regression","probability-output"],"stem":"A health insurer needs a well-calibrated probability of hospitalization for each member, because the probability is multiplied by the expected cost to set financial reserves. The team compares a linear SVM and a logistic regression trained on the same 30 features; the two models rank members almost identically and take similar time to train. Which consideration should decide the choice?","options":["The SVM's hinge loss yields better probabilities, because it ignores easy examples","Both models output probabilities natively, so the faster one to train should be chosen","SVM decision values can be read as probabilities after dividing by their maximum","Logistic regression is trained with log loss and outputs probabilities directly"],"answer":[3],"explain":"الحاجة هنا إلى probability مُعايَرة تدخل في حساب مالي، والـ logistic regression تُدرَّب بـ log loss الذي يستهدف الاحتمالات مباشرة. مخرجات الـ SVM هي مسافات عن الـ margin وليست احتمالات، والـ hinge loss لا يهتم إلا بالجانب الصحيح من الـ margin. قسمة الـ decision values على أكبر قيمة لا تنتج احتمالات صحيحة؛ يلزم calibration منفصل مثل Platt scaling."},{"id":"ml1-038","domain":"ml","level":"assistant","tags":["naive-bayes","assumptions","text-classification"],"stem":"A news aggregator uses Multinomial Naive Bayes on word counts to assign incoming articles to one of 12 categories. A new team member questions the choice, arguing that the model is 'too naive' for real language, and asks how it actually works. Which statements about this model are correct? (Select TWO)","options":["It needs far more training data than a kernel SVM to give usable results","It often classifies text well even though its independence assumption is violated","It requires the word counts to be standardized before training","It can only separate two categories, so 12 categories need 12 separate models","It assumes that, given the category, word occurrences are independent of one another"],"answer":[1,4],"explain":"الـ Naive Bayes يفترض conditional independence بين الـ features بمعرفة الـ class، وهذا غير صحيح في اللغة، لكنه يعمل جيداً في تصنيف النصوص لأن المهم هو أي class يحصل على أعلى score وليس دقة الاحتمال نفسه. النموذج يتعامل مع عدة classes مباشرة، ولا يحتاج standardization لأنه يع
