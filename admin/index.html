<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة المحاكي</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunken:#E9EDF2; --ink:#15202B; --ink2:#435161; --muted:#6F7C8B; --line:#D3DAE2; --line2:#B9C3CE;
  --accent:#0F4C81; --accent-ink:#FFFFFF; --good:#17784A; --bad:#B42318; --flag:#9A5A06; --s1:#2a78d6; --s2:#eb6834;
  --ar:"IBM Plex Sans Arabic","IBM Plex Sans","Segoe UI",Tahoma,sans-serif; --en:"IBM Plex Sans","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0E141A; --surface:#161F28; --sunken:#1D2833; --ink:#E7ECF1; --ink2:#B4BFCA; --muted:#8894A2; --line:#2A3642; --line2:#3B4958;
  --accent:#74B4EC; --accent-ink:#0A1621; --good:#4FC48C; --bad:#F27D72; --flag:#E6A94D; --s1:#3987e5; --s2:#d95926; } }
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);font-size:15px;line-height:1.7}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:26px}
h1{font-size:24px;margin:0;line-height:1.35} h2{font-size:17px;margin:0;font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top .acts{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line2);background:var(--surface);padding:8px 16px;border-radius:4px;font-weight:500;cursor:pointer;line-height:1.4}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=email],input[type=password]{border:1px solid var(--line2);background:var(--surface);padding:8px 10px;border-radius:4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding-bottom:8px}
.sec-h span{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));overflow:hidden}
.kpis div{padding:14px 16px;border-inline-start:1px solid var(--line);border-bottom:1px solid var(--line);margin-inline-start:-1px;margin-bottom:-1px}
.kpis b{display:block;font-size:26px;font-weight:600;line-height:1.3}
.kpis span{font-size:12.5px;color:var(--muted)}
.kpis small{display:block;font-size:12px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--sunken)}
tr:last-child td{border-bottom:0}
.scroll-x{overflow-x:auto}
.bar{height:8px;background:var(--sunken);border-radius:2px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.empty{padding:18px 16px;color:var(--muted)}
.ltr{direction:ltr;text-align:left;font-family:var(--en);unicode-bidi:isolate}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px} @media (max-width:820px){.two{grid-template-columns:1fr}}
.login{max-width:380px;display:flex;flex-direction:column;gap:12px;padding:20px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink2)}
.err{color:var(--bad);font-size:13.5px;min-height:1.6em}
.chart{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.chart svg{display:block;width:100%;height:auto} .chart svg text{font-family:var(--mono);font-size:11px;fill:var(--ink2)}
.leg{display:flex;gap:16px;font-size:12.5px;color:var(--ink2)} .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
details{font-size:13px;color:var(--muted)} summary{cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>لوحة محاكي شارة عالم البيانات</h1>
    <div class="acts" id="acts" hidden>
      <select id="days" aria-label="الفترة"><option value="7">آخر 7 أيام</option><option value="30" selected>آخر 30 يوماً</option><option value="90">آخر 90 يوماً</option><option value="3650">كل الفترة</option></select>
      <button class="btn" id="refresh">تحديث</button><button class="btn" id="logout">خروج</button></div></div>

  <form class="panel login" id="login" hidden>
    <h2>دخول المشرف</h2>
    <label>البريد الإلكتروني<input type="email" id="email" class="ltr" autocomplete="username" required></label>
    <label>كلمة المرور<input type="password" id="pass" class="ltr" autocomplete="current-password" required></label>
    <div class="err" id="err"></div>
    <button class="btn primary" id="go" type="submit">دخول</button>
  </form>
  <div class="panel empty" id="nocfg" hidden>لم تُضبط مفاتيح Supabase بعد. أضفها في ملف <span class="ltr">config.json</span> ثم أعد البناء.</div>
  <div id="dash" hidden></div>
</div>

function view(id){ for(const k of ["login","nocfg","dash"]) $("#"+k).hidden = k!==id; $("#acts").hidden = id!=="dash"; }

async function signIn(email, password){
  const r = await fetch(base()+"/auth/v1/token?grant_type=password", {method:"POST", headers:{"Content-Type":"application/json", apikey:CFG.key}, body:JSON.stringify({email, password})});
  const j = await r.json().catch(()=>({}));
  if(!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || "بيانات الدخول غير صحيحة");
  token = j.access_token; try{ sessionStorage.setItem("dsb.admin", token); }catch(e){}
}
async function load(){
  const r = await fetch(base()+"/rest/v1/rpc/dsb_admin_stats", {method:"POST", headers:{"Content-Type":"application/json", apikey:CFG.key, Authorization:"Bearer "+token}, body:JSON.stringify({days:+$("#days").value})});
  if(r.status===401 || r.status===403){ signOut(r.status===403 ? "هذا الحساب ليس حساب المشرف." : "انتهت الجلسة، سجّل الدخول من جديد."); return; }
  if(!r.ok){ $("#dash").innerHTML=`<div class="panel empty">تعذّر تحميل الإحصاءات (${r.status}). تأكد من تشغيل ملف setup.sql في Supabase.</div>`; view("dash"); return; }
  render(await r.json());
}
function signOut(msg){ token=null; try{ sessionStorage.removeItem("dsb.admin"); }catch(e){} $("#err").textContent=msg||""; view("login"); }

function dailyChart(rows, days){
  const map = new Map(rows.map(r=>[r.day,r])), out=[], n=Math.min(days, 30), today=new Date();
  for(let i=n-1;i>=0;i--){ const d=new Date(today); d.setDate(d.getDate()-i); const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; out.push(map.get(k)||{day:k,visitors:0,starts:0,finishes:0}); }
  const W=900,H=240,m={l:36,r:10,t:10,b:30}, pw=W-m.l-m.r, ph=H-m.t-m.b, max=Math.max(4,...out.map(r=>Math.max(r.visitors,r.starts)));
  const step=Math.ceil(max/4), top=step*4, y=v=>m.t+ph-v/top*ph, band=pw/out.length, bw=Math.max(3,Math.min(14,(band-6)/2));
  let g="";
  for(let t=0;t<=top;t+=step) g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;
  out.forEach((r,i)=>{ const cx=m.l+band*(i+.5);
    [["visitors","var(--s1)","زوار"],["starts","var(--s2)","محاولات"]].forEach(([k,c,lab],si)=>{ const v=r[k]; if(!v) return; const x=cx+(si?1:-bw-1), yy=y(v), h=m.t+ph-yy, rr=Math.min(3,h);
      g+=`<path d="M${x} ${yy+h}V${yy+rr}Q${x} ${yy} ${x+rr} ${yy}H${x+bw-rr}Q${x+bw} ${yy} ${x+bw} ${yy+rr}V${yy+h}Z" fill="${c}"><title>${r.day} · ${lab}: ${v}</title></path>`; });
    if(i%Math.ceil(out.length/10)===0) g+=`<text x="${cx}" y="${H-10}" text-anchor="middle">${r.day.slice(5)}</text>`; });
  g+=`<line x1="${m.l}" x2="${W-m.r}" y1="${m.t+ph}" y2="${m.t+ph}" stroke="var(--line2)"/>`;
  return `<div class="panel chart"><div class="leg"><span><i style="background:var(--s1)"></i>زوار فريدون</span><span><i style="background:var(--s2)"></i>محاولات بدأت</span></div>
    <div class="ltr"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="الزوار والمحاولات يومياً">${g}</svg></div>
    <details><summary>عرض كجدول</summary><div class="scroll-x"><table><tr><th>اليوم</th><th>زوار</th><th>بدأوا</th><th>أكملوا</th></tr>${out.slice().reverse().filter(r=>r.visitors||r.starts||r.finishes).map(r=>`<tr><td class="num">${r.day}</td><td class="num">${r.visitors}</td><td class="num">${r.starts}</td><td class="num">${r.finishes}</td></tr>`).join("")||`<tr><td colspan="4">لا بيانات</td></tr>`}</table></div></details></div>`;
}

    <section><div class="panel kpis">
      <div><span>الزوار</span><b class="num">${p.visitors||0}</b><small>${p.visits||0} زيارة · الإجمالي ${a.visitors||0}</small></div>
      <div><span>المستخدمون (بدأوا اختباراً)</span><b class="num">${p.users||0}</b><small>${pct(p.users,p.visitors)}% من الزوار · الإجمالي ${a.users||0}</small></div>
      <div><span>المحاولات</span><b class="num">${p.starts||0}</b><small>الإجمالي ${a.starts||0}</small></div>
      <div><span>المحاولات المكتملة</span><b class="num">${p.finishes||0}</b><small>${pct(p.finishes,p.starts)}% نسبة الإكمال</small></div>
      <div><span>متوسط النتيجة</span><b class="num">${p.avg_score==null?"—":p.avg_score+"%"}</b><small>${p.finishers||0} شخصاً أكملوا</small></div>
    </div></section>
    <section style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>النشاط اليومي</h2><span>بتوقيت الرياض${days>30?" · آخر 30 يوماً":""}</span></div>${dailyChart(d.daily||[],days)}</section>
    <div class="two">
      <section style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>الأداء حسب القسم</h2><span>كل المستخدمين</span></div><div class="panel scroll-x">${doms.length?`<table><tr><th>القسم</th><th>الصحيح</th><th>النسبة</th><th style="width:34%"></th></tr>${doms.map(k=>{const v=d.domains[k],pp=pct(v[0],v[1]);return `<tr><td>${DOMAINS[k]}</td><td class="num">${v[0]}/${v[1]}</td><td class="num">${pp}%</td><td><div class="bar"><i style="width:${pp}%"></i></div></td></tr>`;}).join("")}</table>`:`<div class="empty">لا توجد محاولات مكتملة بعد.</div>`}</div></section>
      <section style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>آخر المحاولات المكتملة</h2><span>المعرّف مجهول الهوية</span></div><div class="panel scroll-x">${(d.recent||[]).length?`<table><tr><th>الوقت</th><th>الزائر</th><th>النتيجة</th><th>المدة</th></tr>${d.recent.slice(0,12).map(r=>`<tr><td class="num">${when(r.at)}</td><td class="num">${esc(r.who)}</td><td class="num"><b>${pct(r.correct,r.total)}%</b> (${r.correct}/${r.total})</td><td class="num">${clock(r.usedSec)}${r.timeUp?" ⏱":""}</td></tr>`).join("")}</table>`:`<div class="empty">لا توجد محاولات مكتملة بعد.</div>`}</div></section>
    </div>
    <section style="display:flex;flex-direction:column;gap:12px"><div class="sec-h"><h2>أكثر الأسئلة خطأً</h2><span>مرشّحة للمراجعة أو لإعادة الصياغة</span></div><div class="panel scroll-x">${(d.missed||[]).length?`<table><tr><th>السؤال</th><th>أخطأوا</th><th>ظهر</th><th>نسبة الخطأ</th><th>النص</th></tr>${d.missed.map(q=>`<tr><td class="num">${esc(q.id)}</td><td class="num">${q.wrong}</td><td class="num">${q.asked}</td><td class="num">${pct(q.wrong,q.asked)}%</td><td class="ltr" style="font-size:13px">${esc(STEMS[q.id]||"")}</td></tr>`).join("")}</table>`:`<div class="empty">ستظهر هنا بعد أول محاولات مكتملة.</div>`}</div></section>`;
  view("dash");
}

$("#login").onsubmit = async e => { e.preventDefault(); $("#go").disabled=true; $("#err").textContent="";
  try{ await signIn($("#email").value.trim(), $("#pass").value); $("#pass").value=""; await load(); }
  catch(x){ $("#err").textContent = x.message || "تعذّر الدخول"; }
  finally{ $("#go").disabled=false; } };
$("#refresh").onclick = load; $("#days").onchange = load; $("#logout").onclick = () => signOut("");
if(!CFG || !CFG.url || !CFG.key) view("nocfg"); else if(token) load().catch(()=>signOut("")); else view("login");
</script>
</body>
</html>
